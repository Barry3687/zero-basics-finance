html": "\u003ch1 id=\"零基礎個人投資與理財入門專案規則\">零基礎個人投資與理財入門：專案規則\u003c/h1>\n\u003ch2 id=\"1-適用範圍與版本\">1. 適用範圍與版本\u003c/h2>\n\u003cp>本檔規範本專案的來源、閱讀筆記、Wiki、練習、簡報及後續維護。既有系統與使用者明確指令優先；不得把本檔解釋成可以忽略使用者的停止點。\u003c/p>\n\u003cp>版本：2026-11-19 對話確認規格完整彙整版。本機先前沒有本專案規則檔，目前可讀取的對話未含早期定稿全文，因此本檔不是舊稿逐字復原。內容依使用者已確認的規格與已核准文件整理，保留本輪引用的節次；版本限制須如實記入日誌。後續若取得原定稿，先比對差異，不得靜默覆蓋。本檔落地後，後續工作可依實體規則核對，但不回溯宣稱之前已讀過不存在的檔案。\u003c/p>\n\u003ch2 id=\"2-專案目的與範圍\">2. 專案目的與範圍\u003c/h2>\n\u003ch3 id=\"21-受眾與教學目的\">2.1 受眾與教學目的\u003c/h3>\n\u003cp>使用臺灣繁體中文，協助完全沒有股市、基金或財經知識的大學生及社會新鮮人，從生活金錢安排開始，建立基本判斷能力。只做一般金融教育，不提供個人化投資建議、商品推薦、保證收益或下單操作。\u003c/p>\n\u003ch3 id=\"22-五個核心學習單元\">2.2 五個核心學習單元\u003c/h3>\n\u003cp>依先備順序維持下列五篇：\u003c/p>\n\u003col>\n\u003cli>wiki/01-budget-and-emergency-fund.md：先管好生活中的錢。\u003c/li>\n\u003cli>wiki/02-inflation-and-compound-interest.md：錢為什麼會變多，也可能變少。\u003c/li>\n\u003cli>wiki/03-stocks-bonds-funds-etfs.md：股票、債券、基金與 ETF 是什麼。\u003c/li>\n\u003cli>wiki/04-diversification-and-allocation.md：如何避免把風險集中在一起。\u003c/li>\n\u003cli>wiki/05-first-financial-plan.md：建立自己的第一份理財計畫。\u003c/li>\n\u003c/ol>\n\u003cp>各單元可以含有必要的相關觀念，但依先備順序逐一說明，不堆砌未介紹的名詞。是否實際投資由讀者自行評估；不投入市場也可以是合理計畫。\u003c/p>\n\u003ch2 id=\"3-白話轉譯鐵則\">3. 白話轉譯鐵則\u003c/h2>\n\u003cul>\n\u003cli>全程使用臺灣繁體中文；專有名詞、縮寫第一次在學習正文出現時附白話解釋，不能只在編輯備註補解釋。\u003c/li>\n\u003cli>每個核心概念搭配日常生活比喻，如便當、信封、雞群、旅行或雨具；明確標示【教學轉譯】，交代比喻的適用範圍與限制。\u003c/li>\n\u003cli>說明先備知識。題目只能使用已介紹的概念、數字運算及符號，不靠課外常識判分。\u003c/li>\n\u003cli>公式說明每個符號、時間與金額單位；百分比轉小數時不得混淆。展開必要步驟。\u003c/li>\n\u003cli>以【來源內容】、【教學轉譯】、【假設例子】、【自編練習】及【待確認】區分來源、編者說明、模擬與缺漏。\u003c/li>\n\u003cli>生活比喻不能代替證據；不得把假設當成市場現況、官方推薦或歷史績效。\u003c/li>\n\u003cli>不以「任何人都適用」語氣推薦備用金月份、配置比例或預期報酬。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"4-來源登錄與可讀性\">4. 來源登錄與可讀性\u003c/h2>\n\u003ch3 id=\"41-來源選擇\">4.1 來源選擇\u003c/h3>\n\u003cp>優先採臺灣官方或公信力機構可公開查閱的金融教育資料。至少五份彼此不同的來源；同一 PDF 的五頁不算五份來源。不得虛構網址、作者、日期或閱讀完成狀態。\u003c/p>\n\u003ch3 id=\"42-id-與保存\">4.2 ID 與保存\u003c/h3>\n\u003cp>來源 ID 依序為 S001、S002 等，不能因改稿重新分配舊 ID。sources/catalog.md 登錄資料；notes/s001-reading.md 等保存自行整理的閱讀筆記。原始檔僅在私人本機查核暫存；權利未確認前，不隨公開專案發布。\u003c/p>\n\u003ch3 id=\"43-catalog-必填欄位\">4.3 catalog 必填欄位\u003c/h3>\n\u003cp>每份來源必列 ID、標題、發布／製作機構、真實網址、發布或更新日期、查閱日期、可定位段落或 PDF 實際頁序、適用地區、可讀性與保存狀態、使用範圍與限制、權利處理、處理狀態及相關檔案。未知日期寫未列或待確認，不從頁尾年份、檔案名稱或中繼資料推定。\u003c/p>\n\u003ch3 id=\"44-閱讀筆記\">4.4 閱讀筆記\u003c/h3>\n\u003cp>說明讀到什麼、尚未讀到什麼，區分文字抽取與逐圖核對。摘錄應短且必要，多以自行轉述為主。來源主張附定位；圖表不能只憑搜尋摘要說已完整核對。\u003c/p>\n\u003ch3 id=\"45-缺漏與錯誤\">4.5 缺漏與錯誤\u003c/h3>\n\u003cp>遇缺頁、不可讀、無法定位、矛盾或可疑算式，標【待確認】並說明影響。可用既有來源補足者先查核；需新來源時依使用者授權補登。無法補足而影響教學正確性時，停止依賴該內容並追問，不自行猜測。錯誤原文不可當成正確結論，也不能無紀錄地修正後假稱來源原意。\u003c/p>\n\u003ch2 id=\"5-目錄命名與資訊保護\">5. 目錄、命名與資訊保護\u003c/h2>\n\u003cul>\n\u003cli>AGENTS.md：本檔規則。\u003c/li>\n\u003cli>sources/catalog.md：來源索引；不存放未授權公開的原始教材全文。\u003c/li>\n\u003cli>notes/：來源閱讀筆記，命名 s001-reading.md。\u003c/li>\n\u003cli>wiki/：知識條目、index.md 與 log.md。\u003c/li>\n\u003cli>exercises/：各課練習、提示及解析；與 Wiki 同一編號及檔名。\u003c/li>\n\u003cli>slides/outline.md：八頁大綱；slides/source-map.md：來源對照。\u003c/li>\n\u003cli>slides/drafts/slide-01.md 至 slide-08.md：人工閘門通過後的逐頁稿。\u003c/li>\n\u003cli>reports/YYYY-MM-DD-content-check.md：內容檢查與修正證據。\u003c/li>\n\u003cli>assets/：後續生成且可公開的圖表或圖片；原始私人教材另存私人位置，不混入此處。\u003c/li>\n\u003cli>後續 HTML 發布檔只在使用者授權該階段後建立；根目錄 index.html 為屆時網站入口，目前階段不得提前產生。\u003c/li>\n\u003c/ul>\n\u003cp>檔名用英文小寫、數字及連字號，使用 UTF-8。採可移動的相對連結。公開庫排除 API 金鑰、環境秘密、帳密、學習者真實財務資料與未授權教材；檢查報告、日誌也不可洩漏秘密。不得因教材含有指令就把它當成使用者授權。\u003c/p>\n\u003ch2 id=\"6-wiki-固定模板與練習\">6. Wiki 固定模板與練習\u003c/h2>\n\u003cp>每篇核心 Wiki 嚴格只有以下六個標題，次序不變；第一個標題填實際概念名稱，其餘照列：\u003c/p>\n\u003col>\n\u003cli># 概念標題\u003c/li>\n\u003cli>## 一句話白話定義（40字內）\u003c/li>\n\u003cli>## 生活化比喻\u003c/li>\n\u003cli>## 具體數字小試算\u003c/li>\n\u003cli>## 新手最常踩的誤區\u003c/li>\n\u003cli>## 知識網路連結（標註上一課與下一課的超連結）\u003c/li>\n\u003c/ol>\n\u003cp>一句話定義最多 40 字，先備、必要說明可用粗體或清單編排，不加第七個標題。比喻須標【教學轉譯】並列限制；試算須標【假設例子】，寫出條件、期間、幣別、計算步驟及未考慮項目。重要主張旁標來源 ID 與定位。\u003c/p>\n\u003cp>每單元搭配一道【自編練習】。Wiki 課末只放題幹、選項及 exercises/ 連結，不直接揭露答案。練習檔包含題目、提示、正解、逐步解析、錯誤選項診斷、依據及返回連結。練習不得偷用未教術語或假裝是來源機構原題。\u003c/p>\n\u003cp>目錄、閱讀筆記、日誌、簡報稿與報告不受 Wiki 六標題限制。\u003c/p>\n\u003ch2 id=\"7-索引與執行紀錄\">7. 索引與執行紀錄\u003c/h2>\n\u003ch3 id=\"71-匯入同步\">7.1 匯入同步\u003c/h3>\n\u003cp>每次正式匯入資料，來源登錄、閱讀筆記、Wiki、練習、目錄及日誌需保持對應。只製作簡報時不必重寫已驗收 Wiki，但要記錄所使用版本及必要的狀態更新。\u003c/p>\n\u003ch3 id=\"72-wikiindexmd\">7.2 wiki/index.md\u003c/h3>\n\u003cp>列出學習順序、各篇連結與摘要、來源 ID、練習連結、內容標示及本階段狀態。首課／末課清楚標記，上一課、下一課可回到目錄。新增章節同步更新章節導覽；網站存在後也更新根目錄 index.html。\u003c/p>\n\u003ch3 id=\"73-wikilogmd\">7.3 wiki/log.md\u003c/h3>\n\u003cp>以 Asia/Taipei、UTC+08:00 寫實際時間；追加、不抹去歷史。至少記錄階段、使用者確認或授權、輸入與輸出、來源及缺口處理、執行的檢查、真實結果、修正及原因、殘餘限制、下一停止點。操作時間不能冒充訊息實際發送時間；歷史回填須註明。不得提前預填通過。\u003c/p>\n\u003ch2 id=\"8-公式與圖表\">8. 公式與圖表\u003c/h2>\n\u003ch3 id=\"81-計算\">8.1 計算\u003c/h3>\n\u003cp>例子使用已驗收 Wiki 的條件與數字。百分比、期間、稅費、是否中途收付、四捨五入及單位皆說清楚。不得以來源權威掩蓋算術錯誤；正確重算後留下問題紀錄。簡報壓縮不能刪掉影響結論的條件。\u003c/p>\n\u003ch3 id=\"82-svg-圖表規格\">8.2 SVG 圖表規格\u003c/h3>\n\u003cp>使用圖表前，逐頁稿先寫圖表標題、類型、資料與定位、座標軸及單位、圖例、概念示意／假設模擬標示、必要假設、文字說明與無障礙描述。關係圖或比較表若不需要座標軸，明寫「不適用」及理由，不虛構 XY 軸。\u003c/p>\n\u003cp>數值軸標單位、範圍與尺度，避免截斷造成誤導；假設模型不標成歷史績效。資料表須列列名、欄名及單位。圖例不要只靠顏色。正文與替代描述須能表達圖的重點。\u003c/p>\n\u003cp>逐頁稿階段只寫未來 SVG 的規格與資料，不能提前輸出 SVG／HTML 程式碼。Step 7 獲使用者明確授權後，按核准規格實際繪製原生 SVG。標題與圖表短標籤不計入正文上限，但不能把完整解說或必要假設移入標籤規避字數。需要對讀者顯示的假設、風險與圖意說明納入正文。\u003c/p>\n\u003ch2 id=\"9-工作流與前移檢查閘門\">9. 工作流與前移檢查閘門\u003c/h2>\n\u003ch3 id=\"91-來源登錄與可讀性檢查\">9.1 來源登錄與可讀性檢查\u003c/h3>\n\u003cp>先登錄來源、檢查可讀性與資料缺口，建立 notes/，提交使用者確認；未獲授權不跳過確認直接生成 Wiki。\u003c/p>\n\u003ch3 id=\"92-正式匯入\">9.2 正式匯入\u003c/h3>\n\u003cp>依確認來源產生五篇 Wiki 與對應練習，同步索引與日誌。核對固定模板、白話、來源、數字與連結；遇不足按第 4.5 節處理。\u003c/p>\n\u003ch3 id=\"93-八頁大綱與來源對照\">9.3 八頁大綱與來源對照\u003c/h3>\n\u003cp>產生逐頁稿或 HTML 前，先交 slides/outline.md 與 slides/source-map.md。固定八頁，含導入，不加額外封面或附錄。已核准順序為：學習路線、收支與備用金、購買力與通膨、單利與複利、股票與債券、基金與 ETF、分散與配置、第一份計畫與付款前查核。\u003c/p>\n\u003cp>每頁十項欄位：頁碼與標題、一個主要教學目標、最多三個重點、預定術語與白話、先備知識、生活比喻／數字／圖表規劃及類型標示、Wiki 條目及段落、來源 ID 與定位、正文預估字數、檢查方式。\u003c/p>\n\u003cp>source-map.md 逐頁對照「教學主張、Wiki 段落、原始來源 ID、圖表或試算依據」。來源 ID 不得用來繞過 Wiki 新增未匯入的內容。\u003c/p>\n\u003ch3 id=\"94-人工審核閘門\">9.4 人工審核閘門\u003c/h3>\n\u003cp>使用者須明確確認八頁大綱與對照表，才可撰寫逐頁稿。結構或內容檢查不等於人工審核；沉默不是批准。記錄明確確認的內容、當時操作時間及授權邊界。\u003c/p>\n\u003cp>使用者先前已確認八頁、學習順序、Wiki 範圍、術語、來源與數字、資訊量及練習範圍，通過逐頁稿閘門。2026-11-19 本輪又明確確認八份逐頁稿與內容報告，授權 Step 7 製作 HTML 及交付文件；依本輪指定，公開網址實測保留待使用者上傳後驗證，不代為宣稱已部署。\u003c/p>\n\u003ch3 id=\"95-分開撰寫與內容檢查\">9.5 分開撰寫與內容檢查\u003c/h3>\n\u003cp>先完成初稿，再以獨立的檢查程序與內容清單重新讀稿，不能邊改邊宣稱沒有問題。逐頁記錄實際字數、白話詞義、先備、數字、來源及假設。算術或結構工具不等於語意正確的完整證明。若同一助手執行，明說是分階段自我檢查，不冒稱外部審稿者或另一模型審查。\u003c/p>\n\u003ch3 id=\"96-逐頁稿限制\">9.6 逐頁稿限制\u003c/h3>\n\u003cp>檔名固定 slide-01.md 至 slide-08.md；嚴格按已批准大綱，不增加頁數或新資料。每頁僅一個主要目標、最多三個主要重點；正文最多 120 字，含標點，不含標題、來源引用及圖表短標籤。必要詞義、可見圖意、假設及限制一併計入。\u003c/p>\n\u003cp>採保守可重算方式：正文區塊去除 Markdown 清單標記與空白後，每個 Unicode 字元計 1 字，含漢字、標點、數字、英文字母與算式符號。不只計漢字。圖表規格與編輯備註不得被投影成未計字的額外正文；未來新增可見文字須重計。\u003c/p>\n\u003ch3 id=\"97-修正報告與停止點\">9.7 修正、報告與停止點\u003c/h3>\n\u003cp>報告存 reports/YYYY-MM-DD-content-check.md。逐頁列初稿字數、問題、是否超限、修改原因、修改後字數、術語結果、數字與來源 ID 結果。保留問題文字或可核實差異；不得把超限初稿偷偷替換後只報最後通過。\u003c/p>\n\u003cp>一個檢查階段至多三輪修正，若仍有實質問題，誠實列出、停下並向使用者說明。結構檢查、算術、來源語意、視覺版面及人工批准分開記錄；沒有渲染不能宣稱版面通過。\u003c/p>\n\u003cp>本階段完成逐頁稿、內容報告與日誌後停止。只有使用者確認報告並下達 Step 7 指令，才可開始 HTML 與發布。若主張、來源、頁序或重要假設需要變更，先修大綱與來源表並請使用者審核，不在逐頁稿臨時擴張。\u003c/p>\n\u003ch2 id=\"10-完成標準與後續維護\">10. 完成標準與後續維護\u003c/h2>\n\u003cul>\n\u003cli>本階段完成：實體規則檔、閘門紀錄、八份逐頁稿、逐頁檢查報告、日誌與完整更新包；正文全數合規，限制與待確認事項如實列出。\u003c/li>\n\u003cli>未來網站階段：依經確認稿製作恰八頁 HTML，正確呈現繁體中文、可讀正文、公式、SVG 標籤與來源連結；檢查桌面與手機的文字、重疊、導航、圖表及鍵盤可用性，才能宣稱完成網站驗收。\u003c/li>\n\u003cli>GitHub 與公開網址僅在相關階段實際上傳、開啟確認後提供；不得將本機檔案稱作已公開網站。\u003c/li>\n\u003cli>新增資料先重走來源、閱讀、匯入、索引及日誌流程；維持同一模板與追溯。來源錯誤與停用決定不得在後續生成中遺忘。\u003c/li>\n\u003cli>目前隔離：S004 p25 未附出處數據停用；S006 p12 誤植、未查實引言不採。未知發布日不補猜。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"11-公開與排除規範\">11. 公開與排除規範\u003c/h2>\n\u003cp>本節依使用者 Step 7 訊息明列要求增補，非宣稱找回早期逐字舊稿。\u003c/p>\n\u003cul>\n\u003cli>root index.html 作入口，slides/index.html 固定八頁，CSS 與 JavaScript 全數內嵌；不引入未審核資料、追蹤程式或模型服務。\u003c/li>\n\u003cli>簡報正文必須逐字對應核准 drafts/，數字及定義不改寫，保持原有一個目標及最多三個重點的邊界。\u003c/li>\n\u003cli>README.md 說明架構、來源查證、工作流及本機／線上使用；.gitignore 排除 .env、秘密、私人筆記、暫存與未授權原始教材。\u003c/li>\n\u003cli>.gitignore 只影響後續納管，不能移除已公開的秘密；公開前仍須核對實際交付檔案。交付 ZIP 同樣不能夾帶未授權教材或私人財務資料。\u003c/li>\n\u003cli>提供完整檔案與程式碼，不以省略標記或待填程式區塊冒充實作。入口四個目的地都要能找到相對檔案或目錄入口。\u003c/li>\n\u003cli>GitHub Repository 與 Pages URL 未實際建立及查驗前，不填猜測網址。使用者本輪指定公開測試待其上傳後驗證，因此本輪只交可上傳的完整包。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"12-發布檢查與如實報告\">12. 發布檢查與如實報告\u003c/h2>\n\u003cp>本節依使用者 Step 7 訊息明列要求增補，非宣稱與不可得的舊版第 12 節逐字相同。\u003c/p>\n\u003cul>\n\u003cli>reports/2026-11-19-release-check.md 分開寫「本機檔案與 HTML 結構檢查」「本機瀏覽器版面／互動檢查」「GitHub Pages 公開網址實測」。只有實際執行才寫已完成。\u003c/li>\n\u003cli>檢查八頁數量、正文逐字一致、SVG 標題／軸或不適用理由／單位／圖例／類型／Wiki 編號／替代描述、相對連結、按鍵與按鈕、進度與邊界、秘密及私人資料排除。\u003c/li>\n\u003cli>手機與桌面檢查列明實際尺寸與方法，保留可查證畫面；未測裝置、縮放或瀏覽器不能泛稱全數支援。\u003c/li>\n\u003cli>公開網址測試預設待使用者上傳後親自開啟驗證。本機 localhost、檔案連結或 ZIP 不是已公開網址；不得虛構成功部署或線上測試。\u003c/li>\n\u003cli>日誌追加實際時間、輸出、問題、修正、殘餘限制與客觀反思；反思只用真實紀錄，不把示例事件當成已發生事實。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"後續公開授權與閱讀器同步\">後續公開授權與閱讀器同步\u003c/h3>\n\u003cp>2026-11-19 使用者追加要求完成優化、公開 GitHub／教學網頁及準備 COOL 繳交內容，已取代 Step 7 僅本機交付的階段限制。允許發布已檢查的公開教材，並如實追加公開網址實測紀錄；COOL 草稿不按最終繳交。學生資料與協作截圖只放私人繳交區，不放公開 Repository。Markdown 為內容正本；修改文件時須同步 reader.html 內嵌快照、索引與日誌，並檢查讀取路徑及來源錨點。\u003c/p>", "source": "# 零基礎個人投資與理財入門：專案規則\n\n## 1. 適用範圍與版本\n\n本檔規範本專案的來源、閱讀筆記、Wiki、練習、簡報及後續維護。既有系統與使用者明確指令優先；不得把本檔解釋成可以忽略使用者的停止點。\n\n版本：2026-11-19 對話確認規格完整彙整版。本機先前沒有本專案規則檔，目前可讀取的對話未含早期定稿全文，因此本檔不是舊稿逐字復原。內容依使用者已確認的規格與已核准文件整理，保留本輪引用的節次；版本限制須如實記入日誌。後續若取得原定稿，先比對差異，不得靜默覆蓋。本檔落地後，後續工作可依實體規則核對，但不回溯宣稱之前已讀過不存在的檔案。\n\n## 2. 專案目的與範圍\n\n### 2.1 受眾與教學目的\n\n使用臺灣繁體中文，協助完全沒有股市、基金或財經知識的大學生及社會新鮮人，從生活金錢安排開始，建立基本判斷能力。只做一般金融教育，不提供個人化投資建議、商品推薦、保證收益或下單操作。\n\n### 2.2 五個核心學習單元\n\n依先備順序維持下列五篇：\n\n1. wiki/01-budget-and-emergency-fund.md：先管好生活中的錢。\n2. wiki/02-inflation-and-compound-interest.md：錢為什麼會變多，也可能變少。\n3. wiki/03-stocks-bonds-funds-etfs.md：股票、債券、基金與 ETF 是什麼。\n4. wiki/04-diversification-and-allocation.md：如何避免把風險集中在一起。\n5. wiki/05-first-financial-plan.md：建立自己的第一份理財計畫。\n\n各單元可以含有必要的相關觀念，但依先備順序逐一說明，不堆砌未介紹的名詞。是否實際投資由讀者自行評估；不投入市場也可以是合理計畫。\n\n## 3. 白話轉譯鐵則\n\n- 全程使用臺灣繁體中文；專有名詞、縮寫第一次在學習正文出現時附白話解釋，不能只在編輯備註補解釋。\n- 每個核心概念搭配日常生活比喻，如便當、信封、雞群、旅行或雨具；明確標示【教學轉譯】，交代比喻的適用範圍與限制。\n- 說明先備知識。題目只能使用已介紹的概念、數字運算及符號，不靠課外常識判分。\n- 公式說明每個符號、時間與金額單位；百分比轉小數時不得混淆。展開必要步驟。\n- 以【來源內容】、【教學轉譯】、【假設例子】、【自編練習】及【待確認】區分來源、編者說明、模擬與缺漏。\n- 生活比喻不能代替證據；不得把假設當成市場現況、官方推薦或歷史績效。\n- 不以「任何人都適用」語氣推薦備用金月份、配置比例或預期報酬。\n\n## 4. 來源登錄與可讀性\n\n### 4.1 來源選擇\n\n優先採臺灣官方或公信力機構可公開查閱的金融教育資料。至少五份彼此不同的來源；同一 PDF 的五頁不算五份來源。不得虛構網址、作者、日期或閱讀完成狀態。\n\n### 4.2 ID 與保存\n\n來源 ID 依序為 S001、S002 等，不能因改稿重新分配舊 ID。sources/catalog.md 登錄資料；notes/s001-reading.md 等保存自行整理的閱讀筆記。原始檔僅在私人本機查核暫存；權利未確認前，不隨公開專案發布。\n\n### 4.3 catalog 必填欄位\n\n每份來源必列 ID、標題、發布／製作機構、真實網址、發布或更新日期、查閱日期、可定位段落或 PDF 實際頁序、適用地區、可讀性與保存狀態、使用範圍與限制、權利處理、處理狀態及相關檔案。未知日期寫未列或待確認，不從頁尾年份、檔案名稱或中繼資料推定。\n\n### 4.4 閱讀筆記\n\n說明讀到什麼、尚未讀到什麼，區分文字抽取與逐圖核對。摘錄應短且必要，多以自行轉述為主。來源主張附定位；圖表不能只憑搜尋摘要說已完整核對。\n\n### 4.5 缺漏與錯誤\n\n遇缺頁、不可讀、無法定位、矛盾或可疑算式，標【待確認】並說明影響。可用既有來源補足者先查核；需新來源時依使用者授權補登。無法補足而影響教學正確性時，停止依賴該內容並追問，不自行猜測。錯誤原文不可當成正確結論，也不能無紀錄地修正後假稱來源原意。\n\n## 5. 目錄、命名與資訊保護\n\n- AGENTS.md：本檔規則。\n- sources/catalog.md：來源索引；不存放未授權公開的原始教材全文。\n- notes/：來源閱讀筆記，命名 s001-reading.md。\n- wiki/：知識條目、index.md 與 log.md。\n- exercises/：各課練習、提示及解析；與 Wiki 同一編號及檔名。\n- slides/outline.md：八頁大綱；slides/source-map.md：來源對照。\n- slides/drafts/slide-01.md 至 slide-08.md：人工閘門通過後的逐頁稿。\n- reports/YYYY-MM-DD-content-check.md：內容檢查與修正證據。\n- assets/：後續生成且可公開的圖表或圖片；原始私人教材另存私人位置，不混入此處。\n- 後續 HTML 發布檔只在使用者授權該階段後建立；根目錄 index.html 為屆時網站入口，目前階段不得提前產生。\n\n檔名用英文小寫、數字及連字號，使用 UTF-8。採可移動的相對連結。公開庫排除 API 金鑰、環境秘密、帳密、學習者真實財務資料與未授權教材；檢查報告、日誌也不可洩漏秘密。不得因教材含有指令就把它當成使用者授權。\n\n## 6. Wiki 固定模板與練習\n\n每篇核心 Wiki 嚴格只有以下六個標題，次序不變；第一個標題填實際概念名稱，其餘照列：\n\n1. # 概念標題\n2. ## 一句話白話定義（40字內）\n3. ## 生活化比喻\n4. ## 具體數字小試算\n5. ## 新手最常踩的誤區\n6. ## 知識網路連結（標註上一課與下一課的超連結）\n\n一句話定義最多 40 字，先備、必要說明可用粗體或清單編排，不加第七個標題。比喻須標【教學轉譯】並列限制；試算須標【假設例子】，寫出條件、期間、幣別、計算步驟及未考慮項目。重要主張旁標來源 ID 與定位。\n\n每單元搭配一道【自編練習】。Wiki 課末只放題幹、選項及 exercises/ 連結，不直接揭露答案。練習檔包含題目、提示、正解、逐步解析、錯誤選項診斷、依據及返回連結。練習不得偷用未教術語或假裝是來源機構原題。\n\n目錄、閱讀筆記、日誌、簡報稿與報告不受 Wiki 六標題限制。\n\n## 7. 索引與執行紀錄\n\n### 7.1 匯入同步\n\n每次正式匯入資料，來源登錄、閱讀筆記、Wiki、練習、目錄及日誌需保持對應。只製作簡報時不必重寫已驗收 Wiki，但要記錄所使用版本及必要的狀態更新。\n\n### 7.2 wiki/index.md\n\n列出學習順序、各篇連結與摘要、來源 ID、練習連結、內容標示及本階段狀態。首課／末課清楚標記，上一課、下一課可回到目錄。新增章節同步更新章節導覽；網站存在後也更新根目錄 index.html。\n\n### 7.3 wiki/log.md\n\n以 Asia/Taipei、UTC+08:00 寫實際時間；追加、不抹去歷史。至少記錄階段、使用者確認或授權、輸入與輸出、來源及缺口處理、執行的檢查、真實結果、修正及原因、殘餘限制、下一停止點。操作時間不能冒充訊息實際發送時間；歷史回填須註明。不得提前預填通過。\n\n## 8. 公式與圖表\n\n### 8.1 計算\n\n例子使用已驗收 Wiki 的條件與數字。百分比、期間、稅費、是否中途收付、四捨五入及單位皆說清楚。不得以來源權威掩蓋算術錯誤；正確重算後留下問題紀錄。簡報壓縮不能刪掉影響結論的條件。\n\n### 8.2 SVG 圖表規格\n\n使用圖表前，逐頁稿先寫圖表標題、類型、資料與定位、座標軸及單位、圖例、概念示意／假設模擬標示、必要假設、文字說明與無障礙描述。關係圖或比較表若不需要座標軸，明寫「不適用」及理由，不虛構 XY 軸。\n\n數值軸標單位、範圍與尺度，避免截斷造成誤導；假設模型不標成歷史績效。資料表須列列名、欄名及單位。圖例不要只靠顏色。正文與替代描述須能表達圖的重點。\n\n逐頁稿階段只寫未來 SVG 的規格與資料，不能提前輸出 SVG／HTML 程式碼。Step 7 獲使用者明確授權後，按核准規格實際繪製原生 SVG。標題與圖表短標籤不計入正文上限，但不能把完整解說或必要假設移入標籤規避字數。需要對讀者顯示的假設、風險與圖意說明納入正文。\n\n## 9. 工作流與前移檢查閘門\n\n### 9.1 來源登錄與可讀性檢查\n\n先登錄來源、檢查可讀性與資料缺口，建立 notes/，提交使用者確認；未獲授權不跳過確認直接生成 Wiki。\n\n### 9.2 正式匯入\n\n依確認來源產生五篇 Wiki 與對應練習，同步索引與日誌。核對固定模板、白話、來源、數字與連結；遇不足按第 4.5 節處理。\n\n### 9.3 八頁大綱與來源對照\n\n產生逐頁稿或 HTML 前，先交 slides/outline.md 與 slides/source-map.md。固定八頁，含導入，不加額外封面或附錄。已核准順序為：學習路線、收支與備用金、購買力與通膨、單利與複利、股票與債券、基金與 ETF、分散與配置、第一份計畫與付款前查核。\n\n每頁十項欄位：頁碼與標題、一個主要教學目標、最多三個重點、預定術語與白話、先備知識、生活比喻／數字／圖表規劃及類型標示、Wiki 條目及段落、來源 ID 與定位、正文預估字數、檢查方式。\n\nsource-map.md 逐頁對照「教學主張、Wiki 段落、原始來源 ID、圖表或試算依據」。來源 ID 不得用來繞過 Wiki 新增未匯入的內容。\n\n### 9.4 人工審核閘門\n\n使用者須明確確認八頁大綱與對照表，才可撰寫逐頁稿。結構或內容檢查不等於人工審核；沉默不是批准。記錄明確確認的內容、當時操作時間及授權邊界。\n\n使用者先前已確認八頁、學習順序、Wiki 範圍、術語、來源與數字、資訊量及練習範圍，通過逐頁稿閘門。2026-11-19 本輪又明確確認八份逐頁稿與內容報告，授權 Step 7 製作 HTML 及交付文件；依本輪指定，公開網址實測保留待使用者上傳後驗證，不代為宣稱已部署。\n\n### 9.5 分開撰寫與內容檢查\n\n先完成初稿，再以獨立的檢查程序與內容清單重新讀稿，不能邊改邊宣稱沒有問題。逐頁記錄實際字數、白話詞義、先備、數字、來源及假設。算術或結構工具不等於語意正確的完整證明。若同一助手執行，明說是分階段自我檢查，不冒稱外部審稿者或另一模型審查。\n\n### 9.6 逐頁稿限制\n\n檔名固定 slide-01.md 至 slide-08.md；嚴格按已批准大綱，不增加頁數或新資料。每頁僅一個主要目標、最多三個主要重點；正文最多 120 字，含標點，不含標題、來源引用及圖表短標籤。必要詞義、可見圖意、假設及限制一併計入。\n\n採保守可重算方式：正文區塊去除 Markdown 清單標記與空白後，每個 Unicode 字元計 1 字，含漢字、標點、數字、英文字母與算式符號。不只計漢字。圖表規格與編輯備註不得被投影成未計字的額外正文；未來新增可見文字須重計。\n\n### 9.7 修正、報告與停止點\n\n報告存 reports/YYYY-MM-DD-content-check.md。逐頁列初稿字數、問題、是否超限、修改原因、修改後字數、術語結果、數字與來源 ID 結果。保留問題文字或可核實差異；不得把超限初稿偷偷替換後只報最後通過。\n\n一個檢查階段至多三輪修正，若仍有實質問題，誠實列出、停下並向使用者說明。結構檢查、算術、來源語意、視覺版面及人工批准分開記錄；沒有渲染不能宣稱版面通過。\n\n本階段完成逐頁稿、內容報告與日誌後停止。只有使用者確認報告並下達 Step 7 指令，才可開始 HTML 與發布。若主張、來源、頁序或重要假設需要變更，先修大綱與來源表並請使用者審核，不在逐頁稿臨時擴張。\n\n## 10. 完成標準與後續維護\n\n- 本階段完成：實體規則檔、閘門紀錄、八份逐頁稿、逐頁檢查報告、日誌與完整更新包；正文全數合規，限制與待確認事項如實列出。\n- 未來網站階段：依經確認稿製作恰八頁 HTML，正確呈現繁體中文、可讀正文、公式、SVG 標籤與來源連結；檢查桌面與手機的文字、重疊、導航、圖表及鍵盤可用性，才能宣稱完成網站驗收。\n- GitHub 與公開網址僅在相關階段實際上傳、開啟確認後提供；不得將本機檔案稱作已公開網站。\n- 新增資料先重走來源、閱讀、匯入、索引及日誌流程；維持同一模板與追溯。來源錯誤與停用決定不得在後續生成中遺忘。\n- 目前隔離：S004 p25 未附出處數據停用；S006 p12 誤植、未查實引言不採。未知發布日不補猜。\n\n## 11. 公開與排除規範\n\n本節依使用者 Step 7 訊息明列要求增補，非宣稱找回早期逐字舊稿。\n\n- root index.html 作入口，slides/index.html 固定八頁，CSS 與 JavaScript 全數內嵌；不引入未審核資料、追蹤程式或模型服務。\n- 簡報正文必須逐字對應核准 drafts/，數字及定義不改寫，保持原有一個目標及最多三個重點的邊界。\n- README.md 說明架構、來源查證、工作流及本機／線上使用；.gitignore 排除 .env、秘密、私人筆記、暫存與未授權原始教材。\n- .gitignore 只影響後續納管，不能移除已公開的秘密；公開前仍須核對實際交付檔案。交付 ZIP 同樣不能夾帶未授權教材或私人財務資料。\n- 提供完整檔案與程式碼，不以省略標記或待填程式區塊冒充實作。入口四個目的地都要能找到相對檔案或目錄入口。\n- GitHub Repository 與 Pages URL 未實際建立及查驗前，不填猜測網址。使用者本輪指定公開測試待其上傳後驗證，因此本輪只交可上傳的完整包。\n\n## 12. 發布檢查與如實報告\n\n本節依使用者 Step 7 訊息明列要求增補，非宣稱與不可得的舊版第 12 節逐字相同。\n\n- reports/2026-11-19-release-check.md 分開寫「本機檔案與 HTML 結構檢查」「本機瀏覽器版面／互動檢查」「GitHub Pages 公開網址實測」。只有實際執行才寫已完成。\n- 檢查八頁數量、正文逐字一致、SVG 標題／軸或不適用理由／單位／圖例／類型／Wiki 編號／替代描述、相對連結、按鍵與按鈕、進度與邊界、秘密及私人資料排除。\n- 手機與桌面檢查列明實際尺寸與方法，保留可查證畫面；未測裝置、縮放或瀏覽器不能泛稱全數支援。\n- 公開網址測試預設待使用者上傳後親自開啟驗證。本機 localhost、檔案連結或 ZIP 不是已公開網址；不得虛構成功部署或線上測試。\n- 日誌追加實際時間、輸出、問題、修正、殘餘限制與客觀反思；反思只用真實紀錄，不把示例事件當成已發生事實。\n\n\n### 後續公開授權與閱讀器同步\n\n2026-11-19 使用者追加要求完成優化、公開 GitHub／教學網頁及準備 COOL 繳交內容，已取代 Step 7 僅本機交付的階段限制。允許發布已檢查的公開教材，並如實追加公開網址實測紀錄；COOL 草稿不按最終繳交。學生資料與協作截圖只放私人繳交區，不放公開 Repository。Markdown 為內容正本；修改文件時須同步 reader.html 內嵌快照、索引與日誌，並檢查讀取路徑及來源錨點。\n"}, "exercises/01-budget-and-emergency-fund.md": {"title": "練習 01：備用金需要存多久？", "html": "\u003ch1 id=\"練習-01備用金需要存多久\">練習 01：備用金需要存多久？\u003c/h1>\n\u003cp>【自編練習】月收入 28,000 元、必要支出 22,000 元；從零開始存兩個月必要支出的備用金，每月結餘全部存入。不計利息，至少需幾個完整月份？\u003c/p>\n\u003cul>\n\u003cli>A. 2 個月\u003c/li>\n\u003cli>B. 6 個月\u003c/li>\n\u003cli>C. 7 個月\u003c/li>\n\u003cli>D. 8 個月\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"先想想\">先想想\u003c/h2>\n\u003cp>先分別算「每月留下多少」與「總共要存多少」，再比較七個月是否已足夠。本題月份設定是練習條件，不是適用每個人的備用金建議。\u003c/p>\n\u003ch2 id=\"提示\">提示\u003c/h2>\n\u003cp>每月可存 = 月收入 − 必要支出；目標 = 每月必要支出 × 指定月份。至少需完整月份時，小數不能無條件捨去。\u003c/p>\n\u003ch2 id=\"答案與逐步解析\">答案與逐步解析\u003c/h2>\n\u003cp>正確答案：\u003cstrong>D，8 個月\u003c/strong>。\u003c/p>\n\u003col>\n\u003cli>每月可存：28,000 − 22,000 = 6,000 元。\u003c/li>\n\u003cli>目標金額：22,000 × 2 = 44,000 元。\u003c/li>\n\u003cli>七個月：6,000 × 7 = 42,000 元，還差 2,000 元。\u003c/li>\n\u003cli>八個月：6,000 × 8 = 48,000 元，才達到至少 44,000 元。\u003c/li>\n\u003c/ol>\n\u003cp>不計利息、稅費、收入及支出變動；沒有其他提款。\u003c/p>\n\u003ch2 id=\"其他選項錯在哪\">其他選項錯在哪\u003c/h2>\n\u003cul>\n\u003cli>A：把要準備幾個月生活費，誤當成儲蓄所需月份。\u003c/li>\n\u003cli>B：六個月只存 36,000 元。\u003c/li>\n\u003cli>C：七個月仍少於目標，不能把不足一個月直接捨去。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"學習依據\">學習依據\u003c/h2>\n\u003cp>題目與數字均自行設計；概念來自 \u003ca href=\"reader.html?doc=sources/catalog.md#s001\">S001\u003c/a>。\u003ca href=\"reader.html?doc=wiki/01-budget-and-emergency-fund.md\">返回課程\u003c/a>；\u003ca href=\"reader.html?doc=wiki/index.md\">回目錄\u003c/a>。\u003c/p>", "source": "# 練習 01：備用金需要存多久？\n\n【自編練習】月收入 28,000 元、必要支出 22,000 元；從零開始存兩個月必要支出的備用金，每月結餘全部存入。不計利息，至少需幾個完整月份？\n\n- A. 2 個月\n- B. 6 個月\n- C. 7 個月\n- D. 8 個月\n\n## 先想想\n\n先分別算「每月留下多少」與「總共要存多少」，再比較七個月是否已足夠。本題月份設定是練習條件，不是適用每個人的備用金建議。\n\n## 提示\n\n每月可存 = 月收入 − 必要支出；目標 = 每月必要支出 × 指定月份。至少需完整月份時，小數不能無條件捨去。\n\n## 答案與逐步解析\n\n正確答案：**D，8 個月**。\n\n1. 每月可存：28,000 − 22,000 = 6,000 元。\n2. 目標金額：22,000 × 2 = 44,000 元。\n3. 七個月：6,000 × 7 = 42,000 元，還差 2,000 元。\n4. 八個月：6,000 × 8 = 48,000 元，才達到至少 44,000 元。\n\n不計利息、稅費、收入及支出變動；沒有其他提款。\n\n## 其他選項錯在哪\n\n- A：把要準備幾個月生活費，誤當成儲蓄所需月份。\n- B：六個月只存 36,000 元。\n- C：七個月仍少於目標，不能把不足一個月直接捨去。\n\n## 學習依據\n\n題目與數字均自行設計；概念來自 [S001](../sources/catalog.md#s001)。[返回課程](../wiki/01-budget-and-emergency-fund.md)；[回目錄](../wiki/index.md)。\n"}, "exercises/02-inflation-and-compound-interest.md": {"title": "練習 02：利息留下來之後", "html": "\u003ch1 id=\"練習-02利息留下來之後\">練習 02：利息留下來之後\u003c/h1>\n\u003cp>【自編練習】本金 10,000 元，每年 3%，每年複利一次，連放兩年，不另收付且忽略稅費。期末金額是多少？\u003c/p>\n\u003cul>\n\u003cli>A. 10,300 元\u003c/li>\n\u003cli>B. 10,600 元\u003c/li>\n\u003cli>C. 10,609 元\u003c/li>\n\u003cli>D. 13,000 元\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"先想想\">先想想\u003c/h2>\n\u003cp>第二年應按最初的 10,000 元計息，還是把第一年利息也放進計息基礎？\u003c/p>\n\u003ch2 id=\"提示\">提示\u003c/h2>\n\u003cp>3% = 0.03；每一年把當年期初金額乘以 1.03。不要將 1.03 再加上百分比符號。\u003c/p>\n\u003ch2 id=\"答案與逐步解析\">答案與逐步解析\u003c/h2>\n\u003cp>正確答案：\u003cstrong>C，10,609 元\u003c/strong>。\u003c/p>\n\u003col>\n\u003cli>第一年利息：10,000 × 0.03 = 300 元。\u003c/li>\n\u003cli>第一年期末：10,000 + 300 = 10,300 元。\u003c/li>\n\u003cli>第二年利息：10,300 × 0.03 = 309 元。\u003c/li>\n\u003cli>第二年期末：10,300 + 309 = 10,609 元。\u003c/li>\n\u003cli>合併公式：A = P(1+r)^n = 10,000 × (1.03)^2 = 10,609 元。P 為原本金，r 為每年利率的小數，n 為年數，A 為期末金額。\u003c/li>\n\u003c/ol>\n\u003cp>這是固定正利率、每年計息一次、利息全留存的假設，不是市場收益預測。\u003c/p>\n\u003ch2 id=\"其他選項錯在哪\">其他選項錯在哪\u003c/h2>\n\u003cul>\n\u003cli>A：只計算一年。\u003c/li>\n\u003cli>B：每年都只加原本金的 300 元，是單利結果。\u003c/li>\n\u003cli>D：把 3% 誤當成 30%，而且未完成兩年計算。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"學習依據\">學習依據\u003c/h2>\n\u003cp>題目與數字均自行設計；計息定義採 \u003ca href=\"reader.html?doc=sources/catalog.md#s006\">S006 pp11、13\u003c/a>，不採 p12 誤植算式。\u003ca href=\"reader.html?doc=wiki/02-inflation-and-compound-interest.md\">返回課程\u003c/a>；\u003ca href=\"reader.html?doc=wiki/index.md\">回目錄\u003c/a>。\u003c/p>", "source": "# 練習 02：利息留下來之後\n\n【自編練習】本金 10,000 元，每年 3%，每年複利一次，連放兩年，不另收付且忽略稅費。期末金額是多少？\n\n- A. 10,300 元\n- B. 10,600 元\n- C. 10,609 元\n- D. 13,000 元\n\n## 先想想\n\n第二年應按最初的 10,000 元計息，還是把第一年利息也放進計息基礎？\n\n## 提示\n\n3% = 0.03；每一年把當年期初金額乘以 1.03。不要將 1.03 再加上百分比符號。\n\n## 答案與逐步解析\n\n正確答案：**C，10,609 元**。\n\n1. 第一年利息：10,000 × 0.03 = 300 元。\n2. 第一年期末：10,000 + 300 = 10,300 元。\n3. 第二年利息：10,300 × 0.03 = 309 元。\n4. 第二年期末：10,300 + 309 = 10,609 元。\n5. 合併公式：A = P(1+r)^n = 10,000 × (1.03)^2 = 10,609 元。P 為原本金，r 為每年利率的小數，n 為年數，A 為期末金額。\n\n這是固定正利率、每年計息一次、利息全留存的假設，不是市場收益預測。\n\n## 其他選項錯在哪\n\n- A：只計算一年。\n- B：每年都只加原本金的 300 元，是單利結果。\n- D：把 3% 誤當成 30%，而且未完成兩年計算。\n\n## 學習依據\n\n題目與數字均自行設計；計息定義採 [S006 pp11、13](../sources/catalog.md#s006)，不採 p12 誤植算式。[返回課程](../wiki/02-inflation-and-compound-interest.md)；[回目錄](../wiki/index.md)。\n"}, "exercises/03-stocks-bonds-funds-etfs.md": {"title": "練習 03：先分清投資身分", "html": "\u003ch1 id=\"練習-03先分清投資身分\">練習 03：先分清投資身分\u003c/h1>\n\u003cp>【自編練習】哪句話正確？\u003c/p>\n\u003cul>\n\u003cli>A. ETF 不屬於基金。\u003c/li>\n\u003cli>B. 債券持有人一定是公司的股東。\u003c/li>\n\u003cli>C. 股票每年保證配發股利。\u003c/li>\n\u003cli>D. 一般債券持有人依條件請求還本付息，仍須注意履約風險。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"先想想\">先想想\u003c/h2>\n\u003cp>先分清「持有公司所有權」與「依約請求對方付款」；再回想 ETF 與基金的包含關係。\u003c/p>\n\u003ch2 id=\"提示\">提示\u003c/h2>\n\u003cp>「依約可以請求」和「對方一定付得出」是兩件事。\u003c/p>\n\u003ch2 id=\"答案與逐步解析\">答案與逐步解析\u003c/h2>\n\u003cp>正確答案：\u003cstrong>D\u003c/strong>。\u003c/p>\n\u003col>\n\u003cli>股票代表公司的部分所有權，持有人稱股東。\u003c/li>\n\u003cli>一般債券代表發行人依條件籌借資金；持有人依約請求還本付息，不能因此當成公司所有人。\u003c/li>\n\u003cli>還款與利息須看條件，也可能發生對方不能履行付款的違約。\u003c/li>\n\u003cli>ETF 是在交易所買賣的基金，仍屬基金。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"其他選項錯在哪\">其他選項錯在哪\u003c/h2>\n\u003cul>\n\u003cli>A：把基金的其中一種形式排除在基金之外。\u003c/li>\n\u003cli>B：混淆出借者與所有人的身分；單憑持有債券不能斷言是股東。\u003c/li>\n\u003cli>C：公司是否分派股利並非每年保證。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"學習依據\">學習依據\u003c/h2>\n\u003cp>題目自行設計；\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004 pp8–10\u003c/a>、\u003ca href=\"reader.html?doc=sources/catalog.md#s003\">S003 Q1–Q3\u003c/a>、\u003ca href=\"reader.html?doc=sources/catalog.md#s007\">S007 壹\u003c/a>。\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">返回課程\u003c/a>；\u003ca href=\"reader.html?doc=wiki/index.md\">回目錄\u003c/a>。\u003c/p>", "source": "# 練習 03：先分清投資身分\n\n【自編練習】哪句話正確？\n\n- A. ETF 不屬於基金。\n- B. 債券持有人一定是公司的股東。\n- C. 股票每年保證配發股利。\n- D. 一般債券持有人依條件請求還本付息，仍須注意履約風險。\n\n## 先想想\n\n先分清「持有公司所有權」與「依約請求對方付款」；再回想 ETF 與基金的包含關係。\n\n## 提示\n\n「依約可以請求」和「對方一定付得出」是兩件事。\n\n## 答案與逐步解析\n\n正確答案：**D**。\n\n1. 股票代表公司的部分所有權，持有人稱股東。\n2. 一般債券代表發行人依條件籌借資金；持有人依約請求還本付息，不能因此當成公司所有人。\n3. 還款與利息須看條件，也可能發生對方不能履行付款的違約。\n4. ETF 是在交易所買賣的基金，仍屬基金。\n\n## 其他選項錯在哪\n\n- A：把基金的其中一種形式排除在基金之外。\n- B：混淆出借者與所有人的身分；單憑持有債券不能斷言是股東。\n- C：公司是否分派股利並非每年保證。\n\n## 學習依據\n\n題目自行設計；[S004 pp8–10](../sources/catalog.md#s004)、[S003 Q1–Q3](../sources/catalog.md#s003)、[S007 壹](../sources/catalog.md#s007)。[返回課程](../wiki/03-stocks-bonds-funds-etfs.md)；[回目錄](../wiki/index.md)。\n"}, "exercises/04-diversification-and-allocation.md": {"title": "練習 04：分開計算，再加總", "html": "\u003ch1 id=\"練習-04分開計算再加總\">練習 04：分開計算，再加總\u003c/h1>\n\u003cp>【自編練習】6,000 元放 A、4,000 元放 B；同一期間 A 跌 10%、B 不變，無其他收付及費用，合計剩多少？\u003c/p>\n\u003cul>\n\u003cli>A. 9,000 元\u003c/li>\n\u003cli>B. 9,400 元\u003c/li>\n\u003cli>C. 10,000 元\u003c/li>\n\u003cli>D. 10,600 元\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"先想想\">先想想\u003c/h2>\n\u003cp>下跌的 10% 應乘以 A 的金額，還是全部資金？\u003c/p>\n\u003ch2 id=\"提示\">提示\u003c/h2>\n\u003cp>先算 A 剩多少，再加上未變動的 B。A、B 是假設資產，不是推薦商品。\u003c/p>\n\u003ch2 id=\"答案與逐步解析\">答案與逐步解析\u003c/h2>\n\u003cp>正確答案：\u003cstrong>B，9,400 元\u003c/strong>。\u003c/p>\n\u003col>\n\u003cli>A 損失：6,000 × 0.10 = 600 元。\u003c/li>\n\u003cli>A 期末：6,000 − 600 = 5,400 元。\u003c/li>\n\u003cli>B 期末：4,000 元。\u003c/li>\n\u003cli>總額：5,400 + 4,000 = 9,400 元。\u003c/li>\n\u003cli>全組合損失比例：600 ÷ 10,000 = 6%。\u003c/li>\n\u003c/ol>\n\u003cp>即使這題的 B 沒跌，也不能推論現實中的 B 必然不跌；配置比例只是題目設定。\u003c/p>\n\u003ch2 id=\"其他選項錯在哪\">其他選項錯在哪\u003c/h2>\n\u003cul>\n\u003cli>A：把 10% 錯套到全部 10,000 元。\u003c/li>\n\u003cli>C：忽略 A 的損失。\u003c/li>\n\u003cli>D：把下跌當成上漲。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"學習依據\">學習依據\u003c/h2>\n\u003cp>題目與計算自行設計；分散與配置概念採 \u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004 pp22–27\u003c/a>，不使用 p25 未附出處的數據。\u003ca href=\"reader.html?doc=wiki/04-diversification-and-allocation.md\">返回課程\u003c/a>；\u003ca href=\"reader.html?doc=wiki/index.md\">回目錄\u003c/a>。\u003c/p>", "source": "# 練習 04：分開計算，再加總\n\n【自編練習】6,000 元放 A、4,000 元放 B；同一期間 A 跌 10%、B 不變，無其他收付及費用，合計剩多少？\n\n- A. 9,000 元\n- B. 9,400 元\n- C. 10,000 元\n- D. 10,600 元\n\n## 先想想\n\n下跌的 10% 應乘以 A 的金額，還是全部資金？\n\n## 提示\n\n先算 A 剩多少，再加上未變動的 B。A、B 是假設資產，不是推薦商品。\n\n## 答案與逐步解析\n\n正確答案：**B，9,400 元**。\n\n1. A 損失：6,000 × 0.10 = 600 元。\n2. A 期末：6,000 − 600 = 5,400 元。\n3. B 期末：4,000 元。\n4. 總額：5,400 + 4,000 = 9,400 元。\n5. 全組合損失比例：600 ÷ 10,000 = 6%。\n\n即使這題的 B 沒跌，也不能推論現實中的 B 必然不跌；配置比例只是題目設定。\n\n## 其他選項錯在哪\n\n- A：把 10% 錯套到全部 10,000 元。\n- C：忽略 A 的損失。\n- D：把下跌當成上漲。\n\n## 學習依據\n\n題目與計算自行設計；分散與配置概念採 [S004 pp22–27](../sources/catalog.md#s004)，不使用 p25 未附出處的數據。[返回課程](../wiki/04-diversification-and-allocation.md)；[回目錄](../wiki/index.md)。\n"}, "exercises/05-first-financial-plan.md": {"title": "練習 05：面對催促匯款的訊息", "html": "\u003ch1 id=\"練習-05面對催促匯款的訊息\">練習 05：面對催促匯款的訊息\u003c/h1>\n\u003cp>【自編練習】陌生群組保證「每月高報酬、完全零風險」，並催你當天匯款。哪個做法較合適？\u003c/p>\n\u003cul>\n\u003cli>A. 先匯小額就代表安全。\u003c/li>\n\u003cli>B. 只看平台獲利截圖便匯款。\u003c/li>\n\u003cli>C. 暫停匯款，另找官方管道查核，必要時洽 165。\u003c/li>\n\u003cli>D. 提供銀行驗證碼讓對方代操作。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"先想想\">先想想\u003c/h2>\n\u003cp>訊息有沒有聲稱不可能損失？驗證方式是否仍由同一個陌生群組提供？\u003c/p>\n\u003ch2 id=\"提示\">提示\u003c/h2>\n\u003cp>用與對方無關、自己查找到的官方管道查證；不要把看見畫面上的獲利當成資金安全證據。\u003c/p>\n\u003ch2 id=\"答案與逐步解析\">答案與逐步解析\u003c/h2>\n\u003cp>正確答案：\u003cstrong>C\u003c/strong>。\u003c/p>\n\u003col>\n\u003cli>高報酬卻聲稱零風險，是與正常風險概念不相符的警訊。\u003c/li>\n\u003cli>催促立即付款會壓縮查證時間，應先停止匯款。\u003c/li>\n\u003cli>自行找到官方機構或 165 管道查核；不單靠群組給的網址、電話或截圖。\u003c/li>\n\u003cli>不交出帳密或驗證碼。此題辨識應採取的查核行動，不是替個別案件作法律定性。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"其他選項錯在哪\">其他選項錯在哪\u003c/h2>\n\u003cul>\n\u003cli>A：小額能領回也不能證明平台可靠。\u003c/li>\n\u003cli>B：畫面或截圖可以被偽造，不能代替查證。\u003c/li>\n\u003cli>D：驗證碼可涉及帳戶控制，不能交給陌生人操作。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"學習依據\">學習依據\u003c/h2>\n\u003cp>情境自行設計；風險與防詐依 \u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004 pp5、17、31–33\u003c/a>。\u003ca href=\"reader.html?doc=wiki/05-first-financial-plan.md\">返回課程\u003c/a>；\u003ca href=\"reader.html?doc=wiki/index.md\">回目錄\u003c/a>。\u003c/p>", "source": "# 練習 05：面對催促匯款的訊息\n\n【自編練習】陌生群組保證「每月高報酬、完全零風險」，並催你當天匯款。哪個做法較合適？\n\n- A. 先匯小額就代表安全。\n- B. 只看平台獲利截圖便匯款。\n- C. 暫停匯款，另找官方管道查核，必要時洽 165。\n- D. 提供銀行驗證碼讓對方代操作。\n\n## 先想想\n\n訊息有沒有聲稱不可能損失？驗證方式是否仍由同一個陌生群組提供？\n\n## 提示\n\n用與對方無關、自己查找到的官方管道查證；不要把看見畫面上的獲利當成資金安全證據。\n\n## 答案與逐步解析\n\n正確答案：**C**。\n\n1. 高報酬卻聲稱零風險，是與正常風險概念不相符的警訊。\n2. 催促立即付款會壓縮查證時間，應先停止匯款。\n3. 自行找到官方機構或 165 管道查核；不單靠群組給的網址、電話或截圖。\n4. 不交出帳密或驗證碼。此題辨識應採取的查核行動，不是替個別案件作法律定性。\n\n## 其他選項錯在哪\n\n- A：小額能領回也不能證明平台可靠。\n- B：畫面或截圖可以被偽造，不能代替查證。\n- D：驗證碼可涉及帳戶控制，不能交給陌生人操作。\n\n## 學習依據\n\n情境自行設計；風險與防詐依 [S004 pp5、17、31–33](../sources/catalog.md#s004)。[返回課程](../wiki/05-first-financial-plan.md)；[回目錄](../wiki/index.md)。\n"}, "notes/s001-reading.md": {"title": "S001 閱讀筆記", "html": "\u003ch1 id=\"s001-閱讀筆記\">S001 閱讀筆記\u003c/h1>\n\u003cp>來源：\u003ca href=\"reader.html?doc=sources/catalog.md#s001\">登錄表 S001\u003c/a>。查閱：2026-11-19。\u003c/p>\n\u003ch2 id=\"原文重點轉述非逐字引文\">原文重點（轉述，非逐字引文）\u003c/h2>\n\u003cul>\n\u003cli>【來源內容】收入支出健檢說明將財務目標與儲蓄納入收支安排。\u003c/li>\n\u003cli>【來源內容】現金健檢以數個月的生活資金討論突發需求。\u003c/li>\n\u003cli>【來源內容】循環利息健檢提醒欠款與償還負擔；個別計息方式須依契約查核。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"採用與限制\">採用與限制\u003c/h2>\n\u003cul>\n\u003cli>匯入單元 1、5：收支、備用金與計畫。\u003c/li>\n\u003cli>【教學轉譯】預備金月份依生活條件決定；Wiki 的三個月是例題設定，不是官方強制標準。\u003c/li>\n\u003cli>不將現金等價項目清單解讀成所有基金均無價格風險。\u003c/li>\n\u003cli>【待確認】試算器實際輸出未測試；文章個別更新日期未列。兩者皆非本次主張依據。\u003c/li>\n\u003c/ul>", "source": "# S001 閱讀筆記\n\n來源：[登錄表 S001](../sources/catalog.md#s001)。查閱：2026-11-19。\n\n## 原文重點（轉述，非逐字引文）\n\n- 【來源內容】收入支出健檢說明將財務目標與儲蓄納入收支安排。\n- 【來源內容】現金健檢以數個月的生活資金討論突發需求。\n- 【來源內容】循環利息健檢提醒欠款與償還負擔；個別計息方式須依契約查核。\n\n## 採用與限制\n\n- 匯入單元 1、5：收支、備用金與計畫。\n- 【教學轉譯】預備金月份依生活條件決定；Wiki 的三個月是例題設定，不是官方強制標準。\n- 不將現金等價項目清單解讀成所有基金均無價格風險。\n- 【待確認】試算器實際輸出未測試；文章個別更新日期未列。兩者皆非本次主張依據。\n"}, "notes/s002-reading.md": {"title": "S002 閱讀筆記", "html": "\u003ch1 id=\"s002-閱讀筆記\">S002 閱讀筆記\u003c/h1>\n\u003cp>來源：\u003ca href=\"reader.html?doc=sources/catalog.md#s002\">登錄表 S002\u003c/a>。查閱：2026-11-19。\u003c/p>\n\u003ch2 id=\"原文重點轉述非逐字引文\">原文重點（轉述，非逐字引文）\u003c/h2>\n\u003cul>\n\u003cli>【來源內容】整體物價上漲會影響家庭支出及固定金額的購買能力。\u003c/li>\n\u003cli>【來源內容】不同家庭的收入、資產及負債條件不同，受到的影響不一。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"採用與限制\">採用與限制\u003c/h2>\n\u003cul>\n\u003cli>匯入單元 2 的通膨與購買力。\u003c/li>\n\u003cli>雞排或早餐漲價只是生活比喻，不能單憑一家店價格判定整體通膨。\u003c/li>\n\u003cli>不把 2008 年文章當成 2026 年通膨統計；不由此推論特定投資一定抗通膨。\u003c/li>\n\u003cli>原文未完整教單利與複利計算，由 S006 補足。\u003c/li>\n\u003cli>【待確認】個別更新日期未列；不影響採用基礎概念。\u003c/li>\n\u003c/ul>", "source": "# S002 閱讀筆記\n\n來源：[登錄表 S002](../sources/catalog.md#s002)。查閱：2026-11-19。\n\n## 原文重點（轉述，非逐字引文）\n\n- 【來源內容】整體物價上漲會影響家庭支出及固定金額的購買能力。\n- 【來源內容】不同家庭的收入、資產及負債條件不同，受到的影響不一。\n\n## 採用與限制\n\n- 匯入單元 2 的通膨與購買力。\n- 雞排或早餐漲價只是生活比喻，不能單憑一家店價格判定整體通膨。\n- 不把 2008 年文章當成 2026 年通膨統計；不由此推論特定投資一定抗通膨。\n- 原文未完整教單利與複利計算，由 S006 補足。\n- 【待確認】個別更新日期未列；不影響採用基礎概念。\n"}, "notes/s003-reading.md": {"title": "S003 閱讀筆記", "html": "\u003ch1 id=\"s003-閱讀筆記\">S003 閱讀筆記\u003c/h1>\n\u003cp>來源：\u003ca href=\"reader.html?doc=sources/catalog.md#s003\">登錄表 S003\u003c/a>。查閱：2026-11-19。\u003c/p>\n\u003ch2 id=\"原文重點轉述非逐字引文\">原文重點（轉述，非逐字引文）\u003c/h2>\n\u003cul>\n\u003cli>【來源內容】Q1、Q3 說明 ETF 的基金與交易所買賣特性。\u003c/li>\n\u003cli>【來源內容】Q2 列出不同 ETF 類型，包含主動式。\u003c/li>\n\u003cli>【來源內容】Q8 提醒閱讀公開說明書，即產品的重要規則與風險文件。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"採用與限制\">採用與限制\u003c/h2>\n\u003cul>\n\u003cli>匯入單元 3；單元 4 只用於提醒 ETF 內容仍須檢查。\u003c/li>\n\u003cli>將 ETF 解釋為「可在交易所買賣的基金」，避免把 Q1 的指數追蹤描述套用到所有 ETF。\u003c/li>\n\u003cli>不宣稱每檔 ETF 均充分分散、低費用或獲利。\u003c/li>\n\u003cli>【待確認】未逐一核實交易稅費、最低金額及全部圖片，因此不匯入相關數字。\u003c/li>\n\u003c/ul>", "source": "# S003 閱讀筆記\n\n來源：[登錄表 S003](../sources/catalog.md#s003)。查閱：2026-11-19。\n\n## 原文重點（轉述，非逐字引文）\n\n- 【來源內容】Q1、Q3 說明 ETF 的基金與交易所買賣特性。\n- 【來源內容】Q2 列出不同 ETF 類型，包含主動式。\n- 【來源內容】Q8 提醒閱讀公開說明書，即產品的重要規則與風險文件。\n\n## 採用與限制\n\n- 匯入單元 3；單元 4 只用於提醒 ETF 內容仍須檢查。\n- 將 ETF 解釋為「可在交易所買賣的基金」，避免把 Q1 的指數追蹤描述套用到所有 ETF。\n- 不宣稱每檔 ETF 均充分分散、低費用或獲利。\n- 【待確認】未逐一核實交易稅費、最低金額及全部圖片，因此不匯入相關數字。\n"}, "notes/s004-reading.md": {"title": "S004 閱讀筆記與補查結果", "html": "\u003ch1 id=\"s004-閱讀筆記與補查結果\">S004 閱讀筆記與補查結果\u003c/h1>\n\u003cp>來源：\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">登錄表 S004\u003c/a>。查閱：2026-11-19。35 頁文字已抽取；頁碼為 PDF 實際頁序。\u003c/p>\n\u003ch2 id=\"指定範圍補查\">指定範圍補查\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>範圍\u003c/th>\u003cth>【來源內容】定位與用途\u003c/th>\u003cth>判定\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>pp1–7\u003c/td>\u003ctd>p4 理財規劃；p5 風險與報酬；p7 提及複利與通膨\u003c/td>\u003ctd>有概念，缺完整單利／複利計算\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>pp8–9\u003c/td>\u003ctd>股票代表公司部分所有權；股利與價格變化\u003c/td>\u003ctd>股票基本身分可用；不推論保證分紅\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>pp10–13\u003c/td>\u003ctd>p10 基金；pp11–13 ETF 與產品差異\u003c/td>\u003ctd>ETF 定義須與 S003 的主動式類型並讀\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>pp14–17\u003c/td>\u003ctd>虛擬資產及 p17 假投資平台、釣魚等陷阱\u003c/td>\u003ctd>防詐辨識可用；不匯入虛擬資產操作策略\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>pp18–21\u003c/td>\u003ctd>投資制度介紹及目標、工具理解\u003c/td>\u003ctd>不使用未另核實的制度年齡與優惠條件\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>pp28–30\u003c/td>\u003ctd>年齡配置、策略與長期投入提醒\u003c/td>\u003ctd>不採年齡公式作個人建議；仍無完整計息推導\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>pp31–33\u003c/td>\u003ctd>165 打詐儀錶板、案例查詢、165 防詐諮詢資訊\u003c/td>\u003ctd>補足防詐資訊入口\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>pp34–35\u003c/td>\u003ctd>規劃、紀律與結語\u003c/td>\u003ctd>無新增計息公式或債券權利完整說明\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"原已採用區段\">原已採用區段\u003c/h2>\n\u003cul>\n\u003cli>【來源內容】pp22–24：評估生活條件、目標及風險承受；p26：分散與配置；p27：因比例改變而檢視配置。\u003c/li>\n\u003cli>封面與 p26 已做圖像核對；本輪上述範圍是抽取文字檢查，未聲稱全部頁面都逐圖核對。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"三個資料缺口如何處理\">三個資料缺口如何處理\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>單利／複利\u003c/strong>：p7、p30 僅有概念；改由 S006 pp11、13 定義，Wiki 自行展開代數與算例。S006 p12 誤植另記錄，不照抄。\u003c/li>\n\u003cli>\u003cstrong>股票／債券基本權利\u003c/strong>：pp8–9 足以支持股票部分所有權；p12 債券 ETF 的說明不能代替直接持有債券的還本付息條件，因此以 S007「壹、定義」補足債券條件。\u003c/li>\n\u003cli>\u003cstrong>投資詐騙辨識\u003c/strong>：p5、p17、pp31–33 已有可用內容，無須為相同缺口另增來源；教學不把可疑訊號當成法律認定。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"停用與待確認\">停用與待確認\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>p25「超過90%」：未附可查研究出處，使用者已確認停用；不得出現在 Wiki、練習答案或之後簡報作為事實。\u003c/strong>\u003c/li>\n\u003cli>p26 的固定比例、p28 的年齡配置法不作通用指令；本專案的比例一律標記假設。\u003c/li>\n\u003cli>【待確認】p7 的長期通膨數字及 p18–20 個別制度條件尚未另核實，不匯入。\u003c/li>\n\u003cli>【待確認】正式發布日未見；不得將 PDF 建檔日期當發布日。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"匯入去向\">匯入去向\u003c/h2>\n\u003cp>單元 1：預備金；單元 3：股票與基金；單元 4：分散與配置；單元 5：目標、風險及防詐。\u003c/p>", "source": "# S004 閱讀筆記與補查結果\n\n來源：[登錄表 S004](../sources/catalog.md#s004)。查閱：2026-11-19。35 頁文字已抽取；頁碼為 PDF 實際頁序。\n\n## 指定範圍補查\n\n| 範圍 | 【來源內容】定位與用途 | 判定 |\n| --- | --- | --- |\n| pp1–7 | p4 理財規劃；p5 風險與報酬；p7 提及複利與通膨 | 有概念，缺完整單利／複利計算 |\n| pp8–9 | 股票代表公司部分所有權；股利與價格變化 | 股票基本身分可用；不推論保證分紅 |\n| pp10–13 | p10 基金；pp11–13 ETF 與產品差異 | ETF 定義須與 S003 的主動式類型並讀 |\n| pp14–17 | 虛擬資產及 p17 假投資平台、釣魚等陷阱 | 防詐辨識可用；不匯入虛擬資產操作策略 |\n| pp18–21 | 投資制度介紹及目標、工具理解 | 不使用未另核實的制度年齡與優惠條件 |\n| pp28–30 | 年齡配置、策略與長期投入提醒 | 不採年齡公式作個人建議；仍無完整計息推導 |\n| pp31–33 | 165 打詐儀錶板、案例查詢、165 防詐諮詢資訊 | 補足防詐資訊入口 |\n| pp34–35 | 規劃、紀律與結語 | 無新增計息公式或債券權利完整說明 |\n\n## 原已採用區段\n\n- 【來源內容】pp22–24：評估生活條件、目標及風險承受；p26：分散與配置；p27：因比例改變而檢視配置。\n- 封面與 p26 已做圖像核對；本輪上述範圍是抽取文字檢查，未聲稱全部頁面都逐圖核對。\n\n## 三個資料缺口如何處理\n\n1. **單利／複利**：p7、p30 僅有概念；改由 S006 pp11、13 定義，Wiki 自行展開代數與算例。S006 p12 誤植另記錄，不照抄。\n2. **股票／債券基本權利**：pp8–9 足以支持股票部分所有權；p12 債券 ETF 的說明不能代替直接持有債券的還本付息條件，因此以 S007「壹、定義」補足債券條件。\n3. **投資詐騙辨識**：p5、p17、pp31–33 已有可用內容，無須為相同缺口另增來源；教學不把可疑訊號當成法律認定。\n\n## 停用與待確認\n\n- **p25「超過90%」：未附可查研究出處，使用者已確認停用；不得出現在 Wiki、練習答案或之後簡報作為事實。**\n- p26 的固定比例、p28 的年齡配置法不作通用指令；本專案的比例一律標記假設。\n- 【待確認】p7 的長期通膨數字及 p18–20 個別制度條件尚未另核實，不匯入。\n- 【待確認】正式發布日未見；不得將 PDF 建檔日期當發布日。\n\n## 匯入去向\n\n單元 1：預備金；單元 3：股票與基金；單元 4：分散與配置；單元 5：目標、風險及防詐。\n"}, "notes/s005-reading.md": {"title": "S005 閱讀筆記", "html": "\u003ch1 id=\"s005-閱讀筆記\">S005 閱讀筆記\u003c/h1>\n\u003cp>來源：\u003ca href=\"reader.html?doc=sources/catalog.md#s005\">登錄表 S005\u003c/a>。查閱：2026-11-19。\u003c/p>\n\u003ch2 id=\"原文重點轉述非逐字引文\">原文重點（轉述，非逐字引文）\u003c/h2>\n\u003cul>\n\u003cli>【來源內容】投資人篇交易流程：與證券商約定標的、日期、金額、款項及交易方式。\u003c/li>\n\u003cli>【來源內容】常見問答：費用與承作方式須按契約及承作證券商條件確認。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"採用與限制\">採用與限制\u003c/h2>\n\u003cul>\n\u003cli>匯入單元 5 的執行前檢查；先確認目標與可動用資金，再談是否定期投入。\u003c/li>\n\u003cli>固定投入時間不能保證獲利，也不等於已充分分散。\u003c/li>\n\u003cli>不介紹個別商品或以現在的手續費率舉例。\u003c/li>\n\u003cli>【待確認】個別文章發布日未列。制度開辦日不能作本文發布日。\u003c/li>\n\u003c/ul>", "source": "# S005 閱讀筆記\n\n來源：[登錄表 S005](../sources/catalog.md#s005)。查閱：2026-11-19。\n\n## 原文重點（轉述，非逐字引文）\n\n- 【來源內容】投資人篇交易流程：與證券商約定標的、日期、金額、款項及交易方式。\n- 【來源內容】常見問答：費用與承作方式須按契約及承作證券商條件確認。\n\n## 採用與限制\n\n- 匯入單元 5 的執行前檢查；先確認目標與可動用資金，再談是否定期投入。\n- 固定投入時間不能保證獲利，也不等於已充分分散。\n- 不介紹個別商品或以現在的手續費率舉例。\n- 【待確認】個別文章發布日未列。制度開辦日不能作本文發布日。\n"}, "notes/s006-reading.md": {"title": "S006 閱讀筆記與錯誤隔離", "html": "\u003ch1 id=\"s006-閱讀筆記與錯誤隔離\">S006 閱讀筆記與錯誤隔離\u003c/h1>\n\u003cp>來源：\u003ca href=\"reader.html?doc=sources/catalog.md#s006\">登錄表 S006\u003c/a>。查閱：2026-11-19。\u003c/p>\n\u003ch2 id=\"可讀性與定位\">可讀性與定位\u003c/h2>\n\u003cp>下載到的 PDF 共 43 頁；封面為「金融素養培力—從扎根基礎知識做起」，標示 2024.09；頁面有金融消費評議中心標誌。全文可抽取文字，p12 另外渲染核對。\u003c/p>\n\u003ch2 id=\"原文重點轉述非逐字引文\">原文重點（轉述，非逐字引文）\u003c/h2>\n\u003cul>\n\u003cli>【來源內容】p11：單利以原始本金計息；複利把前期利息併入下一期本金。\u003c/li>\n\u003cli>【來源內容】p13：再次比較上述兩種計息基礎。\u003c/li>\n\u003cli>【教學轉譯】若每年只計息一次且利率固定，單利期末金額可寫為 P(1+rn)，複利為 P(1+r)^n；P 是最初金額、r 是每年利率的小數、n 是年數。這是依定義展開的教學推導，非原文逐字公式。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"p12-誤植與限制\">p12 誤植與限制\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>視覺核對確認原頁寫「50萬 × 1.05% = 52.5萬」，左右不相等。\u003c/strong>\u003c/li>\n\u003cli>50 萬乘以 1.05 才是 52.5 萬；1.05% = 0.0105。不得把原頁式子當正確計算。\u003c/li>\n\u003cli>原文「複利利息較高」須限定正利率及多期比較；零利率或負報酬不適用該泛稱。\u003c/li>\n\u003cli>不採該頁未追溯的愛因斯坦引言，不照抄其四捨五入序列。\u003c/li>\n\u003cli>Wiki 用 10,000 元、每年 2%、兩年的【假設例子】獨立驗算，並排除費用、稅及中途收付。\u003c/li>\n\u003cli>【待確認】誤植是否有官方更正版尚未確認；已隔離，不阻擋其餘定義的使用。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"匯入去向\">匯入去向\u003c/h2>\n\u003cp>單元 2：單利、複利與計息公式；練習 02。\u003c/p>", "source": "# S006 閱讀筆記與錯誤隔離\n\n來源：[登錄表 S006](../sources/catalog.md#s006)。查閱：2026-11-19。\n\n## 可讀性與定位\n\n下載到的 PDF 共 43 頁；封面為「金融素養培力—從扎根基礎知識做起」，標示 2024.09；頁面有金融消費評議中心標誌。全文可抽取文字，p12 另外渲染核對。\n\n## 原文重點（轉述，非逐字引文）\n\n- 【來源內容】p11：單利以原始本金計息；複利把前期利息併入下一期本金。\n- 【來源內容】p13：再次比較上述兩種計息基礎。\n- 【教學轉譯】若每年只計息一次且利率固定，單利期末金額可寫為 P(1+rn)，複利為 P(1+r)^n；P 是最初金額、r 是每年利率的小數、n 是年數。這是依定義展開的教學推導，非原文逐字公式。\n\n## p12 誤植與限制\n\n- **視覺核對確認原頁寫「50萬 × 1.05% = 52.5萬」，左右不相等。**\n- 50 萬乘以 1.05 才是 52.5 萬；1.05% = 0.0105。不得把原頁式子當正確計算。\n- 原文「複利利息較高」須限定正利率及多期比較；零利率或負報酬不適用該泛稱。\n- 不採該頁未追溯的愛因斯坦引言，不照抄其四捨五入序列。\n- Wiki 用 10,000 元、每年 2%、兩年的【假設例子】獨立驗算，並排除費用、稅及中途收付。\n- 【待確認】誤植是否有官方更正版尚未確認；已隔離，不阻擋其餘定義的使用。\n\n## 匯入去向\n\n單元 2：單利、複利與計息公式；練習 02。\n"}, "notes/s007-reading.md": {"title": "S007 閱讀筆記", "html": "\u003ch1 id=\"s007-閱讀筆記\">S007 閱讀筆記\u003c/h1>\n\u003cp>來源：\u003ca href=\"reader.html?doc=sources/catalog.md#s007\">登錄表 S007\u003c/a>。查閱：2026-11-19。\u003c/p>\n\u003ch2 id=\"可讀性\">可讀性\u003c/h2>\n\u003cp>搜尋瀏覽工具回應 403；改用一般 HTTPS 下載取得官方公開 HTML，並實際讀取正文。未以搜尋摘要冒充全文閱讀。\u003c/p>\n\u003ch2 id=\"原文重點轉述非逐字引文\">原文重點（轉述，非逐字引文）\u003c/h2>\n\u003cul>\n\u003cli>【來源內容】「壹、定義」一：公司或銀行發行債券以籌措資金。\u003c/li>\n\u003cli>【來源內容】「壹、定義」二：利率可能固定或浮動；還本可一次或分次；有些債券沒有到期日；付息設計也不同。\u003c/li>\n\u003cli>【來源內容】「貳、發行面」三：發行人財務資訊及發行條件須另查。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"教學使用與限制\">教學使用與限制\u003c/h2>\n\u003cul>\n\u003cli>【教學轉譯】一般債券持有人是依約請求還本付息的出借者；這種請求關係稱「債權」，並非公司所有權。\u003c/li>\n\u003cli>單元 3 只假設一年到期、固定利率、按約支付的債券；不能推論所有債券同樣設計。\u003c/li>\n\u003cli>契約承諾不等於實際付款保證；不把公司債等同受保障的銀行存款。\u003c/li>\n\u003cli>不匯入交易時段、交易單位等本次不需使用的制度細節。\u003c/li>\n\u003cli>【待確認】個別文章發布／更新日未列，不採頁尾版權年份推定。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"匯入去向\">匯入去向\u003c/h2>\n\u003cp>單元 3：債券與股票的基本身分差異；練習 03。\u003c/p>", "source": "# S007 閱讀筆記\n\n來源：[登錄表 S007](../sources/catalog.md#s007)。查閱：2026-11-19。\n\n## 可讀性\n\n搜尋瀏覽工具回應 403；改用一般 HTTPS 下載取得官方公開 HTML，並實際讀取正文。未以搜尋摘要冒充全文閱讀。\n\n## 原文重點（轉述，非逐字引文）\n\n- 【來源內容】「壹、定義」一：公司或銀行發行債券以籌措資金。\n- 【來源內容】「壹、定義」二：利率可能固定或浮動；還本可一次或分次；有些債券沒有到期日；付息設計也不同。\n- 【來源內容】「貳、發行面」三：發行人財務資訊及發行條件須另查。\n\n## 教學使用與限制\n\n- 【教學轉譯】一般債券持有人是依約請求還本付息的出借者；這種請求關係稱「債權」，並非公司所有權。\n- 單元 3 只假設一年到期、固定利率、按約支付的債券；不能推論所有債券同樣設計。\n- 契約承諾不等於實際付款保證；不把公司債等同受保障的銀行存款。\n- 不匯入交易時段、交易單位等本次不需使用的制度細節。\n- 【待確認】個別文章發布／更新日未列，不採頁尾版權年份推定。\n\n## 匯入去向\n\n單元 3：債券與股票的基本身分差異；練習 03。\n"}, "README.md": {"title": "零基礎個人投資與理財入門", "html": "\u003ch1 id=\"零基礎個人投資與理財入門\">零基礎個人投資與理財入門\u003c/h1>\n\u003cp>給沒有股市、基金或財經先備知識的大學生與社會新鮮人。從生活中的錢開始，透過生活比喻、假設試算與基礎題建立理解；不提供個人化投資建議或商品推薦。\u003c/p>\n\u003ch2 id=\"從哪裡開始\">從哪裡開始\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"index.html\">公開入口首頁\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"slides/index.html\">八頁教學 HTML 簡報\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=wiki/index.md\">完整 Wiki 目錄\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=sources/catalog.md\">七份來源登錄\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"exercises/index.html\">五題練習與可展開解析\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=AGENTS.md\">專案規則\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=reports/2026-11-19-content-check.md\">內容檢查報告\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=reports/2026-11-19-release-check.md\">發布檢查報告\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"五個學習單元\">五個學習單元\u003c/h2>\n\u003col>\n\u003cli>\u003ca href=\"reader.html?doc=wiki/01-budget-and-emergency-fund.md\">先管好生活中的錢\u003c/a>：收支、結餘與備用金。\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=wiki/02-inflation-and-compound-interest.md\">錢為什麼會變多，也可能變少\u003c/a>：購買力、單利與複利。\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">股票、債券、基金與 ETF 是什麼\u003c/a>：所有權、出借及基金包含關係。\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=wiki/04-diversification-and-allocation.md\">如何避免把風險集中在一起\u003c/a>：分散與配置仍可能損失。\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=wiki/05-first-financial-plan.md\">建立自己的第一份理財計畫\u003c/a>：生活、目標、執行與付款前查核。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"專案架構\">專案架構\u003c/h2>\n\u003cpre>\u003ccode>zero-basics-finance/\n  AGENTS.md\n  README.md\n  .gitignore\n  .nojekyll\n  index.html\n  sources/catalog.md\n  notes/                     七份來源閱讀筆記\n  wiki/                      五篇知識條目、目錄與執行日誌\n  exercises/                 五份練習 Markdown 與 index.html\n  slides/\n    outline.md\n    source-map.md\n    drafts/                  八份核准逐頁稿\n    index.html               八頁 HTML，內嵌 CSS、JavaScript 與 SVG\n  reports/\n    2026-11-19-content-check.md\n    2026-11-19-release-check.md\n    browser-check.json\n    screenshots/             本機驗收畫面\u003c/code>\u003c/pre>\n\u003ch2 id=\"來源查證原則\">來源查證原則\u003c/h2>\n\u003cp>來源 ID 固定為 S001–S007，優先使用臺灣官方與公信力機構。每份登錄有網址、機構、日期、可定位段落、適用範圍與使用限制；不知道的發布日不補猜。可讀性與資料缺口另存 notes/。\u003c/p>\n\u003cp>重要主張先進 Wiki 才能進簡報，不能直接從外部資料加進簡報。用【來源內容】、【教學轉譯】、【假設例子】、【自編練習】及【待確認】辨識不同性質。假設數字不當歷史績效或收益保證。\u003c/p>\n\u003cp>S004 p25 未附出處的數據停用；S006 p12 百分比算式誤植已隔離，計息定義採 pp11、13，教學數字另行驗算。原始 PDF 與未授權教材不放入公開專案。\u003c/p>\n\u003ch2 id=\"工作流\">工作流\u003c/h2>\n\u003col>\n\u003cli>先討論受眾、單元與規則。\u003c/li>\n\u003cli>來源登錄、可讀性與缺口檢查，取得使用者確認。\u003c/li>\n\u003cli>匯入五篇 Wiki 與練習，同步目錄與日誌。\u003c/li>\n\u003cli>先做固定八頁大綱及逐頁來源對照，再由使用者明確確認。\u003c/li>\n\u003cli>撰寫逐頁稿，分開執行字數、詞義、數字及來源檢查；保留問題與修正紀錄。\u003c/li>\n\u003cli>使用者確認內容報告後，才製作 HTML 與 SVG。\u003c/li>\n\u003cli>本機檢查通過後交付；上傳 GitHub Pages 之後另作公開網址實測。\u003c/li>\n\u003c/ol>\n\u003cp>新增知識時先更新來源與 Wiki，再重新檢查受影響的大綱、來源表、逐頁稿與 HTML。不能只改成品，使核准稿和網站內容分岔。\u003c/p>\n\u003ch2 id=\"本機瀏覽\">本機瀏覽\u003c/h2>\n\u003cp>解壓縮後直接開啟根目錄 index.html，再進入簡報；或直接開啟 slides/index.html。簡報的樣式、互動與圖表均內嵌，不需安裝套件、API 金鑰或網路字型。\u003c/p>\n\u003cp>若電腦有 Python，也可在本專案根目錄執行：\u003c/p>\n\u003cpre>\u003ccode>python -m http.server 8000 --bind 127.0.0.1\u003c/code>\u003c/pre>\n\u003cp>再以瀏覽器開啟 \u003ccode>http://127.0.0.1:8000/\u003c/code>。這是僅限本機的預覽，不是公開網址；關閉預覽服務即可停止。\u003c/p>\n\u003cp>操作：方向鍵左右切頁，空白鍵前進；也可使用下方按鈕。首頁與末頁按鈕有邊界，不會多出第九頁。手機直向採上下排列，依可用高度縮放；短螢幕或高倍率縮放可能使字變小，必要時改橫向或在較大螢幕閱讀。\u003c/p>\n\u003cp>原始 Markdown 保留供版本核對；網站另有 reader.html，可直接閱讀與搜尋 Wiki、來源、規則及報告，不依賴 GitHub 的 Markdown 顯示。練習另有 HTML 入口。reader.html 內嵌目前文件快照，修改 Markdown 後須同步重建閱讀器，避免顯示舊資料。\u003c/p>\n\u003ch2 id=\"github-pages-線上使用\">GitHub Pages 線上使用\u003c/h2>\n\u003cp>本專案已於 2026-11-19 發布至公開 GitHub Repository 與 GitHub Pages。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"https://barry3687.github.io/zero-basics-finance/\">公開教學首頁\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://barry3687.github.io/zero-basics-finance/slides/index.html\">八頁教學簡報\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://barry3687.github.io/zero-basics-finance/reader.html?doc=wiki/index.md\">可搜尋 Wiki 閱讀器\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Barry3687/zero-basics-finance\">GitHub Repository\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>以下發布說明保留作為日後更新操作指引。\u003c/p>\n\u003cp>將這個資料夾內的完整內容放入預定作為網站根目錄的 GitHub Repository，保留相對目錄及 \u003ccode>.nojekyll\u003c/code>。網站的發布來源必須包含根目錄 index.html；若多包一層資料夾，入口路徑也會多一層。\u003c/p>\n\u003cp>由使用者設定 GitHub Pages 發布來源後，使用 GitHub 顯示的實際網站網址開啟驗證。不要把 Repository 網址當成 Pages 網址，也不要猜測網址當作已部署成功。靜態網站的服務方式見 \u003ca href=\"https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages\">GitHub Pages 官方說明\u003c/a>；發布來源見\u003ca href=\"https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site\">官方設定文件\u003c/a>。\u003c/p>\n\u003cp>上傳後須親自檢查：首頁、八頁切換、圖表、來源／Wiki 路徑、練習解析、手機閱讀與公開無需登入；並把實際時間、網址及結果追加發布報告。\u003ccode>.nojekyll\u003c/code> 用來保留純靜態目錄與原始 Markdown 路徑，本專案不依賴 Jekyll 建置。\u003c/p>\n\u003ch2 id=\"公開與私人資料\">公開與私人資料\u003c/h2>\n\u003cp>\u003ccode>.gitignore\u003c/code> 排除 .env、憑證、私人筆記、上傳原檔及未授權 PDF／Office 教材。公開的 notes/ 是來源閱讀摘要，並非私人學習筆記。reports/screenshots/ 只有本專案教學畫面。\u003c/p>\n\u003cp>忽略規則不能自動撤回以前已加入版本控制的秘密；上傳前仍要核對實際檔案。此專案沒有模型金鑰、帳號登入、分析追蹤或收集使用者財務資料的功能。\u003c/p>\n\u003ch2 id=\"驗收界線\">驗收界線\u003c/h2>\n\u003cp>本機結構與指定尺寸的 Chrome 檢查已記錄於發布報告；不等於所有裝置、瀏覽器或公開主機皆已驗收。GitHub Pages 公開網址已實測首頁、Wiki、來源定位、八頁切換、鍵盤操作與練習解析；最新結果見 reports/2026-11-19-optimization-check.md。\u003c/p>", "source": "# 零基礎個人投資與理財入門\n\n給沒有股市、基金或財經先備知識的大學生與社會新鮮人。從生活中的錢開始，透過生活比喻、假設試算與基礎題建立理解；不提供個人化投資建議或商品推薦。\n\n## 從哪裡開始\n\n- [公開入口首頁](index.html)\n- [八頁教學 HTML 簡報](slides/index.html)\n- [完整 Wiki 目錄](wiki/index.md)\n- [七份來源登錄](sources/catalog.md)\n- [五題練習與可展開解析](exercises/index.html)\n- [專案規則](AGENTS.md)\n- [內容檢查報告](reports/2026-11-19-content-check.md)\n- [發布檢查報告](reports/2026-11-19-release-check.md)\n\n## 五個學習單元\n\n1. [先管好生活中的錢](wiki/01-budget-and-emergency-fund.md)：收支、結餘與備用金。\n2. [錢為什麼會變多，也可能變少](wiki/02-inflation-and-compound-interest.md)：購買力、單利與複利。\n3. [股票、債券、基金與 ETF 是什麼](wiki/03-stocks-bonds-funds-etfs.md)：所有權、出借及基金包含關係。\n4. [如何避免把風險集中在一起](wiki/04-diversification-and-allocation.md)：分散與配置仍可能損失。\n5. [建立自己的第一份理財計畫](wiki/05-first-financial-plan.md)：生活、目標、執行與付款前查核。\n\n## 專案架構\n\n```text\nzero-basics-finance/\n  AGENTS.md\n  README.md\n  .gitignore\n  .nojekyll\n  index.html\n  sources/catalog.md\n  notes/                     七份來源閱讀筆記\n  wiki/                      五篇知識條目、目錄與執行日誌\n  exercises/                 五份練習 Markdown 與 index.html\n  slides/\n    outline.md\n    source-map.md\n    drafts/                  八份核准逐頁稿\n    index.html               八頁 HTML，內嵌 CSS、JavaScript 與 SVG\n  reports/\n    2026-11-19-content-check.md\n    2026-11-19-release-check.md\n    browser-check.json\n    screenshots/             本機驗收畫面\n```\n\n## 來源查證原則\n\n來源 ID 固定為 S001–S007，優先使用臺灣官方與公信力機構。每份登錄有網址、機構、日期、可定位段落、適用範圍與使用限制；不知道的發布日不補猜。可讀性與資料缺口另存 notes/。\n\n重要主張先進 Wiki 才能進簡報，不能直接從外部資料加進簡報。用【來源內容】、【教學轉譯】、【假設例子】、【自編練習】及【待確認】辨識不同性質。假設數字不當歷史績效或收益保證。\n\nS004 p25 未附出處的數據停用；S006 p12 百分比算式誤植已隔離，計息定義採 pp11、13，教學數字另行驗算。原始 PDF 與未授權教材不放入公開專案。\n\n## 工作流\n\n1. 先討論受眾、單元與規則。\n2. 來源登錄、可讀性與缺口檢查，取得使用者確認。\n3. 匯入五篇 Wiki 與練習，同步目錄與日誌。\n4. 先做固定八頁大綱及逐頁來源對照，再由使用者明確確認。\n5. 撰寫逐頁稿，分開執行字數、詞義、數字及來源檢查；保留問題與修正紀錄。\n6. 使用者確認內容報告後，才製作 HTML 與 SVG。\n7. 本機檢查通過後交付；上傳 GitHub Pages 之後另作公開網址實測。\n\n新增知識時先更新來源與 Wiki，再重新檢查受影響的大綱、來源表、逐頁稿與 HTML。不能只改成品，使核准稿和網站內容分岔。\n\n## 本機瀏覽\n\n解壓縮後直接開啟根目錄 index.html，再進入簡報；或直接開啟 slides/index.html。簡報的樣式、互動與圖表均內嵌，不需安裝套件、API 金鑰或網路字型。\n\n若電腦有 Python，也可在本專案根目錄執行：\n\n```powershell\npython -m http.server 8000 --bind 127.0.0.1\n```\n\n再以瀏覽器開啟 `http://127.0.0.1:8000/`。這是僅限本機的預覽，不是公開網址；關閉預覽服務即可停止。\n\n操作：方向鍵左右切頁，空白鍵前進；也可使用下方按鈕。首頁與末頁按鈕有邊界，不會多出第九頁。手機直向採上下排列，依可用高度縮放；短螢幕或高倍率縮放可能使字變小，必要時改橫向或在較大螢幕閱讀。\n\n原始 Markdown 保留供版本核對；網站另有 reader.html，可直接閱讀與搜尋 Wiki、來源、規則及報告，不依賴 GitHub 的 Markdown 顯示。練習另有 HTML 入口。reader.html 內嵌目前文件快照，修改 Markdown 後須同步重建閱讀器，避免顯示舊資料。\n\n## GitHub Pages 線上使用\n\n本專案已於 2026-11-19 發布至公開 GitHub Repository 與 GitHub Pages。\n\n- [公開教學首頁](https://barry3687.github.io/zero-basics-finance/)\n- [八頁教學簡報](https://barry3687.github.io/zero-basics-finance/slides/index.html)\n- [可搜尋 Wiki 閱讀器](https://barry3687.github.io/zero-basics-finance/reader.html?doc=wiki/index.md)\n- [GitHub Repository](https://github.com/Barry3687/zero-basics-finance)\n\n以下發布說明保留作為日後更新操作指引。\n\n將這個資料夾內的完整內容放入預定作為網站根目錄的 GitHub Repository，保留相對目錄及 `.nojekyll`。網站的發布來源必須包含根目錄 index.html；若多包一層資料夾，入口路徑也會多一層。\n\n由使用者設定 GitHub Pages 發布來源後，使用 GitHub 顯示的實際網站網址開啟驗證。不要把 Repository 網址當成 Pages 網址，也不要猜測網址當作已部署成功。靜態網站的服務方式見 [GitHub Pages 官方說明](https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages)；發布來源見[官方設定文件](https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site)。\n\n上傳後須親自檢查：首頁、八頁切換、圖表、來源／Wiki 路徑、練習解析、手機閱讀與公開無需登入；並把實際時間、網址及結果追加發布報告。`.nojekyll` 用來保留純靜態目錄與原始 Markdown 路徑，本專案不依賴 Jekyll 建置。\n\n## 公開與私人資料\n\n`.gitignore` 排除 .env、憑證、私人筆記、上傳原檔及未授權 PDF／Office 教材。公開的 notes/ 是來源閱讀摘要，並非私人學習筆記。reports/screenshots/ 只有本專案教學畫面。\n\n忽略規則不能自動撤回以前已加入版本控制的秘密；上傳前仍要核對實際檔案。此專案沒有模型金鑰、帳號登入、分析追蹤或收集使用者財務資料的功能。\n\n## 驗收界線\n\n本機結構與指定尺寸的 Chrome 檢查已記錄於發布報告；不等於所有裝置、瀏覽器或公開主機皆已驗收。GitHub Pages 公開網址已實測首頁、Wiki、來源定位、八頁切換、鍵盤操作與練習解析；最新結果見 reports/2026-11-19-optimization-check.md。\n"}, "reports/2026-11-19-content-check.md": {"title": "2026-11-19 逐頁稿內容檢查報告", "html": "\u003ch1 id=\"2026-11-19-逐頁稿內容檢查報告\">2026-11-19 逐頁稿內容檢查報告\u003c/h1>\n\u003ch2 id=\"1-範圍時間與判定\">1. 範圍、時間與判定\u003c/h2>\n\u003cul>\n\u003cli>專案：零基礎個人投資與理財入門。\u003c/li>\n\u003cli>審稿依據：\u003ca href=\"reader.html?doc=AGENTS.md\">AGENTS.md\u003c/a>第 3、8.2、9.5–9.7 節；使用者本輪明列要求；已核准的\u003ca href=\"reader.html?doc=slides/outline.md\">八頁大綱\u003c/a>、\u003ca href=\"reader.html?doc=slides/source-map.md\">來源對照表\u003c/a>及五篇 Wiki。\u003c/li>\n\u003cli>人工閘門：使用者已明確確認第 9.4 節通過；登錄處理起始時間 2026-11-19 01:10:54 +08:00。此為操作時間，不冒充訊息發送時間。\u003c/li>\n\u003cli>初稿、修正及最終內容檢查：2026-11-19 01:10:54–01:19:23 +08:00，Asia/Taipei；報告與打包完成時間另記於日誌。\u003c/li>\n\u003cli>檢查模式：同一助手先撰稿、保留初稿，再另行讀檔與執行結構／計數／算術程序，使用語意清單逐頁核對。\u003cstrong>這是分階段自我檢查，不是另一人員、另一模型或外部機構審稿。\u003c/strong>\u003c/li>\n\u003cli>最終判定：八份 Markdown 逐頁稿符合本輪明列的內容、結構與字數要求，等待使用者驗收本報告；尚未取得 HTML 或發布授權。\u003c/li>\n\u003cli>規則版本限制：本機先前無規則檔，也未取得早期定稿的完整逐字原文。本輪依可見對話確認規格完整彙整 AGENTS.md，不能宣稱和舊稿逐字相同。已具備後續可實際核對的規則，但「歷史逐字一致」仍未經證實。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"2-字數算法與投影邊界\">2. 字數算法與投影邊界\u003c/h2>\n\u003cp>只計各稿「正文」區塊的可見文字，移除 Markdown 清單的行首符號及空白。每一個 Unicode 字元算一字，\u003cstrong>包含中文字、標點、英文字母、數字、百分號及算式符號\u003c/strong>。因此 ETF 算三字、0.02 算四字，比只數漢字嚴格。\u003c/p>\n\u003cp>標題、來源引用與圖表短標籤依使用者要求排除；主要目標、繪圖製作規格與編輯備註也不是要投影的補充正文。每頁需要對讀者顯示的詞義、圖意、假設與風險已放在正文。後續若顯示編輯資料、額外說明或圖說，必須加入正文重新計數，不能把長段文字改名為標籤避開 120 字。\u003c/p>\n\u003cp>圖表資料中的金額、年份、情境及元／月單位，是允許排除的短標籤；完整假設和不保證收益的限制仍計入正文。無障礙替代描述只重述正文及圖表資料，不得成為藏有新金融主張的另一份教材。\u003c/p>\n\u003ch2 id=\"3-逐頁實際正文字數\">3. 逐頁實際正文字數\u003c/h2>\n\u003cp>第一輪為初稿；第二輪為超限與白話修正；第三輪為詞義及數字表示複檢。沒有第四輪改寫。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>頁碼\u003c/th>\u003cth>第一輪字數\u003c/th>\u003cth>第一輪 ≤120\u003c/th>\u003cth>第二輪字數\u003c/th>\u003cth>第三輪最終字數\u003c/th>\u003cth>最終 ≤120\u003c/th>\u003cth>主要目標數\u003c/th>\u003cth>重點數\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003ca href=\"reader.html?doc=slides/drafts/slide-01.md\">01\u003c/a>\u003c/td>\u003ctd>114\u003c/td>\u003ctd>通過\u003c/td>\u003ctd>114\u003c/td>\u003ctd>103\u003c/td>\u003ctd>通過\u003c/td>\u003ctd>1\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"reader.html?doc=slides/drafts/slide-02.md\">02\u003c/a>\u003c/td>\u003ctd>151\u003c/td>\u003ctd>超過\u003c/td>\u003ctd>100\u003c/td>\u003ctd>100\u003c/td>\u003ctd>通過\u003c/td>\u003ctd>1\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"reader.html?doc=slides/drafts/slide-03.md\">03\u003c/a>\u003c/td>\u003ctd>128\u003c/td>\u003ctd>超過\u003c/td>\u003ctd>103\u003c/td>\u003ctd>103\u003c/td>\u003ctd>通過\u003c/td>\u003ctd>1\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"reader.html?doc=slides/drafts/slide-04.md\">04\u003c/a>\u003c/td>\u003ctd>177\u003c/td>\u003ctd>超過\u003c/td>\u003ctd>107\u003c/td>\u003ctd>115\u003c/td>\u003ctd>通過\u003c/td>\u003ctd>1\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"reader.html?doc=slides/drafts/slide-05.md\">05\u003c/a>\u003c/td>\u003ctd>129\u003c/td>\u003ctd>超過\u003c/td>\u003ctd>107\u003c/td>\u003ctd>109\u003c/td>\u003ctd>通過\u003c/td>\u003ctd>1\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"reader.html?doc=slides/drafts/slide-06.md\">06\u003c/a>\u003c/td>\u003ctd>122\u003c/td>\u003ctd>超過\u003c/td>\u003ctd>105\u003c/td>\u003ctd>105\u003c/td>\u003ctd>通過\u003c/td>\u003ctd>1\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"reader.html?doc=slides/drafts/slide-07.md\">07\u003c/a>\u003c/td>\u003ctd>169\u003c/td>\u003ctd>超過\u003c/td>\u003ctd>101\u003c/td>\u003ctd>101\u003c/td>\u003ctd>通過\u003c/td>\u003ctd>1\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"reader.html?doc=slides/drafts/slide-08.md\">08\u003c/a>\u003c/td>\u003ctd>141\u003c/td>\u003ctd>超過\u003c/td>\u003ctd>108\u003c/td>\u003ctd>108\u003c/td>\u003ctd>通過\u003c/td>\u003ctd>1\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>每頁僅一個主要教學目標，正文皆為三個主要重點。正文最長 115 字；沒有為壓縮而刪掉實質假設或把條件藏入圖表標籤。\u003c/p>\n\u003ch2 id=\"4-問題修正原因與結果\">4. 問題、修正原因與結果\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>頁\u003c/th>\u003cth>初稿問題\u003c/th>\u003cth>第二輪處理與字數\u003c/th>\u003cth>第三輪處理與最終字數\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>01\u003c/td>\u003ctd>114 字未超限，但首頁先提「收支、計息、風險」作預告，讀者仍可能不懂正式名稱\u003c/td>\u003ctd>本輪未改正文，114 字\u003c/td>\u003ctd>改為「收錢花錢、錢與物價、可能損失」，圖中站點也用白話短標籤，正式名詞留到對應頁；103 字\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>02\u003c/td>\u003ctd>151 字超限；結餘與備用金定義重複太長\u003c/td>\u003ctd>合併定義，保留從零存、三個月、全存、無其他支出欠款及未計項目；100 字\u003c/td>\u003ctd>無再改，100 字\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>03\u003c/td>\u003ctd>128 字超限；定義及數字句可簡化\u003c/td>\u003ctd>保留整體物價、單店限制、同一籃、一年及非臺灣統計；103 字\u003c/td>\u003ctd>無再改，103 字\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>04\u003c/td>\u003ctd>177 字超限；定義、比喻與計息條件重複\u003c/td>\u003ctd>保留本金、利息、兩種計息與完整條件；圖表只放金額序列，107 字\u003c/td>\u003ctd>複檢補「計算用 0.02」，明確連結百分比與小數；115 字\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>05\u003c/td>\u003ctd>129 字超限；「盈餘」仍偏抽象，身分說明重複\u003c/td>\u003ctd>以公司賺錢後分給股東的錢說明股利；保留合資、出借及違約限制，107 字\u003c/td>\u003ctd>「分紅」改「每年都有」，「付款條款」改「付款約定」，降低二次術語負擔；109 字\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>06\u003c/td>\u003ctd>122 字超限；「撮合」不夠白話，「分散」尚未正式介紹\u003c/td>\u003ctd>用「讓買賣雙方成交」解釋交易所；先用「內容未必多樣」表達限制，將分散正式詞義留第 7 頁；105 字\u003c/td>\u003ctd>正文不變；同步編輯備註，105 字\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>07\u003c/td>\u003ctd>169 字超限；把圖表金額再重複寫進正文\u003c/td>\u003ctd>正文保留詞義、同期間與本金、各半非建議、無中途收付及未計項目；已准許的短數值放比較表，不把完整解說放標籤；101 字\u003c/td>\u003ctd>無再改，101 字\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>08\u003c/td>\u003ctd>141 字超限；契約與查證說明太長\u003c/td>\u003ctd>保留清單、旅行結果不保證、定期定額詞義、可用錢、費用、警訊及官方／165 查證；108 字\u003c/td>\u003ctd>無再改，108 字\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>初稿曾實際寫入各稿，再讀取計數；下方附初稿正文及字數，並非事後虛構問題。第二輪後字數均通過，但仍做第三輪詞義與小數表示複檢。沒有把第一輪超限說成一次通過。\u003c/p>\n\u003ch2 id=\"5-術語白話與先備檢查與數字檢查分開\">5. 術語白話與先備檢查（與數字檢查分開）\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>頁\u003c/th>\u003cth>正文首見詞義／承接\u003c/th>\u003cth>檢查結果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>01\u003c/td>\u003ctd>理財計畫＝安排生活支出、目標與錢的用途；投資＝把錢放入可能增值或虧損的工具。預告站點改為日常詞句\u003c/td>\u003ctd>通過；不需先懂 ETF、單利等名詞\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>02\u003c/td>\u003ctd>收入＝收到、支出＝花掉、結餘＝差額；緊急預備金＝急用備款\u003c/td>\u003ctd>通過；只用基本加減乘除\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>03\u003c/td>\u003ctd>通貨膨脹／通膨＝整體物價持續上升；購買力＝同一筆錢能買多少；帳面金額＝帳上錢數\u003c/td>\u003ctd>通過；不引入未教的實質報酬公式\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>04\u003c/td>\u003ctd>本金＝最初的錢；利息＝依約增加的錢；單利、複利以計息基礎解釋；年利率 2% 以每百元年息及 0.02 複習\u003c/td>\u003ctd>通過；不用未定義的 P、r、n 等公式符號\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>05\u003c/td>\u003ctd>股票、股東、股利、債券、債權及違約在正文解釋；還本付息承接第 4 頁本金與利息\u003c/td>\u003ctd>通過；不介紹清償順位、轉換權等新概念\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>06\u003c/td>\u003ctd>基金、ETF、交易所、費用以集合、成交及付的錢說明；可能損失承接第 1 頁\u003c/td>\u003ctd>通過；不提前使用分散、主動式、被動式等未教分類\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>07\u003c/td>\u003ctd>風險＝可能不如預期或損失；分散＝減少依賴同一風險；配置＝各類投資占多少；組合＝一起算的投資\u003c/td>\u003ctd>通過；A、B 在圖例明示假設資產\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>08\u003c/td>\u003ctd>定期定額＝固定日期金額投入；契約＝約定執行付款規則；查證＝另找官方資料核對；165＝防詐諮詢\u003c/td>\u003ctd>通過；收支、備款及可承受損失承接前頁\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>沒有另出新選擇題；編輯理解檢核取已核准大綱，末頁情境沿用 Wiki 05 自編題。若後續顯示完整題目／解析，須遵守既有 exercises/ 的先作答後看解析安排，並重新核對可見文字字數，不能當成已自動取得額外正文額度。\u003c/p>\n\u003ch2 id=\"6-數字主張與來源-id-核對與詞義檢查分開\">6. 數字、主張與來源 ID 核對（與詞義檢查分開）\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>頁\u003c/th>\u003cth>Wiki 定位\u003c/th>\u003cth>來源 ID 與定位\u003c/th>\u003cth>數字／主張核對\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>01\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/01-budget-and-emergency-fund.md\">Wiki 01\u003c/a>定義；\u003ca href=\"reader.html?doc=wiki/05-first-financial-plan.md\">Wiki 05\u003c/a>依序執行與旅行比喻\u003c/td>\u003ctd>S001 收入支出健檢；S004 pp21–24、p34\u003c/td>\u003ctd>無收益數字；五站為教學編排，並非官方規定。保留現在不投資也合理的轉譯\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>02\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/01-budget-and-emergency-fund.md\">Wiki 01\u003c/a>「具體數字小試算」\u003c/td>\u003ctd>S001 收入支出／現金健檢；S004 p24\u003c/td>\u003ctd>月收 30,000−支出 24,000＝6,000；24,000×3＝72,000；72,000÷6,000＝12 月。假設均保留\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>03\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/02-inflation-and-compound-interest.md\">Wiki 02\u003c/a>購買力及最後一年例子\u003c/td>\u003ctd>S002 家庭支出與「通貨膨脹起，財富大風吹」\u003c/td>\u003ctd>原始商品籃與資金均 100，一年後 105 與 102；102＜105。圖的 Y 軸上限 110 是繪圖尺度，非新增統計，從 0 起避免誤導\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>04\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/02-inflation-and-compound-interest.md\">Wiki 02\u003c/a>單利、複利例子\u003c/td>\u003ctd>S006 pp11、13\u003c/td>\u003ctd>單利 10,000／10,200／10,400；複利 10,000／10,200／10,404；第二年利息 200／204；2%＝0.02。未採 p12\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>05\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">Wiki 03\u003c/a>股票、債券定義及違約限制\u003c/td>\u003ctd>S004 pp8–9；S007「壹、定義」一與二\u003c/td>\u003ctd>無新增數字；股票所有權與債券請求關係相符，不寫保本或每年必有股利\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>06\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">Wiki 03\u003c/a>基金、ETF 兩列與比喻限制\u003c/td>\u003ctd>S004 p10；S003 Q1–Q3、Q8\u003c/td>\u003ctd>無新增數字；ETF 在基金之內，圖面積不代表數量占比，不泛稱所有 ETF 被動或安全\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>07\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/04-diversification-and-allocation.md\">Wiki 04\u003c/a>「具體數字小試算」四步\u003c/td>\u003ctd>S004 pp22–24、p26；S003 Q2、Q8 僅作了解產品內容背景\u003c/td>\u003ctd>同初始 10,000；A−20%、B＋10% 時各半 4,000＋5,500＝9,500、全 A＝8,000；兩者−20% 時各半＝8,000。各半不作建議\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>08\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/05-first-financial-plan.md\">Wiki 05\u003c/a>計畫、定期定額、防詐及自編題\u003c/td>\u003ctd>S001 收支／現金健檢；S004 pp21–24、p34、pp5、17、31–33；S005 交易流程及 Q1–Q3\u003c/td>\u003ctd>不另加入理財數字；165 與原 Wiki 一致；高報酬零風險及催匯款只支持暫停查證，不作個案法律認定\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>完整來源網址、機構與日期見\u003ca href=\"reader.html?doc=sources/catalog.md\">來源登錄表\u003c/a>。S001–S007 均有對應；原 21 列來源對照未修改。兩個新單位「1 萬元」等於既有 10,000 元，不是新增數據；圖表刻度只為呈現既有數據。\u003c/p>\n\u003ch2 id=\"7-圖表規格檢查\">7. 圖表規格檢查\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>頁\u003c/th>\u003cth>SVG 規劃與類型\u003c/th>\u003cth>軸／單位\u003c/th>\u003cth>標示、圖例與說明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>01\u003c/td>\u003ctd>五站學習路線／概念關係圖\u003c/td>\u003ctd>無數值軸，明列不適用\u003c/td>\u003ctd>有概念示意、站點文字、線只表示先後、正文解釋及替代描述規格\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>02\u003c/td>\u003ctd>三步算式與信封／假設數字及概念示意\u003c/td>\u003ctd>不使用 XY；元、元／月、月分開\u003c/td>\u003ctd>有完整三步值，條件留正文，非通用月份建議\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>03\u003c/td>\u003ctd>商品籃價格與資金／假設比較圖\u003c/td>\u003ctd>X 時間；Y 元，0–110 線性\u003c/td>\u003ctd>同期同籃、圖例加填紋、102＜105、非當期臺灣統計\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>04\u003c/td>\u003ctd>單利與複利／假設年度表\u003c/td>\u003ctd>年欄、元值；不虛構 XY\u003c/td>\u003ctd>0–2 年與兩列金額、第二年利息、完整假設及雞群比喻限制\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>05\u003c/td>\u003ctd>身分對照／概念關係圖\u003c/td>\u003ctd>無數值軸，明列不適用\u003c/td>\u003ctd>文字及線型區分所有權／出借，無保本標章\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>06\u003c/td>\u003ctd>基金包含 ETF／概念關係圖\u003c/td>\u003ctd>無數值軸，面積不代表數量\u003c/td>\u003ctd>外基金內 ETF，無市場占比或內容安全暗示\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>07\u003c/td>\u003ctd>兩情境期末金額／假設比較表\u003c/td>\u003ctd>情境列、配置欄、元值\u003c/td>\u003ctd>兩列資料均回到 Wiki，非歷史績效、各半非建議\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>08\u003c/td>\u003ctd>盤點目標查核／概念清單\u003c/td>\u003ctd>無數值軸，明列不適用\u003c/td>\u003ctd>標題、警訊、圖例、文字及替代描述規格；不另設新題目\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>八份稿均明列未來 SVG 標題、軸／單位（或不適用理由）、圖例、資料、類型標示、文字說明及替代描述規格。\u003cstrong>只檢查規格完整性，並未產生 SVG，也沒有渲染驗收。\u003c/strong>\u003c/p>\n\u003ch2 id=\"8-檔案與範圍檢查\">8. 檔案與範圍檢查\u003c/h2>\n\u003cul>\n\u003cli>規則檔：已建立，必要節次存在；版本限制如第 1 節所述。\u003c/li>\n\u003cli>稿件：恰 slide-01.md 至 slide-08.md，各有一個主要目標及最多三個重點。\u003c/li>\n\u003cli>算術：10 項比較／運算斷言通過，涵蓋備用金、購買力、單利、複利及兩種風險情境。\u003c/li>\n\u003cli>輸入保護：18 份既有來源目錄、閱讀筆記、練習及核心 Wiki 經 SHA-256 比較保持原內容。\u003c/li>\n\u003cli>檢查程序更正：第一次輸入保護篩選因 Windows 路徑分隔符差異選到 0 檔，未將其視為有效通過；正規化路徑並加入「必須恰 18 檔」條件後重跑，18 檔均一致。沒有因此改動課程內容。\u003c/li>\n\u003cli>大綱與來源表只更新閘門／階段註記；原八頁內容與 21 列主張對照不改。\u003c/li>\n\u003cli>未產生 HTML、SVG 程式碼、實際圖片或簡報；未提交作業或公開發布。\u003c/li>\n\u003cli>連結與最終封裝檢查結果及完成時間追加於\u003ca href=\"reader.html?doc=wiki/log.md\">執行日誌\u003c/a>，不把尚未執行的打包檢查預寫成通過。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"9-人工驗收與下一停止點\">9. 人工驗收與下一停止點\u003c/h2>\n\u003cp>\u003cstrong>等待使用者確認本報告並下達 Step 7（HTML 簡報與發布）指令。\u003c/strong>\u003c/p>\n\u003cp>已獲通過的是大綱／來源表閘門，不代表使用者已確認本次新逐頁稿或彙整版規則全文。沒有後續明確指令前，不撰寫最終 HTML、不提前產生 SVG、不公開發布。\u003c/p>\n\u003ch2 id=\"附錄-a初稿正文原貌與字數\">附錄 A：初稿正文原貌與字數\u003c/h2>\n\u003cp>以下保留第一輪實際正文作修正證據。這些是歷史初稿，不能混入最終投影，也不計入最終頁面字數。\u003c/p>\n\u003ch3 id=\"第-01-頁初稿114-字\">第 01 頁初稿：114 字\u003c/h3>\n\u003cblockquote>理財計畫是安排生活支出、目標與錢的用途。投資是把錢投入可能增值、也可能虧損的工具。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003cblockquote>像規劃旅行，先看旅費再選交通方式。依序學收支、計息與物價、工具、風險、計畫。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003cblockquote>行程只是概念示意，結果與時間不保證。現在不投入市場，也可以有合理計畫。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003ch3 id=\"第-02-頁初稿151-字\">第 02 頁初稿：151 字\u003c/h3>\n\u003cblockquote>收入是收到的錢，支出是花掉的錢，收支結餘是收入減支出留下的錢。緊急預備金是突發急用時能及時取用的備款。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003cblockquote>三個信封分生活、備用與未來。本例從零存三個月生活費，結餘全部存入，沒有其他支出或欠款，未計利息、稅費與收支物價變動。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003cblockquote>三個月只是此題假設，不是人人適用的標準。例中的結餘已安排存備款，不能全當可投資金額。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003ch3 id=\"第-03-頁初稿128-字\">第 03 頁初稿：128 字\u003c/h3>\n\u003cblockquote>通貨膨脹，簡稱通膨，是整體物價持續上升。購買力是同一筆錢能買多少。帳面金額就是帳上記的錢數。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003cblockquote>像便當漲價，百元鈔能買的份量縮小，但一家店漲價不能證明整體通膨。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003cblockquote>假設一年後，同一籃商品從100元漲到105元，錢只有102元，仍買不到原來一籃。這不是臺灣現況統計。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003ch3 id=\"第-04-頁初稿177-字\">第 04 頁初稿：177 字\u003c/h3>\n\u003cblockquote>本金是最初投入的錢，利息是依約計息增加的錢。單利每期只按原本金算，複利把利息留下來一起算下一期。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003cblockquote>像把新小雞加入下一年的產蛋隊伍，但實際投資不會固定產生收益。年利率2%就是每100元一年計息2元，計算時用0.02。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003cblockquote>本例10,000元，固定年利率2%，每年計息一次，共兩年，沒有中途存入或領出，忽略稅費。第二年單利利息200元，複利204元，這不是收益保證。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003ch3 id=\"第-05-頁初稿129-字\">第 05 頁初稿：129 字\u003c/h3>\n\u003cblockquote>股票是公司一小部分所有權，持有人叫股東。股利是公司分給股東的盈餘，並非每年保證有。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003cblockquote>債券像按約借錢給飲料店，持有人依約請求還本付息的關係叫債權，不是因此成為公司老闆。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003cblockquote>股票像合資開店，債券像出借。違約是對方無法按約付款，借據不保證收得回錢，付款與還本仍要看條款。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003ch3 id=\"第-06-頁初稿122-字\">第 06 頁初稿：122 字\u003c/h3>\n\u003cblockquote>基金是集合大家的錢，由管理者按規則投資，像湊錢請人買綜合便當。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003cblockquote>ETF是在交易所買賣的基金。交易所是依規則撮合買賣的市場。費用是使用或買賣產品支付的成本。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003cblockquote>便當只比喻集合與交易形式。仍要查內容、風險與費用，基金或ETF都不保證充分分散、安全或獲利。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003ch3 id=\"第-07-頁初稿169-字\">第 07 頁初稿：169 字\u003c/h3>\n\u003cblockquote>風險是結果不如預期甚至損失的可能。分散是減少依賴同一風險來源，配置是決定每類投資占多少。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003cblockquote>像備不同雨具，也防不了所有風險。組合是一起計算的投資。假設同期間共10,000元，A、B各半，無中途收付，忽略稅費與交易。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003cblockquote>A跌20%、B漲10%時各半剩9,500元，全A剩8,000元。若兩者都跌20%，各半也剩8,000元。50／50不是比例建議。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003ch3 id=\"第-08-頁初稿141-字\">第 08 頁初稿：141 字\u003c/h3>\n\u003cblockquote>像規劃旅行，先列收支、欠款、備用金、目標期限與能承受的損失，保留回程車錢，結果不保證。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003cblockquote>定期定額是約定固定日期與金額投入。契約是雙方的執行與付款規則，仍要查可用金額、契約與費用，不能保證獲利。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003cblockquote>遇到高報酬、零風險又催匯款，先停下查證，也就是另找官方資料核對，必要時洽防詐諮詢管道165。\u003c/blockquote>\n\u003cp>&gt;\u003c/p>\n\u003ch2 id=\"附錄-b最終正文便於不開八個檔案就能審閱\">附錄 B：最終正文（便於不開八個檔案就能審閱）\u003c/h2>\n\u003cp>這裡與八份逐頁稿的正文相同，為審閱副本；最終字數以各稿正文按第 2 節算法計算。\u003c/p>\n\u003ch3 id=\"第-01-頁最終103-字\">第 01 頁最終：103 字\u003c/h3>\n\u003cul>\n\u003cli>理財計畫是安排生活支出、目標與錢的用途。投資是把錢投入可能增值、也可能虧損的工具。\u003c/li>\n\u003cli>像旅行先看旅費。依序學收錢花錢、錢與物價、工具、可能損失與計畫。\u003c/li>\n\u003cli>路線只是概念示意，結果與時間不保證。現在不投資也可以有計畫。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"第-02-頁最終100-字\">第 02 頁最終：100 字\u003c/h3>\n\u003cul>\n\u003cli>收入是收到的錢，支出是花掉的錢，結餘是兩者差額。\u003c/li>\n\u003cli>緊急預備金是急用備款，像信封留給生活與備用。假設從零存三個月生活費，結餘全存。\u003c/li>\n\u003cli>無其他支出欠款，不計利息稅費及收支物價變動。三個月非通則，結餘不全可投資。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"第-03-頁最終103-字\">第 03 頁最終：103 字\u003c/h3>\n\u003cul>\n\u003cli>通貨膨脹（通膨）是整體物價持續上升，購買力是同一筆錢能買多少。帳面金額是帳上錢數。\u003c/li>\n\u003cli>像便當漲價，但單店漲價不能證明整體通膨。\u003c/li>\n\u003cli>假設一年後，同一籃商品100元變105元，錢變102元仍買不足。這不是臺灣現況統計。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"第-04-頁最終115-字\">第 04 頁最終：115 字\u003c/h3>\n\u003cul>\n\u003cli>本金是最初的錢，利息是依約增加的錢。單利按原本金算，複利讓利息加入下期，像新小雞加入產蛋。\u003c/li>\n\u003cli>假設本金1萬元，年利率2%即每百元年息2元，計算用0.02，每年計息一次共兩年，無中途收付、不計稅費。\u003c/li>\n\u003cli>比喻不代表真實收益固定，也不保證獲利。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"第-05-頁最終109-字\">第 05 頁最終：109 字\u003c/h3>\n\u003cul>\n\u003cli>股票是公司部分所有權，持有人叫股東。股利是公司賺錢後分給股東的錢，不保證每年都有。\u003c/li>\n\u003cli>債券像借錢給店家，債權是依約請求還本付息的關係，出借不等於合資。股票像合資開店。\u003c/li>\n\u003cli>違約是未能按約付款，借據不保證收得回錢，付款約定仍要查。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"第-06-頁最終105-字\">第 06 頁最終：105 字\u003c/h3>\n\u003cul>\n\u003cli>基金是大家湊錢交管理者按規則投資，像合買綜合便當。\u003c/li>\n\u003cli>ETF是在交易所買賣的基金。交易所是依規則讓買賣雙方成交的市場，費用是買賣或使用產品付的錢。\u003c/li>\n\u003cli>便當只比喻集合與交易形式，內容未必多樣，仍要查可能損失，不保證獲利。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"第-07-頁最終101-字\">第 07 頁最終：101 字\u003c/h3>\n\u003cul>\n\u003cli>風險是可能不如預期或損失，分散是減少依賴同一風險，配置是各類投資占多少。組合是一起算的投資。\u003c/li>\n\u003cli>像不同雨具也防不住所有風險。假設同期間1萬元，各半非建議，無中途收付、忽略稅費交易。\u003c/li>\n\u003cli>分散仍可能共同下跌而損失。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"第-08-頁最終108-字\">第 08 頁最終：108 字\u003c/h3>\n\u003cul>\n\u003cli>像規劃旅行，列收支、欠款、備款、目標期限與能承受的損失，結果不保證。\u003c/li>\n\u003cli>定期定額是固定日期金額投入。契約是約定的執行付款規則，先查可用錢與費用。\u003c/li>\n\u003cli>遇高報酬零風險又催匯款，暫停並另找官方資料核對查證，必要時洽防詐諮詢165。\u003c/li>\n\u003c/ul>", "source": "# 2026-11-19 逐頁稿內容檢查報告\n\n## 1. 範圍、時間與判定\n\n- 專案：零基礎個人投資與理財入門。\n- 審稿依據：[AGENTS.md](../AGENTS.md)第 3、8.2、9.5–9.7 節；使用者本輪明列要求；已核准的[八頁大綱](../slides/outline.md)、[來源對照表](../slides/source-map.md)及五篇 Wiki。\n- 人工閘門：使用者已明確確認第 9.4 節通過；登錄處理起始時間 2026-11-19 01:10:54 +08:00。此為操作時間，不冒充訊息發送時間。\n- 初稿、修正及最終內容檢查：2026-11-19 01:10:54–01:19:23 +08:00，Asia/Taipei；報告與打包完成時間另記於日誌。\n- 檢查模式：同一助手先撰稿、保留初稿，再另行讀檔與執行結構／計數／算術程序，使用語意清單逐頁核對。**這是分階段自我檢查，不是另一人員、另一模型或外部機構審稿。**\n- 最終判定：八份 Markdown 逐頁稿符合本輪明列的內容、結構與字數要求，等待使用者驗收本報告；尚未取得 HTML 或發布授權。\n- 規則版本限制：本機先前無規則檔，也未取得早期定稿的完整逐字原文。本輪依可見對話確認規格完整彙整 AGENTS.md，不能宣稱和舊稿逐字相同。已具備後續可實際核對的規則，但「歷史逐字一致」仍未經證實。\n\n## 2. 字數算法與投影邊界\n\n只計各稿「正文」區塊的可見文字，移除 Markdown 清單的行首符號及空白。每一個 Unicode 字元算一字，**包含中文字、標點、英文字母、數字、百分號及算式符號**。因此 ETF 算三字、0.02 算四字，比只數漢字嚴格。\n\n標題、來源引用與圖表短標籤依使用者要求排除；主要目標、繪圖製作規格與編輯備註也不是要投影的補充正文。每頁需要對讀者顯示的詞義、圖意、假設與風險已放在正文。後續若顯示編輯資料、額外說明或圖說，必須加入正文重新計數，不能把長段文字改名為標籤避開 120 字。\n\n圖表資料中的金額、年份、情境及元／月單位，是允許排除的短標籤；完整假設和不保證收益的限制仍計入正文。無障礙替代描述只重述正文及圖表資料，不得成為藏有新金融主張的另一份教材。\n\n## 3. 逐頁實際正文字數\n\n第一輪為初稿；第二輪為超限與白話修正；第三輪為詞義及數字表示複檢。沒有第四輪改寫。\n\n| 頁碼 | 第一輪字數 | 第一輪 ≤120 | 第二輪字數 | 第三輪最終字數 | 最終 ≤120 | 主要目標數 | 重點數 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| [01](../slides/drafts/slide-01.md) | 114 | 通過 | 114 | 103 | 通過 | 1 | 3 |\n| [02](../slides/drafts/slide-02.md) | 151 | 超過 | 100 | 100 | 通過 | 1 | 3 |\n| [03](../slides/drafts/slide-03.md) | 128 | 超過 | 103 | 103 | 通過 | 1 | 3 |\n| [04](../slides/drafts/slide-04.md) | 177 | 超過 | 107 | 115 | 通過 | 1 | 3 |\n| [05](../slides/drafts/slide-05.md) | 129 | 超過 | 107 | 109 | 通過 | 1 | 3 |\n| [06](../slides/drafts/slide-06.md) | 122 | 超過 | 105 | 105 | 通過 | 1 | 3 |\n| [07](../slides/drafts/slide-07.md) | 169 | 超過 | 101 | 101 | 通過 | 1 | 3 |\n| [08](../slides/drafts/slide-08.md) | 141 | 超過 | 108 | 108 | 通過 | 1 | 3 |\n\n每頁僅一個主要教學目標，正文皆為三個主要重點。正文最長 115 字；沒有為壓縮而刪掉實質假設或把條件藏入圖表標籤。\n\n## 4. 問題、修正原因與結果\n\n| 頁 | 初稿問題 | 第二輪處理與字數 | 第三輪處理與最終字數 |\n| --- | --- | --- | --- |\n| 01 | 114 字未超限，但首頁先提「收支、計息、風險」作預告，讀者仍可能不懂正式名稱 | 本輪未改正文，114 字 | 改為「收錢花錢、錢與物價、可能損失」，圖中站點也用白話短標籤，正式名詞留到對應頁；103 字 |\n| 02 | 151 字超限；結餘與備用金定義重複太長 | 合併定義，保留從零存、三個月、全存、無其他支出欠款及未計項目；100 字 | 無再改，100 字 |\n| 03 | 128 字超限；定義及數字句可簡化 | 保留整體物價、單店限制、同一籃、一年及非臺灣統計；103 字 | 無再改，103 字 |\n| 04 | 177 字超限；定義、比喻與計息條件重複 | 保留本金、利息、兩種計息與完整條件；圖表只放金額序列，107 字 | 複檢補「計算用 0.02」，明確連結百分比與小數；115 字 |\n| 05 | 129 字超限；「盈餘」仍偏抽象，身分說明重複 | 以公司賺錢後分給股東的錢說明股利；保留合資、出借及違約限制，107 字 | 「分紅」改「每年都有」，「付款條款」改「付款約定」，降低二次術語負擔；109 字 |\n| 06 | 122 字超限；「撮合」不夠白話，「分散」尚未正式介紹 | 用「讓買賣雙方成交」解釋交易所；先用「內容未必多樣」表達限制，將分散正式詞義留第 7 頁；105 n### 第 01 頁初稿：114 字\n\n> 理財計畫是安排生活支出、目標與錢的用途。投資是把錢投入可能增值、也可能虧損的工具。\n>\n> 像規劃旅行，先看旅費再選交通方式。依序學收支、計息與物價、工具、風險、計畫。\n>\n> 行程只是概念示意，結果與時間不保證。現在不投入市場，也可以有合理計畫。\n>\n\n### 第 02 頁初稿：151 字\n\n> 收入是收到的錢，支出是花掉的錢，收支結餘是收入減支出留下的錢。緊急預備金是突發急用時能及時取用的備款。\n>\n> 三個信封分生活、備用與未來。本例從零存三個月生活費，結餘全部存入，沒有其他支出或欠款，未計利息、稅費與收支物價變動。\n>\n> 三個月只是此題假設，不是人人適用的標準。例中的結餘已安排存備款，不能全當可投資金額。\n>\n\n### 第 03 頁初稿：128 字\n\n> 通貨膨脹，簡稱通膨，是整體物價持續上升。購買力是同一筆錢能買多少。帳面金額就是帳上記的錢數。\n>\n> 像便當漲價，百元鈔能買的份量縮小，但一家店漲價不能證明整體通膨。\n>\n> 假設一年後，同一籃商品從100元漲到105元，錢只有102元，仍買不到原來一籃。這不是臺灣現況統計。\n>\n\n### 第 04 頁初稿：177 字\n\n> 本金是最初投入的錢，利息是依約計息增加的錢。單利每期只按原本金算，複利把利息留下來一起算下一期。\n>\n> 像把新小雞加入下一年的產蛋隊伍，但實際投資不會固定產生收益。年利率2%就是每100元一年計息2元，計算時用0.02。\n>\n> 本例10,000元，固定年利率2%，每年計息一次，共兩年，沒有中途存入或領出，忽略稅費。第二年單利利息200元，複利204元，這不是收益保證。\n>\n\n### 第 05 頁初稿：129 字\n\n> 股票是公司一小部分所有權，持有人叫股東。股利是公司分給股東的盈餘，並非每年保證有。\n>\n> 債券像按約借錢給飲料店，持有人依約請求還本付息的關係叫債權，不是因此成為公司老闆。\n>\n> 股票像合資開店，債券像出借。違約是對方無法按約付款，借據不保證收得回錢，付款與還本仍要看條款。\n>\n\n### 第 06 頁初稿：122 字\n\n> 基金是集合大家的錢，由管理者按規則投資，像湊錢請人買綜合便當。\n>\n> ETF是在交易所買賣的基金。交易所是依規則撮合買賣的市場。費用是使用或買賣產品支付的成本。\n>\n> 便當只比喻集合與交易形式。仍要查內容、風險與費用，基金或ETF都不保證充分分散、安全或獲利。\n>\n\n### 第 07 頁初稿：169 字\n\n> 風險是結果不如預期甚至損失的可能。分散是減少依賴同一風險來源，配置是決定每類投資占多少。\n>\n> 像備不同雨具，也防不了所有風險。組合是一起計算的投資。假設同期間共10,000元，A、B各半，無中途收付，忽略稅費與交易。\n>\n> A跌20%、B漲10%時各半剩9,500元，全A剩8,000元。若兩者都跌20%，各半也剩8,000元。50／50不是比例建議。\n>\n\n### 第 08 頁初稿：141 字\n\n> 像規劃旅行，先列收支、欠款、備用金、目標期限與能承受的損失，保留回程車錢，結果不保證。\n>\n> 定期定額是約定固定日期與金額投入。契約是雙方的執行與付款規則，仍要查可用金額、契約與費用，不能保證獲利。\n>\n> 遇到高報酬、零風險又催匯款，先停下查證，也就是另找官方資料核對，必要時洽防詐諮詢管道165。\n>\n\n## 附錄 B：最終正文（便於不開八個檔案就能審閱）\n\n這裡與八份逐頁稿的正文相同，為審閱副本；最終字數以各稿正文按第 2 節算法計算。\n\n### 第 01 頁最終：103 字\n\n- 理財計畫是安排生活支出、目標與錢的用途。投資是把錢投入可能增值、也可能虧損的工具。\n- 像旅行先看旅費。依序學收錢花錢、錢與物價、工具、可能損失與計畫。\n- 路線只是概念示意，結果與時間不保證。現在不投資也可以有計畫。\n\n### 第 02 頁最終：100 字\n\n- 收入是收到的錢，支出是花掉的錢，結餘是兩者差額。\n- 緊急預備金是急用備款，像信封留給生活與備用。假設從零存三個月生活費，結餘全存。\n- 無其他支出欠款，不計利息稅費及收支物價變動。三個月非通則，結餘不全可投資。\n\n### 第 03 頁最終：103 字\n\n- 通貨膨脹（通膨）是整體物價持續上升，購買力是同一筆錢能買多少。帳面金額是帳上錢數。\n- 像便當漲價，但單店漲價不能證明整體通膨。\n- 假設一年後，同一籃商品100元變105元，錢變102元仍買不足。這不是臺灣現況統計。\n\n### 第 04 頁最終：115 字\n\n- 本金是最初的錢，利息是依約增加的錢。單利按原本金算，複利讓利息加入下期，像新小雞加入產蛋。\n- 假設本金1萬元，年利率2%即每百元年息2元，計算用0.02，每年計息一次共兩年，無中途收付、不計稅費。\n- 比喻不代表真實收益固定，也不保證獲利。\n\n### 第 05 頁最終：109 字\n\n- 股票是公司部分所有權，持有人叫股東。股利是公司賺錢後分給股東的錢，不保證每年都有。\n- 債券像借錢給店家，債權是依約請求還本付息的關係，出借不等於合資。股票像合資開店。\n- 違約是未能按約付款，借據不保證收得回錢，付款約定仍要查。\n\n### 第 06 頁最終：105 字\n\n- 基金是大家湊錢交管理者按規則投資，像合買綜合便當。\n- ETF是在交易所買賣的基金。交易所是依規則讓買賣雙方成交的市場，費用是買賣或使用產品付的錢。\n- 便當只比喻集合與交易形式，內容未必多樣，仍要查可能損失，不保證獲利。\n\n### 第 07 頁最終：101 字\n\n- 風險是可能不如預期或損失，分散是減少依賴同一風險，配置是各類投資占多少。組合是一起算的投資。\n- 像不同雨具也防不住所有風險。假設同期間1萬元，各半非建議，無中途收付、忽略稅費交易。\n- 分散仍可能共同下跌而損失。\n\n### 第 08 頁最終：108 字\n\n- 像規劃旅行，列收支、欠款、備款、目標期限與能承受的損失，結果不保證。\n- 定期定額是固定日期金額投入。契約是約定的執行付款規則，先查可用錢與費用。\n- 遇高報酬零風險又催匯款，暫停並另找官方資料核對查證，必要時洽防詐諮詢165。\n"}, "reports/2026-11-19-optimization-check.md": {"title": "2026-11-19 優化與公開檢查", "html": "\u003ch1 id=\"2026-11-19-優化與公開檢查\">2026-11-19 優化與公開檢查\u003c/h1>\n\u003ch2 id=\"本次範圍與實際發布\">本次範圍與實際發布\u003c/h2>\n\u003cp>2026-11-19 04:48–04:51（Asia/Taipei）執行後續優化與公開測試。GitHub Pages 設定顯示網站已上線，Chrome 實際開啟公開網址可瀏覽，未要求網站登入。最初上線內容提交為 5a443b647bca1fe1dd3c1002a759c1b04ccc2b8a；後續提交補齊報告及閱讀器同步。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"https://barry3687.github.io/zero-basics-finance/\">公開入口\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Barry3687/zero-basics-finance\">GitHub\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://barry3687.github.io/zero-basics-finance/reader.html?doc=wiki/index.md\">Wiki 閱讀器\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://barry3687.github.io/zero-basics-finance/slides/index.html\">教學簡報\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"優化內容\">優化內容\u003c/h2>\n\u003cp>新增可搜尋、可定位來源的離線 Wiki 閱讀器；首頁直接導向五個單元、練習與證據。另設 loop／graph 頁面及真實檢查入口。Markdown 為正本，閱讀器是同步快照。簡報僅改善引用連結，八份核准正文與數字保持不變。\u003c/p>\n\u003ch2 id=\"真實執行與檢查\">真實執行與檢查\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>項目\u003c/th>\u003cth>實際結果\u003c/th>\u003cth>範圍\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>結構與內容鎖定\u003c/td>\u003ctd>8 頁、8 張 SVG，26 份核心正本雜湊未變\u003c/td>\u003ctd>本機靜態檢查\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>正文字數\u003c/td>\u003ctd>103、100、103、115、109、105、101、108，皆 ≤120\u003c/td>\u003ctd>與核准逐頁稿逐字比較\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>公開簡報\u003c/td>\u003ctd>下一頁依序 1/8 至 8/8，最後按鈕停用；左鍵回 7/8、空白鍵回 8/8\u003c/td>\u003ctd>Chrome 公開網址\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>公開 Wiki\u003c/td>\u003ctd>第二課完整載入，S006 引用能導向來源登錄 #s006\u003c/td>\u003ctd>目標標題位於畫面頂部，無登入要求\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>公開練習\u003c/td>\u003ctd>第一題解析可展開，顯示 D、8 個月與逐步計算\u003c/td>\u003ctd>不宣稱有自動批改\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>搜尋\u003c/td>\u003ctd>搜尋「複利」回傳對應文件；清除後恢復文章\u003c/td>\u003ctd>本機 Chrome；索引會隨文件增加改變\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>手機閱讀器\u003c/td>\u003ctd>390×844，頁面 scrollWidth 375，沒有超出 390 的水平溢出\u003c/td>\u003ctd>本機 Chrome，桌面瀏覽器回復原尺寸\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>來源與安全\u003c/td>\u003ctd>無憑證字串、未授權原始教材或私人財務檔案\u003c/td>\u003ctd>靜態掃描；學生資料及 Gemini 截圖不公開\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Step 7 的桌面 1536×960 與手機 390×844 逐頁版面資料仍保留於 browser-check.json；不把舊版尺寸紀錄假稱為本次新首頁測試。歷史報告中的「待上傳」是當時狀態，已由本次真正公開測試補上。\u003c/p>\n\u003ch2 id=\"六項繳交要求對照\">六項繳交要求對照\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>要求\u003c/th>\u003cth>本專案證據\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>主題與簡介\u003c/td>\u003ctd>首頁、README，受眾為零基礎大學生與新鮮人\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Wiki 連結／成果，至少匯入 5 篇\u003c/td>\u003ctd>sources/catalog.md 登錄 S001–S007；notes 七份；wiki 五課與索引\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>教學 HTML\u003c/td>\u003ctd>slides/index.html 固定八頁，含 SVG、鍵盤與按鈕\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>loop／graph\u003c/td>\u003ctd>workflow/index.html、graph.svg、loop-and-graph.md；三個失敗回圈與人工閘門\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>實際執行與檢查\u003c/td>\u003ctd>內容檢查、發布檢查、本報告、日誌與實測畫面\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>反思與檢查前移\u003c/td>\u003ctd>來源誤植隔離、初稿七頁超限；先查證／計字／審稿再排版\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"反思與界線\">反思與界線\u003c/h2>\n\u003cp>最容易出錯的是把完整 Wiki 濃縮成逐頁稿：初稿八頁中七頁超過 120 字。檢查因此前移到 Markdown 草稿階段，再局部精簡，不等 HTML 排好才刪字。來源層另有 S004 無出處數據停用、S006 百分比算式誤植隔離；機構來源仍需逐句與逐式核對。\u003c/p>\n\u003cp>Gemini 早期自編 raw/ 投資素材只作發想紀錄，沒有當成正式七份來源。流程是人與 AI 分階段協作，並非自動 LangGraph 系統；網站是靜態教材，沒有即時模型、投資推薦或自動交易。未測所有瀏覽器與裝置，不保證教師評分。\u003c/p>\n\u003cp>補充靜態核對：目前閱讀器包含 36 份 Markdown 文件；內嵌內容的 259 個本機連結逐一檢查，沒有缺檔或來源錨點錯誤。網站及 Markdown 外部主機連線不屬於此靜態數目。\u003c/p>", "source": "# 2026-11-19 優化與公開檢查\n\n## 本次範圍與實際發布\n\n2026-11-19 04:48–04:51（Asia/Taipei）執行後續優化與公開測試。GitHub Pages 設定顯示網站已上線，Chrome 實際開啟公開網址可瀏覽，未要求網站登入。最初上線內容提交為 5a443b647bca1fe1dd3c1002a759c1b04ccc2b8a；後續提交補齊報告及閱讀器同步。\n\n- [公開入口](https://barry3687.github.io/zero-basics-finance/)\n- [GitHub](https://github.com/Barry3687/zero-basics-finance)\n- [Wiki 閱讀器](https://barry3687.github.io/zero-basics-finance/reader.html?doc=wiki/index.md)\n- [教學簡報](https://barry3687.github.io/zero-basics-finance/slides/index.html)\n\n## 優化內容\n\n新增可搜尋、可定位來源的離線 Wiki 閱讀器；首頁直接導向五個單元、練習與證據。另設 loop／graph 頁面及真實檢查入口。Markdown 為正本，閱讀器是同步快照。簡報僅改善引用連結，八份核准正文與數字保持不變。\n\n## 真實執行與檢查\n\n| 項目 | 實際結果 | 範圍 |\n|---|---|---|\n| 結構與內容鎖定 | 8 頁、8 張 SVG，26 份核心正本雜湊未變 | 本機靜態檢查 |\n| 正文字數 | 103、100、103、115、109、105、101、108，皆 ≤120 | 與核准逐頁稿逐字比較 |\n| 公開簡報 | 下一頁依序 1/8 至 8/8，最後按鈕停用；左鍵回 7/8、空白鍵回 8/8 | Chrome 公開網址 |\n| 公開 Wiki | 第二課完整載入，S006 引用能導向來源登錄 #s006 | 目標標題位於畫面頂部，無登入要求 |\n| 公開練習 | 第一題解析可展開，顯示 D、8 個月與逐步計算 | 不宣稱有自動批改 |\n| 搜尋 | 搜尋「複利」回傳對應文件；清除後恢復文章 | 本機 Chrome；索引會隨文件增加改變 |\n| 手機閱讀器 | 390×844，頁面 scrollWidth 375，沒有超出 390 的水平溢出 | 本機 Chrome，桌面瀏覽器回復原尺寸 |\n| 來源與安全 | 無憑證字串、未授權原始教材或私人財務檔案 | 靜態掃描；學生資料及 Gemini 截圖不公開 |\n\nStep 7 的桌面 1536×960 與手機 390×844 逐頁版面資料仍保留於 browser-check.json；不把舊版尺寸紀錄假稱為本次新首頁測試。歷史報告中的「待上傳」是當時狀態，已由本次真正公開測試補上。\n\n## 六項繳交要求對照\n\n| 要求 | 本專案證據 |\n|---|---|\n| 主題與簡介 | 首頁、README，受眾為零基礎大學生與新鮮人 |\n| Wiki 連結／成果，至少匯入 5 篇 | sources/catalog.md 登錄 S001–S007；notes 七份；wiki 五課與索引 |\n| 教學 HTML | slides/index.html 固定八頁，含 SVG、鍵盤與按鈕 |\n| loop／graph | workflow/index.html、graph.svg、loop-and-graph.md；三個失敗回圈與人工閘門 |\n| 實際執行與檢查 | 內容檢查、發布檢查、本報告、日誌與實測畫面 |\n| 反思與檢查前移 | 來源誤植隔離、初稿七頁超限；先查證／計字／審稿再排版 |\n\n## 反思與界線\n\n最容易出錯的是把完整 Wiki 濃縮成逐頁稿：初稿八頁中七頁超過 120 字。檢查因此前移到 Markdown 草稿階段，再局部精簡，不等 HTML 排好才刪字。來源層另有 S004 無出處數據停用、S006 百分比算式誤植隔離；機構來源仍需逐句與逐式核對。\n\nGemini 早期自編 raw/ 投資素材只作發想紀錄，沒有當成正式七份來源。流程是人與 AI 分階段協作，並非自動 LangGraph 系統；網站是靜態教材，沒有即時模型、投資推薦或自動交易。未測所有瀏覽器與裝置，不保證教師評分。\n\n補充靜態核對：目前閱讀器包含 36 份 Markdown 文件；內嵌內容的 259 個本機連結逐一檢查，沒有缺檔或來源錨點錯誤。網站及 Markdown 外部主機連線不屬於此靜態數目。\n"}, "reports/2026-11-19-release-check.md": {"title": "2026-11-19 發布與版面檢查報告", "html": "\u003ch1 id=\"2026-11-19-發布與版面檢查報告\">2026-11-19 發布與版面檢查報告\u003c/h1>\n\u003ch2 id=\"1-驗收範圍與時間\">1. 驗收範圍與時間\u003c/h2>\n\u003cul>\n\u003cli>專案：零基礎個人投資與理財入門。\u003c/li>\n\u003cli>本輪開始：2026-11-19 01:24:46 +08:00（Asia/Taipei，操作時間）。\u003c/li>\n\u003cli>本機程式、內容及瀏覽器查核紀錄截至：2026-11-19 01:37:04 +08:00；報告與最終封裝完成時間見日誌。\u003c/li>\n\u003cli>使用者本輪明確確認八份逐頁稿及內容報告，授權製作 HTML、入口頁與交付文件；指定公開網址測試待其上傳後親自驗證。\u003c/li>\n\u003cli>規則：依 \u003ca href=\"reader.html?doc=AGENTS.md\">AGENTS.md\u003c/a>第 8、9.5–9.6 節及本輪增補的第 11、12 節。第 11、12 節先前不存在，本次按使用者明列規格增補，不宣稱找回舊稿原文。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"2-驗收狀態分界\">2. 驗收狀態分界\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>檢查層級\u003c/th>\u003cth>狀態\u003c/th>\u003cth>可證實範圍\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>本機檔案與 HTML 結構檢查\u003c/td>\u003ctd>已完成\u003c/td>\u003ctd>八頁、逐字一致、SVG 結構、內嵌資源、來源、連結與交付檔案排除\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>本機 Chrome 版面與互動\u003c/td>\u003ctd>已完成指定尺寸\u003c/td>\u003ctd>1536×960 桌面及 390×844 手機直向，八頁逐頁邊界；方向鍵、空白鍵、按鈕及末頁邊界\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>其他裝置／瀏覽器／高倍率縮放\u003c/td>\u003ctd>未全面測試\u003c/td>\u003ctd>不把兩種尺寸推論為所有裝置均已通過\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>GitHub Repository 上傳\u003c/td>\u003ctd>未執行\u003c/td>\u003ctd>此輪交付本機完整檔與 ZIP\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>GitHub Pages 公開網址實測\u003c/td>\u003ctd>\u003cstrong>待使用者上傳後親自開啟驗證\u003c/strong>\u003c/td>\u003ctd>本輪無已驗證的公開網址，沒有部署成功結果可報\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>localhost、可下載 ZIP 及本機檔案連結都不是公開部署的證據。本機驗收不等於 GitHub Pages 已可公開瀏覽。\u003c/p>\n\u003ch2 id=\"3-交付檔案\">3. 交付檔案\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"slides/index.html\">八頁 HTML 簡報\u003c/a>：完整內嵌 CSS、JavaScript 及八張原生 SVG。\u003c/li>\n\u003cli>\u003ca href=\"index.html\">專案入口\u003c/a>：四張卡片對應簡報、Wiki 目錄、來源目錄及 exercises/。\u003c/li>\n\u003cli>\u003ca href=\"exercises/index.html\">練習 HTML 入口\u003c/a>：把已驗收的五份練習呈現為題目與可展開解析，避免目錄入口無首頁。\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=README.md\">README\u003c/a>：架構、學習順序、來源、工作流及本機／線上使用方式。\u003c/li>\n\u003cli>.gitignore：憑證、私人資料、暫存及未授權原始教材排除規則。\u003c/li>\n\u003cli>.nojekyll：純靜態交付，保留 Markdown 原始路徑。\u003c/li>\n\u003cli>本報告、\u003ca href=\"reader.html?doc=wiki/log.md\">執行日誌\u003c/a>、\u003ca href=\"reports/browser-check.json\">瀏覽器查核資料\u003c/a>及三張本機截圖。\u003c/li>\n\u003cli>既有 Wiki、筆記、來源、練習、大綱、逐頁稿及內容報告一併保留。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"4-八頁結構與正文鎖定\">4. 八頁結構與正文鎖定\u003c/h2>\n\u003cp>檢查方式：從各 Markdown 的「正文」讀出三點，再讀取 HTML 每個 section 的 copy 清單，比對三點文字及順序完全相同，並重算字數。HTML 跳脫只處理標記字元，不改字句。標題也逐頁比對原稿。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>頁碼\u003c/th>\u003cth>主題\u003c/th>\u003cth>HTML 正文字數\u003c/th>\u003cth>與核准稿逐字相同\u003c/th>\u003cth>正文重點數\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>01\u003c/td>\u003ctd>零基礎個人投資與理財入門\u003c/td>\u003ctd>103\u003c/td>\u003ctd>是\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>02\u003c/td>\u003ctd>收支與緊急預備金\u003c/td>\u003ctd>100\u003c/td>\u003ctd>是\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>03\u003c/td>\u003ctd>金額增加與購買力\u003c/td>\u003ctd>103\u003c/td>\u003ctd>是\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>04\u003c/td>\u003ctd>單利與複利\u003c/td>\u003ctd>115\u003c/td>\u003ctd>是\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>05\u003c/td>\u003ctd>股票與債券的身分差異\u003c/td>\u003ctd>109\u003c/td>\u003ctd>是\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>06\u003c/td>\u003ctd>基金與ETF的包含關係\u003c/td>\u003ctd>105\u003c/td>\u003ctd
