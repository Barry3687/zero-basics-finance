險與催匯款是暫停查證警訊；另找官方管道，必要時洽 165 | [Wiki 05](../wiki/05-first-financial-plan.md)「新手最常踩的誤區」第 3 點；「知識網路連結」自編練習 | S004 pp5、17、31–33；具體群組情境由 Wiki 自編 | 【概念示意】只呈現原題警訊及查核方向，不新增案件或犯罪判決；不在本階段撰寫題目逐頁成稿，後續解析沿用 [練習 05](../exercises/05-first-financial-plan.md) |\n\n## 禁止帶入的內容\n\n- S004 p25 停用數據，以及未經核實的固定配置比例、年齡配置公式。\n- S006 p12 的誤植算式及未核實名人引言；只採 pp11、13 定義。\n- Wiki 沒有的商品推薦、當期市場數據、稅費率、歷史報酬、投資詐騙個案判決。\n- 以「已整理官方來源」為由繞過 Wiki，新增來源中其他尚未匯入的內容。\n\n## 本階段檢查與後續閘門\n\n- 已對照八頁、五篇 Wiki 與 S001–S007；每個數字例子都有 Wiki 內相同條件及數值。\n- 主張涵蓋檢查採逐列閱讀；連結、頁數與試算可做結構／算術檢查，不能據此宣稱所有語意已由程式證明。\n- 上述表格是大綱階段的規劃依據，當時只檢查字數預算；本輪已另寫逐頁稿，實際字數與語意檢查見[內容報告](../reports/2026-11-19-content-check.md)。尚未進行 HTML 版面驗收。\n- **第 9.4 節狀態：使用者已明確確認通過；本輪停在內容報告待驗收，不進入 HTML 與發布。**\n\n後續狀態：Step 7 使用者已明確驗收逐頁稿及內容報告，允許製作 HTML；成品見[八頁簡報](index.html)，核對見[發布報告](../reports/2026-11-19-release-check.md)。原 21 列對照保持不變；公開網址尚待使用者上傳後驗證。\n"}, "sources/catalog.md": {"title": "來源登錄表", "html": "\u003ch1 id=\"來源登錄表\">來源登錄表\u003c/h1>\n\u003cp>專案：零基礎個人投資與理財入門。查閱日期：2026-11-19（Asia/Taipei）。\u003c/p>\n\u003cp>S001–S005 已獲使用者確認；S006–S007 依本次授權補強後匯入。以下只登錄來源與教學使用範圍，未取得整份教材的公開重製授權。原始 PDF 不隨專案發布；以摘要、定位及官方連結供查核。頁碼均指 PDF 實際頁序，從 1 起算。\u003c/p>\n\u003ch2 id=\"s001\">S001\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>標題\u003c/strong>：金融試算工具—金融健檢軟體。\u003c/li>\n\u003cli>\u003cstrong>發布機構\u003c/strong>：金融監督管理委員會金融智慧網。\u003c/li>\n\u003cli>\u003cstrong>真實網址\u003c/strong>：\u003ca href=\"https://moneywise.fsc.gov.tw/tabf/main/tool1.html\">官方原文\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>發布／更新日期\u003c/strong>：頁面未列個別文章日期；不可用網站頁尾日期推定。\u003c/li>\n\u003cli>\u003cstrong>查閱日期\u003c/strong>：2026-11-19。\u003c/li>\n\u003cli>\u003cstrong>可定位段落\u003c/strong>：「收入支出健檢」「循環利息健檢」「現金健檢」各自的試算說明。\u003c/li>\n\u003cli>\u003cstrong>適用地區\u003c/strong>：臺灣。\u003c/li>\n\u003cli>\u003cstrong>可讀性／保存狀態\u003c/strong>：HTML 正文可讀；未操作試算器。專案保存自行整理的筆記與連結，不保存全頁複本。\u003c/li>\n\u003cli>\u003cstrong>適用範圍與限制\u003c/strong>：收支安排及緊急預備金；工具的比例與燈號不是所有人的標準。信用卡計息另依契約，不將循環信用一概稱作複利。\u003c/li>\n\u003cli>\u003cstrong>權利處理\u003c/strong>：僅轉述必要概念，不重製網站圖表。\u003c/li>\n\u003cli>\u003cstrong>處理狀態／相關檔案\u003c/strong>：已確認並匯入；\u003ca href=\"reader.html?doc=notes/s001-reading.md\">閱讀筆記\u003c/a>、Wiki 01、05。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s002\">S002\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>標題\u003c/strong>：四、通貨膨脹有什麼壞處？\u003c/li>\n\u003cli>\u003cstrong>發布機構\u003c/strong>：中央銀行。\u003c/li>\n\u003cli>\u003cstrong>真實網址\u003c/strong>：\u003ca href=\"https://www.cbc.gov.tw/tw/cp-731-24677-0C9D6-1.html\">官方原文\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>發布／更新日期\u003c/strong>：發布 2008-03-24；個別更新日期未確認。\u003c/li>\n\u003cli>\u003cstrong>查閱日期\u003c/strong>：2026-11-19。\u003c/li>\n\u003cli>\u003cstrong>可定位段落\u003c/strong>：開頭家庭生活支出說明；「通貨膨脹起，財富大風吹」。\u003c/li>\n\u003cli>\u003cstrong>適用地區\u003c/strong>：臺灣；購買力概念可一般化。\u003c/li>\n\u003cli>\u003cstrong>可讀性／保存狀態\u003c/strong>：HTML 正文可讀；保存筆記與連結。\u003c/li>\n\u003cli>\u003cstrong>適用範圍與限制\u003c/strong>：整體物價上漲與購買力。不是目前臺灣通膨率資料，也不能由單一商品漲價斷定整體通膨。\u003c/li>\n\u003cli>\u003cstrong>權利處理\u003c/strong>：自行轉述，不重製全文。\u003c/li>\n\u003cli>\u003cstrong>處理狀態／相關檔案\u003c/strong>：已確認並匯入；\u003ca href=\"reader.html?doc=notes/s002-reading.md\">閱讀筆記\u003c/a>、Wiki 02。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s003\">S003\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>標題\u003c/strong>：ETF 專區—ETF 基礎認識問答。\u003c/li>\n\u003cli>\u003cstrong>發布機構\u003c/strong>：中華民國證券投資信託暨顧問商業同業公會。\u003c/li>\n\u003cli>\u003cstrong>真實網址\u003c/strong>：\u003ca href=\"https://www.sitca.org.tw/ROC/SITCA_ETF/etf-hub-basic.html\">原文\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>發布／更新日期\u003c/strong>：頁面未明列。\u003c/li>\n\u003cli>\u003cstrong>查閱日期\u003c/strong>：2026-11-19。\u003c/li>\n\u003cli>\u003cstrong>可定位段落\u003c/strong>：Q1 ETF 定義、Q2 類型、Q3 與一般基金比較、Q8 公開說明書。\u003c/li>\n\u003cli>\u003cstrong>適用地區\u003c/strong>：臺灣。\u003c/li>\n\u003cli>\u003cstrong>可讀性／保存狀態\u003c/strong>：Q1–Q11 HTML 文字可讀；非所有圖片皆經逐圖檢查；保存筆記與連結。\u003c/li>\n\u003cli>\u003cstrong>適用範圍與限制\u003c/strong>：ETF 是基金的一種；並非全部被動追蹤指數。Q1 簡述須與 Q2 主動式 ETF 說明並讀，不泛化為「所有 ETF 都相同」。\u003c/li>\n\u003cli>\u003cstrong>權利處理\u003c/strong>：自行轉述，未重製表格圖像。\u003c/li>\n\u003cli>\u003cstrong>處理狀態／相關檔案\u003c/strong>：已確認並匯入；\u003ca href=\"reader.html?doc=notes/s003-reading.md\">閱讀筆記\u003c/a>、Wiki 03、04。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s004\">S004\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>標題\u003c/strong>：投資理財與風險管理（含虛擬資產商品性質及風險）。\u003c/li>\n\u003cli>\u003cstrong>製作／發布機構\u003c/strong>：財團法人中華民國證券暨期貨市場發展基金會製作；台灣金融服務業聯合總會網站提供下載。\u003c/li>\n\u003cli>\u003cstrong>真實網址\u003c/strong>：\u003ca href=\"https://www.tfsr.org.tw/storage/file/download/01.%E6%8A%95%E8%B3%87%E7%90%86%E8%B2%A1%E5%8F%8A%E9%A2%A8%E9%9A%AA%E7%AE%A1%E7%90%86-%E4%B8%80%E8%88%AC%E6%8A%95%E8%B3%87%E4%BA%BA%28%E8%AD%89%E5%9F%BA%E6%9C%83%29.pdf\">35 頁 PDF\u003c/a>；\u003ca href=\"https://www.tfsr.org.tw/downloadZone/download?kind_id=5\">官方下載目錄\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>發布／更新日期\u003c/strong>：目錄列於 115 年度宣導資料；PDF 未見正式發布日期。檔案中繼資料 2026-05-26 不能當成正式發布日期。\u003c/li>\n\u003cli>\u003cstrong>查閱日期\u003c/strong>：2026-11-19。\u003c/li>\n\u003cli>\u003cstrong>可定位段落\u003c/strong>：p4 理財規劃；p5 風險與報酬；p7 複利概念；pp8–9 股票；p10 基金；pp11–13 ETF；p17 詐騙；pp21–24 目標與風險承受；pp26–27 配置與調整；pp31–33 防詐；p34 總結。\u003c/li>\n\u003cli>\u003cstrong>適用地區\u003c/strong>：臺灣。\u003c/li>\n\u003cli>\u003cstrong>可讀性／保存狀態\u003c/strong>：35 頁文字已抽取；封面與 p26 已視覺核對。本輪補查 pp1–21、28–35 的抽取文字。原檔僅在專案外的本機查核暫存，不列入發布檔。\u003c/li>\n\u003cli>\u003cstrong>適用範圍與限制\u003c/strong>：股票所有權、基金、配置、防詐。單利／複利完整算式及債券基本條件不足，分別由 S006、S007 補強。\u003c/li>\n\u003cli>\u003cstrong>權利處理\u003c/strong>：只保留自行撰寫的摘要與頁碼，不重製整份簡報。\u003c/li>\n\u003cli>\u003cstrong>處理狀態／相關檔案\u003c/strong>：已確認並匯入；\u003cstrong>p25「超過90%」停用\u003c/strong>，不採未核實的固定配置比例或年齡公式。\u003ca href=\"reader.html?doc=notes/s004-reading.md\">閱讀筆記\u003c/a>、Wiki 01、03–05。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s005\">S005\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>標題\u003c/strong>：定期定額投資股票及 ETF 專區—投資人篇。\u003c/li>\n\u003cli>\u003cstrong>發布機構\u003c/strong>：臺灣證券交易所。\u003c/li>\n\u003cli>\u003cstrong>真實網址\u003c/strong>：\u003ca href=\"https://www.twse.com.tw/zh/products/system/ftfa-trading.html\">官方原文\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>發布／更新日期\u003c/strong>：未列個別文章日期；2017-01-16 是制度開辦日期，非本文發布日期。\u003c/li>\n\u003cli>\u003cstrong>查閱日期\u003c/strong>：2026-11-19。\u003c/li>\n\u003cli>\u003cstrong>可定位段落\u003c/strong>：「投資人篇」之「貳、交易流程」「參、投資人常見問答」Q1–Q3。\u003c/li>\n\u003cli>\u003cstrong>適用地區\u003c/strong>：臺灣證券商承作的相關制度。\u003c/li>\n\u003cli>\u003cstrong>可讀性／保存狀態\u003c/strong>：投資人篇 HTML 可讀；未開戶或進行交易；保存筆記與連結。\u003c/li>\n\u003cli>\u003cstrong>適用範圍與限制\u003c/strong>：固定日期、金額與契約費用的安排；不支持「定期定額保證獲利」。\u003c/li>\n\u003cli>\u003cstrong>權利處理\u003c/strong>：自行轉述，不重製全文。\u003c/li>\n\u003cli>\u003cstrong>處理狀態／相關檔案\u003c/strong>：已確認並匯入；\u003ca href=\"reader.html?doc=notes/s005-reading.md\">閱讀筆記\u003c/a>、Wiki 05。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s006\">S006\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>標題\u003c/strong>：金融素養培力—從扎根基礎知識做起。\u003c/li>\n\u003cli>\u003cstrong>製作／提供機構\u003c/strong>：財團法人金融消費評議中心（頁面標誌可辨）；中華民國信託業商業同業公會網站提供 PDF。\u003c/li>\n\u003cli>\u003cstrong>真實網址\u003c/strong>：\u003ca href=\"https://www.trust.org.tw/upload/1130600262001.pdf\">43 頁 PDF\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>發布／更新日期\u003c/strong>：封面標示 2024.09；未見更精確發布日。\u003c/li>\n\u003cli>\u003cstrong>查閱日期\u003c/strong>：2026-11-19。\u003c/li>\n\u003cli>\u003cstrong>可定位段落\u003c/strong>：p10 儲蓄與預備金；p11 單利和複利；p12 複利的效果；p13 重點提醒。\u003c/li>\n\u003cli>\u003cstrong>適用地區\u003c/strong>：臺灣；計息概念可一般化。\u003c/li>\n\u003cli>\u003cstrong>可讀性／保存狀態\u003c/strong>：43 頁 PDF 可下載並抽取文字；p12 已渲染視覺核對。原檔僅存於專案外本機查核暫存。\u003c/li>\n\u003cli>\u003cstrong>適用範圍與限制\u003c/strong>：採 pp11、13 的計息定義。\u003cstrong>p12 算式「×1.05%」有明顯誤植，不照抄\u003c/strong>；應以 5% 年利率的本利和乘數 1.05 理解。Wiki 改用獨立驗算的 2% 假設例子；未核實的愛因斯坦引言不採。\u003c/li>\n\u003cli>\u003cstrong>權利處理\u003c/strong>：自行推導與轉述，不重製簡報圖片。\u003c/li>\n\u003cli>\u003cstrong>處理狀態／相關檔案\u003c/strong>：依使用者補強授權登錄並匯入；\u003ca href=\"reader.html?doc=notes/s006-reading.md\">閱讀筆記\u003c/a>、Wiki 02。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s007\">S007\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>標題\u003c/strong>：公司債及金融債簡介。\u003c/li>\n\u003cli>\u003cstrong>發布機構\u003c/strong>：財團法人中華民國證券櫃檯買賣中心。\u003c/li>\n\u003cli>\u003cstrong>真實網址\u003c/strong>：\u003ca href=\"https://www.tpex.org.tw/zh-tw/bond/service/introduction/co-bond.html\">官方原文\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>發布／更新日期\u003c/strong>：本文未明列；頁尾版權年份不是更新日期。\u003c/li>\n\u003cli>\u003cstrong>查閱日期\u003c/strong>：2026-11-19。\u003c/li>\n\u003cli>\u003cstrong>可定位段落\u003c/strong>：「壹、定義」一、何謂普通公司債及金融債；二、發行條件之票面利率、發行年限、還本方式、計付息方式；「貳、發行面」三、資訊揭露。\u003c/li>\n\u003cli>\u003cstrong>適用地區\u003c/strong>：臺灣普通公司債及金融債；不可代替所有特殊債券的個別條款。\u003c/li>\n\u003cli>\u003cstrong>可讀性／保存狀態\u003c/strong>：搜尋瀏覽工具回應 403；改由直接 HTTPS 取得公開 HTML，已讀取並核對定義與條件段落。不是只根據搜尋摘要登錄。\u003c/li>\n\u003cli>\u003cstrong>適用範圍與限制\u003c/strong>：籌資、利息、還本及條款差異。只示範約定一年到期、固定利息的假設債券，不泛稱所有債券有固定到期日或保本。\u003c/li>\n\u003cli>\u003cstrong>權利處理\u003c/strong>：自行轉述；HTML 查核暫存不隨專案發布。\u003c/li>\n\u003cli>\u003cstrong>處理狀態／相關檔案\u003c/strong>：依使用者補強授權登錄並匯入；\u003ca href=\"reader.html?doc=notes/s007-reading.md\">閱讀筆記\u003c/a>、Wiki 03。\u003c/li>\n\u003c/ul>", "source": "# 來源登錄表\n\n專案：零基礎個人投資與理財入門。查閱日期：2026-11-19（Asia/Taipei）。\n\nS001–S005 已獲使用者確認；S006–S007 依本次授權補強後匯入。以下只登錄來源與教學使用範圍，未取得整份教材的公開重製授權。原始 PDF 不隨專案發布；以摘要、定位及官方連結供查核。頁碼均指 PDF 實際頁序，從 1 起算。\n\n## S001\n\n- **標題**：金融試算工具—金融健檢軟體。\n- **發布機構**：金融監督管理委員會金融智慧網。\n- **真實網址**：[官方原文](https://moneywise.fsc.gov.tw/tabf/main/tool1.html)。\n- **發布／更新日期**：頁面未列個別文章日期；不可用網站頁尾日期推定。\n- **查閱日期**：2026-11-19。\n- **可定位段落**：「收入支出健檢」「循環利息健檢」「現金健檢」各自的試算說明。\n- **適用地區**：臺灣。\n- **可讀性／保存狀態**：HTML 正文可讀；未操作試算器。專案保存自行整理的筆記與連結，不保存全頁複本。\n- **適用範圍與限制**：收支安排及緊急預備金；工具的比例與燈號不是所有人的標準。信用卡計息另依契約，不將循環信用一概稱作複利。\n- **權利處理**：僅轉述必要概念，不重製網站圖表。\n- **處理狀態／相關檔案**：已確認並匯入；[閱讀筆記](../notes/s001-reading.md)、Wiki 01、05。\n\n## S002\n\n- **標題**：四、通貨膨脹有什麼壞處？\n- **發布機構**：中央銀行。\n- **真實網址**：[官方原文](https://www.cbc.gov.tw/tw/cp-731-24677-0C9D6-1.html)。\n- **發布／更新日期**：發布 2008-03-24；個別更新日期未確認。\n- **查閱日期**：2026-11-19。\n- **可定位段落**：開頭家庭生活支出說明；「通貨膨脹起，財富大風吹」。\n- **適用地區**：臺灣；購買力概念可一般化。\n- **可讀性／保存狀態**：HTML 正文可讀；保存筆記與連結。\n- **適用範圍與限制**：整體物價上漲與購買力。不是目前臺灣通膨率資料，也不能由單一商品漲價斷定整體通膨。\n- **權利處理**：自行轉述，不重製全文。\n- **處理狀態／相關檔案**：已確認並匯入；[閱讀筆記](../notes/s002-reading.md)、Wiki 02。\n\n## S003\n\n- **標題**：ETF 專區—ETF 基礎認識問答。\n- **發布機構**：中華民國證券投資信託暨顧問商業同業公會。\n- **真實網址**：[原文](https://www.sitca.org.tw/ROC/SITCA_ETF/etf-hub-basic.html)。\n- **發布／更新日期**：頁面未明列。\n- **查閱日期**：2026-11-19。\n- **可定位段落**：Q1 ETF 定義、Q2 類型、Q3 與一般基金比較、Q8 公開說明書。\n- **適用地區**：臺灣。\n- **可讀性／保存狀態**：Q1–Q11 HTML 文字可讀；非所有圖片皆經逐圖檢查；保存筆記與連結。\n- **適用範圍與限制**：ETF 是基金的一種；並非全部被動追蹤指數。Q1 簡述須與 Q2 主動式 ETF 說明並讀，不泛化為「所有 ETF 都相同」。\n- **權利處理**：自行轉述，未重製表格圖像。\n- **處理狀態／相關檔案**：已確認並匯入；[閱讀筆記](../notes/s003-reading.md)、Wiki 03、04。\n\n## S004\n\n- **標題**：投資理財與風險管理（含虛擬資產商品性質及風險）。\n- **製作／發布機構**：財團法人中華民國證券暨期貨市場發展基金會製作；台灣金融服務業聯合總會網站提供下載。\n- **真實網址**：[35 頁 PDF](https://www.tfsr.org.tw/storage/file/download/01.%E6%8A%95%E8%B3%87%E7%90%86%E8%B2%A1%E5%8F%8A%E9%A2%A8%E9%9A%AA%E7%AE%A1%E7%90%86-%E4%B8%80%E8%88%AC%E6%8A%95%E8%B3%87%E4%BA%BA%28%E8%AD%89%E5%9F%BA%E6%9C%83%29.pdf)；[官方下載目錄](https://www.tfsr.org.tw/downloadZone/download?kind_id=5)。\n- **發布／更新日期**：目錄列於 115 年度宣導資料；PDF 未見正式發布日期。檔案中繼資料 2026-05-26 不能當成正式發布日期。\n- **查閱日期**：2026-11-19。\n- **可定位段落**：p4 理財規劃；p5 風險與報酬；p7 複利概念；pp8–9 股票；p10 基金；pp11–13 ETF；p17 詐騙；pp21–24 目標與風險承受；pp26–27 配置與調整；pp31–33 防詐；p34 總結。\n- **適用地區**：臺灣。\n- **可讀性／保存狀態**：35 頁文字已抽取；封面與 p26 已視覺核對。本輪補查 pp1–21、28–35 的抽取文字。原檔僅在專案外的本機查核暫存，不列入發布檔。\n- **適用範圍與限制**：股票所有權、基金、配置、防詐。單利／複利完整算式及債券基本條件不足，分別由 S006、S007 補強。\n- **權利處理**：只保留自行撰寫的摘要與頁碼，不重製整份簡報。\n- **處理狀態／相關檔案**：已確認並匯入；**p25「超過90%」停用**，不採未核實的固定配置比例或年齡公式。[閱讀筆記](../notes/s004-reading.md)、Wiki 01、03–05。\n\n## S005\n\n- **標題**：定期定額投資股票及 ETF 專區—投資人篇。\n- **發布機構**：臺灣證券交易所。\n- **真實網址**：[官方原文](https://www.twse.com.tw/zh/products/system/ftfa-trading.html)。\n- **發布／更新日期**：未列個別文章日期；2017-01-16 是制度開辦日期，非本文發布日期。\n- **查閱日期**：2026-11-19。\n- **可定位段落**：「投資人篇」之「貳、交易流程」「參、投資人常見問答」Q1–Q3。\n- **適用地區**：臺灣證券商承作的相關制度。\n- **可讀性／保存狀態**：投資人篇 HTML 可讀；未開戶或進行交易；保存筆記與連結。\n- **適用範圍與限制**：固定日期、金額與契約費用的安排；不支持「定期定額保證獲利」。\n- **權利處理**：自行轉述，不重製全文。\n- **處理狀態／相關檔案**：已確認並匯入；[閱讀筆記](../notes/s005-reading.md)、Wiki 05。\n\n## S006\n\n- **標題**：金融素養培力—從扎根基礎知識做起。\n- **製作／提供機構**：財團法人金融消費評議中心（頁面標誌可辨）；中華民國信託業商業同業公會網站提供 PDF。\n- **真實網址**：[43 頁 PDF](https://www.trust.org.tw/upload/1130600262001.pdf)。\n- **發布／更新日期**：封面標示 2024.09；未見更精確發布日。\n- **查閱日期**：2026-11-19。\n- **可定位段落**：p10 儲蓄與預備金；p11 單利和複利；p12 複利的效果；p13 重點提醒。\n- **適用地區**：臺灣；計息概念可一般化。\n- **可讀性／保存狀態**：43 頁 PDF 可下載並抽取文字；p12 已渲染視覺核對。原檔僅存於專案外本機查核暫存。\n- **適用範圍與限制**：採 pp11、13 的計息定義。**p12 算式「×1.05%」有明顯誤植，不照抄**；應以 5% 年利率的本利和乘數 1.05 理解。Wiki 改用獨立驗算的 2% 假設例子；未核實的愛因斯坦引言不採。\n- **權利處理**：自行推導與轉述，不重製簡報圖片。\n- **處理狀態／相關檔案**：依使用者補強授權登錄並匯入；[閱讀筆記](../notes/s006-reading.md)、Wiki 02。\n\n## S007\n\n- **標題**：公司債及金融債簡介。\n- **發布機構**：財團法人中華民國證券櫃檯買賣中心。\n- **真實網址**：[官方原文](https://www.tpex.org.tw/zh-tw/bond/service/introduction/co-bond.html)。\n- **發布／更新日期**：本文未明列；頁尾版權年份不是更新日期。\n- **查閱日期**：2026-11-19。\n- **可定位段落**：「壹、定義」一、何謂普通公司債及金融債；二、發行條件之票面利率、發行年限、還本方式、計付息方式；「貳、發行面」三、資訊揭露。\n- **適用地區**：臺灣普通公司債及金融債；不可代替所有特殊債券的個別條款。\n- **可讀性／保存狀態**：搜尋瀏覽工具回應 403；改由直接 HTTPS 取得公開 HTML，已讀取並核對定義與條件段落。不是只根據搜尋摘要登錄。\n- **適用範圍與限制**：籌資、利息、還本及條款差異。只示範約定一年到期、固定利息的假設債券，不泛稱所有債券有固定到期日或保本。\n- **權利處理**：自行轉述；HTML 查核暫存不隨專案發布。\n- **處理狀態／相關檔案**：依使用者補強授權登錄並匯入；[閱讀筆記](../notes/s007-reading.md)、Wiki 03。\n"}, "wiki/01-budget-and-emergency-fund.md": {"title": "先管好生活中的錢", "html": "\u003ch1 id=\"先管好生活中的錢\">先管好生活中的錢\u003c/h1>\n\u003ch2 id=\"一句話白話定義40字內\">一句話白話定義（40字內）\u003c/h2>\n\u003cp>先安排生活支出與備用金，再決定能拿多少錢投資。\u003c/p>\n\u003cp>\u003cstrong>先備知識\u003c/strong>：只需要加減乘除；本課不需要股市知識。\u003c/p>\n\u003cp>【來源內容】\u003cstrong>依序理解\u003c/strong>：收入是收到的錢，支出是花掉的錢；「收支結餘」就是收入減支出後留下的金額。「緊急預備金」是應付突發必要支出或收入中斷、能及時取用的備用錢。先盤點生活，再設定目標與儲蓄安排。\u003ca href=\"reader.html?doc=sources/catalog.md#s001\">S001\u003c/a>\u003c/p>\n\u003ch2 id=\"生活化比喻\">生活化比喻\u003c/h2>\n\u003cp>【教學轉譯】把錢分成三個信封：日常生活、下雨備用、未來目標。先讓生活信封夠用，再替下雨信封留錢；不能因為想買投資商品，就把明天的午餐錢也拿走。\u003c/p>\n\u003cp>\u003cstrong>比喻限制\u003c/strong>：實際不必用實體信封；備用錢也不能只看名稱，要確認能否及時取用及金額是否可能大幅變動。\u003c/p>\n\u003cp>【來源內容】應備多少，須配合生活費、收入穩定程度與家庭責任評估；不存在適用每個人的唯一月份。\u003ca href=\"reader.html?doc=sources/catalog.md#s001\">S001\u003c/a>；\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004 p24\u003c/a>\u003c/p>\n\u003ch2 id=\"具體數字小試算\">具體數字小試算\u003c/h2>\n\u003cp>【假設例子】全部金額為新臺幣。假設月收入 30,000 元、必要生活費 24,000 元，沒有其他支出或待還欠款；目前備用金為 0。自己選定先存三個月生活費，且每月結餘全存入備用金。三個月只是此題設定。\u003c/p>\n\u003col>\n\u003cli>每月結餘：30,000 − 24,000 = 6,000 元。\u003c/li>\n\u003cli>備用金目標：24,000 × 3 = 72,000 元。\u003c/li>\n\u003cli>達標時間：72,000 ÷ 6,000 = 12 個月。\u003c/li>\n\u003c/ol>\n\u003cp>若除不盡，而題目問至少需要幾個完整月份，就逐月比較存款是否達標，不能把不足一個月直接捨去。\u003c/p>\n\u003cp>這不是「每月可直接投資 6,000 元」；本例已把這筆錢安排去補備用金。未計利息、稅費、物價及收入變動。\u003c/p>\n\u003ch2 id=\"新手最常踩的誤區\">新手最常踩的誤區\u003c/h2>\n\u003cul>\n\u003cli>把結餘都當可投資金額：學費、欠款、已知的大筆支出也要先盤點。\u003c/li>\n\u003cli>把會漲跌的投資當隨時等值可用的備用金：急用時可能必須虧損賣出。\u003c/li>\n\u003cli>把例題的三個月當硬規定：應依自己的生活條件調整。\u003ca href=\"reader.html?doc=sources/catalog.md#s001\">S001\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"知識網路連結標註上一課與下一課的超連結\">知識網路連結（標註上一課與下一課的超連結）\u003c/h2>\n\u003cul>\n\u003cli>上一課：無，從\u003ca href=\"reader.html?doc=wiki/index.md\">全站目錄\u003c/a>開始。\u003c/li>\n\u003cli>下一課：\u003ca href=\"reader.html?doc=wiki/02-inflation-and-compound-interest.md\">錢為什麼會變多，也可能變少\u003c/a>。\u003c/li>\n\u003cli>【自編練習】月收入 28,000 元、必要支出 22,000 元；從零開始存兩個月必要支出的備用金，每月結餘全部存入。不計利息，至少需幾個完整月份？A. 2 個月　B. 6 個月　C. 7 個月　D. 8 個月。\u003c/li>\n\u003cli>先作答，再看\u003ca href=\"reader.html?doc=exercises/01-budget-and-emergency-fund.md\">提示與解析\u003c/a>。\u003c/li>\n\u003c/ul>", "source": "# 先管好生活中的錢\n\n## 一句話白話定義（40字內）\n\n先安排生活支出與備用金，再決定能拿多少錢投資。\n\n**先備知識**：只需要加減乘除；本課不需要股市知識。\n\n【來源內容】**依序理解**：收入是收到的錢，支出是花掉的錢；「收支結餘」就是收入減支出後留下的金額。「緊急預備金」是應付突發必要支出或收入中斷、能及時取用的備用錢。先盤點生活，再設定目標與儲蓄安排。[S001](../sources/catalog.md#s001)\n\n## 生活化比喻\n\n【教學轉譯】把錢分成三個信封：日常生活、下雨備用、未來目標。先讓生活信封夠用，再替下雨信封留錢；不能因為想買投資商品，就把明天的午餐錢也拿走。\n\n**比喻限制**：實際不必用實體信封；備用錢也不能只看名稱，要確認能否及時取用及金額是否可能大幅變動。\n\n【來源內容】應備多少，須配合生活費、收入穩定程度與家庭責任評估；不存在適用每個人的唯一月份。[S001](../sources/catalog.md#s001)；[S004 p24](../sources/catalog.md#s004)\n\n## 具體數字小試算\n\n【假設例子】全部金額為新臺幣。假設月收入 30,000 元、必要生活費 24,000 元，沒有其他支出或待還欠款；目前備用金為 0。自己選定先存三個月生活費，且每月結餘全存入備用金。三個月只是此題設定。\n\n1. 每月結餘：30,000 − 24,000 = 6,000 元。\n2. 備用金目標：24,000 × 3 = 72,000 元。\n3. 達標時間：72,000 ÷ 6,000 = 12 個月。\n\n若除不盡，而題目問至少需要幾個完整月份，就逐月比較存款是否達標，不能把不足一個月直接捨去。\n\n這不是「每月可直接投資 6,000 元」；本例已把這筆錢安排去補備用金。未計利息、稅費、物價及收入變動。\n\n## 新手最常踩的誤區\n\n- 把結餘都當可投資金額：學費、欠款、已知的大筆支出也要先盤點。\n- 把會漲跌的投資當隨時等值可用的備用金：急用時可能必須虧損賣出。\n- 把例題的三個月當硬規定：應依自己的生活條件調整。[S001](../sources/catalog.md#s001)\n\n## 知識網路連結（標註上一課與下一課的超連結）\n\n- 上一課：無，從[全站目錄](index.md)開始。\n- 下一課：[錢為什麼會變多，也可能變少](02-inflation-and-compound-interest.md)。\n- 【自編練習】月收入 28,000 元、必要支出 22,000 元；從零開始存兩個月必要支出的備用金，每月結餘全部存入。不計利息，至少需幾個完整月份？A. 2 個月　B. 6 個月　C. 7 個月　D. 8 個月。\n- 先作答，再看[提示與解析](../exercises/01-budget-and-emergency-fund.md)。\n"}, "wiki/02-inflation-and-compound-interest.md": {"title": "錢為什麼會變多，也可能變少", "html": "\u003ch1 id=\"錢為什麼會變多也可能變少\">錢為什麼會變多，也可能變少\u003c/h1>\n\u003ch2 id=\"一句話白話定義40字內\">一句話白話定義（40字內）\u003c/h2>\n\u003cp>利息能增加帳面金額，物價上漲卻可能降低購買力。\u003c/p>\n\u003cp>\u003cstrong>先備知識\u003c/strong>：\u003ca href=\"reader.html?doc=wiki/01-budget-and-emergency-fund.md\">收支與備用金\u003c/a>、百分比：2% 就是 2÷100＝0.02。\u003c/p>\n\u003cp>【來源內容】\u003cstrong>依序理解\u003c/strong>：「本金」是最初投入的金額；「利息」是依計息約定增加的錢；「利率」是每期利息相對於計息基礎的比例。單利每期只按原本金算，複利把利息留下來一起算下一期。\u003ca href=\"reader.html?doc=sources/catalog.md#s006\">S006 pp11、13\u003c/a>\u003c/p>\n\u003cp>【來源內容】「通貨膨脹」，簡稱通膨，是整體物價水準持續上升；「購買力」是同一筆錢能買多少東西。因此帳面金額增加，不等於能買到更多。\u003ca href=\"reader.html?doc=sources/catalog.md#s002\">S002\u003c/a>\u003c/p>\n\u003ch2 id=\"生活化比喻\">生活化比喻\u003c/h2>\n\u003cp>【教學轉譯】單利像每年依原本雞隻數量收雞蛋，把蛋另外放；複利像讓新增小雞也加入下一年的產蛋隊伍。通膨則像同樣一張百元鈔，面對漲價的便當，能買的份量縮小。\u003c/p>\n\u003cp>\u003cstrong>比喻限制\u003c/strong>：真實投資不會固定生出收益，甚至會虧損；單一家便當店漲價也不能證明整體通膨。雞與蛋只用來理解計算基礎。\u003c/p>\n\u003ch2 id=\"具體數字小試算\">具體數字小試算\u003c/h2>\n\u003cp>【假設例子】本金 10,000 元，每年利率固定 2%，一年計息一次，放兩年，不再存入或領出，忽略稅費。\u003c/p>\n\u003cp>\u003cstrong>先算單利\u003c/strong>：每年利息 = 10,000 × 0.02 = 200 元。兩年後 = 10,000 + 200 + 200 = 10,400 元。\u003c/p>\n\u003cp>\u003cstrong>再算複利\u003c/strong>：第一年後 = 10,000 × 1.02 = 10,200 元。第二年利息 = 10,200 × 0.02 = 204 元；第二年後 = 10,200 + 204 = 10,404 元。\u003c/p>\n\u003cp>【教學轉譯】令 P 為原本金、r 為每年利率的小數、n 為年數、A 為期末金額，則單利 A = P(1+rn)；每年計息一次的複利 A = P(1+r)^n。這是依 S006 定義自行展開的公式，不是投資收益承諾。\u003c/p>\n\u003cp>【假設例子】另看一年：若原本 100 元的一籃固定商品變成 105 元，而資金只有 102 元，仍買不到原本一整籃。此處 5% 是假設，並非臺灣現況統計。\u003c/p>\n\u003ch2 id=\"新手最常踩的誤區\">新手最常踩的誤區\u003c/h2>\n\u003cul>\n\u003cli>把 2% 當 2 代入：應用 0.02；本利和乘數是 1.02。\u003c/li>\n\u003cli>忘記期間：每月計息與每年計息不能直接混用同一個 r、n。\u003c/li>\n\u003cli>以為複利保證賺錢：公式需要利率與再投入條件；實際投資未必有固定正報酬。\u003c/li>\n\u003cli>把所有信用卡欠款都說成複利：計息仍須依個別契約與規範確認。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"知識網路連結標註上一課與下一課的超連結\">知識網路連結（標註上一課與下一課的超連結）\u003c/h2>\n\u003cul>\n\u003cli>上一課：\u003ca href=\"reader.html?doc=wiki/01-budget-and-emergency-fund.md\">先管好生活中的錢\u003c/a>。\u003c/li>\n\u003cli>下一課：\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">股票、債券、基金與 ETF 是什麼\u003c/a>。\u003c/li>\n\u003cli>【自編練習】本金 10,000 元，每年 3%，每年複利一次，連放兩年，不另收付且忽略稅費。期末金額是多少？A. 10,300 元　B. 10,600 元　C. 10,609 元　D. 13,000 元。\u003c/li>\n\u003cli>先作答，再看\u003ca href=\"reader.html?doc=exercises/02-inflation-and-compound-interest.md\">提示與解析\u003c/a>。\u003c/li>\n\u003c/ul>", "source": "# 錢為什麼會變多，也可能變少\n\n## 一句話白話定義（40字內）\n\n利息能增加帳面金額，物價上漲卻可能降低購買力。\n\n**先備知識**：[收支與備用金](01-budget-and-emergency-fund.md)、百分比：2% 就是 2÷100＝0.02。\n\n【來源內容】**依序理解**：「本金」是最初投入的金額；「利息」是依計息約定增加的錢；「利率」是每期利息相對於計息基礎的比例。單利每期只按原本金算，複利把利息留下來一起算下一期。[S006 pp11、13](../sources/catalog.md#s006)\n\n【來源內容】「通貨膨脹」，簡稱通膨，是整體物價水準持續上升；「購買力」是同一筆錢能買多少東西。因此帳面金額增加，不等於能買到更多。[S002](../sources/catalog.md#s002)\n\n## 生活化比喻\n\n【教學轉譯】單利像每年依原本雞隻數量收雞蛋，把蛋另外放；複利像讓新增小雞也加入下一年的產蛋隊伍。通膨則像同樣一張百元鈔，面對漲價的便當，能買的份量縮小。\n\n**比喻限制**：真實投資不會固定生出收益，甚至會虧損；單一家便當店漲價也不能證明整體通膨。雞與蛋只用來理解計算基礎。\n\n## 具體數字小試算\n\n【假設例子】本金 10,000 元，每年利率固定 2%，一年計息一次，放兩年，不再存入或領出，忽略稅費。\n\n**先算單利**：每年利息 = 10,000 × 0.02 = 200 元。兩年後 = 10,000 + 200 + 200 = 10,400 元。\n\n**再算複利**：第一年後 = 10,000 × 1.02 = 10,200 元。第二年利息 = 10,200 × 0.02 = 204 元；第二年後 = 10,200 + 204 = 10,404 元。\n\n【教學轉譯】令 P 為原本金、r 為每年利率的小數、n 為年數、A 為期末金額，則單利 A = P(1+rn)；每年計息一次的複利 A = P(1+r)^n。這是依 S006 定義自行展開的公式，不是投資收益承諾。\n\n【假設例子】另看一年：若原本 100 元的一籃固定商品變成 105 元，而資金只有 102 元，仍買不到原本一整籃。此處 5% 是假設，並非臺灣現況統計。\n\n## 新手最常踩的誤區\n\n- 把 2% 當 2 代入：應用 0.02；本利和乘數是 1.02。\n- 忘記期間：每月計息與每年計息不能直接混用同一個 r、n。\n- 以為複利保證賺錢：公式需要利率與再投入條件；實際投資未必有固定正報酬。\n- 把所有信用卡欠款都說成複利：計息仍須依個別契約與規範確認。\n\n## 知識網路連結（標註上一課與下一課的超連結）\n\n- 上一課：[先管好生活中的錢](01-budget-and-emergency-fund.md)。\n- 下一課：[股票、債券、基金與 ETF 是什麼](03-stocks-bonds-funds-etfs.md)。\n- 【自編練習】本金 10,000 元，每年 3%，每年複利一次，連放兩年，不另收付且忽略稅費。期末金額是多少？A. 10,300 元　B. 10,600 元　C. 10,609 元　D. 13,000 元。\n- 先作答，再看[提示與解析](../exercises/02-inflation-and-compound-interest.md)。\n"}, "wiki/03-stocks-bonds-funds-etfs.md": {"title": "股票、債券、基金與 ETF 是什麼", "html": "\u003ch1 id=\"股票債券基金與-etf-是什麼\">股票、債券、基金與 ETF 是什麼\u003c/h1>\n\u003ch2 id=\"一句話白話定義40字內\">一句話白話定義（40字內）\u003c/h2>\n\u003cp>先分清當老闆、當出借者與共同買一籃資產。\u003c/p>\n\u003cp>\u003cstrong>先備知識\u003c/strong>：\u003ca href=\"reader.html?doc=wiki/02-inflation-and-compound-interest.md\">本金、利息與利率\u003c/a>。本課依序辨認身分，再辨認包裝，暫不比較哪個較適合自己。\u003c/p>\n\u003cp>【來源內容】以下為依來源轉述的基本關係；「出借者」的白話說明另見生活比喻。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>觀念\u003c/th>\u003cth>白話說明與基本關係\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>股票\u003c/td>\u003ctd>持有公司的一小部分所有權；持有人稱股東。公司分給股東的盈餘叫股利，但不是每年保證有。\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004 pp8–9\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>債券\u003c/td>\u003ctd>發行人依條件籌借資金；持有人是依約請求還本付息的出借者，這種請求關係叫債權，不是公司所有權。付息與還本方式須看條款。\u003ca href=\"reader.html?doc=sources/catalog.md#s007\">S007 壹\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>基金\u003c/td>\u003ctd>許多人集合資金，由管理者按規則投資；持有基金不等於直接成為所投資公司的股東。\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004 p10\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ETF\u003c/td>\u003ctd>可在交易所買賣的基金；交易所是依規則撮合買賣的市場。ETF 是基金的一種，既有追蹤一組市場指標的被動式，也有由管理者主動選擇投資的主動式。\u003ca href=\"reader.html?doc=sources/catalog.md#s003\">S003 Q1–Q3\u003c/a>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"生活化比喻\">生活化比喻\u003c/h2>\n\u003cp>【教學轉譯】股票像合資開飲料店，參與經營成果；債券像按借款約定把錢借給店家。基金像大家湊錢請人依菜單買綜合便當；ETF 則像這種便當還能在指定市場轉手買賣。\u003c/p>\n\u003cp>\u003cstrong>比喻限制\u003c/strong>：股東不保證收到分紅；借據不保證借款人有錢償還。便當比喻只說明集合與交易形式，不代表每個基金或 ETF 都充分分散或不會虧損。\u003c/p>\n\u003ch2 id=\"具體數字小試算\">具體數字小試算\u003c/h2>\n\u003cp>【假設例子】某債券約定借出本金 10,000 元、年利率固定 2%、一年後一次還本並支付一年利息。假設以 10,000 元買入、發行人按約支付，且不提前賣出；忽略稅與費用。\u003c/p>\n\u003col>\n\u003cli>利息 = 10,000 × 0.02 = 200 元。\u003c/li>\n\u003cli>一年後約定收到本金與利息 = 10,000 + 200 = 10,200 元。\u003c/li>\n\u003cli>這是依約計算，不是已確定入帳；對方無法履約付款叫「違約」，可能使實收減少。\u003c/li>\n\u003c/ol>\n\u003cp>本例不適用所有債券：有些分次還本、利率會變動，甚至沒有固定到期日。\u003ca href=\"reader.html?doc=sources/catalog.md#s007\">S007 壹、二\u003c/a>\u003c/p>\n\u003ch2 id=\"新手最常踩的誤區\">新手最常踩的誤區\u003c/h2>\n\u003cul>\n\u003cli>把 ETF 和基金當互不相干的兩類：ETF 屬於基金。\u003c/li>\n\u003cli>看到「債」就以為保本：付款能力與條款仍需確認。\u003c/li>\n\u003cli>認為股票配發股利就是額外保證獲利：還要考慮價格變動，不能只看收到的錢。\u003c/li>\n\u003cli>覺得買基金就不用看：仍要查投資內容、風險與費用。\u003ca href=\"reader.html?doc=sources/catalog.md#s003\">S003 Q8\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"知識網路連結標註上一課與下一課的超連結\">知識網路連結（標註上一課與下一課的超連結）\u003c/h2>\n\u003cul>\n\u003cli>上一課：\u003ca href=\"reader.html?doc=wiki/02-inflation-and-compound-interest.md\">錢為什麼會變多，也可能變少\u003c/a>。\u003c/li>\n\u003cli>下一課：\u003ca href=\"reader.html?doc=wiki/04-diversification-and-allocation.md\">如何避免把風險集中在一起\u003c/a>。\u003c/li>\n\u003cli>【自編練習】哪句話正確？A. ETF 不屬於基金。B. 債券持有人一定是公司的股東。C. 股票每年保證配發股利。D. 一般債券持有人依條件請求還本付息，仍須注意履約風險。\u003c/li>\n\u003cli>先作答，再看\u003ca href=\"reader.html?doc=exercises/03-stocks-bonds-funds-etfs.md\">提示與解析\u003c/a>。\u003c/li>\n\u003c/ul>", "source": "# 股票、債券、基金與 ETF 是什麼\n\n## 一句話白話定義（40字內）\n\n先分清當老闆、當出借者與共同買一籃資產。\n\n**先備知識**：[本金、利息與利率](02-inflation-and-compound-interest.md)。本課依序辨認身分，再辨認包裝，暫不比較哪個較適合自己。\n\n【來源內容】以下為依來源轉述的基本關係；「出借者」的白話說明另見生活比喻。\n\n| 觀念 | 白話說明與基本關係 |\n| --- | --- |\n| 股票 | 持有公司的一小部分所有權；持有人稱股東。公司分給股東的盈餘叫股利，但不是每年保證有。[S004 pp8–9](../sources/catalog.md#s004) |\n| 債券 | 發行人依條件籌借資金；持有人是依約請求還本付息的出借者，這種請求關係叫債權，不是公司所有權。付息與還本方式須看條款。[S007 壹](../sources/catalog.md#s007) |\n| 基金 | 許多人集合資金，由管理者按規則投資；持有基金不等於直接成為所投資公司的股東。[S004 p10](../sources/catalog.md#s004) |\n| ETF | 可在交易所買賣的基金；交易所是依規則撮合買賣的市場。ETF 是基金的一種，既有追蹤一組市場指標的被動式，也有由管理者主動選擇投資的主動式。[S003 Q1–Q3](../sources/catalog.md#s003) |\n\n## 生活化比喻\n\n【教學轉譯】股票像合資開飲料店，參與經營成果；債券像按借款約定把錢借給店家。基金像大家湊錢請人依菜單買綜合便當；ETF 則像這種便當還能在指定市場轉手買賣。\n\n**比喻限制**：股東不保證收到分紅；借據不保證借款人有錢償還。便當比喻只說明集合與交易形式，不代表每個基金或 ETF 都充分分散或不會虧損。\n\n## 具體數字小試算\n\n【假設例子】某債券約定借出本金 10,000 元、年利率固定 2%、一年後一次還本並支付一年利息。假設以 10,000 元買入、發行人按約支付，且不提前賣出；忽略稅與費用。\n\n1. 利息 = 10,000 × 0.02 = 200 元。\n2. 一年後約定收到本金與利息 = 10,000 + 200 = 10,200 元。\n3. 這是依約計算，不是已確定入帳；對方無法履約付款叫「違約」，可能使實收減少。\n\n本例不適用所有債券：有些分次還本、利率會變動，甚至沒有固定到期日。[S007 壹、二](../sources/catalog.md#s007)\n\n## 新手最常踩的誤區\n\n- 把 ETF 和基金當互不相干的兩類：ETF 屬於基金。\n- 看到「債」就以為保本：付款能力與條款仍需確認。\n- 認為股票配發股利就是額外保證獲利：還要考慮價格變動，不能只看收到的錢。\n- 覺得買基金就不用看：仍要查投資內容、風險與費用。[S003 Q8](../sources/catalog.md#s003)\n\n## 知識網路連結（標註上一課與下一課的超連結）\n\n- 上一課：[錢為什麼會變多，也可能變少](02-inflation-and-compound-interest.md)。\n- 下一課：[如何避免把風險集中在一起](04-diversification-and-allocation.md)。\n- 【自編練習】哪句話正確？A. ETF 不屬於基金。B. 債券持有人一定是公司的股東。C. 股票每年保證配發股利。D. 一般債券持有人依條件請求還本付息，仍須注意履約風險。\n- 先作答，再看[提示與解析](../exercises/03-stocks-bonds-funds-etfs.md)。\n"}, "wiki/04-diversification-and-allocation.md": {"title": "如何避免把風險集中在一起", "html": "\u003ch1 id=\"如何避免把風險集中在一起\">如何避免把風險集中在一起\u003c/h1>\n\u003ch2 id=\"一句話白話定義40字內\">一句話白話定義（40字內）\u003c/h2>\n\u003cp>把資金分配到不同風險來源，避免單一損失拖累全部。\u003c/p>\n\u003cp>\u003cstrong>先備知識\u003c/strong>：\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">股票、債券與基金\u003c/a>、百分比。\u003c/p>\n\u003cp>【來源內容】\u003cstrong>依序理解\u003c/strong>：「風險」指結果可能不如預期、甚至損失的可能性；「分散」是減少對同一種風險的集中依賴。「資產配置」是決定各類資產占總資金多少；這些比重合計應為 100%。\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004 pp22、26\u003c/a>\u003c/p>\n\u003ch2 id=\"生活化比喻\">生活化比喻\u003c/h2>\n\u003cp>【教學轉譯】出門可把雨傘、雨衣分別備好；但買三把同款雨傘放在同一個會漏水的袋子裡，未必真的多三層保護。投資也要看背後依賴的東西，而不只數商品名稱。\u003c/p>\n\u003cp>\u003cstrong>比喻限制\u003c/strong>：投資沒有能隔絕所有風險的裝備；即使分散，不同資產仍可能同時下跌。配置是在管理影響，不能保證不賠。\u003c/p>\n\u003cp>【教學轉譯】兩檔基金若大量買同一群公司，商品數量增加，風險來源卻可能仍相近。讀投資內容，不能只因為叫 ETF 就視為已完成分散。\u003ca href=\"reader.html?doc=sources/catalog.md#s003\">S003 Q2、Q8\u003c/a>\u003c/p>\n\u003ch2 id=\"具體數字小試算\">具體數字小試算\u003c/h2>\n\u003cp>【假設例子】總資金 10,000 元，比較同一段期間的兩種組合；A、B 是假設資產，不是商品推薦。A 下跌 20%，B 上漲 10%；忽略稅費、中途買賣與收付。\u003c/p>\n\u003col>\n\u003cli>全部買 A：10,000 × (1 − 0.20) = 8,000 元，損失 2,000 元。\u003c/li>\n\u003cli>一半 A、一半 B：A 剩 5,000 × 0.80 = 4,000 元；B 變成 5,000 × 1.10 = 5,500 元。\u003c/li>\n\u003cli>合計 9,500 元；損失 500 元，損失比例 = 500 ÷ 10,000 = 5%。\u003c/li>\n\u003cli>若 A、B 都下跌 20%，同樣剩 8,000 元。分開買並不保證免損失。\u003c/li>\n\u003c/ol>\n\u003cp>50%／50% 是比較用設定，不是每個人的最佳比例；實際配置須回到目標、期限、能承受的損失及可用資金。\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004 pp22–24\u003c/a>\u003c/p>\n\u003ch2 id=\"新手最常踩的誤區\">新手最常踩的誤區\u003c/h2>\n\u003cul>\n\u003cli>只數商品數，不看內容重疊。\u003c/li>\n\u003cli>誤以為分散後不會跌：共同的市場變化仍可能同時影響它們。\u003c/li>\n\u003cli>把例題配置直接照抄到自己帳戶。\u003c/li>\n\u003cli>因某資產漲了而不知比例已改變：可先檢視是否偏離原計畫，調整還需考慮費用。\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004 p27\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"知識網路連結標註上一課與下一課的超連結\">知識網路連結（標註上一課與下一課的超連結）\u003c/h2>\n\u003cul>\n\u003cli>上一課：\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">股票、債券、基金與 ETF 是什麼\u003c/a>。\u003c/li>\n\u003cli>下一課：\u003ca href=\"reader.html?doc=wiki/05-first-financial-plan.md\">建立自己的第一份理財計畫\u003c/a>。\u003c/li>\n\u003cli>【自編練習】6,000 元放 A、4,000 元放 B；同一期間 A 跌 10%、B 不變，無其他收付及費用，合計剩多少？A. 9,000 元　B. 9,400 元　C. 10,000 元　D. 10,600 元。\u003c/li>\n\u003cli>先作答，再看\u003ca href=\"reader.html?doc=exercises/04-diversification-and-allocation.md\">提示與解析\u003c/a>。\u003c/li>\n\u003c/ul>", "source": "# 如何避免把風險集中在一起\n\n## 一句話白話定義（40字內）\n\n把資金分配到不同風險來源，避免單一損失拖累全部。\n\n**先備知識**：[股票、債券與基金](03-stocks-bonds-funds-etfs.md)、百分比。\n\n【來源內容】**依序理解**：「風險」指結果可能不如預期、甚至損失的可能性；「分散」是減少對同一種風險的集中依賴。「資產配置」是決定各類資產占總資金多少；這些比重合計應為 100%。[S004 pp22、26](../sources/catalog.md#s004)\n\n## 生活化比喻\n\n【教學轉譯】出門可把雨傘、雨衣分別備好；但買三把同款雨傘放在同一個會漏水的袋子裡，未必真的多三層保護。投資也要看背後依賴的東西，而不只數商品名稱。\n\n**比喻限制**：投資沒有能隔絕所有風險的裝備；即使分散，不同資產仍可能同時下跌。配置是在管理影響，不能保證不賠。\n\n【教學轉譯】兩檔基金若大量買同一群公司，商品數量增加，風險來源卻可能仍相近。讀投資內容，不能只因為叫 ETF 就視為已完成分散。[S003 Q2、Q8](../sources/catalog.md#s003)\n\n## 具體數字小試算\n\n【假設例子】總資金 10,000 元，比較同一段期間的兩種組合；A、B 是假設資產，不是商品推薦。A 下跌 20%，B 上漲 10%；忽略稅費、中途買賣與收付。\n\n1. 全部買 A：10,000 × (1 − 0.20) = 8,000 元，損失 2,000 元。\n2. 一半 A、一半 B：A 剩 5,000 × 0.80 = 4,000 元；B 變成 5,000 × 1.10 = 5,500 元。\n3. 合計 9,500 元；損失 500 元，損失比例 = 500 ÷ 10,000 = 5%。\n4. 若 A、B 都下跌 20%，同樣剩 8,000 元。分開買並不保證免損失。\n\n50%／50% 是比較用設定，不是每個人的最佳比例；實際配置須回到目標、期限、能承受的損失及可用資金。[S004 pp22–24](../sources/catalog.md#s004)\n\n## 新手最常踩的誤區\n\n- 只數商品數，不看內容重疊。\n- 誤以為分散後不會跌：共同的市場變化仍可能同時影響它們。\n- 把例題配置直接照抄到自己帳戶。\n- 因某資產漲了而不知比例已改變：可先檢視是否偏離原計畫，調整還需考慮費用。[S004 p27](../sources/catalog.md#s004)\n\n## 知識網路連結（標註上一課與下一課的超連結）\n\n- 上一課：[股票、債券、基金與 ETF 是什麼](03-stocks-bonds-funds-etfs.md)。\n- 下一課：[建立自己的第一份理財計畫](05-first-financial-plan.md)。\n- 【自編練習】6,000 元放 A、4,000 元放 B；同一期間 A 跌 10%、B 不變，無其他收付及費用，合計剩多少？A. 9,000 元　B. 9,400 元　C. 10,000 元　D. 10,600 元。\n- 先作答，再看[提示與解析](../exercises/04-diversification-and-allocation.md)。\n"}, "wiki/05-first-financial-plan.md": {"title": "建立自己的第一份理財計畫", "html": "\u003ch1 id=\"建立自己的第一份理財計畫\">建立自己的第一份理財計畫\u003c/h1>\n\u003ch2 id=\"一句話白話定義40字內\">一句話白話定義（40字內）\u003c/h2>\n\u003cp>把生活、目標、可承受損失與查核步驟寫成可執行計畫。\u003c/p>\n\u003cp>\u003cstrong>先備知識\u003c/strong>：\u003ca href=\"reader.html?doc=wiki/01-budget-and-emergency-fund.md\">備用金\u003c/a>、\u003ca href=\"reader.html?doc=wiki/02-inflation-and-compound-interest.md\">計息與物價\u003c/a>、\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">工具差異\u003c/a>、\u003ca href=\"reader.html?doc=wiki/04-diversification-and-allocation.md\">分散風險\u003c/a>。\u003c/p>\n\u003cp>【教學轉譯】\u003cstrong>依序執行\u003c/strong>：先記錄收入、生活支出與待還欠款；再寫目標金額及期限，確認備用金、近期用途及可承受損失。最後才決定是否需要投資、如何執行與定期檢視。現在不投入市場，也可以是一份合理計畫。這是依下列來源整理的教學順序。\u003ca href=\"reader.html?doc=sources/catalog.md#s001\">S001\u003c/a>；\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004 pp21–24、34\u003c/a>\u003c/p>\n\u003ch2 id=\"生活化比喻\">生活化比喻\u003c/h2>\n\u003cp>【教學轉譯】像規劃旅行：先知道目的地、出發時間與旅費，保留回家的車錢，再選交通工具；遇到陌生人聲稱「零風險瞬間抵達」，先停下來查證。\u003c/p>\n\u003cp>\u003cstrong>比喻限制\u003c/strong>：投資到達目標的時間與結果不確定，無法保證照時刻表獲利；不必為了趕目標而承擔不了損失。\u003c/p>\n\u003cp>【來源內容】定期定額是約定固定日期與金額投入的安排，仍須看契約、費用及投資內容，不能保證獲利。\u003ca href=\"reader.html?doc=sources/catalog.md#s005\">S005 交易流程與問答\u003c/a>\u003c/p>\n\u003ch2 id=\"具體數字小試算\">具體數字小試算\u003c/h2>\n\u003cp>【假設例子】新臺幣月收入 30,000 元，必要生活費 24,000 元，無待還欠款；每月先補備用金 3,000 元。另有一年後需支付的 24,000 元進修費，從零開始存；忽略利息、稅費及收支變化。\u003c/p>\n\u003col>\n\u003cli>每月為進修目標存：24,000 ÷ 12 = 2,000 元。\u003c/li>\n\u003cli>本月未分配金額：30,000 − 24,000 − 3,000 − 2,000 = 1,000 元。\u003c/li>\n\u003cli>這 1,000 元尚未決定用途，不能直接等同可投資金額；還要盤點其他必要開銷、備用金缺口與近期用途。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>寫成自己的空白計畫\u003c/strong>：每月收入＿＿；必要支出＿＿；欠款與還款安排＿＿；備用金現有／目標＿＿；目標金額／期限＿＿；最多能接受損失＿＿；檢視頻率＿＿。不必在公開網站填真實個資或帳戶資料。\u003c/p>\n\u003ch2 id=\"新手最常踩的誤區\">新手最常踩的誤區\u003c/h2>\n\u003cul>\n\u003cli>為達標假設必定獲利：先以可控制的儲蓄安排試算；不夠就調整金額、期限或收支。\u003c/li>\n\u003cli>只看投入金額，不查費用與契約。\u003ca href=\"reader.html?doc=sources/catalog.md#s005\">S005\u003c/a>\u003c/li>\n\u003cli>相信「保證高報酬、零風險」或假平台顯示的獲利。這些是應停止付款查證的警訊；不要交出帳密、驗證碼或因催促而匯款。由自行找到的官方管道確認，必要時洽 165，不能只相信群組提供的連結。\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004 pp5、17、31–33\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"知識網路連結標註上一課與下一課的超連結\">知識網路連結（標註上一課與下一課的超連結）\u003c/h2>\n\u003cul>\n\u003cli>上一課：\u003ca href=\"reader.html?doc=wiki/04-diversification-and-allocation.md\">如何避免把風險集中在一起\u003c/a>。\u003c/li>\n\u003cli>下一課：本系列結束，回到\u003ca href=\"reader.html?doc=wiki/index.md\">目錄\u003c/a>複習，再依需求補充學習。\u003c/li>\n\u003cli>【自編練習】陌生群組保證「每月高報酬、完全零風險」，並催你當天匯款。哪個做法較合適？A. 先匯小額就代表安全。B. 只看平台獲利截圖便匯款。C. 暫停匯款，另找官方管道查核，必要時洽 165。D. 提供銀行驗證碼讓對方代操作。\u003c/li>\n\u003cli>先作答，再看\u003ca href=\"reader.html?doc=exercises/05-first-financial-plan.md\">提示與解析\u003c/a>。\u003c/li>\n\u003c/ul>", "source": "# 建立自己的第一份理財計畫\n\n## 一句話白話定義（40字內）\n\n把生活、目標、可承受損失與查核步驟寫成可執行計畫。\n\n**先備知識**：[備用金](01-budget-and-emergency-fund.md)、[計息與物價](02-inflation-and-compound-interest.md)、[工具差異](03-stocks-bonds-funds-etfs.md)、[分散風險](04-diversification-and-allocation.md)。\n\n【教學轉譯】**依序執行**：先記錄收入、生活支出與待還欠款；再寫目標金額及期限，確認備用金、近期用途及可承受損失。最後才決定是否需要投資、如何執行與定期檢視。現在不投入市場，也可以是一份合理計畫。這是依下列來源整理的教學順序。[S001](../sources/catalog.md#s001)；[S004 pp21–24、34](../sources/catalog.md#s004)\n\n## 生活化比喻\n\n【教學轉譯】像規劃旅行：先知道目的地、出發時間與旅費，保留回家的車錢，再選交通工具；遇到陌生人聲稱「零風險瞬間抵達」，先停下來查證。\n\n**比喻限制**：投資到達目標的時間與結果不確定，無法保證照時刻表獲利；不必為了趕目標而承擔不了損失。\n\n【來源內容】定期定額是約定固定日期與金額投入的安排，仍須看契約、費用及投資內容，不能保證獲利。[S005 交易流程與問答](../sources/catalog.md#s005)\n\n## 具體數字小試算\n\n【假設例子】新臺幣月收入 30,000 元，必要生活費 24,000 元，無待還欠款；每月先補備用金 3,000 元。另有一年後需支付的 24,000 元進修費，從零開始存；忽略利息、稅費及收支變化。\n\n1. 每月為進修目標存：24,000 ÷ 12 = 2,000 元。\n2. 本月未分配金額：30,000 − 24,000 − 3,000 − 2,000 = 1,000 元。\n3. 這 1,000 元尚未決定用途，不能直接等同可投資金額；還要盤點其他必要開銷、備用金缺口與近期用途。\n\n**寫成自己的空白計畫**：每月收入＿＿；必要支出＿＿；欠款與還款安排＿＿；備用金現有／目標＿＿；目標金額／期限＿＿；最多能接受損失＿＿；檢視頻率＿＿。不必在公開網站填真實個資或帳戶資料。\n\n## 新手最常踩的誤區\n\n- 為達標假設必定獲利：先以可控制的儲蓄安排試算；不夠就調整金額、期限或收支。\n- 只看投入金額，不查費用與契約。[S005](../sources/catalog.md#s005)\n- 相信「保證高報酬、零風險」或假平台顯示的獲利。這些是應停止付款查證的警訊；不要交出帳密、驗證碼或因催促而匯款。由自行找到的官方管道確認，必要時洽 165，不能只相信群組提供的連結。[S004 pp5、17、31–33](../sources/catalog.md#s004)\n\n## 知識網路連結（標註上一課與下一課的超連結）\n\n- 上一課：[如何避免把風險集中在一起](04-diversification-and-allocation.md)。\n- 下一課：本系列結束，回到[目錄](index.md)複習，再依需求補充學習。\n- 【自編練習】陌生群組保證「每月高報酬、完全零風險」，並催你當天匯款。哪個做法較合適？A. 先匯小額就代表安全。B. 只看平台獲利截圖便匯款。C. 暫停匯款，另找官方管道查核，必要時洽 165。D. 提供銀行驗證碼讓對方代操作。\n- 先作答，再看[提示與解析](../exercises/05-first-financial-plan.md)。\n"}, "wiki/index.md": {"title": "零基礎個人投資與理財入門", "html": "\u003ch1 id=\"零基礎個人投資與理財入門\">零基礎個人投資與理財入門\u003c/h1>\n\u003cp>給沒有股市、基金或財經先備知識的大學生與社會新鮮人。先整理生活中的錢，再理解計息、工具與風險，最後寫自己的計畫；沒有要求讀完就必須開始投資。\u003c/p>\n\u003ch2 id=\"依序學習\">依序學習\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>次序\u003c/th>\u003cth>核心條目與摘要\u003c/th>\u003cth>主要依據\u003c/th>\u003cth>自編練習\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>01\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/01-budget-and-emergency-fund.md\">先管好生活中的錢\u003c/a>：收支、結餘與備用金\u003c/td>\u003ctd>S001；S004 p24\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=exercises/01-budget-and-emergency-fund.md\">練習 01\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>02\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/02-inflation-and-compound-interest.md\">錢為什麼會變多，也可能變少\u003c/a>：單利、複利與購買力\u003c/td>\u003ctd>S002；S006 pp11、13\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=exercises/02-inflation-and-compound-interest.md\">練習 02\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>03\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">股票、債券、基金與 ETF 是什麼\u003c/a>：分清所有權、出借與基金\u003c/td>\u003ctd>S003；S004 pp8–10；S007\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=exercises/03-stocks-bonds-funds-etfs.md\">練習 03\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>04\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/04-diversification-and-allocation.md\">如何避免把風險集中在一起\u003c/a>：分散、配置與共同下跌\u003c/td>\u003ctd>S004 pp22–27；S003\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=exercises/04-diversification-and-allocation.md\">練習 04\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>05\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/05-first-financial-plan.md\">建立自己的第一份理財計畫\u003c/a>：生活、目標、執行與防詐\u003c/td>\u003ctd>S001、S004、S005\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=exercises/05-first-financial-plan.md\">練習 05\u003c/a>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"如何使用\">如何使用\u003c/h2>\n\u003cp>每課依序讀定義、生活比喻、數字試算、誤區，先回答課末選擇題，再進入獨立練習檔看提示與解析。各課含數個基礎概念，但按先備順序逐一介紹；本階段是 Markdown 教材，沒有自動判分或進度鎖定功能。\u003c/p>\n\u003ch2 id=\"來源與內容標示\">來源與內容標示\u003c/h2>\n\u003cul>\n\u003cli>【來源內容】：依可查資料轉述；重要主張旁以來源 ID 連結定位。\u003c/li>\n\u003cli>【教學轉譯】：為新手設計的說明或比喻，並列比喻限制。\u003c/li>\n\u003cli>【假設例子】：自行設定的數字與條件，不是歷史績效、現況數據或收益預測。\u003c/li>\n\u003cli>【自編練習】：本專案設計的題目，非來源機構原題。\u003c/li>\n\u003cli>【待確認】：尚未釐清的來源資訊；未驗證內容不得當已知事實。\u003c/li>\n\u003c/ul>\n\u003cp>詳見\u003ca href=\"reader.html?doc=sources/catalog.md\">來源登錄表\u003c/a>及\u003ca href=\"reader.html?doc=wiki/log.md\">匯入日誌\u003c/a>。S004 p25 未附出處的數據停用；S006 p12 誤植算式已隔離。這些未採用內容不作課程結論。\u003c/p>\n\u003ch2 id=\"本階段狀態\">本階段狀態\u003c/h2>\n\u003cp>五篇核心條目與對應練習已建立。八頁\u003ca href=\"reader.html?doc=slides/outline.md\">大綱\u003c/a>、\u003ca href=\"reader.html?doc=slides/source-map.md\">來源對照\u003c/a>、逐頁稿及\u003ca href=\"reader.html?doc=reports/2026-11-19-content-check.md\">內容檢查報告\u003c/a>已獲使用者確認。\u003ca href=\"slides/index.html\">八頁 HTML 簡報\u003c/a>、\u003ca href=\"index.html\">公開入口檔案\u003c/a>與\u003ca href=\"exercises/index.html\">練習頁\u003c/a>已完成本機檢查，結果見\u003ca href=\"reader.html?doc=reports/2026-11-19-release-check.md\">發布檢查報告\u003c/a>。後續已依使用者授權發布 GitHub Pages；可直接使用首頁、可搜尋的 Wiki 閱讀器、流程圖及驗收入口。最新公開實測與作業要求對照見 \u003ca href=\"reader.html?doc=reports/2026-11-19-optimization-check.md\">優化與公開檢查\u003c/a>。\u003c/p>", "source": "# 零基礎個人投資與理財入門\n\n給沒有股市、基金或財經先備知識的大學生與社會新鮮人。先整理生活中的錢，再理解計息、工具與風險，最後寫自己的計畫；沒有要求讀完就必須開始投資。\n\n## 依序學習\n\n| 次序 | 核心條目與摘要 | 主要依據 | 自編練習 |\n| --- | --- | --- | --- |\n| 01 | [先管好生活中的錢](01-budget-and-emergency-fund.md)：收支、結餘與備用金 | S001；S004 p24 | [練習 01](../exercises/01-budget-and-emergency-fund.md) |\n| 02 | [錢為什麼會變多，也可能變少](02-inflation-and-compound-interest.md)：單利、複利與購買力 | S002；S006 pp11、13 | [練習 02](../exercises/02-inflation-and-compound-interest.md) |\n| 03 | [股票、債券、基金與 ETF 是什麼](03-stocks-bonds-funds-etfs.md)：分清所有權、出借與基金 | S003；S004 pp8–10；S007 | [練習 03](../exercises/03-stocks-bonds-funds-etfs.md) |\n| 04 | [如何避免把風險集中在一起](04-diversification-and-allocation.md)：分散、配置與共同下跌 | S004 pp22–27；S003 | [練習 04](../exercises/04-diversification-and-allocation.md) |\n| 05 | [建立自己的第一份理財計畫](05-first-financial-plan.md)：生活、目標、執行與防詐 | S001、S004、S005 | [練習 05](../exercises/05-first-financial-plan.md) |\n\n## 如何使用\n\n每課依序讀定義、生活比喻、數字試算、誤區，先回答課末選擇題，再進入獨立練習檔看提示與解析。各課含數個基礎概念，但按先備順序逐一介紹；本階段是 Markdown 教材，沒有自動判分或進度鎖定功能。\n\n## 來源與內容標示\n\n- 【來源內容】：依可查資料轉述；重要主張旁以來源 ID 連結定位。\n- 【教學轉譯】：為新手設計的說明或比喻，並列比喻限制。\n- 【假設例子】：自行設定的數字與條件，不是歷史績效、現況數據或收益預測。\n- 【自編練習】：本專案設計的題目，非來源機構原題。\n- 【待確認】：尚未釐清的來源資訊；未驗證內容不得當已知事實。\n\n詳見[來源登錄表](../sources/catalog.md)及[匯入日誌](log.md)。S004 p25 未附出處的數據停用；S006 p12 誤植算式已隔離。這些未採用內容不作課程結論。\n\n## 本階段狀態\n\n五篇核心條目與對應練習已建立。八頁[大綱](../slides/outline.md)、[來源對照](../slides/source-map.md)、逐頁稿及[內容檢查報告](../reports/2026-11-19-content-check.md)已獲使用者確認。[八頁 HTML 簡報](../slides/index.html)、[公開入口檔案](../index.html)與[練習頁](../exercises/index.html)已完成本機檢查，結果見[發布檢查報告](../reports/2026-11-19-release-check.md)。後續已依使用者授權發布 GitHub Pages；可直接使用首頁、可搜尋的 Wiki 閱讀器、流程圖及驗收入口。最新公開實測與作業要求對照見 [優化與公開檢查](../reports/2026-11-19-optimization-check.md)。\n"}, "wiki/log.md": {"title": "執行與檢查紀錄", "html": "\u003ch1 id=\"執行與檢查紀錄\">執行與檢查紀錄\u003c/h1>\n\u003cp>時間一律採 Asia/Taipei（UTC+08:00）。既有來源登錄內容原在對話輸出，本次才落地成專案檔案；不將回填紀錄冒充當時已存在的檔案。\u003c/p>\n\u003ch2 id=\"step-3來源登錄回填\">Step 3：來源登錄回填\u003c/h2>\n\u003cul>\n\u003cli>查閱起始：2026-11-19 00:38:16 +08:00；PDF 視覺查核截至 00:41:39 +08:00。\u003c/li>\n\u003cli>工作：登錄 S001–S005，閱讀 HTML 與 S004 PDF；建立來源定位及缺口紀錄。\u003c/li>\n\u003cli>已知缺口：完整單利／複利、債券基本條件、防詐定位待補查。\u003c/li>\n\u003cli>未核實：S004 p25 數據；固定比例及制度細節不進入教學主張。\u003c/li>\n\u003cli>可讀性限制：未操作線上試算器，未逐圖檢查所有來源頁面。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"step-4人工確認與缺口補強\">Step 4：人工確認與缺口補強\u003c/h2>\n\u003cul>\n\u003cli>開始查核：2026-11-19 00:46:34 +08:00。\u003c/li>\n\u003cli>人工確認：使用者本次訊息確認採用 S001–S005，停用 S004 p25「超過90%」，並授權必要時增加 S006、S007；不另虛構使用者確認訊息的精確發送時間。\u003c/li>\n\u003cli>S004：補讀 pp1–21、28–35 抽取文字；股票所有權見 pp8–9；防詐見 p17、pp31–33；單利／複利與債券條件仍不完整。\u003c/li>\n\u003cli>S006：43 頁 PDF 可讀；採 pp11、13 計息定義；p12 視覺查核發現百分比誤植，隔離原算式與未追溯名人引言，自行推導並驗算新例子。\u003c/li>\n\u003cli>S007：搜尋瀏覽工具回應 403；直接 HTTPS 取得公開 HTML，實讀定義與發行條件，補足債券的利息及還本條件差異。\u003c/li>\n\u003cli>新增來源屬使用者授權補強；不聲稱 S006、S007 已另經人工逐篇審閱。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"本次匯入內容\">本次匯入內容\u003c/h2>\n\u003cul>\n\u003cli>sources/catalog.md：7 份來源、定位、日期、範圍、處理與權利狀態。\u003c/li>\n\u003cli>notes/：7 份閱讀筆記；S004 指定頁面補查及 S006 錯誤隔離。\u003c/li>\n\u003cli>wiki/：5 篇核心條目；index.md 全站導覽；本日誌。\u003c/li>\n\u003cli>exercises/：5 題含提示、答案、步驟及錯誤選項診斷。\u003c/li>\n\u003cli>原始 PDF、暫存 HTML、API 金鑰、個人帳戶與真實財務資料未放入本專案交付範圍。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"檢查結果\">檢查結果\u003c/h2>\n\u003cul>\n\u003cli>檢查時間：2026-11-19 00:59:41 +08:00 起；實際完成時間見下方結案紀錄。\u003c/li>\n\u003cli>結構檢查通過：5 篇條目各 1 個一級標題、5 個固定二級標題，順序正確；定義分別 23、23、20、24、25 字，均未超過 40 字。\u003c/li>\n\u003cli>檔案及連結檢查通過：20 份 Markdown 檔、86 個本機相對連結，目標存在；來源 ID 錨點可對應。\u003c/li>\n\u003cli>8 項試算檢查通過：結餘、備用金期數、2%／3% 複利、債息、兩組配置、計畫餘額；均與正文一致。\u003c/li>\n\u003cli>Wiki 未出現直接標示的題目答案；5 題均有獨立提示、逐步解析、錯誤選項說明與返回連結。\u003c/li>\n\u003cli>追加的題幹比對第一次因 Wiki 選項同列、練習選項分行的格式差異而未通過；改為抽取題幹比對後，5 題一致。此為檢查方式修正，未改題目以掩蓋錯誤。\u003c/li>\n\u003cli>人工閱讀檢查：題目僅用各課已介紹的觀念；備用金完整月份判斷已補入正文；術語首次出現附白話解釋，比喻均列限制，試算均列假設。\u003c/li>\n\u003cli>隔離檢查通過：五篇課文不使用停用數據；S006 誤植只在來源筆記與登錄表揭露，不作正確算式。\u003c/li>\n\u003cli>範圍檢查通過：未產生 HTML，未進行交易、公開發布或提交作業。未宣稱已做網站互動或瀏覽器渲染驗收。\u003c/li>\n\u003cli>殘餘限制：部分來源發布日不明；S006 誤植更正版未確認。這些限制已標示且不作教學事實依據。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"停止點\">停止點\u003c/h2>\n\u003cp>本階段僅完成正式匯入。未建立簡報大綱／來源對照表，未產生 HTML，等待使用者下一指令。\u003c/p>\n\u003cp>結案記錄時間：2026-11-19 01:00:12 +08:00。交付包含分檔 Markdown、依序合併的完整檔案內容與壓縮包；尚未上傳 GitHub。\u003c/p>\n\u003ch2 id=\"step-5前移檢查閘門八頁大綱與來源對照\">Step 5：前移檢查閘門—八頁大綱與來源對照\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>開始時間\u003c/strong>：2026-11-19 01:03:19 +08:00（Asia/Taipei）。\u003c/li>\n\u003cli>\u003cstrong>生成與首輪檢查完成時間\u003c/strong>：2026-11-19 01:07:29 +08:00。\u003c/li>\n\u003cli>\u003cstrong>人工輸入／確認\u003c/strong>：使用者本次訊息已確認 Step 4 的 20 份 Markdown、S001–S007 與 S006 算式隔離；只授權建立大綱、來源對照表及追加日誌，不等於批准簡報逐頁稿。\u003c/li>\n\u003cli>\u003cstrong>本輪輸出\u003c/strong>：slides/outline.md、slides/source-map.md；本檔只追加，保留前階段歷史紀錄。\u003c/li>\n\u003cli>\u003cstrong>規則核對限制\u003c/strong>：本機沒有本專案 AGENTS.md，不能聲稱逐字核對完整第 9.3、9.4 節。本次依使用者明列的十欄、固定八頁、120 字預算與人工閘門，以及既有對話規則執行；八頁頁序列入待審項，不擅稱已獲人工確認。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"前移檢查結果\">前移檢查結果\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>項目\u003c/th>\u003cth>執行方式與結果\u003c/th>\u003cth>狀態\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>輸入範圍\u003c/td>\u003ctd>重讀五篇 Wiki、目錄及 catalog；未引入新的外部內容或修改已驗收課文\u003c/td>\u003ctd>通過\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>頁數與欄位\u003c/td>\u003ctd>結構檢查：恰為第 1–8 頁，每頁十欄，共 80 欄，且每頁最多三重點\u003c/td>\u003ctd>通過\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>教學順序\u003c/td>\u003ctd>逐頁閱讀，確認收支→物價／計息→工具→分散→計畫；百分比於計息頁複習\u003c/td>\u003ctd>內容檢查通過，待使用者確認頁序\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>術語與先備\u003c/td>\u003ctd>每頁列首見詞義及先備；不引入本益比、夏普值等課外術語\u003c/td>\u003ctd>內容檢查通過\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Wiki 範圍與追溯\u003c/td>\u003ctd>來源表逐列對照 21 項主張，覆蓋八頁、五篇 Wiki、S001–S007；教學轉譯不冒充官方原句\u003c/td>\u003ctd>內容檢查通過\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>比喻、圖表與數字\u003c/td>\u003ctd>規劃皆標概念示意／假設模擬，保留限制與單位；未產生圖像或圖表程式\u003c/td>\u003ctd>規劃檢查通過\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>算術\u003c/td>\u003ctd>6 組檢查涵蓋備用金、購買力比較、單利、複利、分散及同跌情境，與 Wiki 一致\u003c/td>\u003ctd>通過\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>正文預算\u003c/td>\u003ctd>八頁預估 80、115、95、115、115、100、115、115 字，皆不超過 120；條件與限制不可藏入圖表標籤\u003c/td>\u003ctd>預算通過；實際逐頁稿字數待後階段\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>相對連結\u003c/td>\u003ctd>兩份新文件共 66 個相對連結；目標檔存在，來源 ID 錨點對應\u003c/td>\u003ctd>通過\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>排除資料\u003c/td>\u003ctd>未將 S004 p25 停用數據、S006 p12 誤植或未核實引言作為教學內容；未加入推薦商品與現況績效\u003c/td>\u003ctd>通過\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>人工閘門\u003c/td>\u003ctd>明確標記第 9.4 節「待使用者明確確認」；不以結構檢查取代人工審閱\u003c/td>\u003ctd>等待確認，尚未通過\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>越階檢查\u003c/td>\u003ctd>專案內沒有 slides/drafts/ 或 HTML，未公開發布、未提交作業\u003c/td>\u003ctd>通過\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"本階段尚未完成或不作的檢查\">本階段尚未完成或不作的檢查\u003c/h3>\n\u003cul>\n\u003cli>尚無逐頁稿，因此不宣稱已完成實際正文精確字數、閱讀時間或最終版面驗收。\u003c/li>\n\u003cli>沒有渲染簡報，也未進行瀏覽器互動測試；本輪只檢查規劃文件。\u003c/li>\n\u003cli>主張的語意對照是逐列閱讀檢查，不宣稱由程式完整證明。\u003c/li>\n\u003cli>未重新查核來源網站是否改版；本輪使用已驗收資料，不新增金融事實。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"第-94-節停止點\">第 9.4 節停止點\u003c/h3>\n\u003cp>\u003cstrong>狀態：等待使用者明確確認八頁大綱與來源對照，人工審核尚未通過。\u003c/strong>\u003c/p>\n\u003cp>未建立逐頁稿、slides/drafts/、最終 HTML 或替代形式的逐頁成稿。若使用者要求修改，先修訂大綱及來源表，再重新檢查並等待明確確認；不能自行把沉默當批准。\u003c/p>\n\u003ch2 id=\"step-6人工閘門通過與逐頁稿\">Step 6：人工閘門通過與逐頁稿\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>確認登錄起始時間\u003c/strong>：2026-11-19 01:10:54 +08:00（Asia/Taipei；是開始處理此訊息的操作時間，不冒充訊息發送時間）。\u003c/li>\n\u003cli>\u003cstrong>第 9.4 節人工審核\u003c/strong>：使用者本輪明確確認八頁大綱及來源表，逐項確認頁數、認知順序、Wiki 範圍、詞義、來源與數字、資訊量及練習範圍，正式通過人工閘門。\u003c/li>\n\u003cli>\u003cstrong>授權範圍\u003c/strong>：補根目錄規則、八份逐頁稿、獨立內容檢查流程、報告、日誌與更新包。未授權 HTML 或發布。\u003c/li>\n\u003cli>\u003cstrong>規則落地\u003c/strong>：新增 AGENTS.md，完整彙整對話已確認要求及本次指定節次，後續可核對實體規則。先前沒有可取得的舊版完整全文，因此明列「非舊稿逐字復原」版本限制；不冒稱解除逐字舊稿核驗的限制。\u003c/li>\n\u003cli>\u003cstrong>初稿與修正\u003c/strong>：第一輪八頁字數為 114、151、128、177、129、122、169、141；第 2–8 頁超過 120。保留初稿正文及原因於內容報告，第二輪壓縮重複內容，第三輪處理預告詞義、小數說明及白話用語。沒有把必要假設移到圖表標籤規避上限。\u003c/li>\n\u003cli>\u003cstrong>查核分工說明\u003c/strong>：同一助手先撰稿，再以另行讀檔、計數、算術核對及語意清單執行分階段自我檢查；沒有第二位人員或另一模型外部審稿，不冒稱獨立外審。\u003c/li>\n\u003cli>\u003cstrong>核准文件維護\u003c/strong>：outline.md、source-map.md 僅更新閘門／階段說明；八頁規劃與原 21 列主張表未改。wiki/index.md 同步目前狀態，五篇核心 Wiki、七份閱讀筆記及練習保持原內容。\u003c/li>\n\u003cli>\u003cstrong>最終結果\u003c/strong>：見本階段結案紀錄及 reports/2026-11-19-content-check.md；此處不預填尚未執行的檢查結果。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"step-6-內容檢查結案\">Step 6 內容檢查結案\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>完成內容檢查時間\u003c/strong>：2026-11-19 01:22:00 +08:00。\u003c/li>\n\u003cli>\u003cstrong>最終正文\u003c/strong>：第 01–08 頁依序 103、100、103、115、109、105、101、108 字；採含標點、數字、英文字母的保守算法。八頁均小於等於 120 字，各一個主要目標及三個主要重點。\u003c/li>\n\u003cli>\u003cstrong>內容報告\u003c/strong>：reports/2026-11-19-content-check.md 已建立，分列字數、詞義先備、數字與來源、圖表規格、初稿問題與修正；附八頁初稿及最終正文作證據。\u003c/li>\n\u003cli>\u003cstrong>算術／來源檢查\u003c/strong>：10 項算術比較通過；逐頁主張回查核准 Wiki 與來源表，未加商品建議或未匯入金融內容；停用資料未帶入。\u003c/li>\n\u003cli>\u003cstrong>檔案檢查\u003c/strong>：32 份 Markdown，219 個相對連結目標可達；報告最終正文與八份稿一致；大綱仍為八頁，來源表仍為 21 列。\u003c/li>\n\u003cli>\u003cstrong>輸入保護\u003c/strong>：18 份既有來源／筆記／練習／核心 Wiki 內容雜湊一致。第一次篩選因 Windows 分隔符差異選到 0 檔，修正並強制檢查數量為 18 後全數核對通過；問題已記於報告。\u003c/li>\n\u003cli>\u003cstrong>規則檔狀態\u003c/strong>：AGENTS.md 已實際落地；解除「沒有實體規則可讀」限制。因早期完整逐字稿不可得，不宣稱與舊稿逐字相同；這一版本限制仍保留供使用者審閱。\u003c/li>\n\u003cli>\u003cstrong>圖表與範圍\u003c/strong>：八頁均有未來 SVG 的標題、軸／單位或不適用理由、圖例、資料、類型、文字及替代描述規格；未產生 SVG 或 HTML，未渲染、未公開、未提交。\u003c/li>\n\u003cli>\u003cstrong>下一停止點\u003c/strong>：等使用者確認內容報告及新稿，並下達 Step 7。大綱閘門已通過不代表本輪逐頁稿已獲人工驗收；不得自行繼續 HTML。\u003c/li>\n\u003cli>\u003cstrong>封裝查核時間\u003c/strong>：2026-11-19 01:22:40 +08:00。更新完整包包含 32 份 Markdown，ZIP 完整性檢查通過；另提供八頁逐頁稿合併閱讀副本。此筆封裝紀錄寫入後重新封裝並核對封裝內各檔與本機一致。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"step-7html-成品與交付檢查\">Step 7：HTML 成品與交付檢查\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>開始時間\u003c/strong>：2026-11-19 01:24:46 +08:00（Asia/Taipei，操作時間，非訊息發送時間）。\u003c/li>\n\u003cli>\u003cstrong>人工授權\u003c/strong>：使用者本輪明確確認八份逐頁稿與內容報告，授權製作八頁 HTML、入口、README、排除規則、發布報告、日誌與完整包；並要求 GitHub Pages 公開測試待其上傳後親自驗證。\u003c/li>\n\u003cli>\u003cstrong>交付清單\u003c/strong>：slides/index.html、根目錄 index.html、README.md、.gitignore、.nojekyll、exercises/index.html、reports/2026-11-19-release-check.md、reports/browser-check.json、三張驗收截圖及本日誌；保留先前來源、Wiki、練習、核准稿與報告。\u003c/li>\n\u003cli>\u003cstrong>規則核對\u003c/strong>：原實體 AGENTS.md 只有第 1–10 節，本次按使用者明列規格增補第 11 節公開排除與第 12 節如實驗收；不是聲稱早期原稿本來就有可核對的完整兩節。\u003c/li>\n\u003cli>\u003cstrong>內容鎖定\u003c/strong>：HTML 三點正文與每份核准稿逐字比對；字數仍為 103、100、103、115、109、105、101、108，未新增第九頁或金融知識。\u003c/li>\n\u003cli>\u003cstrong>圖表\u003c/strong>：依八份稿實作八張原生 SVG；均具標題、替代描述、類型與 Wiki 標示、圖例、單位／無軸理由。數字圖表不當歷史績效，關係圖不虛構座標。\u003c/li>\n\u003cli>\u003cstrong>本機預覽問題與恢復\u003c/strong>：一般權限的 loopback 預覽起初連線逾時，本機讀取亦回應通訊端權限限制；在允許的執行環境重新啟動僅綁 127.0.0.1 的服務後，Chrome 成功載入。未修改防火牆或降低安全設定。\u003c/li>\n\u003cli>\u003cstrong>桌面與手機驗收\u003c/strong>：1536×960、390×844 各八頁，DOM 邊界與代表截圖檢查通過；方向鍵左右、空白鍵、下一頁按鈕及末頁停留通過；首頁練習卡片與首題解析展開可用。記錄於 browser-check.json。\u003c/li>\n\u003cli>\u003cstrong>檢查工具調整\u003c/strong>：唯讀瀏覽器介面不提供 getBBox，改用渲染後 DOM 邊界檢查。靜態檢查由要求「圖例／單位」字面，改核對第 3 頁已有的兩分類／填紋與第 3、7 頁元單位。未為通過檢查改寫核准內容。\u003c/li>\n\u003cli>\u003cstrong>範圍界線\u003c/strong>：未上傳 GitHub、未建立或測試公開網址。此處本機結果不能當作線上部署結果，待使用者上傳後親自驗證。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"step-37-客觀工程反思供作業說明\">Step 3–7 客觀工程反思（供作業說明）\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>來源能開啟不代表概念已完整。\u003c/strong> S004 重讀指定頁面後，股票與防詐定位可補齊，但完整計息及債券條件仍不足，所以增列 S006、S007，而非用熟悉常識填空。證據見 notes/s004-reading.md。\u003c/li>\n\u003cli>\u003cstrong>網站工具讀取失敗，應改變取證方法並保留限制。\u003c/strong> 可核實紀錄是 S007 搜尋瀏覽工具回應 403，後改以一般 HTTPS 取得並實讀公開正文。不得把搜尋摘要冒充全文，也不把使用者舉例的事件名稱當成已查證事實。S004 本次保留的是 PDF 取得、抽取與指定頁面補查紀錄，不新增未能核對的逾時細節。\u003c/li>\n\u003cli>\u003cstrong>公信力來源仍可能有誤植。\u003c/strong> S006 p12 的「×1.05%」與結果不符，抽取文字後又渲染原頁核對，確定問題確在教材；採 pp11、13 定義，自編 2% 例子驗算。S004 p25 未附出處數據也按使用者確認停用。這些隔離決定一直帶到成品，沒有在後續生成時遺忘。\u003c/li>\n\u003cli>\u003cstrong>大綱字數預算不等於成稿合規。\u003c/strong> Step 6 首稿有七頁超限，介於 122–177 字；依紀錄壓縮重複解釋，保留假設與警語，再複檢詞義及 0.02。最後八頁全部小於等於 120 字；完整初稿與修正保存在內容報告，不只展示最後通過。\u003c/li>\n\u003cli>\u003cstrong>檢查器也需要驗證。\u003c/strong> Step 6 路徑分隔符造成受保護輸入選到 0 檔，改加數量條件才正確核對 18 檔。Step 7 又發現單靠「圖例」字串無法判斷真實圖例，必須查分類、線型與單位。自動檢查不能取代語意閱讀與畫面檢視。\u003c/li>\n\u003cli>\u003cstrong>先鎖內容，再做呈現，才能避免壓版面時偷改教材。\u003c/strong> 成品正文直接從核准稿帶入，26 份核准輸入雜湊比對未改；版面用依視窗縮放及兩欄／上下排列處理，沒有刪掉風險提醒或加新財經例子。\u003c/li>\n\u003cli>\u003cstrong>交付檔與公開部署是不同驗收層。\u003c/strong> 本機八頁與練習可用、ZIP 可下載，不代表助教已能從公開網址觀看。本次依使用者要求保留 Pages 待辦，沒有以本機截圖虛構上線證據。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"step-7-最終狀態\">Step 7 最終狀態\u003c/h3>\n\u003cp>內容與程式查核完成，發布報告列明真實結果與限制。最後的連結數、秘密排除與封裝完成時間在下方追加；公開網址實測仍為待辦。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>最終檔案查核時間\u003c/strong>：2026-11-19 01:40:13 +08:00。八頁／八張 SVG、三點正文與核准稿一致、JavaScript 語法與 SVG XML 解析通過；306 個相對連結無缺檔；26 份核准輸入未改。\u003c/li>\n\u003cli>\u003cstrong>公開排除查核\u003c/strong>：交付文字未命中常見金鑰／私鑰標記或本機使用者絕對路徑，未包含 .env、原始教材、私人筆記或憑證；四個代表私人路徑經 Git 忽略規則檢查會排除。\u003c/li>\n\u003cli>\u003cstrong>交付方式\u003c/strong>：提供完整更新 ZIP、三份 HTML 與文件的完整程式碼合併閱讀檔，沒有省略程式區塊。本機預覽服務於驗收後關閉；實體檔案可直接開啟。\u003c/li>\n\u003cli>\u003cstrong>公開狀態\u003c/strong>：本輪未上傳 Repository 或 Pages，無公開網址測試結果；待使用者上傳後親自確認，不能以 ZIP 交付推論已公開。\u003c/li>\n\u003cli>\u003cstrong>封裝驗證完成\u003c/strong>：2026-11-19 01:41:13 +08:00。完整包共 43 檔，含三份完整 HTML、34 份 Markdown、三張畫面、瀏覽器查核 JSON、.gitignore 與 .nojekyll；ZIP 完整性及每檔位元組比對通過。本筆紀錄納入後重新產出完整程式碼閱讀檔與 ZIP，再核對封裝與本機一致。狀態停在本機交付完成、公開網址待驗證。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"後續優化與公開驗證2026-11-19asiataipei\">後續優化與公開驗證（2026-11-19，Asia/Taipei）\u003c/h2>\n\u003cp>使用者授權完成公開發布後，已建立 GitHub Repository、啟用 main 根目錄 Pages，並實際開啟公開網站。前階段未發布狀態保留為歷史紀錄。新增可搜尋 Wiki 閱讀器、流程圖、驗收入口；八頁正文保持核准稿。實測項目、六項作業要求對照及限制見 \u003ca href=\"reader.html?doc=reports/2026-11-19-optimization-check.md\">優化與公開檢查\u003c/a>。COOL 只準備草稿，不自動按最終繳交。\u003c/p>", "source": "# 執行與檢查紀錄\n\n時間一律採 Asia/Taipei（UTC+08:00）。既有來源登錄內容原在對話輸出，本次才落地成專案檔案；不將回填紀錄冒充當時已存在的檔案。\n\n## Step 3：來源登錄回填\n\n- 查閱起始：2026-11-19 00:38:16 +08:00；PDF 視覺查核截至 00:41:39 +08:00。\n- 工作：登錄 S001–S005，閱讀 HTML 與 S004 PDF；建立來源定位及缺口紀錄。\n- 已知缺口：完整單利／複利、債券基本條件、防詐定位待補查。\n- 未核實：S004 p25 數據；固定比例及制度細節不進入教學主張。\n- 可讀性限制：未操作線上試算器，未逐圖檢查所有來源頁面。\n\n## Step 4：人工確認與缺口補強\n\n- 開始查核：2026-11-19 00:46:34 +08:00。\n- 人工確認：使用者本次訊息確認採用 S001–S005，停用 S004 p25「超過90%」，並授權必要時增加 S006、S007；不另虛構使用者確認訊息的精確發送時間。\n- S004：補讀 pp1–21、28–35 抽取文字；股票所有權見 pp8–9；防詐見 p17、pp31–33；單利／複利與債券條件仍不完整。\n- S006：43 頁 PDF 可讀；採 pp11、13 計息定義；p12 視覺查核發現百分比誤植，隔離原算式與未追溯名人引言，自行推導並驗算新例子。\n- S007：搜尋瀏覽工具回應 403；直接 HTTPS 取得公開 HTML，實讀定義與發行條件，補足債券的利息及還本條件差異。\n- 新增來源屬使用者授權補強；不聲稱 S006、S007 已另經人工逐篇審閱。\n\n## 本次匯入內容\n\n- sources/catalog.md：7 份來源、定位、日期、範圍、處理與權利狀態。\n- notes/：7 份閱讀筆記；S004 指定頁面補查及 S006 錯誤隔離。\n- wiki/：5 篇核心條目；index.md 全站導覽；本日誌。\n- exercises/：5 題含提示、答案、步驟及錯誤選項診斷。\n- 原始 PDF、暫存 HTML、API 金鑰、個人帳戶與真實財務資料未放入本專案交付範圍。\n\n## 檢查結果\n\n- 檢查時間：2026-11-19 00:59:41 +08:00 起；實際完成時間見下方結案紀錄。\n- 結構檢查通過：5 篇條目各 1 個一級標題、5 個固定二級標題，順序正確；定義分別 23、23、20、24、25 字，均未超過 40 字。\n- 檔案及連結檢查通過：20 份 Markdown 檔、86 個本機相對連結，目標存在；來源 ID 錨點可對應。\n- 8 項試算檢查通過：結餘、備用金期數、2%／3% 複利、債息、兩組配置、計畫餘額；均與正文一致。\n- Wiki 未出現直接標示的題目答案；5 題均有獨立提示、逐步解析、錯誤選項說明與返回連結。\n- 追加的題幹比對第一次因 Wiki 選項同列、練習選項分行的格式差異而未通過；改為抽取題幹比對後，5 題一致。此為檢查方式修正，未改題目以掩蓋錯誤。\n- 人工閱讀檢查：題目僅用各課已介紹的觀念；備用金完整月份判斷已補入正文；術語首次出現附白話解釋，比喻均列限制，試算均列假設。\n- 隔離檢查通過：五篇課文不使用停用數據；S006 誤植只在來源筆記與登錄表揭露，不作正確算式。\n- 範圍檢查通過：未產生 HTML，未進行交易、公開發布或提交作業。未宣稱已做網站互動或瀏覽器渲染驗收。\n- 殘餘限制：部分來源發布日不明；S006 誤植更正版未確認。這些限制已標示且不作教學事實依據。\n\n## 停止點\n\n本階段僅完成正式匯入。未建立簡報大綱／來源對照表，未產生 HTML，等待使用者下一指令。\n\n結案記錄時間：2026-11-19 01:00:12 +08:00。交付包含分檔 Markdown、依序合併的完整檔案內容與壓縮包；尚未上傳 GitHub。\n\n## Step 5：前移檢查閘門—八頁大綱與來源對照\n\n- **開始時間**：2026-11-19 01:03:19 +08:00（Asia/Taipei）。\n- **生成與首輪檢查完成時間**：2026-11-19 01:07:29 +08:00。\n- **人工輸入／確認**：使用者本次訊息已確認 Step 4 的 20 份 Markdown、S001–S007 與 S006 算式隔離；只授權建立大綱、來源對照表及追加日誌，不等於批准簡報逐頁稿。\n- **本輪輸出**：slides/outline.md、slides/source-map.md；本檔只追加，保留前階段歷史紀錄。\n- **規則核對限制**：本機沒有本專案 AGENTS.md，不能聲稱逐字核對完整第 9.3、9.4 節。本次依使用者明列的十欄、固定八頁、120 字預算與人工閘門，以及既有對話規則執行；八頁頁序列入待審項，不擅稱已獲人工確認。\n\n### 前移檢查結果\n\n| 項目 | 執行方式與結果 | 狀態 |\n| --- | --- | --- |\n| 輸入範圍 | 重讀五篇 Wiki、目錄及 catalog；未引入新的外部內容或修改已驗收課文 | 通過 |\n| 頁數與欄位 | 結構檢查：恰為第 1–8 頁，每頁十欄，共 80 欄，且每頁最多三重點 | 通過 |\n| 教學順序 | 逐頁閱讀，確認收支→物價／計息→工具→分散→計畫；百分比於計息頁複習 | 內容檢查通過，待使用者確認頁序 |\n| 術語與先備 | 每頁列首見詞義及先備；不引入本益比、夏普值等課外術語 | 內容檢查通過 |\n| Wiki 範圍與追溯 | 來源表逐列對照 21 項主張，覆蓋八頁、五篇 Wiki、S001–S007；教學轉譯不冒充官方原句 | 內容檢查通過 |\n| 比喻、圖表與數字 | 規劃皆標概念示意／假設模擬，保留限制與單位；未產生圖像或圖表程式 | 規劃檢查通過 |\n| 算術 | 6 組檢查涵蓋備用金、購買力比較、單利、複利、分散及同跌情境，與 Wiki 一致 | 通過 |\n| 正文預算 | 八頁預估 80、115、95、115、115、100、115、115 字，皆不超過 120；條件與限制不可藏入圖表標籤 | 預算通過；實際逐頁稿字數待後階段 |\n| 相對連結 | 兩份新文件共 66 個相對連結；目標檔存在，來源 ID 錨點對應 | 通過 |\n| 排除資料 | 未將 S004 p25 停用數據、S006 p12 誤植或未核實引言作為教學內容；未加入推薦商品與現況績效 | 通過 |\n| 人工閘門 | 明確標記第 9.4 節「待使用者明確確認」；不以結構檢查取代人工審閱 | 等待確認，尚未通過 |\n| 越階檢查 | 專案內沒有 slides/drafts/ 或 HTML，未公開發布、未提交作業 | 通過 |\n\n### 本階段尚未完成或不作的檢查\n\n- 尚無逐頁稿，因此不宣稱已完成實際正文精確字數、閱讀時間或最終版面驗收。\n- 沒有渲染簡報，也未進行瀏覽器互動測試；本輪只檢查規劃文件。\n- 主張的語意對照是逐列閱讀檢查，不宣稱由程式完整證明。\n- 未重新查核來源網站是否改版；本輪使用已驗收資料，不新增金融事實。\n\n### 第 9.4 節停止點\n\n**狀態：等待使用者明確確認八頁大綱與來源對照，人工審核尚未通過。**\n\n未建立逐頁稿、slides/drafts/、最終 HTML 或替代形式的逐頁成稿。若使用者要求修改，先修訂大綱及來源表，再重新檢查並等待明確確認；不能自行把沉默當批准。\n\n## Step 6：人工閘門通過與逐頁稿\n\n- **確認登錄起始時間**：2026-11-19 01:10:54 +08:00（Asia/Taipei；是開始處理此訊息的操作時間，不冒充訊息發送時間）。\n- **第 9.4 節人工審核**：使用者本輪明確確認八頁大綱及來源表，逐項確認頁數、認知順序、Wiki 範圍、詞義、來源與數字、資訊量及練習範圍，正式通過人工閘門。\n- **授權範圍**：補根目錄規則、八份逐頁稿、獨立內容檢查流程、報告、日誌與更新包。未授權 HTML 或發布。\n- **規則落地**：新增 AGENTS.md，完整彙整對話已確認要求及本次指定節次，後續可核對實體規則。先前沒有可取得的舊版完整全文，因此明列「非舊稿逐字復原」版本限制；不冒稱解除逐字舊稿核驗的限制。\n- **初稿與修正**：第一輪八頁字數為 114、151、128、177、129、122、169、141；第 2–8 頁超過 120。保留初稿正文及原因於內容報告，第二輪壓縮重複內容，第三輪處理預告詞義、小數說明及白話用語。沒有把必要假設移到圖表標籤規避上限。\n- **查核分工說明**：同一助手先撰稿，再以另行讀檔、計數、算術核對及語意清單執行分階段自我檢查；沒有第二位人員或另一模型外部審稿，不冒稱獨立外審。\n- **核准文件維護**：outline.md、source-map.md 僅更新閘門／階段說明；八頁規劃與原 21 列主張表未改。wiki/index.md 同步目前狀態，五篇核心 Wiki、七份閱讀筆記及練習保持原內容。\n- **最終結果**：見本階段結案紀錄及 reports/2026-11-19-content-check.md；此處不預填尚未執行的檢查結果。\n\n### Step 6 內容檢查結案\n\n- **完成內容檢查時間**：2026-11-19 01:22:00 +08:00。\n- **最終正文**：第 01–08 頁依序 103、100、103、115、109、105、101、108 字；採含標點、數字、英文字母的保守算法。八頁均小於等於 120 字，各一個主要目標及三個主要重點。\n- **內容報告**：reports/2026-11-19-content-check.md 已建立，分列字數、詞義先備、數字與來源、圖表規格、初稿問題與修正；附八頁初稿及最終正文作證據。\n- **算術／來源檢查**：10 項算術比較通過；逐頁主張回查核准 Wiki 與來源表，未加商品建議或未匯入金融內容；停用資料未帶入。\n- **檔案檢查**：32 份 Markdown，219 個相對連結目標可達；報告最終正文與八份稿一致；大綱仍為八頁，來源表仍為 21 列。\n- **輸入保護**：18 份既有來源／筆記／練習／核心 Wiki 內容雜湊一致。第一次篩選因 Windows 分隔符差異選到 0 檔，修正並強制檢查數量為 18 後全數核對通過；問題已記於報告。\n- **規則檔狀態**：AGENTS.md 已實際落地；解除「沒有實體規則可讀」限制。因早期完整逐字稿不可得，不宣稱與舊稿逐字相同；這一版本限制仍保留供使用者審閱。\n- **圖表與範圍**：八頁均有未來 SVG 的標題、軸／單位或不適用理由、圖例、資料、類型、文字及替代描述規格；未產生 SVG 或 HTML，未渲染、未公開、未提交。\n- **下一停止點**：等使用者確認內容報告及新稿，並下達 Step 7。大綱閘門已通過不代表本輪逐頁稿已獲人工驗收；不得自行繼續 HTML。\n- **封裝查核時間**：2026-11-19 01:22:40 +08:00。更新完整包包含 32 份 Markdown，ZIP 完整性檢查通過；另提供八頁逐頁稿合併閱讀副本。此筆封裝紀錄寫入後重新封裝並核對封裝內各檔與本機一致。\n\n## Step 7：HTML 成品與交付檢查\n\n- **開始時間**：2026-11-19 01:24:46 +08:00（Asia/Taipei，操作時間，非訊息發送時間）。\n- **人工授權**：使用者本輪明確確認八份逐頁稿與內容報告，授權製作八頁 HTML、入口、README、排除規則、發布報告、日誌與完整包；並要求 GitHub Pages 公開測試待其上傳後親自驗證。\n- **交付清單**：slides/index.html、根目錄 index.html、README.md、.gitignore、.nojekyll、exercises/index.html、reports/2026-11-19-release-check.md、reports/browser-check.json、三張驗收截圖及本日誌；保留先前來源、Wiki、練習、核准稿與報告。\n- **規則核對**：原實體 AGENTS.md 只有第 1–10 節，本次按使用者明列規格增補第 11 節公開排除與第 12 節如實驗收；不是聲稱早期原稿本來就有可核對的完整兩節。\n- **內容鎖定**：HTML 三點正文與每份核准稿逐字比對；字數仍為 103、100、103、115、109、105、101、108，未新增第九頁或金融知識。\n- **圖表**：依八份稿實作八張原生 SVG；均具標題、替代描述、類型與 Wiki 標示、圖例、單位／無軸理由。數字圖表不當歷史績效，關係圖不虛構座標。\n- **本機預覽問題與恢復**：一般權限的 loopback 預覽起初連線逾時，本機讀取亦回應通訊端權限限制；在允許的執行環境重新啟動僅綁 127.0.0.1 的服務後，Chrome 成功載入。未修改防火牆或降低安全設定。\n- **桌面與手機驗收**：1536×960、390×844 各八頁，DOM 邊界與代表截圖檢查通過；方向鍵左右、空白鍵、下一頁按鈕及末頁停留通過；首頁練習卡片與首題解析展開可用。記錄於 browser-check.json。\n- **檢查工具調整**：唯讀瀏覽器介面不提供 getBBox，改用渲染後 DOM 邊界檢查。靜態檢查由要求「圖例／單位」字面，改核對第 3 頁已有的兩分類／填紋與第 3、7 頁元單位。未為通過檢查改寫核准內容。\n- **範圍界線**：未上傳 GitHub、未建立或測試公開網址。此處本機結果不能當作線上部署結果，待使用者上傳後親自驗證。\n\n### Step 3–7 客觀工程反思（供作業說明）\n\n1. **來源能開啟不代表概念已完整。** S004 重讀指定頁面後，股票與防詐定位可補齊，但完整計息及債券條件仍不足，所以增列 S006、S007，而非用熟悉常識填空。證據見 notes/s004-reading.md。\n2. **網站工具讀取失敗，應改變取證方法並保留限制。** 可核實紀錄是 S007 搜尋瀏覽工具回應 403，後改以一般 HTTPS 取得並實讀公開正文。不得把搜尋摘要冒充全文，也不把使用者舉例的事件名稱當成已查證事實。S004 本次保留的是 PDF 取得、抽取與指定頁面補查紀錄，不新增未能核對的逾時細節。\n3. **公信力來源仍可能有誤植。** S006 p12 的「×1.05%」與結果不符，抽取文字後又渲染原頁核對，確定問題確在教材；採 pp11、13 定義，自編 2% 例子驗算。S004 p25 未附出處數據也按使用者確認停用。這些隔離決定一直帶到成品，沒有在後續生成時遺忘。\n4. **大綱字數預算不等於成稿合規。** Step 6 首稿有七頁超限，介於 122–177 字；依紀錄壓縮重複解釋，保留假設與警語，再複檢詞義及 0.02。最後八頁全部小於等於 120 字；完整初稿與修正保存在內容報告，不只展示最後通過。\n5. **檢查器也需要驗證。** Step 6 路徑分隔符造成受保護輸入選到 0 檔，改加數量條件才正確核對 18 檔。Step 7 又發現單靠「圖例」字串無法判斷真實圖例，必須查分類、線型與單位。自動檢查不能取代語意閱讀與畫面檢視。\n6. **先鎖內容，再做呈現，才能避免壓版面時偷改教材。** 成品正文直接從核准稿帶入，26 份核准輸入雜湊比對未改；版面用依視窗縮放及兩欄／上下排列處理，沒有刪掉風險提醒或加新財經例子。\n7. **交付檔與公開部署是不同驗收層。** 本機八頁與練習可用、ZIP 可下載，不代表助教已能從公開網址觀看。本次依使用者要求保留 Pages 待辦，沒有以本機截圖虛構上線證據。\n\n### Step 7 最終狀態\n\n內容與程式查核完成，發布報告列明真實結果與限制。最後的連結數、秘密排除與封裝完成時間在下方追加；公開網址實測仍為待辦。\n\n- **最終檔案查核時間**：2026-11-19 01:40:13 +08:00。八頁／八張 SVG、三點正文與核准稿一致、JavaScript 語法與 SVG XML 解析通過；306 個相對連結無缺檔；26 份核准輸入未改。\n- **公開排除查核**：交付文字未命中常見金鑰／私鑰標記或本機使用者絕對路徑，未包含 .env、原始教材、私人筆記或憑證；四個代表私人路徑經 Git 忽略規則檢查會排除。\n- **交付方式**：提供完整更新 ZIP、三份 HTML 與文件的完整程式碼合併閱讀檔，沒有省略程式區塊。本機預覽服務於驗收後關閉；實體檔案可直接開啟。\n- **公開狀態**：本輪未上傳 Repository 或 Pages，無公開網址測試結果；待使用者上傳後親自確認，不能以 ZIP 交付推論已公開。\n- **封裝驗證完成**：2026-11-19 01:41:13 +08:00。完整包共 43 檔，含三份完整 HTML、34 份 Markdown、三張畫面、瀏覽器查核 JSON、.gitignore 與 .nojekyll；ZIP 完整性及每檔位元組比對通過。本筆紀錄納入後重新產出完整程式碼閱讀檔與 ZIP，再核對封裝與本機一致。狀態停在本機交付完成、公開網址待驗證。\n\n\n## 後續優化與公開驗證（2026-11-19，Asia/Taipei）\n\n使用者授權完成公開發布後，已建立 GitHub Repository、啟用 main 根目錄 Pages，並實際開啟公開網站。前階段未發布狀態保留為歷史紀錄。新增可搜尋 Wiki 閱讀器、流程圖、驗收入口；八頁正文保持核准稿。實測項目、六項作業要求對照及限制見 [優化與公開檢查](../reports/2026-11-19-optimization-check.md)。COOL 只準備草稿，不自動按最終繳交。\n"}, "workflow/loop-and-graph.md": {"title": "工作流、迴圈與檢查前移", "html": "\u003ch1 id=\"工作流迴圈與檢查前移\">工作流、迴圈與檢查前移\u003c/h1>\n\u003ch2 id=\"流程的性質\">流程的性質\u003c/h2>\n\u003cp>本專案使用人與 AI 分階段協作的工作流，不是已部署的 LangGraph 或自動投資代理。AI 協助整理、轉譯與實作；使用者決定受眾、確認來源、大綱與逐頁稿。圖上的通過與退回，是實際採用的檢查規則。\u003c/p>\n\u003ch2 id=\"主流程\">主流程\u003c/h2>\n\u003cp>先討論零基礎受眾與範圍 → 訂定 AGENTS.md → 登錄並閱讀來源 → 人工確認來源 → 匯入五篇 Wiki 與練習 → 更新目錄及日誌 → 整理八頁大綱與來源對照 → 人工審核 → 撰寫逐頁稿 → 字數、詞義、數字與來源檢查 → 人工確認稿件 → 製作 HTML／SVG → 結構、連結與瀏覽器驗收 → 公開發布並實測 → 整理作業草稿。\u003c/p>\n\u003ch2 id=\"三個重複迴圈\">三個重複迴圈\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>迴圈\u003c/th>\u003cth>重複的工作\u003c/th>\u003cth>通過條件\u003c/th>\u003cth>不通過怎麼走\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>來源與匯入\u003c/td>\u003ctd>逐份閱讀、定位、標示缺口，逐篇編譯 Wiki、補相對連結\u003c/td>\u003ctd>主張有可定位的真實來源，算式可重算，必要概念不缺漏\u003c/td>\u003ctd>回來源查核或補登新來源；不足不憑記憶補寫。S006 原教材誤植隔離，S004 無出處數據停用\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>逐頁稿內容\u003c/td>\u003ctd>八頁逐頁計數、白話詞義及數字對照\u003c/td>\u003ctd>一個目標、至多三重點、正文不超過 120 字；全部回查已驗收 Wiki\u003c/td>\u003ctd>只修有問題的頁，重算並留下差異；一階段最多三輪，仍未解決就停下處理。這次初稿七頁超限，第二輪精簡，第三輪複檢詞義與小數\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>呈現與發布\u003c/td>\u003ctd>HTML 文字比對、SVG、連結、桌面／手機／公開網址檢查\u003c/td>\u003ctd>正文與核准稿逐字一致，指定尺寸無越界，公開連結實際可開\u003c/td>\u003ctd>版面問題回呈現層，路徑問題修連結；若是來源或主張錯誤，回前面的來源及大綱閘門，不偷改核准內容\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"為什麼把檢查往前移\">為什麼把檢查往前移\u003c/h2>\n\u003cp>來源階段先確認可讀性與內容覆蓋，避免 Wiki 已寫好才發現缺少計息或債券依據。簡報階段先審八頁大綱與來源表，再做逐頁稿檢查，最後才寫 HTML，避免排版完才大幅重寫。程式完成後的文字比對則防止實作時把教材偷偷改短。\u003c/p>\n\u003ch2 id=\"真實執行證據\">真實執行證據\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"reader.html?doc=sources/catalog.md\">來源登錄\u003c/a>：五份核心來源補強至 S001–S007。\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=notes/s006-reading.md\">S006 誤植隔離\u003c/a>：原頁百分比算式與結果不符，改採定義並自編驗算。\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=slides/source-map.md\">逐頁來源對照\u003c/a>：八頁共 21 列主張追溯。\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=reports/2026-11-19-content-check.md\">內容檢查報告\u003c/a>：初稿 114、151、128、177、129、122、169、141 字；最後 103、100、103、115、109、105、101、108 字。\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=reports/2026-11-19-release-check.md\">發布與版面報告\u003c/a>：結構與瀏覽器的結果、尺寸及限制分開記錄。\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=wiki/log.md\">執行日誌\u003c/a>：人工確認、缺口、修正及實際時間。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"我的理解與反思\">我的理解與反思\u003c/h2>\n\u003cp>這次問題最集中的節點是「把 Wiki 濃縮成逐頁稿」：八頁初稿有七頁超過上限，並非做出網頁後才發現。修正方法是把內容檢查放到 HTML 之前，先核對字數、詞義與數字，而不是先縮小字體。來源錯誤則應更早攔在來源登錄與匯入階段，不能等到最後簡報才修。\u003c/p>\n\u003cp>Wiki 是已查核內容的共同依據，大綱是內容範圍的約定，逐頁稿是實作的文字契約。生成與檢查交替重複，失敗時回到對應節點，才讓這份流程具有可重用性；不應把「AI 說完全符合」當作驗收證據。\u003c/p>", "source": "# 工作流、迴圈與檢查前移\n\n## 流程的性質\n\n本專案使用人與 AI 分階段協作的工作流，不是已部署的 LangGraph 或自動投資代理。AI 協助整理、轉譯與實作；使用者決定受眾、確認來源、大綱與逐頁稿。圖上的通過與退回，是實際採用的檢查規則。\n\n## 主流程\n\n先討論零基礎受眾與範圍 → 訂定 AGENTS.md → 登錄並閱讀來源 → 人工確認來源 → 匯入五篇 Wiki 與練習 → 更新目錄及日誌 → 整理八頁大綱與來源對照 → 人工審核 → 撰寫逐頁稿 → 字數、詞義、數字與來源檢查 → 人工確認稿件 → 製作 HTML／SVG → 結構、連結與瀏覽器驗收 → 公開發布並實測 → 整理作業草稿。\n\n## 三個重複迴圈\n\n| 迴圈 | 重複的工作 | 通過條件 | 不通過怎麼走 |\n| --- | --- | --- | --- |\n| 來源與匯入 | 逐份閱讀、定位、標示缺口，逐篇編譯 Wiki、補相對連結 | 主張有可定位的真實來源，算式可重算，必要概念不缺漏 | 回來源查核或補登新來源；不足不憑記憶補寫。S006 原教材誤植隔離，S004 無出處數據停用 |\n| 逐頁稿內容 | 八頁逐頁計數、白話詞義及數字對照 | 一個目標、至多三重點、正文不超過 120 字；全部回查已驗收 Wiki | 只修有問題的頁，重算並留下差異；一階段最多三輪，仍未解決就停下處理。這次初稿七頁超限，第二輪精簡，第三輪複檢詞義與小數 |\n| 呈現與發布 | HTML 文字比對、SVG、連結、桌面／手機／公開網址檢查 | 正文與核准稿逐字一致，指定尺寸無越界，公開連結實際可開 | 版面問題回呈現層，路徑問題修連結；若是來源或主張錯誤，回前面的來源及大綱閘門，不偷改核准內容 |\n\n## 為什麼把檢查往前移\n\n來源階段先確認可讀性與內容覆蓋，避免 Wiki 已寫好才發現缺少計息或債券依據。簡報階段先審八頁大綱與來源表，再做逐頁稿檢查，最後才寫 HTML，避免排版完才大幅重寫。程式完成後的文字比對則防止實作時把教材偷偷改短。\n\n## 真實執行證據\n\n- [來源登錄](../sources/catalog.md)：五份核心來源補強至 S001–S007。\n- [S006 誤植隔離](../notes/s006-reading.md)：原頁百分比算式與結果不符，改採定義並自編驗算。\n- [逐頁來源對照](../slides/source-map.md)：八頁共 21 列主張追溯。\n- [內容檢查報告](../reports/2026-11-19-content-check.md)：初稿 114、151、128、177、129、122、169、141 字；最後 103、100、103、115、109、105、101、108 字。\n- [發布與版面報告](../reports/2026-11-19-release-check.md)：結構與瀏覽器的結果、尺寸及限制分開記錄。\n- [執行日誌](../wiki/log.md)：人工確認、缺口、修正及實際時間。\n\n## 我的理解與反思\n\n這次問題最集中的節點是「把 Wiki 濃縮成逐頁稿」：八頁初稿有七頁超過上限，並非做出網頁後才發現。修正方法是把內容檢查放到 HTML 之前，先核對字數、詞義與數字，而不是先縮小字體。來源錯誤則應更早攔在來源登錄與匯入階段，不能等到最後簡報才修。\n\nWiki 是已查核內容的共同依據，大綱是內容範圍的約定，逐頁稿是實作的文字契約。生成與檢查交替重複，失敗時回到對應節點，才讓這份流程具有可重用性；不應把「AI 說完全符合」當作驗收證據。\n"}}</script><script>
(()=>{const docs=JSON.parse(document.getElementById('documents').textContent);const requested=new URLSearchParams(location.search).get('doc')||'wiki/index.md';const path=Object.hasOwn(docs,requested)?requested:'wiki/index.md';const entry=docs[path];const article=document.getElementById('article');article.innerHTML=entry.html;document.title=entry.title+'｜零基礎理財';const raw=document.getElementById('raw-link');raw.href=path;document.querySelectorAll('[data-doc]').forEach(a=>{if(a.dataset.doc===path)a.setAttribute('aria-current','page');});const search=document.getElementById('search');const results=document.getElementById('results');search.addEventListener('input',()=>{const q=search.value.trim().toLocaleLowerCase();results.replaceChildren();results.hidden=!q;article.hidden=!!q;if(!q)return;const hits=Object.entries(docs).filter(([p,d])=>(d.title+' '+d.source).toLocaleLowerCase().includes(q));const count=document.createElement('p');count.textContent='找到 '+hits.length+' 份文件';results.append(count);hits.forEach(([p,d])=>{const a=document.createElement('a');a.href='reader.html?doc='+encodeURIComponent(p);a.textContent=d.title;results.append(a);});});document.getElementById('copy-link').addEventListener('click',async()=>{const s=document.getElementById('copy-status');try{await navigator.clipboard.writeText(location.href);s.textContent='已複製';}catch{s.textContent='請複製瀏覽器網址列。';}});if(location.hash){const id=decodeURIComponent(location.hash.slice(1));requestAnimationFrame(()=>document.getElementById(id)?.scrollIntoView());}})();
</script></body></html>
