>是\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>07\u003c/td>\u003ctd>分散與配置仍可能損失\u003c/td>\u003ctd>101\u003c/td>\u003ctd>是\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>08\u003c/td>\u003ctd>第一份理財計畫與付款前查核\u003c/td>\u003ctd>108\u003c/td>\u003ctd>是\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>恰八個投影片 section、八個主要標題、八張 SVG；沒有第九頁。正文最長 115 字，沿用包含標點、數字、英文字母的保守計數法。每頁的主要目標維持核准稿，只不額外投影編輯資料。\u003c/p>\n\u003cp>26 份既有輸入（八份逐頁稿、五篇核心 Wiki、五份練習、七份閱讀筆記、一份來源目錄）經 SHA-256 比較未改內容。沒有擅自改寫定義或引入新數字。\u003c/p>\n\u003ch2 id=\"5-svg-教學圖表檢查\">5. SVG 教學圖表檢查\u003c/h2>\n\u003cp>全部 SVG 都有可讀 title、desc、role=img、aria-labelledby，且標籤 ID 不重複。可見標題、概念示意／假設模擬、Wiki 編號、圖例及單位都能對應逐頁稿。八張 SVG 均通過 XML 語法解析。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>頁\u003c/th>\u003cth>圖表\u003c/th>\u003cth>軸／單位與圖例\u003c/th>\u003cth>來源與假設\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>01\u003c/td>\u003ctd>五站路線\u003c/td>\u003ctd>無數值軸；單位不適用；數字是學習順序\u003c/td>\u003ctd>概念示意，Wiki 01、05\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>02\u003c/td>\u003ctd>三步算式與信封用途\u003c/td>\u003ctd>不需 XY；新臺幣元、元／月、月；文字辨識生活／備用／未來\u003c/td>\u003ctd>假設模擬及概念示意，Wiki 01；6,000、72,000、12 月均相同\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>03\u003c/td>\u003ctd>商品籃價格與資金\u003c/td>\u003ctd>X 時間（年），Y 新臺幣元，0–110 線性；名稱、實色與填紋區分兩資料列\u003c/td>\u003ctd>假設模擬，Wiki 02；100／100 與 105／102；110 只作尺度\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>04\u003c/td>\u003ctd>年度計息表\u003c/td>\u003ctd>年欄、元值，表格不需 XY；單利／複利列識別\u003c/td>\u003ctd>假設模擬及雞群概念比喻，Wiki 02；兩年單利 10,400、複利 10,404\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>05\u003c/td>\u003ctd>股票／債券身分\u003c/td>\u003ctd>軸與單位不適用；所有權與出借以文字及實／虛線區別\u003c/td>\u003ctd>概念示意，Wiki 03；未加入清償順位等新知識\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>06\u003c/td>\u003ctd>基金包含 ETF\u003c/td>\u003ctd>軸與單位不適用；外框基金、內框 ETF；面積非比例\u003c/td>\u003ctd>概念示意，Wiki 03\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>07\u003c/td>\u003ctd>兩情境金額表\u003c/td>\u003ctd>情境列、配置欄、新臺幣元；A／B 明示假設資產\u003c/td>\u003ctd>假設模擬，Wiki 04；8,000／9,500 與 8,000／8,000\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>08\u003c/td>\u003ctd>盤點、目標、查核\u003c/td>\u003ctd>軸與單位不適用；清單與原自編題警訊\u003c/td>\u003ctd>概念示意，Wiki 05；不作個案法律定性\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>對無數值軸的關係圖不虛構 XY；這符合先前核准規格。圖例不只靠顏色。完整假設與風險提醒仍在正文，沒有把額外解說塞進圖表標籤規避字數。\u003c/p>\n\u003ch2 id=\"6-本機瀏覽器版面與互動結果\">6. 本機瀏覽器版面與互動結果\u003c/h2>\n\u003cp>預覽位置為本機 127.0.0.1:8821，非公開網址。原先一般權限啟動的預覽未能連線；核對到本機通訊端限制後，重新啟動僅綁定 loopback 的預覽服務，Chrome 成功載入。沒有把首次連線逾時寫成通過，也沒有更動防火牆或關閉安全檢查。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>項目\u003c/th>\u003cth>實際測試\u003c/th>\u003cth>結果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>桌面逐頁邊界\u003c/td>\u003ctd>1536×960，依序檢查 1–8 頁\u003c/td>\u003ctd>每次只顯示一頁；頁面在視窗內、正文／圖表分欄、內容不壓到來源列\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>手機逐頁邊界\u003c/td>\u003ctd>390×844，依序檢查 1–8 頁\u003c/td>\u003ctd>頁面在視窗內；正文與圖表上下排列，不壓到來源列\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>SVG 文字範圍\u003c/td>\u003ctd>兩尺寸各八張圖，讀取可見標籤邊界\u003c/td>\u003ctd>未發現文字超出各 SVG 繪圖範圍\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>方向鍵\u003c/td>\u003ctd>右鍵逐頁前進；左鍵由 4 回 3\u003c/td>\u003ctd>正確切頁與更新頁碼\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>空白鍵\u003c/td>\u003ctd>從第 3 頁按空白鍵\u003c/td>\u003ctd>到第 4 頁\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>下方按鈕\u003c/td>\u003ctd>從第 3 頁按下一頁\u003c/td>\u003ctd>到第 4 頁\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>末頁邊界\u003c/td>\u003ctd>第 8 頁按右鍵\u003c/td>\u003ctd>仍為 8／8，下一頁按鈕停用\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>進度\u003c/td>\u003ctd>逐頁觀察進度及頁碼；讀取 aria 值\u003c/td>\u003ctd>對應 1–8，畫面顯示 1／8 至 8／8\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>練習入口\u003c/td>\u003ctd>從首頁卡片進 exercises/\u003c/td>\u003ctd>可看到五題；解析預設折疊\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>解析展開\u003c/td>\u003ctd>打開第 1 題提示與解析\u003c/td>\u003ctd>能看到既有提示、D／8 個月與逐步計算\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>版面檢查包含讀取渲染後邊界與代表畫面檢視，不只是 CSS 存在性檢查。不是完整的螢幕閱讀器、列印、所有瀏覽器或高倍率縮放認證。手機短螢幕縮放後字體可能變小，需使用者在實際裝置閱讀確認。\u003c/p>\n\u003cp>驗收證據：\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"reports/screenshots/desktop-slide-03.jpg\">桌面第 3 頁\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"reports/screenshots/mobile-slide-03.jpg\">手機第 3 頁\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"reports/screenshots/desktop-home.jpg\">桌面入口頁\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"reports/browser-check.json\">16 次逐頁邊界與互動查核資料\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"7-程式與相對連結檢查\">7. 程式與相對連結檢查\u003c/h2>\n\u003cul>\n\u003cli>slides/index.html 恰一段內嵌 style、一段內嵌 script，無外部樣式、腳本、字型、模型或追蹤依賴；JavaScript 語法檢查通過。\u003c/li>\n\u003cli>原生 DOM 控制頁面顯示；hash 可定位 1–8 頁，越界受限制。鍵盤不攔截輸入欄與可編輯區；按鈕獲焦時保留原生空白鍵行為。\u003c/li>\n\u003cli>滿足深色高對比、進度條、頁碼、下方按鈕、方向鍵及空白鍵規格。依可用高度縮放版面，不用固定裁切正文。\u003c/li>\n\u003cli>入口四張卡片的目標均存在；exercises/ 有 index.html，避免目錄無首頁。\u003c/li>\n\u003cli>Markdown 原樣保留，可能在瀏覽器以原始文字顯示或下載；GitHub Repository 提供排版閱讀。不把原始 Markdown 路徑聲稱為已驗證的網站排版頁。\u003c/li>\n\u003cli>全專案 Markdown 與 HTML 的 306 個相對連結目標皆存在；已知 HTML ID 與來源錨點對應。最後封裝檢查追加於日誌。\u003c/li>\n\u003cli>未以省略註解、待填程式或替代程式區塊交付；三份 HTML 都是完整可執行檔。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"8-私人資料與原始教材排除\">8. 私人資料與原始教材排除\u003c/h2>\n\u003cp>交付內容由公開金融教育摘要、自編假設例子與本專案畫面構成，未放入使用者真實財務資料、學號姓名、帳號、密碼或 API 金鑰。\u003c/p>\n\u003cul>\n\u003cli>檢查檔案清單，未包含原始 PDF、Office 教材、.env、私人筆記資料夾或憑證檔。\u003c/li>\n\u003cli>文字掃描未命中常見 GitHub、Groq、OpenAI 金鑰格式、私鑰標記或使用者電腦絕對路徑；未發現需排除的私人資料。\u003c/li>\n\u003cli>.gitignore 已排除上述秘密與原始檔案；原始公開來源僅提供官方網址，不重製整份教材。\u003c/li>\n\u003cli>另以 Git 的忽略規則檢查 .env、private-notes/test.md、sources/originals/source.pdf、uploads/lecture.png 四個代表路徑，均會排除；未建立這些測試檔案或加入真實秘密。\u003c/li>\n\u003cli>本機截圖只包含教學頁面，不含登入資訊或其他使用者分頁。\u003c/li>\n\u003cli>程式未設登入、後端、付款、追蹤或蒐集財務資料的表單。\u003c/li>\n\u003c/ul>\n\u003cp>此為本次實際交付檔案的範圍檢查，不代表 .gitignore 能撤回過去在別處公開的資訊。\u003c/p>\n\u003ch2 id=\"9-檢查中出現的問題與處理\">9. 檢查中出現的問題與處理\u003c/h2>\n\u003col>\n\u003cli>本機預覽首次連線逾時，進一步確認一般執行環境有本機通訊端限制；改用允許的本機預覽服務後成功。沒有修改簡報正文來掩蓋環境問題。\u003c/li>\n\u003cli>瀏覽器的唯讀檢查介面不提供 SVG getBBox；改用實際 DOM 元素的 bounding rectangle 比對 SVG 可見範圍，兩尺寸 16 頁次均通過。\u003c/li>\n\u003cli>結構檢查器初版要求圖中必須含「圖例」「單位」的字面字串，但第 3 頁已用分類名稱及填紋呈現圖例、第 3／7 頁已標新臺幣元；改為檢查實際分類與單位，不為滿足字串檢查擅改核准圖意。第一次檢查中斷時尚未產生腳本語法檢查檔，沒有把該次語法檢查當成功；後續重新執行才通過。\u003c/li>\n\u003cli>發布報告尚未寫入時，第一輪連結檢查列出兩個指向本報告的缺檔；完成報告後再作最後連結檢查。最終以實際檔案存在為準，不預填通過。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"10-github-pages-公開網址實測待辦\">10. GitHub Pages 公開網址實測：待辦\u003c/h2>\n\u003cp>\u003cstrong>狀態：待使用者上傳後親自開啟驗證。\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Repository：本輪未建立或上傳。\u003c/li>\n\u003cli>公開網址：未取得／未驗證；不提供猜測網址。\u003c/li>\n\u003cli>驗證時間：尚未執行，不預填。\u003c/li>\n\u003cli>[ ] 發布來源正確包含根目錄 index.html 與 .nojekyll。\u003c/li>\n\u003cli>[ ] 使用 GitHub 顯示的實際網址，以未登入視窗開啟首頁。\u003c/li>\n\u003cli>[ ] 八頁簡報、方向鍵、空白鍵、按鈕、進度與頁碼正常。\u003c/li>\n\u003cli>[ ] Wiki、來源、練習與返回連結在 Repository 子路徑下可達。\u003c/li>\n\u003cli>[ ] 用實際手機檢查圖表文字及可讀性。\u003c/li>\n\u003cli>[ ] 確認公開檔案沒有私人資料與未授權原檔。\u003c/li>\n\u003cli>[ ] 把真實網址、時間、結果與必要截圖追加到本報告及日誌。\u003c/li>\n\u003c/ul>\n\u003cp>線上驗證尚未完成不能改成「網站已發布通過」。此輪完成的是可供上傳的成品與可查證的本機驗收。\u003c/p>\n\u003ch2 id=\"後續優化與公開驗證2026-11-19asiataipei\">後續優化與公開驗證（2026-11-19，Asia/Taipei）\u003c/h2>\n\u003cp>使用者授權完成公開發布後，已建立 GitHub Repository、啟用 main 根目錄 Pages，並實際開啟公開網站。前階段未發布狀態保留為歷史紀錄。新增可搜尋 Wiki 閱讀器、流程圖、驗收入口；八頁正文保持核准稿。實測項目、六項作業要求對照及限制見 \u003ca href=\"reader.html?doc=reports/2026-11-19-optimization-check.md\">優化與公開檢查\u003c/a>。COOL 只準備草稿，不自動按最終繳交。\u003c/p>", "source": "# 2026-11-19 發布與版面檢查報告\n\n## 1. 驗收範圍與時間\n\n- 專案：零基礎個人投資與理財入門。\n- 本輪開始：2026-11-19 01:24:46 +08:00（Asia/Taipei，操作時間）。\n- 本機程式、內容及瀏覽器查核紀錄截至：2026-11-19 01:37:04 +08:00；報告與最終封裝完成時間見日誌。\n- 使用者本輪明確確認八份逐頁稿及內容報告，授權製作 HTML、入口頁與交付文件；指定公開網址測試待其上傳後親自驗證。\n- 規則：依 [AGENTS.md](../AGENTS.md)第 8、9.5–9.6 節及本輪增補的第 11、12 節。第 11、12 節先前不存在，本次按使用者明列規格增補，不宣稱找回舊稿原文。\n\n## 2. 驗收狀態分界\n\n| 檢查層級 | 狀態 | 可證實範圍 |\n| --- | --- | --- |\n| 本機檔案與 HTML 結構檢查 | 已完成 | 八頁、逐字一致、SVG 結構、內嵌資源、來源、連結與交付檔案排除 |\n| 本機 Chrome 版面與互動 | 已完成指定尺寸 | 1536×960 桌面及 390×844 手機直向，八頁逐頁邊界；方向鍵、空白鍵、按鈕及末頁邊界 |\n| 其他裝置／瀏覽器／高倍率縮放 | 未全面測試 | 不把兩種尺寸推論為所有裝置均已通過 |\n| GitHub Repository 上傳 | 未執行 | 此輪交付本機完整檔與 ZIP |\n| GitHub Pages 公開網址實測 | **待使用者上傳後親自開啟驗證** | 本輪無已驗證的公開網址，沒有部署成功結果可報 |\n\nlocalhost、可下載 ZIP 及本機檔案連結都不是公開部署的證據。本機驗收不等於 GitHub Pages 已可公開瀏覽。\n\n## 3. 交付檔案\n\n- [八頁 HTML 簡報](../slides/index.html)：完整內嵌 CSS、JavaScript 及八張原生 SVG。\n- [專案入口](../index.html)：四張卡片對應簡報、Wiki 目錄、來源目錄及 exercises/。\n- [練習 HTML 入口](../exercises/index.html)：把已驗收的五份練習呈現為題目與可展開解析，避免目錄入口無首頁。\n- [README](../README.md)：架構、學習順序、來源、工作流及本機／線上使用方式。\n- .gitignore：憑證、私人資料、暫存及未授權原始教材排除規則。\n- .nojekyll：純靜態交付，保留 Markdown 原始路徑。\n- 本報告、[執行日誌](../wiki/log.md)、[瀏覽器查核資料](browser-check.json)及三張本機截圖。\n- 既有 Wiki、筆記、來源、練習、大綱、逐頁稿及內容報告一併保留。\n\n## 4. 八頁結構與正文鎖定\n\n檢查方式：從各 Markdown 的「正文」讀出三點，再讀取 HTML 每個 section 的 copy 清單，比對三點文字及順序完全相同，並重算字數。HTML 跳脫只處理標記字元，不改字句。標題也逐頁比對原稿。\n\n| 頁碼 | 主題 | HTML 正文字數 | 與核准稿逐字相同 | 正文重點數 |\n| --- | --- | --- | --- | --- |\n| 01 | 零基礎個人投資與理財入門 | 103 | 是 | 3 |\n| 02 | 收支與緊急預備金 | 100 | 是 | 3 |\n| 03 | 金額增加與購買力 | 103 | 是 | 3 |\n| 04 | 單利與複利 | 115 | 是 | 3 |\n| 05 | 股票與債券的身分差異 | 109 | 是 | 3 |\n| 06 | 基金與ETF的包含關係 | 105 | 是 | 3 |\n| 07 | 分散與配置仍可能損失 | 101 | 是 | 3 |\n| 08 | 第一份理財計畫與付款前查核 | 108 | 是 | 3 |\n\n恰八個投影片 section、八個主要標題、八張 SVG；沒有第九頁。正文最長 115 字，沿用包含標點、數字、英文字母的保守計數法。每頁的主要目標維持核准稿，只不額外投影編輯資料。\n\n26 份既有輸入（八份逐頁稿、五篇核心 Wiki、五份練習、七份閱讀筆記、一份來源目錄）經 SHA-256 比較未改內容。沒有擅自改寫定義或引入新數字。\n\n## 5. SVG 教學圖表檢查\n\n全部 SVG 都有可讀 title、desc、role=img、aria-labelledby，且標籤 ID 不重複。可見標題、概念示意／假設模擬、Wiki 編號、圖例及單位都能對應逐頁稿。八張 SVG 均通過 XML 語法解析。\n\n| 頁 | 圖表 | 軸／單位與圖例 | 來源與假設 |\n| --- | --- | --- | --- |\n| 01 | 五站路線 | 無數值軸；單位不適用；數字是學習順序 | 概念示意，Wiki 01、05 |\n| 02 | 三步算式與信封用途 | 不需 XY；新臺幣元、元／月、月；文字辨識生活／備用／未來 | 假設模擬及概念示意，Wiki 01；6,000、72,000、12 月均相同 |\n| 03 | 商品籃價格與資金 | X 時間（年），Y 新臺幣元，0–110 線性；名稱、實色與填紋區分兩資料列 | 假設模擬，Wiki 02；100／100 與 105／102；110 只作尺度 |\n| 04 | 年度計息表 | 年欄、元值，表格不需 XY；單利／複利列識別 | 假設模擬及雞群概念比喻，Wiki 02；兩年單利 10,400、複利 10,404 |\n| 05 | 股票／債券身分 | 軸與單位不適用；所有權與出借以文字及實／虛線區別 | 概念示意，Wiki 03；未加入清償順位等新知識 |\n| 06 | 基金包含 ETF | 軸與單位不適用；外框基金、內框 ETF；面積非比例 | 概念示意，Wiki 03 |\n| 07 | 兩情境金額表 | 情境列、配置欄、新臺幣元；A／B 明示假設資產 | 假設模擬，Wiki 04；8,000／9,500 與 8,000／8,000 |\n| 08 | 盤點、目標、查核 | 軸與單位不適用；清單與原自編題警訊 | 概念示意，Wiki 05；不作個案法律定性 |\n\n對無數值軸的關係圖不虛構 XY；這符合先前核准規格。圖例不只靠顏色。完整假設與風險提醒仍在正文，沒有把額外解說塞進圖表標籤規避字數。\n\n## 6. 本機瀏覽器版面與互動結果\n\n預覽位置為本機 127.0.0.1:8821，非公開網址。原先一般權限啟動的預覽未能連線；核對到本機通訊端限制後，重新啟動僅綁定 loopback 的預覽服務，Chrome 成功載入。沒有把首次連線逾時寫成通過，也沒有更動防火牆或關閉安全檢查。\n\n| 項目 | 實際測試 | 結果 |\n| --- | --- | --- |\n| 桌面逐頁邊界 | 1536×960，依序檢查 1–8 頁 | 每次只顯示一頁；頁面在視窗內、正文／圖表分欄、內容不壓到來源列 |\n| 手機逐頁邊界 | 390×844，依序檢查 1–8 頁 | 頁面在視窗內；正文與圖表上下排列，不壓到來源列 |\n| SVG 文字範圍 | 兩尺寸各八張圖，讀取可見標籤邊界 | 未發現文字超出各 SVG 繪圖範圍 |\n| 方向鍵 | 右鍵逐頁前進；左鍵由 4 回 3 | 正確切頁與更新頁碼 |\n| 空白鍵 | 從第 3 頁按空白鍵 | 到第 4 頁 |\n| 下方按鈕 | 從第 3 頁按下一頁 | 到第 4 頁 |\n| 末頁邊界 | 第 8 頁按右鍵 | 仍為 8／8，下一頁按鈕停用 |\n| 進度 | 逐頁觀察進度及頁碼；讀取 aria 值 | 對應 1–8，畫面顯示 1／8 至 8／8 |\n| 練習入口 | 從首頁卡片進 exercises/ | 可看到五題；解析預設折疊 |\n| 解析展開 | 打開第 1 題提示與解析 | 能看到既有提示、D／8 個月與逐步計算 |\n\n版面檢查包含讀取渲染後邊界與代表畫面檢視，不只是 CSS 存在性檢查。不是完整的螢幕閱讀器、列印、所有瀏覽器或高倍率縮放認證。手機短螢幕縮放後字體可能變小，需使用者在實際裝置閱讀確認。\n\n驗收證據：\n\n- [桌面第 3 頁](screenshots/desktop-slide-03.jpg)\n- [手機第 3 頁](screenshots/mobile-slide-03.jpg)\n- [桌面入口頁](screenshots/desktop-home.jpg)\n- [16 次逐頁邊界與互動查核資料](browser-check.json)\n\n## 7. 程式與相對連結檢查\n\n- slides/index.html 恰一段內嵌 style、一段內嵌 script，無外部樣式、腳本、字型、模型或追蹤依賴；JavaScript 語法檢查通過。\n- 原生 DOM 控制頁面顯示；hash 可定位 1–8 頁，越界受限制。鍵盤不攔截輸入欄與可編輯區；按鈕獲焦時保留原生空白鍵行為。\n- 滿足深色高對比、進度條、頁碼、下方按鈕、方向鍵及空白鍵規格。依可用高度縮放版面，不用固定裁切正文。\n- 入口四張卡片的目標均存在；exercises/ 有 index.html，避免目錄無首頁。\n- Markdown 原樣保留，可能在瀏覽器以原始文字顯示或下載；GitHub Repository 提供排版閱讀。不把原始 Markdown 路徑聲稱為已驗證的網站排版頁。\n- 全專案 Markdown 與 HTML 的 306 個相對連結目標皆存在；已知 HTML ID 與來源錨點對應。最後封裝檢查追加於日誌。\n- 未以省略註解、待填程式或替代程式區塊交付；三份 HTML 都是完整可執行檔。\n\n## 8. 私人資料與原始教材排除\n\n交付內容由公開金融教育摘要、自編假設例子與本專案畫面構成，未放入使用者真實財務資料、學號姓名、帳號、密碼或 API 金鑰。\n\n- 檢查檔案清單，未包含原始 PDF、Office 教材、.env、私人筆記資料夾或憑證檔。\n- 文字掃描未命中常見 GitHub、Groq、OpenAI 金鑰格式、私鑰標記或使用者電腦絕對路徑；未發現需排除的私人資料。\n- .gitignore 已排除上述秘密與原始檔案；原始公開來源僅提供官方網址，不重製整份教材。\n- 另以 Git 的忽略規則檢查 .env、private-notes/test.md、sources/originals/source.pdf、uploads/lecture.png 四個代表路徑，均會排除；未建立這些測試檔案或加入真實秘密。\n- 本機截圖只包含教學頁面，不含登入資訊或其他使用者分頁。\n- 程式未設登入、後端、付款、追蹤或蒐集財務資料的表單。\n\n此為本次實際交付檔案的範圍檢查，不代表 .gitignore 能撤回過去在別處公開的資訊。\n\n## 9. 檢查中出現的問題與處理\n\n1. 本機預覽首次連線逾時，進一步確認一般執行環境有本機通訊端限制；改用允許的本機預覽服務後成功。沒有修改簡報正文來掩蓋環境問題。\n2. 瀏覽器的唯讀檢查介面不提供 SVG getBBox；改用實際 DOM 元素的 bounding rectangle 比對 SVG 可見範圍，兩尺寸 16 頁次均通過。\n3. 結構檢查器初版要求圖中必須含「圖例」「單位」的字面字串，但第 3 頁已用分類名稱及填紋呈現圖例、第 3／7 頁已標新臺幣元；改為檢查實際分類與單位，不為滿足字串檢查擅改核准圖意。第一次檢查中斷時尚未產生腳本語法檢查檔，沒有把該次語法檢查當成功；後續重新執行才通過。\n4. 發布報告尚未寫入時，第一輪連結檢查列出兩個指向本報告的缺檔；完成報告後再作最後連結檢查。最終以實際檔案存在為準，不預填通過。\n\n## 10. GitHub Pages 公開網址實測：待辦\n\n**狀態：待使用者上傳後親自開啟驗證。**\n\n- Repository：本輪未建立或上傳。\n- 公開網址：未取得／未驗證；不提供猜測網址。\n- 驗證時間：尚未執行，不預填。\n- [ ] 發布來源正確包含根目錄 index.html 與 .nojekyll。\n- [ ] 使用 GitHub 顯示的實際網址，以未登入視窗開啟首頁。\n- [ ] 八頁簡報、方向鍵、空白鍵、按鈕、進度與頁碼正常。\n- [ ] Wiki、來源、練習與返回連結在 Repository 子路徑下可達。\n- [ ] 用實際手機檢查圖表文字及可讀性。\n- [ ] 確認公開檔案沒有私人資料與未授權原檔。\n- [ ] 把真實網址、時間、結果與必要截圖追加到本報告及日誌。\n\n線上驗證尚未完成不能改成「網站已發布通過」。此輪完成的是可供上傳的成品與可查證的本機驗收。\n\n\n## 後續優化與公開驗證（2026-11-19，Asia/Taipei）\n\n使用者授權完成公開發布後，已建立 GitHub Repository、啟用 main 根目錄 Pages，並實際開啟公開網站。前階段未發布狀態保留為歷史紀錄。新增可搜尋 Wiki 閱讀器、流程圖、驗收入口；八頁正文保持核准稿。實測項目、六項作業要求對照及限制見 [優化與公開檢查](../reports/2026-11-19-optimization-check.md)。COOL 只準備草稿，不自動按最終繳交。\n"}, "slides/drafts/slide-01.md": {"title": "01／零基礎個人投資與理財入門", "html": "\u003ch1 id=\"01零基礎個人投資與理財入門\">01／零基礎個人投資與理財入門\u003c/h1>\n\u003ch2 id=\"主要教學目標\">主要教學目標\u003c/h2>\n\u003cp>知道先盤點生活與目標，再理解投資工具的學習順序。\u003c/p>\n\u003ch2 id=\"正文\">正文\u003c/h2>\n\u003cul>\n\u003cli>理財計畫是安排生活支出、目標與錢的用途。投資是把錢投入可能增值、也可能虧損的工具。\u003c/li>\n\u003cli>像旅行先看旅費。依序學收錢花錢、錢與物價、工具、可能損失與計畫。\u003c/li>\n\u003cli>路線只是概念示意，結果與時間不保證。現在不投資也可以有計畫。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"圖表規格\">圖表規格\u003c/h2>\n\u003cp>以下為供下一階段製作 SVG 的規格，不含 SVG 或 HTML 程式碼。短標籤不承載未計字的完整解說；正文是唯一可直接投影的說明文字。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>未來 SVG 標題\u003c/strong>：五站學習路線。\u003c/li>\n\u003cli>\u003cstrong>類型與標示\u003c/strong>：【教學轉譯／概念示意】，五站流程關係圖，並非資金成長曲線。\u003c/li>\n\u003cli>\u003cstrong>座標軸／單位\u003c/strong>：不適用。站點表示學習順序，不表示時間長度或收益大小。\u003c/li>\n\u003cli>\u003cstrong>圖例\u003c/strong>：數字 1–5 代表學習順序，連線只代表先後；不依顏色判讀。\u003c/li>\n\u003cli>\u003cstrong>短標籤\u003c/strong>：1 生活的錢、2 錢與物價、3 工具、4 可能損失、5 計畫。\u003c/li>\n\u003cli>\u003cstrong>資料依據\u003c/strong>：Wiki 目錄的五課，旅行比喻取 Wiki 05。\u003c/li>\n\u003cli>\u003cstrong>文字說明\u003c/strong>：正文第 2、3 點已交代路線與比喻限制，不在圖外增加另一段解說。\u003c/li>\n\u003cli>\u003cstrong>無障礙描述規格\u003c/strong>：描述五站的先後，並重述結果不保證。非本輪生成 SVG。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"來源與定位\">來源與定位\u003c/h2>\n\u003cp>對應 \u003ca href=\"reader.html?doc=slides/outline.md\">已核准大綱\u003c/a>第 1 頁及 \u003ca href=\"reader.html?doc=slides/source-map.md\">來源對照表\u003c/a>同頁。\u003c/p>\n\u003cp>Wiki：\u003ca href=\"reader.html?doc=wiki/01-budget-and-emergency-fund.md\">01-budget-and-emergency-fund.md\u003c/a>；\u003ca href=\"reader.html?doc=wiki/05-first-financial-plan.md\">05-first-financial-plan.md\u003c/a>。段落：Wiki 01「一句話白話定義」；Wiki 05「一句話白話定義」之依序執行、「生活化比喻」。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"reader.html?doc=sources/catalog.md#s001\">S001\u003c/a>：收入支出健檢試算說明。\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004\u003c/a>：pp21–24、p34。\u003c/li>\n\u003c/ul>\n\u003cp>圖表若有數字，均為 Wiki 假設例子，不是來源機構統計。概念圖與比喻為教學轉譯。\u003c/p>\n\u003ch2 id=\"編輯與檢查備註\">編輯與檢查備註\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>先備知識\u003c/strong>：無金融先備；能辨認生活中的收錢與花錢。\u003c/li>\n\u003cli>\u003cstrong>術語核對\u003c/strong>：理財計畫、投資均在正文第 1 點解釋；預告改用收錢花錢、錢與物價、可能損失，將收支、計息、風險正式詞義留在對應教學頁。\u003c/li>\n\u003cli>\u003cstrong>理解檢核\u003c/strong>：編輯檢核：讀者能指出第一步是盤點生活，而非選商品。\u003c/li>\n\u003cli>\u003cstrong>投影邊界\u003c/strong>：主要目標、來源定位、圖表製作規格及本區是編輯資料，不作額外正文。若後續需要顯示其他說明文字，必須納入 120 字重新檢查。\u003c/li>\n\u003cli>\u003cstrong>字數狀態\u003c/strong>：以獨立內容檢查報告為準；本文件尚未宣稱人工驗收通過。\u003c/li>\n\u003c/ul>", "source": "# 01／零基礎個人投資與理財入門\n\n## 主要教學目標\n\n知道先盤點生活與目標，再理解投資工具的學習順序。\n\n## 正文\n\n- 理財計畫是安排生活支出、目標與錢的用途。投資是把錢投入可能增值、也可能虧損的工具。\n- 像旅行先看旅費。依序學收錢花錢、錢與物價、工具、可能損失與計畫。\n- 路線只是概念示意，結果與時間不保證。現在不投資也可以有計畫。\n\n## 圖表規格\n\n以下為供下一階段製作 SVG 的規格，不含 SVG 或 HTML 程式碼。短標籤不承載未計字的完整解說；正文是唯一可直接投影的說明文字。\n\n- **未來 SVG 標題**：五站學習路線。\n- **類型與標示**：【教學轉譯／概念示意】，五站流程關係圖，並非資金成長曲線。\n- **座標軸／單位**：不適用。站點表示學習順序，不表示時間長度或收益大小。\n- **圖例**：數字 1–5 代表學習順序，連線只代表先後；不依顏色判讀。\n- **短標籤**：1 生活的錢、2 錢與物價、3 工具、4 可能損失、5 計畫。\n- **資料依據**：Wiki 目錄的五課，旅行比喻取 Wiki 05。\n- **文字說明**：正文第 2、3 點已交代路線與比喻限制，不在圖外增加另一段解說。\n- **無障礙描述規格**：描述五站的先後，並重述結果不保證。非本輪生成 SVG。\n\n## 來源與定位\n\n對應 [已核准大綱](../outline.md)第 1 頁及 [來源對照表](../source-map.md)同頁。\n\nWiki：[01-budget-and-emergency-fund.md](../../wiki/01-budget-and-emergency-fund.md)；[05-first-financial-plan.md](../../wiki/05-first-financial-plan.md)。段落：Wiki 01「一句話白話定義」；Wiki 05「一句話白話定義」之依序執行、「生活化比喻」。\n\n- [S001](../../sources/catalog.md#s001)：收入支出健檢試算說明。\n- [S004](../../sources/catalog.md#s004)：pp21–24、p34。\n\n圖表若有數字，均為 Wiki 假設例子，不是來源機構統計。概念圖與比喻為教學轉譯。\n\n## 編輯與檢查備註\n\n- **先備知識**：無金融先備；能辨認生活中的收錢與花錢。\n- **術語核對**：理財計畫、投資均在正文第 1 點解釋；預告改用收錢花錢、錢與物價、可能損失，將收支、計息、風險正式詞義留在對應教學頁。\n- **理解檢核**：編輯檢核：讀者能指出第一步是盤點生活，而非選商品。\n- **投影邊界**：主要目標、來源定位、圖表製作規格及本區是編輯資料，不作額外正文。若後續需要顯示其他說明文字，必須納入 120 字重新檢查。\n- **字數狀態**：以獨立內容檢查報告為準；本文件尚未宣稱人工驗收通過。\n"}, "slides/drafts/slide-02.md": {"title": "02／收支與緊急預備金", "html": "\u003ch1 id=\"02收支與緊急預備金\">02／收支與緊急預備金\u003c/h1>\n\u003ch2 id=\"主要教學目標\">主要教學目標\u003c/h2>\n\u003cp>能由月收支算出備用金目標與儲蓄時間。\u003c/p>\n\u003ch2 id=\"正文\">正文\u003c/h2>\n\u003cul>\n\u003cli>收入是收到的錢，支出是花掉的錢，結餘是兩者差額。\u003c/li>\n\u003cli>緊急預備金是急用備款，像信封留給生活與備用。假設從零存三個月生活費，結餘全存。\u003c/li>\n\u003cli>無其他支出欠款，不計利息稅費及收支物價變動。三個月非通則，結餘不全可投資。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"圖表規格\">圖表規格\u003c/h2>\n\u003cp>以下為供下一階段製作 SVG 的規格，不含 SVG 或 HTML 程式碼。短標籤不承載未計字的完整解說；正文是唯一可直接投影的說明文字。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>未來 SVG 標題\u003c/strong>：每月結餘、備用金目標與所需時間。\u003c/li>\n\u003cli>\u003cstrong>類型與標示\u003c/strong>：【假設模擬】三步算式圖；旁附【概念示意】生活、備用、未來三信封。\u003c/li>\n\u003cli>\u003cstrong>座標軸／單位\u003c/strong>：算式圖不使用 XY 軸。金額為新臺幣元；結餘為元／月；存款期間為月。\u003c/li>\n\u003cli>\u003cstrong>圖例\u003c/strong>：生活費、每月結餘、目標及所需月份以文字識別，無額外顏色編碼。\u003c/li>\n\u003cli>\u003cstrong>資料／短標籤\u003c/strong>：月收入 30,000 元；月生活費 24,000 元；30,000−24,000＝6,000 元／月；24,000×3＝72,000 元；72,000÷6,000＝12 個月。\u003c/li>\n\u003cli>\u003cstrong>假設\u003c/strong>：只使用正文列出的條件，不在圖中另藏假設。\u003c/li>\n\u003cli>\u003cstrong>文字說明\u003c/strong>：正文說明結餘先存備款與三個月非通則，數字圖表顯示三步計算。\u003c/li>\n\u003cli>\u003cstrong>無障礙描述規格\u003c/strong>：依序讀出三步算式及單位，說明三信封是用途比喻，不代表真要使用信封。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"來源與定位\">來源與定位\u003c/h2>\n\u003cp>對應 \u003ca href=\"reader.html?doc=slides/outline.md\">已核准大綱\u003c/a>第 2 頁及 \u003ca href=\"reader.html?doc=slides/source-map.md\">來源對照表\u003c/a>同頁。\u003c/p>\n\u003cp>Wiki：\u003ca href=\"reader.html?doc=wiki/01-budget-and-emergency-fund.md\">01-budget-and-emergency-fund.md\u003c/a>。段落：「一句話白話定義」「生活化比喻」「具體數字小試算」與「新手最常踩的誤區」。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"reader.html?doc=sources/catalog.md#s001\">S001\u003c/a>：收入支出、現金健檢試算說明。\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004\u003c/a>：p24。\u003c/li>\n\u003c/ul>\n\u003cp>圖表若有數字，均為 Wiki 假設例子，不是來源機構統計。概念圖與比喻為教學轉譯。\u003c/p>\n\u003ch2 id=\"編輯與檢查備註\">編輯與檢查備註\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>先備知識\u003c/strong>：第 1 頁生活優先；加減乘除。\u003c/li>\n\u003cli>\u003cstrong>術語核對\u003c/strong>：收入、支出、收支結餘、緊急預備金均在正文第 1 點解釋。\u003c/li>\n\u003cli>\u003cstrong>理解檢核\u003c/strong>：編輯檢核：6,000 元在本例已安排到哪裡？\u003c/li>\n\u003cli>\u003cstrong>投影邊界\u003c/strong>：主要目標、來源定位、圖表製作規格及本區是編輯資料，不作額外正文。若後續需要顯示其他說明文字，必須納入 120 字重新檢查。\u003c/li>\n\u003cli>\u003cstrong>字數狀態\u003c/strong>：以獨立內容檢查報告為準；本文件尚未宣稱人工驗收通過。\u003c/li>\n\u003c/ul>", "source": "# 02／收支與緊急預備金\n\n## 主要教學目標\n\n能由月收支算出備用金目標與儲蓄時間。\n\n## 正文\n\n- 收入是收到的錢，支出是花掉的錢，結餘是兩者差額。\n- 緊急預備金是急用備款，像信封留給生活與備用。假設從零存三個月生活費，結餘全存。\n- 無其他支出欠款，不計利息稅費及收支物價變動。三個月非通則，結餘不全可投資。\n\n## 圖表規格\n\n以下為供下一階段製作 SVG 的規格，不含 SVG 或 HTML 程式碼。短標籤不承載未計字的完整解說；正文是唯一可直接投影的說明文字。\n\n- **未來 SVG 標題**：每月結餘、備用金目標與所需時間。\n- **類型與標示**：【假設模擬】三步算式圖；旁附【概念示意】生活、備用、未來三信封。\n- **座標軸／單位**：算式圖不使用 XY 軸。金額為新臺幣元；結餘為元／月；存款期間為月。\n- **圖例**：生活費、每月結餘、目標及所需月份以文字識別，無額外顏色編碼。\n- **資料／短標籤**：月收入 30,000 元；月生活費 24,000 元；30,000−24,000＝6,000 元／月；24,000×3＝72,000 元；72,000÷6,000＝12 個月。\n- **假設**：只使用正文列出的條件，不在圖中另藏假設。\n- **文字說明**：正文說明結餘先存備款與三個月非通則，數字圖表顯示三步計算。\n- **無障礙描述規格**：依序讀出三步算式及單位，說明三信封是用途比喻，不代表真要使用信封。\n\n## 來源與定位\n\n對應 [已核准大綱](../outline.md)第 2 頁及 [來源對照表](../source-map.md)同頁。\n\nWiki：[01-budget-and-emergency-fund.md](../../wiki/01-budget-and-emergency-fund.md)。段落：「一句話白話定義」「生活化比喻」「具體數字小試算」與「新手最常踩的誤區」。\n\n- [S001](../../sources/catalog.md#s001)：收入支出、現金健檢試算說明。\n- [S004](../../sources/catalog.md#s004)：p24。\n\n圖表若有數字，均為 Wiki 假設例子，不是來源機構統計。概念圖與比喻為教學轉譯。\n\n## 編輯與檢查備註\n\n- **先備知識**：第 1 頁生活優先；加減乘除。\n- **術語核對**：收入、支出、收支結餘、緊急預備金均在正文第 1 點解釋。\n- **理解檢核**：編輯檢核：6,000 元在本例已安排到哪裡？\n- **投影邊界**：主要目標、來源定位、圖表製作規格及本區是編輯資料，不作額外正文。若後續需要顯示其他說明文字，必須納入 120 字重新檢查。\n- **字數狀態**：以獨立內容檢查報告為準；本文件尚未宣稱人工驗收通過。\n"}, "slides/drafts/slide-03.md": {"title": "03／金額增加與購買力", "html": "\u003ch1 id=\"03金額增加與購買力\">03／金額增加與購買力\u003c/h1>\n\u003ch2 id=\"主要教學目標\">主要教學目標\u003c/h2>\n\u003cp>能區分帳面金額增加與能買到更多東西。\u003c/p>\n\u003ch2 id=\"正文\">正文\u003c/h2>\n\u003cul>\n\u003cli>通貨膨脹（通膨）是整體物價持續上升，購買力是同一筆錢能買多少。帳面金額是帳上錢數。\u003c/li>\n\u003cli>像便當漲價，但單店漲價不能證明整體通膨。\u003c/li>\n\u003cli>假設一年後，同一籃商品100元變105元，錢變102元仍買不足。這不是臺灣現況統計。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"圖表規格\">圖表規格\u003c/h2>\n\u003cp>以下為供下一階段製作 SVG 的規格，不含 SVG 或 HTML 程式碼。短標籤不承載未計字的完整解說；正文是唯一可直接投影的說明文字。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>未來 SVG 標題\u003c/strong>：同一籃商品價格與可用資金。\u003c/li>\n\u003cli>\u003cstrong>類型與標示\u003c/strong>：【假設模擬】分組直條金額比較圖，不是臺灣實際物價或投資績效。\u003c/li>\n\u003cli>\u003cstrong>X 軸／單位\u003c/strong>：時間組別「起始」「一年後」，時間為年，兩組等距。\u003c/li>\n\u003cli>\u003cstrong>Y 軸／單位\u003c/strong>：金額／新臺幣元，線性刻度，從 0 至 110；刻度 0、50、100、110。110 是繪圖範圍，不是新增觀測值。\u003c/li>\n\u003cli>\u003cstrong>圖例\u003c/strong>：固定商品籃價格、可用資金。以名稱加不同填紋識別，不只依顏色。\u003c/li>\n\u003cli>\u003cstrong>資料／短標籤\u003c/strong>：起始兩者均 100 元；一年後價格 105 元、資金 102 元；比較標記 102＜105。\u003c/li>\n\u003cli>\u003cstrong>假設\u003c/strong>：同一商品籃、同一年；未指定資金增加的來源，禁止自行加上利率或投資工具。\u003c/li>\n\u003cli>\u003cstrong>文字說明\u003c/strong>：正文第 3 點完整表達圖意、假設與非現況統計。\u003c/li>\n\u003cli>\u003cstrong>無障礙描述規格\u003c/strong>：讀出兩時點的四個金額及 102 小於 105，避免只說「左柱較高」。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"來源與定位\">來源與定位\u003c/h2>\n\u003cp>對應 \u003ca href=\"reader.html?doc=slides/outline.md\">已核准大綱\u003c/a>第 3 頁及 \u003ca href=\"reader.html?doc=slides/source-map.md\">來源對照表\u003c/a>同頁。\u003c/p>\n\u003cp>Wiki：\u003ca href=\"reader.html?doc=wiki/02-inflation-and-compound-interest.md\">02-inflation-and-compound-interest.md\u003c/a>。段落：「一句話白話定義」通膨與購買力段、「生活化比喻」、「具體數字小試算」最後的一年例子。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"reader.html?doc=sources/catalog.md#s002\">S002\u003c/a>：開頭家庭支出說明；「通貨膨脹起，財富大風吹」。\u003c/li>\n\u003c/ul>\n\u003cp>圖表若有數字，均為 Wiki 假設例子，不是來源機構統計。概念圖與比喻為教學轉譯。\u003c/p>\n\u003ch2 id=\"編輯與檢查備註\">編輯與檢查備註\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>先備知識\u003c/strong>：第 2 頁金額概念及大小比較；不需先懂複利。\u003c/li>\n\u003cli>\u003cstrong>術語核對\u003c/strong>：通貨膨脹、通膨、購買力、帳面金額在正文首點解釋。\u003c/li>\n\u003cli>\u003cstrong>理解檢核\u003c/strong>：編輯檢核：錢變多是否一定買得更多？\u003c/li>\n\u003cli>\u003cstrong>投影邊界\u003c/strong>：主要目標、來源定位、圖表製作規格及本區是編輯資料，不作額外正文。若後續需要顯示其他說明文字，必須納入 120 字重新檢查。\u003c/li>\n\u003cli>\u003cstrong>字數狀態\u003c/strong>：以獨立內容檢查報告為準；本文件尚未宣稱人工驗收通過。\u003c/li>\n\u003c/ul>", "source": "# 03／金額增加與購買力\n\n## 主要教學目標\n\n能區分帳面金額增加與能買到更多東西。\n\n## 正文\n\n- 通貨膨脹（通膨）是整體物價持續上升，購買力是同一筆錢能買多少。帳面金額是帳上錢數。\n- 像便當漲價，但單店漲價不能證明整體通膨。\n- 假設一年後，同一籃商品100元變105元，錢變102元仍買不足。這不是臺灣現況統計。\n\n## 圖表規格\n\n以下為供下一階段製作 SVG 的規格，不含 SVG 或 HTML 程式碼。短標籤不承載未計字的完整解說；正文是唯一可直接投影的說明文字。\n\n- **未來 SVG 標題**：同一籃商品價格與可用資金。\n- **類型與標示**：【假設模擬】分組直條金額比較圖，不是臺灣實際物價或投資績效。\n- **X 軸／單位**：時間組別「起始」「一年後」，時間為年，兩組等距。\n- **Y 軸／單位**：金額／新臺幣元，線性刻度，從 0 至 110；刻度 0、50、100、110。110 是繪圖範圍，不是新增觀測值。\n- **圖例**：固定商品籃價格、可用資金。以名稱加不同填紋識別，不只依顏色。\n- **資料／短標籤**：起始兩者均 100 元；一年後價格 105 元、資金 102 元；比較標記 102＜105。\n- **假設**：同一商品籃、同一年；未指定資金增加的來源，禁止自行加上利率或投資工具。\n- **文字說明**：正文第 3 點完整表達圖意、假設與非現況統計。\n- **無障礙描述規格**：讀出兩時點的四個金額及 102 小於 105，避免只說「左柱較高」。\n\n## 來源與定位\n\n對應 [已核准大綱](../outline.md)第 3 頁及 [來源對照表](../source-map.md)同頁。\n\nWiki：[02-inflation-and-compound-interest.md](../../wiki/02-inflation-and-compound-interest.md)。段落：「一句話白話定義」通膨與購買力段、「生活化比喻」、「具體數字小試算」最後的一年例子。\n\n- [S002](../../sources/catalog.md#s002)：開頭家庭支出說明；「通貨膨脹起，財富大風吹」。\n\n圖表若有數字，均為 Wiki 假設例子，不是來源機構統計。概念圖與比喻為教學轉譯。\n\n## 編輯與檢查備註\n\n- **先備知識**：第 2 頁金額概念及大小比較；不需先懂複利。\n- **術語核對**：通貨膨脹、通膨、購買力、帳面金額在正文首點解釋。\n- **理解檢核**：編輯檢核：錢變多是否一定買得更多？\n- **投影邊界**：主要目標、來源定位、圖表製作規格及本區是編輯資料，不作額外正文。若後續需要顯示其他說明文字，必須納入 120 字重新檢查。\n- **字數狀態**：以獨立內容檢查報告為準；本文件尚未宣稱人工驗收通過。\n"}, "slides/drafts/slide-04.md": {"title": "04／單利與複利", "html": "\u003ch1 id=\"04單利與複利\">04／單利與複利\u003c/h1>\n\u003ch2 id=\"主要教學目標\">主要教學目標\u003c/h2>\n\u003cp>能指出第二年的計息基礎如何造成單利與複利的差異。\u003c/p>\n\u003ch2 id=\"正文\">正文\u003c/h2>\n\u003cul>\n\u003cli>本金是最初的錢，利息是依約增加的錢。單利按原本金算，複利讓利息加入下期，像新小雞加入產蛋。\u003c/li>\n\u003cli>假設本金1萬元，年利率2%即每百元年息2元，計算用0.02，每年計息一次共兩年，無中途收付、不計稅費。\u003c/li>\n\u003cli>比喻不代表真實收益固定，也不保證獲利。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"圖表規格\">圖表規格\u003c/h2>\n\u003cp>以下為供下一階段製作 SVG 的規格，不含 SVG 或 HTML 程式碼。短標籤不承載未計字的完整解說；正文是唯一可直接投影的說明文字。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>未來 SVG 標題\u003c/strong>：每年 2% 的兩年單利與複利比較。\u003c/li>\n\u003cli>\u003cstrong>類型與標示\u003c/strong>：【假設模擬】年度比較表；比喻另用【教學轉譯／概念示意】雞群與新增小雞。只表示計息基礎，不表示真實收益固定。\u003c/li>\n\u003cli>\u003cstrong>座標軸／單位\u003c/strong>：表格不設 XY 軸。欄位是年度（年），列是計息方式；儲存格為新臺幣元。\u003c/li>\n\u003cli>\u003cstrong>圖例\u003c/strong>：單利＝原本金計息；複利＝利息加入下期。詞義已在正文，不增加其他分類。\u003c/li>\n\u003cli>\u003cstrong>資料／短標籤\u003c/strong>：年度 0、1、2；單利列 10,000、10,200、10,400；複利列 10,000、10,200、10,404。第二年利息分別為 200、204 元。核對算式 10,000×0.02＝200、10,200×0.02＝204。\u003c/li>\n\u003cli>\u003cstrong>假設\u003c/strong>：原本金 10,000 元，固定年利率 2%，每年計息一次共兩年，無中途收付，忽略稅費；皆在正文交代。\u003c/li>\n\u003cli>\u003cstrong>文字說明\u003c/strong>：正文說明第二年計息基礎；圖表只呈現金額，不外推長期成長曲線。\u003c/li>\n\u003cli>\u003cstrong>無障礙描述規格\u003c/strong>：逐列讀 0–2 年金額，指出第二年利息 200 與 204 的差別。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"來源與定位\">來源與定位\u003c/h2>\n\u003cp>對應 \u003ca href=\"reader.html?doc=slides/outline.md\">已核准大綱\u003c/a>第 4 頁及 \u003ca href=\"reader.html?doc=slides/source-map.md\">來源對照表\u003c/a>同頁。\u003c/p>\n\u003cp>Wiki：\u003ca href=\"reader.html?doc=wiki/02-inflation-and-compound-interest.md\">02-inflation-and-compound-interest.md\u003c/a>。段落：「一句話白話定義」計息段、「生活化比喻」、「具體數字小試算」單利與複利兩段。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"reader.html?doc=sources/catalog.md#s006\">S006\u003c/a>：pp11、13；不用 p12 誤植。\u003c/li>\n\u003c/ul>\n\u003cp>圖表若有數字，均為 Wiki 假設例子，不是來源機構統計。概念圖與比喻為教學轉譯。\u003c/p>\n\u003ch2 id=\"編輯與檢查備註\">編輯與檢查備註\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>先備知識\u003c/strong>：第 2 頁加乘運算；本頁複習百分比。\u003c/li>\n\u003cli>\u003cstrong>術語核對\u003c/strong>：本金、利息、單利、複利及年利率均須在正文解釋，百分比附小數。\u003c/li>\n\u003cli>\u003cstrong>理解檢核\u003c/strong>：編輯檢核：第二年複利按哪筆金額計息？\u003c/li>\n\u003cli>\u003cstrong>投影邊界\u003c/strong>：主要目標、來源定位、圖表製作規格及本區是編輯資料，不作額外正文。若後續需要顯示其他說明文字，必須納入 120 字重新檢查。\u003c/li>\n\u003cli>\u003cstrong>字數狀態\u003c/strong>：以獨立內容檢查報告為準；本文件尚未宣稱人工驗收通過。\u003c/li>\n\u003c/ul>", "source": "# 04／單利與複利\n\n## 主要教學目標\n\n能指出第二年的計息基礎如何造成單利與複利的差異。\n\n## 正文\n\n- 本金是最初的錢，利息是依約增加的錢。單利按原本金算，複利讓利息加入下期，像新小雞加入產蛋。\n- 假設本金1萬元，年利率2%即每百元年息2元，計算用0.02，每年計息一次共兩年，無中途收付、不計稅費。\n- 比喻不代表真實收益固定，也不保證獲利。\n\n## 圖表規格\n\n以下為供下一階段製作 SVG 的規格，不含 SVG 或 HTML 程式碼。短標籤不承載未計字的完整解說；正文是唯一可直接投影的說明文字。\n\n- **未來 SVG 標題**：每年 2% 的兩年單利與複利比較。\n- **類型與標示**：【假設模擬】年度比較表；比喻另用【教學轉譯／概念示意】雞群與新增小雞。只表示計息基礎，不表示真實收益固定。\n- **座標軸／單位**：表格不設 XY 軸。欄位是年度（年），列是計息方式；儲存格為新臺幣元。\n- **圖例**：單利＝原本金計息；複利＝利息加入下期。詞義已在正文，不增加其他分類。\n- **資料／短標籤**：年度 0、1、2；單利列 10,000、10,200、10,400；複利列 10,000、10,200、10,404。第二年利息分別為 200、204 元。核對算式 10,000×0.02＝200、10,200×0.02＝204。\n- **假設**：原本金 10,000 元，固定年利率 2%，每年計息一次共兩年，無中途收付，忽略稅費；皆在正文交代。\n- **文字說明**：正文說明第二年計息基礎；圖表只呈現金額，不外推長期成長曲線。\n- **無障礙描述規格**：逐列讀 0–2 年金額，指出第二年利息 200 與 204 的差別。\n\n## 來源與定位\n\n對應 [已核准大綱](../outline.md)第 4 頁及 [來源對照表](../source-map.md)同頁。\n\nWiki：[02-inflation-and-compound-interest.md](../../wiki/02-inflation-and-compound-interest.md)。段落：「一句話白話定義」計息段、「生活化比喻」、「具體數字小試算」單利與複利兩段。\n\n- [S006](../../sources/catalog.md#s006)：pp11、13；不用 p12 誤植。\n\n圖表若有數字，均為 Wiki 假設例子，不是來源機構統計。概念圖與比喻為教學轉譯。\n\n## 編輯與檢查備註\n\n- **先備知識**：第 2 頁加乘運算；本頁複習百分比。\n- **術語核對**：本金、利息、單利、複利及年利率均須在正文解釋，百分比附小數。\n- **理解檢核**：編輯檢核：第二年複利按哪筆金額計息？\n- **投影邊界**：主要目標、來源定位、圖表製作規格及本區是編輯資料，不作額外正文。若後續需要顯示其他說明文字，必須納入 120 字重新檢查。\n- **字數狀態**：以獨立內容檢查報告為準；本文件尚未宣稱人工驗收通過。\n"}, "slides/drafts/slide-05.md": {"title": "05／股票與債券的身分差異", "html": "\u003ch1 id=\"05股票與債券的身分差異\">05／股票與債券的身分差異\u003c/h1>\n\u003ch2 id=\"主要教學目標\">主要教學目標\u003c/h2>\n\u003cp>能區分公司部分所有人與依約請求還本付息的出借者。\u003c/p>\n\u003ch2 id=\"正文\">正文\u003c/h2>\n\u003cul>\n\u003cli>股票是公司部分所有權，持有人叫股東。股利是公司賺錢後分給股東的錢，不保證每年都有。\u003c/li>\n\u003cli>債券像借錢給店家，債權是依約請求還本付息的關係，出借不等於合資。股票像合資開店。\u003c/li>\n\u003cli>違約是未能按約付款，借據不保證收得回錢，付款約定仍要查。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"圖表規格\">圖表規格\u003c/h2>\n\u003cp>以下為供下一階段製作 SVG 的規格，不含 SVG 或 HTML 程式碼。短標籤不承載未計字的完整解說；正文是唯一可直接投影的說明文字。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>未來 SVG 標題\u003c/strong>：合資開店與出借資金的身分對照。\u003c/li>\n\u003cli>\u003cstrong>類型與標示\u003c/strong>：【教學轉譯／概念示意】兩方身分關係圖，不是實際商品或法律契約範本。\u003c/li>\n\u003cli>\u003cstrong>座標軸／單位\u003c/strong>：不適用。圖只表示身分與請求關係，不比較金額或報酬。\u003c/li>\n\u003cli>\u003cstrong>圖例\u003c/strong>：股票連到股東／部分所有權；債券連到出借者／依約還本付息。使用文字與線型辨識。\u003c/li>\n\u003cli>\u003cstrong>短標籤\u003c/strong>：股票、股東、股利；債券、債權、違約。所有詞義只使用正文已給的說明。\u003c/li>\n\u003cli>\u003cstrong>假設與限制\u003c/strong>：不新增清償順位、轉換權或特殊商品；不畫固定收入或保本圖示。\u003c/li>\n\u003cli>\u003cstrong>文字說明\u003c/strong>：正文已說明合資／出借比喻與付款不保證，無額外隱藏文字。\u003c/li>\n\u003cli>\u003cstrong>無障礙描述規格\u003c/strong>：說明兩種身分，不以圖形位置或顏色暗示誰更安全。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"來源與定位\">來源與定位\u003c/h2>\n\u003cp>對應 \u003ca href=\"reader.html?doc=slides/outline.md\">已核准大綱\u003c/a>第 5 頁及 \u003ca href=\"reader.html?doc=slides/source-map.md\">來源對照表\u003c/a>同頁。\u003c/p>\n\u003cp>Wiki：\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">03-stocks-bonds-funds-etfs.md\u003c/a>。段落：「一句話白話定義」表格股票、債券列；「生活化比喻」；「具體數字小試算」第 3 點與限制。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004\u003c/a>：pp8–9。\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=sources/catalog.md#s007\">S007\u003c/a>：壹、定義：一及二之利率、年限、還本與付息方式。\u003c/li>\n\u003c/ul>\n\u003cp>圖表若有數字，均為 Wiki 假設例子，不是來源機構統計。概念圖與比喻為教學轉譯。\u003c/p>\n\u003ch2 id=\"編輯與檢查備註\">編輯與檢查備註\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>先備知識\u003c/strong>：第 4 頁本金、利息；合資與借款的日常直覺。\u003c/li>\n\u003cli>\u003cstrong>術語核對\u003c/strong>：股票、股東、股利、債券、債權、違約須在正文給白話；本金、利息沿用第 4 頁。\u003c/li>\n\u003cli>\u003cstrong>理解檢核\u003c/strong>：編輯檢核：僅持有一般債券就成為股東嗎？\u003c/li>\n\u003cli>\u003cstrong>投影邊界\u003c/strong>：主要目標、來源定位、圖表製作規格及本區是編輯資料，不作額外正文。若後續需要顯示其他說明文字，必須納入 120 字重新檢查。\u003c/li>\n\u003cli>\u003cstrong>字數狀態\u003c/strong>：以獨立內容檢查報告為準；本文件尚未宣稱人工驗收通過。\u003c/li>\n\u003c/ul>", "source": "# 05／股票與債券的身分差異\n\n## 主要教學目標\n\n能區分公司部分所有人與依約請求還本付息的出借者。\n\n## 正文\n\n- 股票是公司部分所有權，持有人叫股東。股利是公司賺錢後分給股東的錢，不保證每年都有。\n- 債券像借錢給店家，債權是依約請求還本付息的關係，出借不等於合資。股票像合資開店。\n- 違約是未能按約付款，借據不保證收得回錢，付款約定仍要查。\n\n## 圖表規格\n\n以下為供下一階段製作 SVG 的規格，不含 SVG 或 HTML 程式碼。短標籤不承載未計字的完整解說；正文是唯一可直接投影的說明文字。\n\n- **未來 SVG 標題**：合資開店與出借資金的身分對照。\n- **類型與標示**：【教學轉譯／概念示意】兩方身分關係圖，不是實際商品或法律契約範本。\n- **座標軸／單位**：不適用。圖只表示身分與請求關係，不比較金額或報酬。\n- **圖例**：股票連到股東／部分所有權；債券連到出借者／依約還本付息。使用文字與線型辨識。\n- **短標籤**：股票、股東、股利；債券、債權、違約。所有詞義只使用正文已給的說明。\n- **假設與限制**：不新增清償順位、轉換權或特殊商品；不畫固定收入或保本圖示。\n- **文字說明**：正文已說明合資／出借比喻與付款不保證，無額外隱藏文字。\n- **無障礙描述規格**：說明兩種身分，不以圖形位置或顏色暗示誰更安全。\n\n## 來源與定位\n\n對應 [已核准大綱](../outline.md)第 5 頁及 [來源對照表](../source-map.md)同頁。\n\nWiki：[03-stocks-bonds-funds-etfs.md](../../wiki/03-stocks-bonds-funds-etfs.md)。段落：「一句話白話定義」表格股票、債券列；「生活化比喻」；「具體數字小試算」第 3 點與限制。\n\n- [S004](../../sources/catalog.md#s004)：pp8–9。\n- [S007](../../sources/catalog.md#s007)：壹、定義：一及二之利率、年限、還本與付息方式。\n\n圖表若有數字，均為 Wiki 假設例子，不是來源機構統計。概念圖與比喻為教學轉譯。\n\n## 編輯與檢查備註\n\n- **先備知識**：第 4 頁本金、利息；合資與借款的日常直覺。\n- **術語核對**：股票、股東、股利、債券、債權、違約須在正文給白話；本金、利息沿用第 4 頁。\n- **理解檢核**：編輯檢核：僅持有一般債券就成為股東嗎？\n- **投影邊界**：主要目標、來源定位、圖表製作規格及本區是編輯資料，不作額外正文。若後續需要顯示其他說明文字，必須納入 120 字重新檢查。\n- **字數狀態**：以獨立內容檢查報告為準；本文件尚未宣稱人工驗收通過。\n"}, "slides/drafts/slide-06.md": {"title": "06／基金與ETF的包含關係", "html": "\u003ch1 id=\"06基金與etf的包含關係\">06／基金與ETF的包含關係\u003c/h1>\n\u003ch2 id=\"主要教學目標\">主要教學目標\u003c/h2>\n\u003cp>知道 ETF 是基金的一種，交易方式不代表必定分散或獲利。\u003c/p>\n\u003ch2 id=\"正文\">正文\u003c/h2>\n\u003cul>\n\u003cli>基金是大家湊錢交管理者按規則投資，像合買綜合便當。\u003c/li>\n\u003cli>ETF是在交易所買賣的基金。交易所是依規則讓買賣雙方成交的市場，費用是買賣或使用產品付的錢。\u003c/li>\n\u003cli>便當只比喻集合與交易形式，內容未必多樣，仍要查可能損失，不保證獲利。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"圖表規格\">圖表規格\u003c/h2>\n\u003cp>以下為供下一階段製作 SVG 的規格，不含 SVG 或 HTML 程式碼。短標籤不承載未計字的完整解說；正文是唯一可直接投影的說明文字。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>未來 SVG 標題\u003c/strong>：ETF 屬於基金。\u003c/li>\n\u003cli>\u003cstrong>類型與標示\u003c/strong>：【教學轉譯／概念示意】包含關係圖，不是數量比例圖。\u003c/li>\n\u003cli>\u003cstrong>座標軸／單位\u003c/strong>：不適用。外範圍為基金，內範圍為 ETF；面積大小不代表市場占比。\u003c/li>\n\u003cli>\u003cstrong>圖例／短標籤\u003c/strong>：外框「基金」、內框「ETF」；用框線、文字表達包含，不只依顏色。\u003c/li>\n\u003cli>\u003cstrong>資料依據\u003c/strong>：Wiki 03 基金、ETF 定義及便當比喻；不放主動／被動細分類或市場數據。\u003c/li>\n\u003cli>\u003cstrong>假設與限制\u003c/strong>：概念示意，不代表內容相同、商品比例或安全程度；不得加低費用保證。\u003c/li>\n\u003cli>\u003cstrong>文字說明\u003c/strong>：正文第 2 點給定義，第 3 點保留便當比喻限制。\u003c/li>\n\u003cli>\u003cstrong>無障礙描述規格\u003c/strong>：說明 ETF 在基金大類之內，避免把兩者說成互斥。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"來源與定位\">來源與定位\u003c/h2>\n\u003cp>對應 \u003ca href=\"reader.html?doc=slides/outline.md\">已核准大綱\u003c/a>第 6 頁及 \u003ca href=\"reader.html?doc=slides/source-map.md\">來源對照表\u003c/a>同頁。\u003c/p>\n\u003cp>Wiki：\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">03-stocks-bonds-funds-etfs.md\u003c/a>。段落：「一句話白話定義」表格基金、ETF 列；「生活化比喻」及「新手最常踩的誤區」第 1、4 點。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004\u003c/a>：p10。\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=sources/catalog.md#s003\">S003\u003c/a>：Q1–Q3、Q8；並讀 Q2，不泛稱 ETF 全為被動式。\u003c/li>\n\u003c/ul>\n\u003cp>圖表若有數字，均為 Wiki 假設例子，不是來源機構統計。概念圖與比喻為教學轉譯。\u003c/p>\n\u003ch2 id=\"編輯與檢查備註\">編輯與檢查備註\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>先備知識\u003c/strong>：第 5 頁已認識工具；能理解大類包含小類。\u003c/li>\n\u003cli>\u003cstrong>術語核對\u003c/strong>：基金、ETF、交易所、費用在正文說明；正文以「可能損失」「內容未必多樣」說明限制，分散的正式詞義留在第 7 頁。\u003c/li>\n\u003cli>\u003cstrong>理解檢核\u003c/strong>：編輯檢核：ETF 是否屬於基金？\u003c/li>\n\u003cli>\u003cstrong>投影邊界\u003c/strong>：主要目標、來源定位、圖表製作規格及本區是編輯資料，不作額外正文。若後續需要顯示其他說明文字，必須納入 120 字重新檢查。\u003c/li>\n\u003cli>\u003cstrong>字數狀態\u003c/strong>：以獨立內容檢查報告為準；本文件尚未宣稱人工驗收通過。\u003c/li>\n\u003c/ul>", "source": "# 06／基金與ETF的包含關係\n\n## 主要教學目標\n\n知道 ETF 是基金的一種，交易方式不代表必定分散或獲利。\n\n## 正文\n\n- 基金是大家湊錢交管理者按規則投資，像合買綜合便當。\n- ETF是在交易所買賣的基金。交易所是依規則讓買賣雙方成交的市場，費用是買賣或使用產品付的錢。\n- 便當只比喻集合與交易形式，內容未必多樣，仍要查可能損失，不保證獲利。\n\n## 圖表規格\n\n以下為供下一階段製作 SVG 的規格，不含 SVG 或 HTML 程式碼。短標籤不承載未計字的完整解說；正文是唯一可直接投影的說明文字。\n\n- **未來 SVG 標題**：ETF 屬於基金。\n- **類型與標示**：【教學轉譯／概念示意】包含關係圖，不是數量比例圖。\n- **座標軸／單位**：不適用。外範圍為基金，內範圍為 ETF；面積大小不代表市場占比。\n- **圖例／短標籤**：外框「基金」、內框「ETF」；用框線、文字表達包含，不只依顏色。\n- **資料依據**：Wiki 03 基金、ETF 定義及便當比喻；不放主動／被動細分類或市場數據。\n- **假設與限制**：概念示意，不代表內容相同、商品比例或安全程度；不得加低費用保證。\n- **文字說明**：正文第 2 點給定義，第 3 點保留便當比喻限制。\n- **無障礙描述規格**：說明 ETF 在基金大類之內，避免把兩者說成互斥。\n\n## 來源與定位\n\n對應 [已核准大綱](../outline.md)第 6 頁及 [來源對照表](../source-map.md)同頁。\n\nWiki：[03-stocks-bonds-funds-etfs.md](../../wiki/03-stocks-bonds-funds-etfs.md)。段落：「一句話白話定義」表格基金、ETF 列；「生活化比喻」及「新手最常踩的誤區」第 1、4 點。\n\n- [S004](../../sources/catalog.md#s004)：p10。\n- [S003](../../sources/catalog.md#s003)：Q1–Q3、Q8；並讀 Q2，不泛稱 ETF 全為被動式。\n\n圖表若有數字，均為 Wiki 假設例子，不是來源機構統計。概念圖與比喻為教學轉譯。\n\n## 編輯與檢查備註\n\n- **先備知識**：第 5 頁已認識工具；能理解大類包含小類。\n- **術語核對**：基金、ETF、交易所、費用在正文說明；正文以「可能損失」「內容未必多樣」說明限制，分散的正式詞義留在第 7 頁。\n- **理解檢核**：編輯檢核：ETF 是否屬於基金？\n- **投影邊界**：主要目標、來源定位、圖表製作規格及本區是編輯資料，不作額外正文。若後續需要顯示其他說明文字，必須納入 120 字重新檢查。\n- **字數狀態**：以獨立內容檢查報告為準；本文件尚未宣稱人工驗收通過。\n"}, "slides/drafts/slide-07.md": {"title": "07／分散與配置仍可能損失", "html": "\u003ch1 id=\"07分散與配置仍可能損失\">07／分散與配置仍可能損失\u003c/h1>\n\u003ch2 id=\"主要教學目標\">主要教學目標\u003c/h2>\n\u003cp>能用同期間的組合算例解釋分散不保證免損失。\u003c/p>\n\u003ch2 id=\"正文\">正文\u003c/h2>\n\u003cul>\n\u003cli>風險是可能不如預期或損失，分散是減少依賴同一風險，配置是各類投資占多少。組合是一起算的投資。\u003c/li>\n\u003cli>像不同雨具也防不住所有風險。假設同期間1萬元，各半非建議，無中途收付、忽略稅費交易。\u003c/li>\n\u003cli>分散仍可能共同下跌而損失。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"圖表規格\">圖表規格\u003c/h2>\n\u003cp>以下為供下一階段製作 SVG 的規格，不含 SVG 或 HTML 程式碼。短標籤不承載未計字的完整解說；正文是唯一可直接投影的說明文字。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>未來 SVG 標題\u003c/strong>：同一筆資金在兩種假設情境下的期末金額。\u003c/li>\n\u003cli>\u003cstrong>類型與標示\u003c/strong>：【假設模擬】比較表，不是歷史績效。雨具是【教學轉譯／概念示意】，不代表保證保護。\u003c/li>\n\u003cli>\u003cstrong>座標軸／單位\u003c/strong>：表格不設 XY 軸。列為情境，欄為配置方式；期末金額單位新臺幣元。\u003c/li>\n\u003cli>\u003cstrong>圖例\u003c/strong>：A、B 為假設資產；全 A＝10,000 元放 A；各半＝A、B 各 5,000 元。使用文字標記，不只用紅綠顏色。\u003c/li>\n\u003cli>\u003cstrong>資料表短標籤\u003c/strong>：\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>情境\u003c/th>\u003cth>全 A 期末／元\u003c/th>\u003cth>A、B 各半期末／元\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>A−20%、B＋10%\u003c/td>\u003ctd>8,000\u003c/td>\u003ctd>9,500\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>A−20%、B−20%\u003c/td>\u003ctd>8,000\u003c/td>\u003ctd>8,000\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>試算依據\u003c/strong>：5,000×0.8＋5,000×1.1＝9,500；同跌時 5,000×0.8＋5,000×0.8＝8,000。所有值沿用 Wiki 04，不新增情境。\u003c/li>\n\u003cli>\u003cstrong>假設與限制\u003c/strong>：同期間、同初始 10,000 元，無中途收付，忽略稅費與交易；各半只是設定，不是推薦比例。假設與警語須留在正文，不塞進標籤。\u003c/li>\n\u003cli>\u003cstrong>文字說明\u003c/strong>：正文交代可能共同損失，表中兩情境供比較，不畫成分散必然較佳。\u003c/li>\n\u003cli>\u003cstrong>無障礙描述規格\u003c/strong>：逐列讀情境及兩種期末金額，說明共同下跌時仍有損失。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"來源與定位\">來源與定位\u003c/h2>\n\u003cp>對應 \u003ca href=\"reader.html?doc=slides/outline.md\">已核准大綱\u003c/a>第 7 頁及 \u003ca href=\"reader.html?doc=slides/source-map.md\">來源對照表\u003c/a>同頁。\u003c/p>\n\u003cp>Wiki：\u003ca href=\"reader.html?doc=wiki/04-diversification-and-allocation.md\">04-diversification-and-allocation.md\u003c/a>。段落：「一句話白話定義」「生活化比喻」「具體數字小試算」四步與比例限制。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004\u003c/a>：pp22–24、p26。\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=sources/catalog.md#s003\">S003\u003c/a>：Q2、Q8，僅作了解產品內容之背景。\u003c/li>\n\u003c/ul>\n\u003cp>圖表若有數字，均為 Wiki 假設例子，不是來源機構統計。概念圖與比喻為教學轉譯。\u003c/p>\n\u003ch2 id=\"編輯與檢查備註\">編輯與檢查備註\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>先備知識\u003c/strong>：第 5、6 頁工具關係；百分比與金額加總。\u003c/li>\n\u003cli>\u003cstrong>術語核對\u003c/strong>：風險、分散、配置、組合均須白話；A、B 是假設資產，不是商品名稱。\u003c/li>\n\u003cli>\u003cstrong>理解檢核\u003c/strong>：編輯檢核：兩種資產同跌時，分開持有會免損失嗎？\u003c/li>\n\u003cli>\u003cstrong>投影邊界\u003c/strong>：主要目標、來源定位、圖表製作規格及本區是編輯資料，不作額外正文。若後續需要顯示其他說明文字，必須納入 120 字重新檢查。\u003c/li>\n\u003cli>\u003cstrong>字數狀態\u003c/strong>：以獨立內容檢查報告為準；本文件尚未宣稱人工驗收通過。\u003c/li>\n\u003c/ul>", "source": "# 07／分散與配置仍可能損失\n\n## 主要教學目標\n\n能用同期間的組合算例解釋分散不保證免損失。\n\n## 正文\n\n- 風險是可能不如預期或損失，分散是減少依賴同一風險，配置是各類投資占多少。組合是一起算的投資。\n- 像不同雨具也防不住所有風險。假設同期間1萬元，各半非建議，無中途收付、忽略稅費交易。\n- 分散仍可能共同下跌而損失。\n\n## 圖表規格\n\n以下為供下一階段製作 SVG 的規格，不含 SVG 或 HTML 程式碼。短標籤不承載未計字的完整解說；正文是唯一可直接投影的說明文字。\n\n- **未來 SVG 標題**：同一筆資金在兩種假設情境下的期末金額。\n- **類型與標示**：【假設模擬】比較表，不是歷史績效。雨具是【教學轉譯／概念示意】，不代表保證保護。\n- **座標軸／單位**：表格不設 XY 軸。列為情境，欄為配置方式；期末金額單位新臺幣元。\n- **圖例**：A、B 為假設資產；全 A＝10,000 元放 A；各半＝A、B 各 5,000 元。使用文字標記，不只用紅綠顏色。\n- **資料表短標籤**：\n\n| 情境 | 全 A 期末／元 | A、B 各半期末／元 |\n| --- | --- | --- |\n| A−20%、B＋10% | 8,000 | 9,500 |\n| A−20%、B−20% | 8,000 | 8,000 |\n\n- **試算依據**：5,000×0.8＋5,000×1.1＝9,500；同跌時 5,000×0.8＋5,000×0.8＝8,000。所有值沿用 Wiki 04，不新增情境。\n- **假設與限制**：同期間、同初始 10,000 元，無中途收付，忽略稅費與交易；各半只是設定，不是推薦比例。假設與警語須留在正文，不塞進標籤。\n- **文字說明**：正文交代可能共同損失，表中兩情境供比較，不畫成分散必然較佳。\n- **無障礙描述規格**：逐列讀情境及兩種期末金額，說明共同下跌時仍有損失。\n\n## 來源與定位\n\n對應 [已核准大綱](../outline.md)第 7 頁及 [來源對照表](../source-map.md)同頁。\n\nWiki：[04-diversification-and-allocation.md](../../wiki/04-diversification-and-allocation.md)。段落：「一句話白話定義」「生活化比喻」「具體數字小試算」四步與比例限制。\n\n- [S004](../../sources/catalog.md#s004)：pp22–24、p26。\n- [S003](../../sources/catalog.md#s003)：Q2、Q8，僅作了解產品內容之背景。\n\n圖表若有數字，均為 Wiki 假設例子，不是來源機構統計。概念圖與比喻為教學轉譯。\n\n## 編輯與檢查備註\n\n- **先備知識**：第 5、6 頁工具關係；百分比與金額加總。\n- **術語核對**：風險、分散、配置、組合均須白話；A、B 是假設資產，不是商品名稱。\n- **理解檢核**：編輯檢核：兩種資產同跌時，分開持有會免損失嗎？\n- **投影邊界**：主要目標、來源定位、圖表製作規格及本區是編輯資料，不作額外正文。若後續需要顯示其他說明文字，必須納入 120 字重新檢查。\n- **字數狀態**：以獨立內容檢查報告為準；本文件尚未宣稱人工驗收通過。\n"}, "slides/drafts/slide-08.md": {"title": "08／第一份理財計畫與付款前查核", "html": "\u003ch1 id=\"08第一份理財計畫與付款前查核\">08／第一份理財計畫與付款前查核\u003c/h1>\n\u003ch2 id=\"主要教學目標\">主要教學目標\u003c/h2>\n\u003cp>能依生活、目標及查核條件決定下一步，而非立刻購買商品。\u003c/p>\n\u003ch2 id=\"正文\">正文\u003c/h2>\n\u003cul>\n\u003cli>像規劃旅行，列收支、欠款、備款、目標期限與能承受的損失，結果不保證。\u003c/li>\n\u003cli>定期定額是固定日期金額投入。契約是約定的執行付款規則，先查可用錢與費用。\u003c/li>\n\u003cli>遇高報酬零風險又催匯款，暫停並另找官方資料核對查證，必要時洽防詐諮詢165。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"圖表規格\">圖表規格\u003c/h2>\n\u003cp>以下為供下一階段製作 SVG 的規格，不含 SVG 或 HTML 程式碼。短標籤不承載未計字的完整解說；正文是唯一可直接投影的說明文字。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>未來 SVG 標題\u003c/strong>：盤點、目標與付款前查核。\u003c/li>\n\u003cli>\u003cstrong>類型與標示\u003c/strong>：【教學轉譯／概念示意】清單流程；警訊取 Wiki 05 自編題，不是案件判決。\u003c/li>\n\u003cli>\u003cstrong>座標軸／單位\u003c/strong>：不適用。清單表示決策順序，不代表必須投資或保證達標時間。\u003c/li>\n\u003cli>\u003cstrong>圖例／短標籤\u003c/strong>：盤點、目標、查核；欄位：收入、支出、欠款、備用金、目標／期限、可承受損失；警訊：高報酬、零風險、當天匯款。\u003c/li>\n\u003cli>\u003cstrong>資料依據\u003c/strong>：Wiki 05 空白計畫、定期定額段與課末自編題；不放另一組數字案例，不新增問題選項。\u003c/li>\n\u003cli>\u003cstrong>假設與限制\u003c/strong>：只供自我盤點，不能要求在公開網頁輸入真實帳戶與財務資料；警訊只支持查證，不直接認定犯罪。\u003c/li>\n\u003cli>\u003cstrong>文字說明\u003c/strong>：正文第 1 點表達計畫與旅行限制，第 2、3 點表達契約與查證，不在圖外增列未計字說明。\u003c/li>\n\u003cli>\u003cstrong>無障礙描述規格\u003c/strong>：依序讀盤點、目標、查核，最後讀出暫停匯款及自行尋找官方管道的行動。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"來源與定位\">來源與定位\u003c/h2>\n\u003cp>對應 \u003ca href=\"reader.html?doc=slides/outline.md\">已核准大綱\u003c/a>第 8 頁及 \u003ca href=\"reader.html?doc=slides/source-map.md\">來源對照表\u003c/a>同頁。\u003c/p>\n\u003cp>Wiki：\u003ca href=\"reader.html?doc=wiki/05-first-financial-plan.md\">05-first-financial-plan.md\u003c/a>。段落：「一句話白話定義」依序執行、「生活化比喻」定期定額段、「具體數字小試算」空白計畫、「新手最常踩的誤區」與課末自編題。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"reader.html?doc=sources/catalog.md#s001\">S001\u003c/a>：收入支出、現金健檢。\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004\u003c/a>：pp21–24、p34（規劃）；pp5、17、31–33（防詐）。\u003c/li>\n\u003cli>\u003ca href=\"reader.html?doc=sources/catalog.md#s005\">S005\u003c/a>：投資人篇：貳、交易流程；參、常見問答 Q1–Q3。\u003c/li>\n\u003c/ul>\n\u003cp>圖表若有數字，均為 Wiki 假設例子，不是來源機構統計。概念圖與比喻為教學轉譯。\u003c/p>\n\u003ch2 id=\"編輯與檢查備註\">編輯與檢查備註\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>先備知識\u003c/strong>：第 1–7 頁；已知用途與損失承受的概念。\u003c/li>\n\u003cli>\u003cstrong>術語核對\u003c/strong>：定期定額、契約、查證、165 均在正文解釋；收支及備用金承接第 2 頁。\u003c/li>\n\u003cli>\u003cstrong>理解檢核\u003c/strong>：編輯檢核沿用 Wiki 05 情境：未查證前，是否應因催促而匯款？不在本頁新增選擇題。\u003c/li>\n\u003cli>\u003cstrong>投影邊界\u003c/strong>：主要目標、來源定位、圖表製作規格及本區是編輯資料，不作額外正文。若後續需要顯示其他說明文字，必須納入 120 字重新檢查。\u003c/li>\n\u003cli>\u003cstrong>字數狀態\u003c/strong>：以獨立內容檢查報告為準；本文件尚未宣稱人工驗收通過。\u003c/li>\n\u003c/ul>", "source": "# 08／第一份理財計畫與付款前查核\n\n## 主要教學目標\n\n能依生活、目標及查核條件決定下一步，而非立刻購買商品。\n\n## 正文\n\n- 像規劃旅行，列收支、欠款、備款、目標期限與能承受的損失，結果不保證。\n- 定期定額是固定日期金額投入。契約是約定的執行付款規則，先查可用錢與費用。\n- 遇高報酬零風險又催匯款，暫停並另找官方資料核對查證，必要時洽防詐諮詢165。\n\n## 圖表規格\n\n以下為供下一階段製作 SVG 的規格，不含 SVG 或 HTML 程式碼。短標籤不承載未計字的完整解說；正文是唯一可直接投影的說明文字。\n\n- **未來 SVG 標題**：盤點、目標與付款前查核。\n- **類型與標示**：【教學轉譯／概念示意】清單流程；警訊取 Wiki 05 自編題，不是案件判決。\n- **座標軸／單位**：不適用。清單表示決策順序，不代表必須投資或保證達標時間。\n- **圖例／短標籤**：盤點、目標、查核；欄位：收入、支出、欠款、備用金、目標／期限、可承受損失；警訊：高報酬、零風險、當天匯款。\n- **資料依據**：Wiki 05 空白計畫、定期定額段與課末自編題；不放另一組數字案例，不新增問題選項。\n- **假設與限制**：只供自我盤點，不能要求在公開網頁輸入真實帳戶與財務資料；警訊只支持查證，不直接認定犯罪。\n- **文字說明**：正文第 1 點表達計畫與旅行限制，第 2、3 點表達契約與查證，不在圖外增列未計字說明。\n- **無障礙描述規格**：依序讀盤點、目標、查核，最後讀出暫停匯款及自行尋找官方管道的行動。\n\n## 來源與定位\n\n對應 [已核准大綱](../outline.md)第 8 頁及 [來源對照表](../source-map.md)同頁。\n\nWiki：[05-first-financial-plan.md](../../wiki/05-first-financial-plan.md)。段落：「一句話白話定義」依序執行、「生活化比喻」定期定額段、「具體數字小試算」空白計畫、「新手最常踩的誤區」與課末自編題。\n\n- [S001](../../sources/catalog.md#s001)：收入支出、現金健檢。\n- [S004](../../sources/catalog.md#s004)：pp21–24、p34（規劃）；pp5、17、31–33（防詐）。\n- [S005](../../sources/catalog.md#s005)：投資人篇：貳、交易流程；參、常見問答 Q1–Q3。\n\n圖表若有數字，均為 Wiki 假設例子，不是來源機構統計。概念圖與比喻為教學轉譯。\n\n## 編輯與檢查備註\n\n- **先備知識**：第 1–7 頁；已知用途與損失承受的概念。\n- **術語核對**：定期定額、契約、查證、165 均在正文解釋；收支及備用金承接第 2 頁。\n- **理解檢核**：編輯檢核沿用 Wiki 05 情境：未查證前，是否應因催促而匯款？不在本頁新增選擇題。\n- **投影邊界**：主要目標、來源定位、圖表製作規格及本區是編輯資料，不作額外正文。若後續需要顯示其他說明文字，必須納入 120 字重新檢查。\n- **字數狀態**：以獨立內容檢查報告為準；本文件尚未宣稱人工驗收通過。\n"}, "slides/outline.md": {"title": "八頁教學簡報大綱", "html": "\u003ch1 id=\"八頁教學簡報大綱\">八頁教學簡報大綱\u003c/h1>\n\u003cp>專案：零基礎個人投資與理財入門。\u003c/p>\n\u003cp>\u003cstrong>文件階段：八頁大綱已由使用者明確確認，第 9.4 節人工審核通過。這份文件仍是核准的大綱，逐頁稿另存。\u003c/strong>\u003c/p>\n\u003ch2 id=\"規則與範圍\">規則與範圍\u003c/h2>\n\u003cul>\n\u003cli>僅從已驗收的五篇 Wiki 選取、壓縮內容；外部來源只用於追溯，不能繞過 Wiki 增加主張。\u003c/li>\n\u003cli>大綱初版時本機沒有本專案 AGENTS.md；當時依使用者明列規格核對。本輪已落地\u003ca href=\"reader.html?doc=AGENTS.md\">對話規格完整彙整版\u003c/a>，後續可依實體規則核對。版本限制見規則檔第 1 節；不回溯宣稱初版已讀過此檔。\u003c/li>\n\u003cli>固定八頁，含第 1 頁導入，不另外增加封面、練習頁、答案頁或參考資料頁。各頁頁腳放來源 ID，完整對照見 \u003ca href=\"reader.html?doc=slides/source-map.md\">source-map.md\u003c/a>。頁序亦納入本次人工審核。\u003c/li>\n\u003cli>正文預估含可見重點、術語解釋、必要假設及限制，原則不超過 120 個中文字。不把整段正文移到圖表標籤來規避字數；實際文字與精確字數於審核後的逐頁稿再檢查。\u003c/li>\n\u003cli>比喻均標為【教學轉譯／概念示意】，數字均標為【假設例子／假設模擬】，保留適用條件。圖表目前只規劃，不製圖、不撰寫圖表程式。\u003c/li>\n\u003cli>不採 S004 p25 未附出處的數據、不複製 S006 p12 誤植、不引入未解釋術語或任何個別商品推薦。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"第-1-頁\">第 1 頁\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>頁碼與標題\u003c/strong>：01／零基礎個人投資與理財入門。\u003c/li>\n\u003cli>\u003cstrong>一個主要教學目標\u003c/strong>：知道先盤點生活與目標，再理解投資工具的學習順序。\u003c/li>\n\u003cli>\u003cstrong>最多三個重點\u003c/strong>：\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>先了解生活中的錢，再談投資。\u003c/li>\n\u003cli>依序學收支、計息與物價、工具、風險、計畫。\u003c/li>\n\u003cli>現在不投入市場，也可以是合理的計畫。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>預定術語及白話解釋\u003c/strong>：「理財計畫」＝安排生活支出、目標及金錢用途；「投資」以「把錢投入可能增值、也可能虧損的工具」說明。尚不出現 ETF 等後續術語。\u003c/li>\n\u003cli>\u003cstrong>所需先備知識\u003c/strong>：無金融先備；能辨認生活中收到錢與花錢。\u003c/li>\n\u003cli>\u003cstrong>比喻、案例或圖表規劃\u003c/strong>：【教學轉譯／概念示意】沿用 Wiki 05 的旅行規劃比喻，以五個學習站點表示順序。限制：投資結果與時間不保證；順序是教學安排，不是官方規定。\u003c/li>\n\u003cli>\u003cstrong>對應 Wiki 條目及段落\u003c/strong>：\u003ca href=\"reader.html?doc=wiki/01-budget-and-emergency-fund.md\">Wiki 01\u003c/a>「一句話白話定義」；\u003ca href=\"reader.html?doc=wiki/05-first-financial-plan.md\">Wiki 05\u003c/a>「一句話白話定義」之依序執行、「生活化比喻」。五站名稱取自 \u003ca href=\"reader.html?doc=wiki/index.md\">Wiki 目錄\u003c/a>的五課，不新增課外單元。\u003c/li>\n\u003cli>\u003cstrong>來源 ID 與定位\u003c/strong>：\u003ca href=\"reader.html?doc=sources/catalog.md#s001\">S001\u003c/a>「收入支出健檢」試算說明；\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004\u003c/a> pp21–24、p34。僅支持規劃概念；五站的先後順序屬 Wiki 教學轉譯。\u003c/li>\n\u003cli>\u003cstrong>正文預估字數\u003c/strong>：約 80 個中文字，硬上限 120；含上述白話詞義與不保證結果的限制。\u003c/li>\n\u003cli>\u003cstrong>該頁檢查方式\u003c/strong>：核對五站均能返回 Wiki；不增加「必須投資」或獲利承諾；術語首見即說明。後續讀者檢核：能說出第一步是盤點生活，而非先挑商品。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"第-2-頁\">第 2 頁\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>頁碼與標題\u003c/strong>：02／收支與緊急預備金。\u003c/li>\n\u003cli>\u003cstrong>一個主要教學目標\u003c/strong>：能由月收支算出備用金目標與儲蓄時間。\u003c/li>\n\u003cli>\u003cstrong>最多三個重點\u003c/strong>：\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>收入減支出才是結餘，結餘仍可能已有用途。\u003c/li>\n\u003cli>備用金用來應付突發必要支出或收入中斷。\u003c/li>\n\u003cli>用假設的三個月目標練習，不視為通用標準。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>預定術語及白話解釋\u003c/strong>：「收入」＝收到的錢；「支出」＝花掉的錢；「收支結餘」＝收入減支出後留下的錢；「緊急預備金」＝急用且能及時取用的備用錢。\u003c/li>\n\u003cli>\u003cstrong>所需先備知識\u003c/strong>：第 1 頁的生活優先概念；加減乘除。\u003c/li>\n\u003cli>\u003cstrong>比喻、案例或圖表規劃\u003c/strong>：【教學轉譯／概念示意】三個信封：日常、備用、未來；不代表真要使用信封。【假設模擬】30,000−24,000＝6,000 元／月；24,000×3＝72,000 元；72,000÷6,000＝12 個月。假設備用金從零起、無其他支出或欠款、結餘全存，不計利息、稅費及收支物價變動。以三步算式呈現，不增加新數據。\u003c/li>\n\u003cli>\u003cstrong>對應 Wiki 條目及段落\u003c/strong>：\u003ca href=\"reader.html?doc=wiki/01-budget-and-emergency-fund.md\">Wiki 01\u003c/a>「一句話白話定義」「生活化比喻」「具體數字小試算」「新手最常踩的誤區」。\u003c/li>\n\u003cli>\u003cstrong>來源 ID 與定位\u003c/strong>：\u003ca href=\"reader.html?doc=sources/catalog.md#s001\">S001\u003c/a>「收入支出健檢」「現金健檢」試算說明；\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004\u003c/a> p24。數字與三個月設定來自 Wiki 自編例子，不是官方建議值。\u003c/li>\n\u003cli>\u003cstrong>正文預估字數\u003c/strong>：約 115 個中文字，上限 120；假設與月份非通則的提醒納入正文，不藏於引用。\u003c/li>\n\u003cli>\u003cstrong>該頁檢查方式\u003c/strong>：重算三步；檢查新臺幣、月與月份單位；確認保留「三個月為假設」「結餘全存」「非全可投資」。後續讀者檢核：能指出 6,000 元本例的既定用途。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"第-3-頁\">第 3 頁\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>頁碼與標題\u003c/strong>：03／金額增加與購買力。\u003c/li>\n\u003cli>\u003cstrong>一個主要教學目標\u003c/strong>：能區分帳面金額增加與能買到更多東西。\u003c/li>\n\u003cli>\u003cstrong>最多三個重點\u003c/strong>：\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>通膨看整體物價，不能只看一家店。\u003c/li>\n\u003cli>同一筆錢能買多少，才是購買力。\u003c/li>\n\u003cli>錢增加到 102 元，仍可能買不起原來那一籃商品。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>預定術語及白話解釋\u003c/strong>：「通貨膨脹（通膨）」＝整體物價水準持續上升；「購買力」＝同一筆錢能買多少東西；「帳面金額」＝帳上以元記下的錢數。\u003c/li>\n\u003cli>\u003cstrong>所需先備知識\u003c/strong>：第 2 頁的金額概念；大小比較。此頁不要求先懂複利。\u003c/li>\n\u003cli>\u003cstrong>比喻、案例或圖表規劃\u003c/strong>：【教學轉譯／概念示意】便當漲價使同一張百元鈔能買的份量縮小；提醒單店漲價不是整體通膨證據。【假設模擬】沿用 Wiki 02 一年例子，固定商品籃 100→105 元，可用資金 100→102 元；用成對金額比較圖，標示一年、元與 102＜105。只比較價格與資金，不虛構收益來源，不當作當年臺灣統計。\u003c/li>\n\u003cli>\u003cstrong>對應 Wiki 條目及段落\u003c/strong>：\u003ca href=\"reader.html?doc=wiki/02-inflation-and-compound-interest.md\">Wiki 02\u003c/a>「一句話白話定義」之通膨與購買力、「生活化比喻」「具體數字小試算」最後的一年例子。\u003c/li>\n\u003cli>\u003cstrong>來源 ID 與定位\u003c/strong>：\u003ca href=\"reader.html?doc=sources/catalog.md#s002\">S002\u003c/a>開頭家庭支出說明及「通貨膨脹起，財富大風吹」。100、102、105 為 Wiki 假設，非來源統計。\u003c/li>\n\u003cli>\u003cstrong>正文預估字數\u003c/strong>：約 95 個中文字，上限 120；含假設、非現況統計及單店比喻限制。\u003c/li>\n\u003cli>\u003cstrong>該頁檢查方式\u003c/strong>：核對 102＜105；圖表維持同一商品籃、同一期間與元單位；不得新增實質報酬公式、歷史通膨率或推薦抗通膨商品。後續讀者檢核：金額變多是否必然買得更多？\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"第-4-頁\">第 4 頁\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>頁碼與標題\u003c/strong>：04／單利與複利。\u003c/li>\n\u003cli>\u003cstrong>一個主要教學目標\u003c/strong>：能指出第二年的計息基礎如何造成單利與複利的差異。\u003c/li>\n\u003cli>\u003cstrong>最多三個重點\u003c/strong>：\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>單利每期只用原本金計息。\u003c/li>\n\u003cli>複利把利息留下，加入下一期的計息金額。\u003c/li>\n\u003cli>固定正利率的例題不代表真實投資保證成長。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>預定術語及白話解釋\u003c/strong>：「本金」＝最初投入的錢；「利息」＝依約計息增加的錢；「年利率」＝每年利息相對於計息金額的比例；「單利」＝只按原本金算；「複利」＝先前利息也加入下期計息。2% 以 0.02 說明，不出現未定義公式符號。\u003c/li>\n\u003cli>\u003cstrong>所需先備知識\u003c/strong>：第 2 頁的加乘運算；百分比 2%＝0.02（本頁簡短複習）。\u003c/li>\n\u003cli>\u003cstrong>比喻、案例或圖表規劃\u003c/strong>：【教學轉譯／概念示意】原有雞群產蛋，或把新小雞加入下一年雞群；不表示實際收益固定。【假設模擬】本金 10,000 元、每年 2%、每年計息一次、共兩年，無中途收付，忽略稅費；兩列年度表：單利 10,000→10,200→10,400，複利 10,000→10,200→10,404；標出第二年利息 200 與 204 元。不延伸為長期成長曲線。\u003c/li>\n\u003cli>\u003cstrong>對應 Wiki 條目及段落\u003c/strong>：\u003ca href=\"reader.html?doc=wiki/02-inflation-and-compound-interest.md\">Wiki 02\u003c/a>「一句話白話定義」之計息定義、「生活化比喻」「具體數字小試算」單利與複利兩段、「新手最常踩的誤區」。\u003c/li>\n\u003cli>\u003cstrong>來源 ID 與定位\u003c/strong>：\u003ca href=\"reader.html?doc=sources/catalog.md#s006\">S006\u003c/a> pp11、13；算例依 Wiki 自行推導。排除 p12 誤植及未追溯的名人引言。\u003c/li>\n\u003cli>\u003cstrong>正文預估字數\u003c/strong>：約 115 個中文字，上限 120；含詞義與固定條件。年度表金額是圖表標籤，假設與限制仍為正文。\u003c/li>\n\u003cli>\u003cstrong>該頁檢查方式\u003c/strong>：重算 10,000×0.02＝200、10,200×0.02＝204；核對第二年底 10,400／10,404；禁止把乘數再加百分號；後續讀者檢核：第二年複利應按哪筆金額計息？\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"第-5-頁\">第 5 頁\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>頁碼與標題\u003c/strong>：05／股票與債券的身分差異。\u003c/li>\n\u003cli>\u003cstrong>一個主要教學目標\u003c/strong>：能區分公司的部分所有人與依約請求還本付息的出借者。\u003c/li>\n\u003cli>\u003cstrong>最多三個重點\u003c/strong>：\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>股票是公司的一部分所有權，股利並非保證。\u003c/li>\n\u003cli>債券是依條件出借資金的關係，不等於公司所有權。\u003c/li>\n\u003cli>債券付款與還本須看條款及對方是否能履行。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>預定術語及白話解釋\u003c/strong>：「股票」＝公司一小部分所有權；「股東」＝持有股票的所有人；「股利」＝公司分給股東的盈餘；「債券」＝發行人依條件借錢的憑據；「債權」＝依約請求還本付息的關係；「違約」＝對方無法履行約定付款。本金、利息沿用第 4 頁，不另引入信用評等等術語。\u003c/li>\n\u003cli>\u003cstrong>所需先備知識\u003c/strong>：第 4 頁的本金與利息；知道所有人與借款人的差別。\u003c/li>\n\u003cli>\u003cstrong>比喻、案例或圖表規劃\u003c/strong>：【教學轉譯／概念示意】合資開飲料店，與按借款約定把錢借給店家，做身分對照。保留「分紅不保證、借據不保證實際付款」限制；本頁不放額外收益算例，降低詞義負荷。\u003c/li>\n\u003cli>\u003cstrong>對應 Wiki 條目及段落\u003c/strong>：\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">Wiki 03\u003c/a>「一句話白話定義」表格的股票、債券列；「生活化比喻」；「具體數字小試算」第 3 點及條款限制；「新手最常踩的誤區」。\u003c/li>\n\u003cli>\u003cstrong>來源 ID 與定位\u003c/strong>：\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004\u003c/a> pp8–9；\u003ca href=\"reader.html?doc=sources/catalog.md#s007\">S007\u003c/a>「壹、定義」一及二之票面利率、發行年限、還本方式、計付息方式。比喻是 Wiki 教學轉譯，不是原機構插圖。\u003c/li>\n\u003cli>\u003cstrong>正文預估字數\u003c/strong>：約 115 個中文字，上限 120；解釋與風險限制優先，不補充優先受償等課外內容。\u003c/li>\n\u003cli>\u003cstrong>該頁檢查方式\u003c/strong>：逐一核對股票所有權／債券請求權；不得寫「每年分紅」「債券必保本或都有到期日」。後續讀者檢核：僅持有一般債券是否就成為股東？\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"第-6-頁\">第 6 頁\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>頁碼與標題\u003c/strong>：06／基金與 ETF 的包含關係。\u003c/li>\n\u003cli>\u003cstrong>一個主要教學目標\u003c/strong>：知道 ETF 是基金的一種，交易方式不代表必定分散或獲利。\u003c/li>\n\u003cli>\u003cstrong>最多三個重點\u003c/strong>：\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>基金是集合資金，依規則交由管理者投資。\u003c/li>\n\u003cli>ETF 是能在交易所買賣的基金。\u003c/li>\n\u003cli>仍須了解投資內容、風險與費用，不單看名稱。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>預定術語及白話解釋\u003c/strong>：「基金」＝集合大家的錢按規則投資；「ETF」＝在交易所買賣的基金；「交易所」＝依規則撮合買賣的市場；「費用」＝使用或買賣產品支付的成本。此頁不講主動／被動分類，不使用英文縮寫以外的新術語。\u003c/li>\n\u003cli>\u003cstrong>所需先備知識\u003c/strong>：第 5 頁已認識投資工具；能理解大類包含小類。\u003c/li>\n\u003cli>\u003cstrong>比喻、案例或圖表規劃\u003c/strong>：【教學轉譯／概念示意】綜合便當比喻，配「基金」大範圍內含「ETF」的關係圖；只表達集合與交易形式，不暗示所有基金都持有相同內容、必然分散或安全。不引入價格、稅費率或虛構商品。\u003c/li>\n\u003cli>\u003cstrong>對應 Wiki 條目及段落\u003c/strong>：\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">Wiki 03\u003c/a>「一句話白話定義」表格基金、ETF 兩列；「生活化比喻」之便當與限制；「新手最常踩的誤區」第 1、4 點。\u003c/li>\n\u003cli>\u003cstrong>來源 ID 與定位\u003c/strong>：\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004\u003c/a> p10；\u003ca href=\"reader.html?doc=sources/catalog.md#s003\">S003\u003c/a> Q1–Q3、Q8。不得把 Q1 的指數描述改寫成所有 ETF 都只追蹤指數。\u003c/li>\n\u003cli>\u003cstrong>正文預估字數\u003c/strong>：約 100 個中文字，上限 120；含詞義及不保證安全的限制。\u003c/li>\n\u003cli>\u003cstrong>該頁檢查方式\u003c/strong>：包含關係方向必須為 ETF 屬於基金；圖中文字首見附解釋；不寫所有基金主動操作、所有 ETF 被動或費用一定較低。後續讀者檢核：ETF 和基金是否互不相干？\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"第-7-頁\">第 7 頁\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>頁碼與標題\u003c/strong>：07／分散與配置仍可能損失。\u003c/li>\n\u003cli>\u003cstrong>一個主要教學目標\u003c/strong>：能用同期間的組合算例解釋分散不保證免損失。\u003c/li>\n\u003cli>\u003cstrong>最多三個重點\u003c/strong>：\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>看風險來源是否重疊，不只看商品數量。\u003c/li>\n\u003cli>配置是決定各類資產占多少，不是抄固定比例。\u003c/li>\n\u003cli>分開持有仍可能一起下跌。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>預定術語及白話解釋\u003c/strong>：「風險」＝結果不如預期、甚至損失的可能性；「分散」＝減少依賴同一風險來源；「資產配置」＝決定每類投資占總資金多少；「組合」＝放在一起計算的投資。A、B 只是假設資產標記。\u003c/li>\n\u003cli>\u003cstrong>所需先備知識\u003c/strong>：第 5、6 頁的工具關係；百分比與金額加總。\u003c/li>\n\u003cli>\u003cstrong>比喻、案例或圖表規劃\u003c/strong>：【教學轉譯／概念示意】沿用雨具比喻，不能防住所有風險。【假設模擬】同期間 10,000 元：全 A 遇 A−20% 剩 8,000；各半 A、B 遇 A−20%、B＋10% 剩 9,500；若兩者均−20%，各半也剩 8,000。規劃兩情境金額比較表，不畫歷史績效曲線。50／50 非建議；無中途收付，忽略稅費與交易。\u003c/li>\n\u003cli>\u003cstrong>對應 Wiki 條目及段落\u003c/strong>：\u003ca href=\"reader.html?doc=wiki/04-diversification-and-allocation.md\">Wiki 04\u003c/a>「一句話白話定義」「生活化比喻」「具體數字小試算」四步與配置限制。\u003c/li>\n\u003cli>\u003cstrong>來源 ID 與定位\u003c/strong>：\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004\u003c/a> pp22–24、p26；\u003ca href=\"reader.html?doc=sources/catalog.md#s003\">S003\u003c/a> Q2、Q8 只支持了解產品內容；具體情境數字全部來自 Wiki 假設。排除 S004 p25 數據。\u003c/li>\n\u003cli>\u003cstrong>正文預估字數\u003c/strong>：約 115 個中文字，上限 120；保留假設、比喻限制、比例非建議及可能共同下跌。\u003c/li>\n\u003cli>\u003cstrong>該頁檢查方式\u003c/strong>：重算 4,000＋5,500＝9,500、兩者同跌各半剩 8,000；檢查圖表同期間同初始資金；不得畫成分散必然勝出。後續讀者檢核：兩種資產同跌時是否仍會虧損？\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"第-8-頁\">第 8 頁\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>頁碼與標題\u003c/strong>：08／第一份理財計畫與付款前查核。\u003c/li>\n\u003cli>\u003cstrong>一個主要教學目標\u003c/strong>：能依生活、目標及查核條件決定下一步，而非立刻購買商品。\u003c/li>\n\u003cli>\u003cstrong>最多三個重點\u003c/strong>：\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>寫出收支、欠款、備用金、目標期限與可承受損失。\u003c/li>\n\u003cli>若考慮定期定額，先確認可用金額、契約及費用。\u003c/li>\n\u003cli>遇保證高報酬又催匯款，暫停並找獨立官方管道查證。\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>\u003cstrong>預定術語及白話解釋\u003c/strong>：「定期定額」＝約定固定日期與金額投入；「契約」＝雙方約定的執行與付款規則；「查證」＝另找官方資料核對；「165」＝防詐諮詢管道。收支、備用金及風險沿用前頁詞義；不新增報酬評比術語。\u003c/li>\n\u003cli>\u003cstrong>所需先備知識\u003c/strong>：第 1–7 頁；知道可投資金額要考慮生活、已知用途與損失承受。\u003c/li>\n\u003cli>\u003cstrong>比喻、案例或圖表規劃\u003c/strong>：【教學轉譯／概念示意】沿用旅行規劃與保留回程車錢的比喻，以「盤點→目標→查核」清單收尾；結果不保證。【自編情境／概念示意】取 Wiki 05 課末題的「零風險、高報酬、當天匯款」三個警訊；只規劃先思考再查核的提示，不新增題目或額外頁。若後續採用該題，依既有練習連結查看解析。\u003c/li>\n\u003cli>\u003cstrong>對應 Wiki 條目及段落\u003c/strong>：\u003ca href=\"reader.html?doc=wiki/05-first-financial-plan.md\">Wiki 05\u003c/a>「一句話白話定義」依序執行、「生活化比喻」定期定額段、「具體數字小試算」空白計畫、「新手最常踩的誤區」及「知識網路連結」自編題。\u003c/li>\n\u003cli>\u003cstrong>來源 ID 與定位\u003c/strong>：\u003ca href=\"reader.html?doc=sources/catalog.md#s001\">S001\u003c/a>收入支出與現金健檢；\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004\u003c/a> pp21–24、p34（規劃），pp5、17、31–33（風險與防詐）；\u003ca href=\"reader.html?doc=sources/catalog.md#s005\">S005\u003c/a>投資人篇「貳、交易流程」「參、常見問答」Q1–Q3（安排及費用）。\u003c/li>\n\u003cli>\u003cstrong>正文預估字數\u003c/strong>：約 115 個中文字，上限 120；先保留三個重點、白話詞義及不保證結果的限制。清單僅留詞組，不把段落移入標籤；不再放另一組完整數字案例。\u003c/li>\n\u003cli>\u003cstrong>該頁檢查方式\u003c/strong>：每項清單回查 Wiki；定期定額不得等同獲利保證；警訊只支持暫停查證，不能直接認定個案違法；不得要求輸入真實帳戶資料。後續讀者檢核：未查證前是否應因催促而匯款？\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"第-94-節人工審核閘門\">第 9.4 節人工審核閘門\u003c/h2>\n\u003cp>\u003cstrong>狀態：已通過。\u003c/strong>\u003c/p>\n\u003cp>使用者本輪明確確認八頁、順序、Wiki 範圍、術語、來源與數字、資訊量及練習範圍。確認登錄起始時間為 2026-11-19 01:10:54 +08:00（操作時間，非訊息發送時間）。本次只允許逐頁稿與內容檢查；最終 HTML 與發布仍須等待使用者確認報告並下達 Step 7 指令。核准的八頁內容規劃未作實質改動。\u003c/p>\n\u003cp>後續狀態：使用者已於 Step 7 明確確認逐頁稿及內容報告並授權 HTML 交付；本機成品見\u003ca href=\"slides/index.html\">index.html\u003c/a>。公開網址仍依使用者要求，待其上傳後親自驗證。上述段落保留為前階段授權紀錄，不視為目前仍未獲准製作 HTML。\u003c/p>", "source": "# 八頁教學簡報大綱\n\n專案：零基礎個人投資與理財入門。\n\n**文件階段：八頁大綱已由使用者明確確認，第 9.4 節人工審核通過。這份文件仍是核准的大綱，逐頁稿另存。**\n\n## 規則與範圍\n\n- 僅從已驗收的五篇 Wiki 選取、壓縮內容；外部來源只用於追溯，不能繞過 Wiki 增加主張。\n- 大綱初版時本機沒有本專案 AGENTS.md；當時依使用者明列規格核對。本輪已落地[對話規格完整彙整版](../AGENTS.md)，後續可依實體規則核對。版本限制見規則檔第 1 節；不回溯宣稱初版已讀過此檔。\n- 固定八頁，含第 1 頁導入，不另外增加封面、練習頁、答案頁或參考資料頁。各頁頁腳放來源 ID，完整對照見 [source-map.md](source-map.md)。頁序亦納入本次人工審核。\n- 正文預估含可見重點、術語解釋、必要假設及限制，原則不超過 120 個中文字。不把整段正文移到圖表標籤來規避字數；實際文字與精確字數於審核後的逐頁稿再檢查。\n- 比喻均標為【教學轉譯／概念示意】，數字均標為【假設例子／假設模擬】，保留適用條件。圖表目前只規劃，不製圖、不撰寫圖表程式。\n- 不採 S004 p25 未附出處的數據、不複製 S006 p12 誤植、不引入未解釋術語或任何個別商品推薦。\n\n## 第 1 頁\n\n1. **頁碼與標題**：01／零基礎個人投資與理財入門。\n2. **一個主要教學目標**：知道先盤點生活與目標，再理解投資工具的學習順序。\n3. **最多三個重點**：\n   - 先了解生活中的錢，再談投資。\n   - 依序學收支、計息與物價、工具、風險、計畫。\n   - 現在不投入市場，也可以是合理的計畫。\n4. **預定術語及白話解釋**：「理財計畫」＝安排生活支出、目標及金錢用途；「投資」以「把錢投入可能增值、也可能虧損的工具」說明。尚不出現 ETF 等後續術語。\n5. **所需先備知識**：無金融先備；能辨認生活中收到錢與花錢。\n6. **比喻、案例或圖表規劃**：【教學轉譯／概念示意】沿用 Wiki 05 的旅行規劃比喻，以五個學習站點表示順序。限制：投資結果與時間不保證；順序是教學安排，不是官方規定。\n7. **對應 Wiki 條目及段落**：[Wiki 01](../wiki/01-budget-and-emergency-fund.md)「一句話白話定義」；[Wiki 05](../wiki/05-first-financial-plan.md)「一句話白話定義」之依序執行、「生活化比喻」。五站名稱取自 [Wiki 目錄](../wiki/index.md)的五課，不新增課外單元。\n8. **來源 ID 與定位**：[S001](../sources/catalog.md#s001)「收入支出健檢」試算說明；[S004](../sources/catalog.md#s004) pp21–24、p34。僅支持規劃概念；五站的先後順序屬 Wiki 教學轉譯。\n9. **正文預估字數**：約 80 個中文字，硬上限 120；含上述白話詞義與不保證結果的限制。\n10. **該頁檢查方式**：核對五站均能返回 Wiki；不增加「必須投資」或獲利承諾；術語首見即說明。後續讀者檢核：能說出第一步是盤點生活，而非先挑商品。\n\n## 第 2 頁\n\n1. **頁碼與標題**：02／收支與緊急預備金。\n2. **一個主要教學目標**：能由月收支算出備用金目標與儲蓄時間。\n3. **最多三個重點**：\n   - 收入減支出才是結餘，結餘仍可能已有用途。\n   - 備用金用來應付突發必要支出或收入中斷。\n   - 用假設的三個月目標練習，不視為通用標準。\n4. **預定術語及白話解釋**：「收入」＝收到的錢；「支出」＝花掉的錢；「收支結餘」＝收入減支出後留下的錢；「緊急預備金」＝急用且能及時取用的備用錢。\n5. **所需先備知識**：第 1 頁的生活優先概念；加減乘除。\n6. **比喻、案例或圖表規劃**：【教學轉譯／概念示意】三個信封：日常、備用、未來；不代表真要使用信封。【假設模擬】30,000−24,000＝6,000 元／月；24,000×3＝72,000 元；72,000÷6,000＝12 個月。假設備用金從零起、無其他支出或欠款、結餘全存，不計利息、稅費及收支物價變動。以三步算式呈現，不增加新數據。\n7. **對應 Wiki 條目及段落**：[Wiki 01](../wiki/01-budget-and-emergency-fund.md)「一句話白話定義」「生活化比喻」「具體數字小試算」「新手最常踩的誤區」。\n8. **來源 ID 與定位**：[S001](../sources/catalog.md#s001)「收入支出健檢」「現金健檢」試算說明；[S004](../sources/catalog.md#s004) p24。數字與三個月設定來自 Wiki 自編例子，不是官方建議值。\n9. **正文預估字數**：約 115 個中文字，上限 120；假設與月份非通則的提醒納入正文，不藏於引用。\n10. **該頁檢查方式**：重算三步；檢查新臺幣、月與月份單位；確認保留「三個月為假設」「結餘全存」「非全可投資」。後續讀者檢核：能指出 6,000 元本例的既定用途。\n\n## 第 3 頁\n\n1. **頁碼與標題**：03／金額增加與購買力。\n2. **一個主要教學目標**：能區分帳面金額增加與能買到更多東西。\n3. **最多三個重點**：\n   - 通膨看整體物價，不能只看一家店。\n   - 同一筆錢能買多少，才是購買力。\n   - 錢增加到 102 元，仍可能買不起原來那一籃商品。\n4. **預定術語及白話解釋**：「通貨膨脹（通膨）」＝整體物價水準持續上升；「購買力」＝同一筆錢能買多少東西；「帳面金額」＝帳上以元記下的錢數。\n5. **所需先備知識**：第 2 頁的金額概念；大小比較。此頁不要求先懂複利。\n6. **比喻、案例或圖表規劃**：【教學轉譯／概念示意】便當漲價使同一張百元鈔能買的份量縮小；提醒單店漲價不是整體通膨證據。【假設模擬】沿用 Wiki 02 一年例子，固定商品籃 100→105 元，可用資金 100→102 元；用成對金額比較圖，標示一年、元與 102＜105。只比較價格與資金，不虛構收益來源，不當作當年臺灣統計。\n7. **對應 Wiki 條目及段落**：[Wiki 02](../wiki/02-inflation-and-compound-interest.md)「一句話白話定義」之通膨與購買力、「生活化比喻」「具體數字小試算」最後的一年例子。\n8. **來源 ID 與定位**：[S002](../sources/catalog.md#s002)開頭家庭支出說明及「通貨膨脹起，財富大風吹」。100、102、105 為 Wiki 假設，非來源統計。\n9. **正文預估字數**：約 95 個中文字，上限 120；含假設、非現況統計及單店比喻限制。\n10. **該頁檢查方式**：核對 102＜105；圖表維持同一商品籃、同一期間與元單位；不得新增實質報酬公式、歷史通膨率或推薦抗通膨商品。後續讀者檢核：金額變多是否必然買得更多？\n\n## 第 4 頁\n\n1. **頁碼與標題**：04／單利與複利。\n2. **一個主要教學目標**：能指出第二年的計息基礎如何造成單利與複利的差異。\n3. **最多三個重點**：\n   - 單利每期只用原本金計息。\n   - 複利把利息留下，加入下一期的計息金額。\n   - 固定正利率的例題不代表真實投資保證成長。\n4. **預定術語及白話解釋**：「本金」＝最初投入的錢；「利息」＝依約計息增加的錢；「年利率」＝每年利息相對於計息金額的比例；「單利」＝只按原本金算；「複利」＝先前利息也加入下期計息。2% 以 0.02 說明，不出現未定義公式符號。\n5. **所需先備知識**：第 2 頁的加乘運算；百分比 2%＝0.02（本頁簡短複習）。\n6. **比喻、案例或圖表規劃**：【教學轉譯／概念示意】原有雞群產蛋，或把新小雞加入下一年雞群；不表示實際收益固定。【假設模擬】本金 10,000 元、每年 2%、每年計息一次、共兩年，無中途收付，忽略稅費；兩列年度表：單利 10,000→10,200→10,400，複利 10,000→10,200→10,404；標出第二年利息 200 與 204 元。不延伸為長期成長曲線。\n7. **對應 Wiki 條目及段落**：[Wiki 02](../wiki/02-inflation-and-compound-interest.md)「一句話白話定義」之計息定義、「生活化比喻」「具體數字小試算」單利與複利兩段、「新手最常踩的誤區」。\n8. **來源 ID 與定位**：[S006](../sources/catalog.md#s006) pp11、13；算例依 Wiki 自行推導。排除 p12 誤植及未追溯的名人引言。\n9. **正文預估字數**：約 115 個中文字，上限 120；含詞義與固定條件。年度表金額是圖表標籤，假設與限制仍為正文。\n10. **該頁檢查方式**：重算 10,000×0.02＝200、10,200×0.02＝204；核對第二年底 10,400／10,404；禁止把乘數再加百分號；後續讀者檢核：第二年複利應按哪筆金額計息？\n\n## 第 5 頁\n\n1. **頁碼與標題**：05／股票與債券的身分差異。\n2. **一個主要教學目標**：能區分公司的部分所有人與依約請求還本付息的出借者。\n3. **最多三個重點**：\n   - 股票是公司的一部分所有權，股利並非保證。\n   - 債券是依條件出借資金的關係，不等於公司所有權。\n   - 債券付款與還本須看條款及對方是否能履行。\n4. **預定術語及白話解釋**：「股票」＝公司一小部分所有權；「股東」＝持有股票的所有人；「股利」＝公司分給股東的盈餘；「債券」＝發行人依條件借錢的憑據；「債權」＝依約請求還本付息的關係；「違約」＝對方無法履行約定付款。本金、利息沿用第 4 頁，不另引入信用評等等術語。\n5. **所需先備知識**：第 4 頁的本金與利息；知道所有人與借款人的差別。\n6. **比喻、案例或圖表規劃**：【教學轉譯／概念示意】合資開飲料店，與按借款約定把錢借給店家，做身分對照。保留「分紅不保證、借據不保證實際付款」限制；本頁不放額外收益算例，降低詞義負荷。\n7. **對應 Wiki 條目及段落**：[Wiki 03](../wiki/03-stocks-bonds-funds-etfs.md)「一句話白話定義」表格的股票、債券列；「生活化比喻」；「具體數字小試算」第 3 點及條款限制；「新手最常踩的誤區」。\n8. **來源 ID 與定位**：[S004](../sources/catalog.md#s004) pp8–9；[S007](../sources/catalog.md#s007)「壹、定義」一及二之票面利率、發行年限、還本方式、計付息方式。比喻是 Wiki 教學轉譯，不是原機構插圖。\n9. **正文預估字數**：約 115 個中文字，上限 120；解釋與風險限制優先，不補充優先受償等課外內容。\n10. **該頁檢查方式**：逐一核對股票所有權／債券請求權；不得寫「每年分紅」「債券必保本或都有到期日」。後續讀者檢核：僅持有一般債券是否就成為股東？\n\n## 第 6 頁\n\n1. **頁碼與標題**：06／基金與 ETF 的包含關係。\n2. **一個主要教學目標**：知道 ETF 是基金的一種，交易方式不代表必定分散或獲利。\n3. **最多三個重點**：\n   - 基金是集合資金，依規則交由管理者投資。\n   - ETF 是能在交易所買賣的基金。\n   - 仍須了解投資內容、風險與費用，不單看名稱。\n4. **預定術語及白話解釋**：「基金」＝集合大家的錢按規則投資；「ETF」＝在交易所買賣的基金；「交易所」＝依規則撮合買賣的市場；「費用」＝使用或買賣產品支付的成本。此頁不講主動／被動分類，不使用英文縮寫以外的新術語。\n5. **所需先備知識**：第 5 頁已認識投資工具；能理解大類包含小類。\n6. **比喻、案例或圖表規劃**：【教學轉譯／概念示意】綜合便當比喻，配「基金」大範圍內含「ETF」的關係圖；只表達集合與交易形式，不暗示所有基金都持有相同內容、必然分散或安全。不引入價格、稅費率或虛構商品。\n7. **對應 Wiki 條目及段落**：[Wiki 03](../wiki/03-stocks-bonds-funds-etfs.md)「一句話白話定義」表格基金、ETF 兩列；「生活化比喻」之便當與限制；「新手最常踩的誤區」第 1、4 點。\n8. **來源 ID 與定位**：[S004](../sources/catalog.md#s004) p10；[S003](../sources/catalog.md#s003) Q1–Q3、Q8。不得把 Q1 的指數描述改寫成所有 ETF 都只追蹤指數。\n9. **正文預估字數**：約 100 個中文字，上限 120；含詞義及不保證安全的限制。\n10. **該頁檢查方式**：包含關係方向必須為 ETF 屬於基金；圖中文字首見附解釋；不寫所有基金主動操作、所有 ETF 被動或費用一定較低。後續讀者檢核：ETF 和基金是否互不相干？\n\n## 第 7 頁\n\n1. **頁碼與標題**：07／分散與配置仍可能損失。\n2. **一個主要教學目標**：能用同期間的組合算例解釋分散不保證免損失。\n3. **最多三個重點**：\n   - 看風險來源是否重疊，不只看商品數量。\n   - 配置是決定各類資產占多少，不是抄固定比例。\n   - 分開持有仍可能一起下跌。\n4. **預定術語及白話解釋**：「風險」＝結果不如預期、甚至損失的可能性；「分散」＝減少依賴同一風險來源；「資產配置」＝決定每類投資占總資金多少；「組合」＝放在一起計算的投資。A、B 只是假設資產標記。\n5. **所需先備知識**：第 5、6 頁的工具關係；百分比與金額加總。\n6. **比喻、案例或圖表規劃**：【教學轉譯／概念示意】沿用雨具比喻，不能防住所有風險。【假設模擬】同期間 10,000 元：全 A 遇 A−20% 剩 8,000；各半 A、B 遇 A−20%、B＋10% 剩 9,500；若兩者均−20%，各半也剩 8,000。規劃兩情境金額比較表，不畫歷史績效曲線。50／50 非建議；無中途收付，忽略稅費與交易。\n7. **對應 Wiki 條目及段落**：[Wiki 04](../wiki/04-diversification-and-allocation.md)「一句話白話定義」「生活化比喻」「具體數字小試算」四步與配置限制。\n8. **來源 ID 與定位**：[S004](../sources/catalog.md#s004) pp22–24、p26；[S003](../sources/catalog.md#s003) Q2、Q8 只支持了解產品內容；具體情境數字全部來自 Wiki 假設。排除 S004 p25 數據。\n9. **正文預估字數**：約 115 個中文字，上限 120；保留假設、比喻限制、比例非建議及可能共同下跌。\n10. **該頁檢查方式**：重算 4,000＋5,500＝9,500、兩者同跌各半剩 8,000；檢查圖表同期間同初始資金；不得畫成分散必然勝出。後續讀者檢核：兩種資產同跌時是否仍會虧損？\n\n## 第 8 頁\n\n1. **頁碼與標題**：08／第一份理財計畫與付款前查核。\n2. **一個主要教學目標**：能依生活、目標及查核條件決定下一步，而非立刻購買商品。\n3. **最多三個重點**：\n   - 寫出收支、欠款、備用金、目標期限與可承受損失。\n   - 若考慮定期定額，先確認可用金額、契約及費用。\n   - 遇保證高報酬又催匯款，暫停並找獨立官方管道查證。\n4. **預定術語及白話解釋**：「定期定額」＝約定固定日期與金額投入；「契約」＝雙方約定的執行與付款規則；「查證」＝另找官方資料核對；「165」＝防詐諮詢管道。收支、備用金及風險沿用前頁詞義；不新增報酬評比術語。\n5. **所需先備知識**：第 1–7 頁；知道可投資金額要考慮生活、已知用途與損失承受。\n6. **比喻、案例或圖表規劃**：【教學轉譯／概念示意】沿用旅行規劃與保留回程車錢的比喻，以「盤點→目標→查核」清單收尾；結果不保證。【自編情境／概念示意】取 Wiki 05 課末題的「零風險、高報酬、當天匯款」三個警訊；只規劃先思考再查核的提示，不新增題目或額外頁。若後續採用該題，依既有練習連結查看解析。\n7. **對應 Wiki 條目及段落**：[Wiki 05](../wiki/05-first-financial-plan.md)「一句話白話定義」依序執行、「生活化比喻」定期定額段、「具體數字小試算」空白計畫、「新手最常踩的誤區」及「知識網路連結」自編題。\n8. **來源 ID 與定位**：[S001](../sources/catalog.md#s001)收入支出與現金健檢；[S004](../sources/catalog.md#s004) pp21–24、p34（規劃），pp5、17、31–33（風險與防詐）；[S005](../sources/catalog.md#s005)投資人篇「貳、交易流程」「參、常見問答」Q1–Q3（安排及費用）。\n9. **正文預估字數**：約 115 個中文字，上限 120；先保留三個重點、白話詞義及不保證結果的限制。清單僅留詞組，不把段落移入標籤；不再放另一組完整數字案例。\n10. **該頁檢查方式**：每項清單回查 Wiki；定期定額不得等同獲利保證；警訊只支持暫停查證，不能直接認定個案違法；不得要求輸入真實帳戶資料。後續讀者檢核：未查證前是否應因催促而匯款？\n\n## 第 9.4 節人工審核閘門\n\n**狀態：已通過。**\n\n使用者本輪明確確認八頁、順序、Wiki 範圍、術語、來源與數字、資訊量及練習範圍。確認登錄起始時間為 2026-11-19 01:10:54 +08:00（操作時間，非訊息發送時間）。本次只允許逐頁稿與內容檢查；最終 HTML 與發布仍須等待使用者確認報告並下達 Step 7 指令。核准的八頁內容規劃未作實質改動。\n\n後續狀態：使用者已於 Step 7 明確確認逐頁稿及內容報告並授權 HTML 交付；本機成品見[index.html](index.html)。公開網址仍依使用者要求，待其上傳後親自驗證。上述段落保留為前階段授權紀錄，不視為目前仍未獲准製作 HTML。\n"}, "slides/source-map.md": {"title": "逐頁來源對照表", "html": "\u003ch1 id=\"逐頁來源對照表\">逐頁來源對照表\u003c/h1>\n\u003cp>對應文件：\u003ca href=\"reader.html?doc=slides/outline.md\">八頁大綱\u003c/a>。狀態：使用者已明確確認本表及大綱，允許逐頁稿與內容檢查；HTML 尚未授權。核准的 21 列對照內容維持原樣。\u003c/p>\n\u003ch2 id=\"使用原則\">使用原則\u003c/h2>\n\u003cp>追溯順序是「簡報教學主張 → 已驗收 Wiki 段落 → 原始來源 ID 與定位」。來源不是新增主張的捷徑。下表把來源事實、教學轉譯與假設數字分開；沒有原始統計依據的自編例子，不偽稱官方案例。\u003c/p>\n\u003cp>本表的 Wiki 段落欄以檔案連結、既有標題與段內關鍵語定位；PDF 頁碼依實際頁序。外部來源網址及機構詳見 \u003ca href=\"reader.html?doc=sources/catalog.md\">catalog.md\u003c/a>。\u003c/p>\n\u003ch2 id=\"八頁完整對照\">八頁完整對照\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>頁碼\u003c/th>\u003cth>教學主張／類型\u003c/th>\u003cth>Wiki 條目及精確段落\u003c/th>\u003cth>原始來源 ID 與定位\u003c/th>\u003cth>圖表或試算依據與限制\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>01\u003c/td>\u003ctd>【教學轉譯】先安排生活、目標，再決定投資\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/01-budget-and-emergency-fund.md\">Wiki 01\u003c/a>「一句話白話定義」；\u003ca href=\"reader.html?doc=wiki/05-first-financial-plan.md\">Wiki 05\u003c/a>同名段落之「依序執行」\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=sources/catalog.md#s001\">S001\u003c/a>收入支出健檢說明；\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004\u003c/a> pp21–24、p34\u003c/td>\u003ctd>五站路線是教學編排；名稱依 Wiki 01–05，不聲稱機構規定這個順序\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>01\u003c/td>\u003ctd>【教學轉譯】現在不投入市場也可有合理計畫；旅行規劃只作比喻\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/05-first-financial-plan.md\">Wiki 05\u003c/a>「一句話白話定義」最後兩句、「生活化比喻」及限制\u003c/td>\u003ctd>S001、S004 同上，僅支持規劃原則；結論及比喻由 Wiki 轉譯\u003c/td>\u003ctd>【概念示意】五個學習站點，無成長或保證抵達的箭頭含意\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>02\u003c/td>\u003ctd>【來源內容】結餘為收入減支出；備用金處理突發必要需求\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/01-budget-and-emergency-fund.md\">Wiki 01\u003c/a>「一句話白話定義」依序理解\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=sources/catalog.md#s001\">S001\u003c/a>收入支出、現金健檢說明\u003c/td>\u003ctd>【概念示意】三信封；不得把結餘全當成可投資金額\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>02\u003c/td>\u003ctd>【來源內容／教學轉譯】備用金須配合生活條件，三個月不是人人標準\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/01-budget-and-emergency-fund.md\">Wiki 01\u003c/a>「生活化比喻」來源內容及「新手最常踩的誤區」第 3 點\u003c/td>\u003ctd>S001 現金健檢；\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004\u003c/a> p24\u003c/td>\u003ctd>保留「本題設定」；不引用其他月份建議替換\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>02\u003c/td>\u003ctd>【假設例子】月結餘 6,000、目標 72,000、需 12 個月\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/01-budget-and-emergency-fund.md\">Wiki 01\u003c/a>「具體數字小試算」條件與三步\u003c/td>\u003ctd>概念 S001、S004 p24；30,000／24,000／3 個月由 Wiki 自編\u003c/td>\u003ctd>30,000−24,000＝6,000；24,000×3＝72,000；72,000÷6,000＝12。新臺幣；從零存、無其他支出及欠款、全存；未計利息稅費及變動\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>03\u003c/td>\u003ctd>【來源內容】整體物價上升可能削弱固定金額的購買能力\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/02-inflation-and-compound-interest.md\">Wiki 02\u003c/a>「一句話白話定義」通膨與購買力段\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=sources/catalog.md#s002\">S002\u003c/a>開頭家庭支出及「通貨膨脹起，財富大風吹」\u003c/td>\u003ctd>【概念示意】便當比喻；單店價格不能證明整體通膨\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>03\u003c/td>\u003ctd>【假設例子】商品籃 105 元，資金 102 元，仍買不到原來一籃\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/02-inflation-and-compound-interest.md\">Wiki 02\u003c/a>「具體數字小試算」最後一年例子\u003c/td>\u003ctd>S002 支持購買力概念；100／102／105 為 Wiki 自編，無歷史統計 ID\u003c/td>\u003ctd>【假設模擬】同一商品籃、同一年的元金額比較；102＜105。不得新增收益來源、實際通膨率或實質報酬計算\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>04\u003c/td>\u003ctd>【來源內容】單利按原本金；複利把前期利息加入下期計息基礎\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/02-inflation-and-compound-interest.md\">Wiki 02\u003c/a>「一句話白話定義」計息定義\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=sources/catalog.md#s006\">S006\u003c/a> pp11、13\u003c/td>\u003ctd>【概念示意】雞群與新增小雞比喻，不能被理解成固定收益承諾；不採 p12\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>04\u003c/td>\u003ctd>【假設例子】兩年單利 10,400、複利 10,404，差在第二年計息基礎\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/02-inflation-and-compound-interest.md\">Wiki 02\u003c/a>「具體數字小試算」單利及複利段\u003c/td>\u003ctd>S006 定義支持；金額、利率與期間為 Wiki 自編\u003c/td>\u003ctd>每年 2%、年計息、兩年、無中途收付、忽略稅費。單利每年 200；複利第二年 10,200×0.02＝204。表格只放 0、1、2 年，不外推\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>05\u003c/td>\u003ctd>【來源內容】股票是部分所有權，股利不是保證\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">Wiki 03\u003c/a>「一句話白話定義」表格股票列；「生活化比喻」限制\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004\u003c/a> pp8–9\u003c/td>\u003ctd>【概念示意】合資飲料店；不把分紅畫成固定入帳\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>05\u003c/td>\u003ctd>【來源內容／教學轉譯】債券持有人依條件請求還本付息；不是因而成為公司所有人\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">Wiki 03\u003c/a>定義表債券列及「生活化比喻」借款約定\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=sources/catalog.md#s007\">S007\u003c/a>「壹、定義」一與二之利率、還本及付息方式\u003c/td>\u003ctd>【概念示意】出借與合資身分對照；不延伸為法定清償順位、轉換權等未介紹權利\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>05\u003c/td>\u003ctd>【來源內容／教學轉譯】付款與還本條款不同，對方也可能無法履約\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">Wiki 03\u003c/a>「具體數字小試算」第 3 點及例後條款限制；「生活化比喻」限制\u003c/td>\u003ctd>S007「壹、定義」二；一般不保證收益的背景見 S004 p5，已反映於 Wiki 限制\u003c/td>\u003ctd>不放新債息算例；不畫保本標章，不泛稱所有債券有固定到期日\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>06\u003c/td>\u003ctd>【來源內容】基金集合資金由管理者按規則投資\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">Wiki 03\u003c/a>定義表基金列\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004\u003c/a> p10\u003c/td>\u003ctd>【概念示意】綜合便當，只說集合形式，不暗示各產品內容一致\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>06\u003c/td>\u003ctd>【來源內容】ETF 是在交易所買賣的基金\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">Wiki 03\u003c/a>定義表 ETF 列；「新手最常踩的誤區」第 1 點\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=sources/catalog.md#s003\">S003\u003c/a> Q1–Q3（需並讀 Q2，避免全稱被動式）\u003c/td>\u003ctd>【概念示意】基金大類包含 ETF 小類；關係圖方向不可倒置；本頁不展開主動／被動分類\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>06\u003c/td>\u003ctd>【來源內容／教學轉譯】名稱不保證安全，仍須查內容、風險及費用\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/03-stocks-bonds-funds-etfs.md\">Wiki 03\u003c/a>「生活化比喻」限制；「新手最常踩的誤區」第 4 點\u003c/td>\u003ctd>S003 Q8 及 Q2–Q3 的類型差異\u003c/td>\u003ctd>不列費率，不把 ETF 全部畫成高度分散或保證獲利\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>07\u003c/td>\u003ctd>【來源內容／教學轉譯】分散看風險來源；配置是各類資產比重，不能只數商品\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/04-diversification-and-allocation.md\">Wiki 04\u003c/a>「一句話白話定義」「生活化比喻」兩檔基金重疊段\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004\u003c/a> pp22–24、p26；\u003ca href=\"reader.html?doc=sources/catalog.md#s003\">S003\u003c/a> Q2、Q8 僅作產品內容查核背景\u003c/td>\u003ctd>【概念示意】雨具與共同風險；不引入相關係數或最佳化模型\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>07\u003c/td>\u003ctd>【假設例子】A−20%、B＋10% 時，全 A 剩 8,000，各半剩 9,500\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/04-diversification-and-allocation.md\">Wiki 04\u003c/a>「具體數字小試算」第 1–3 步與條件\u003c/td>\u003ctd>S004 p26 支持分散概念；A、B 數值由 Wiki 自編，不是市場績效\u003c/td>\u003ctd>10,000×0.8＝8,000；5,000×0.8＋5,000×1.1＝9,500；同初始金額、同期間，忽略稅費、交易及中途收付\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>07\u003c/td>\u003ctd>【假設例子／教學轉譯】兩者同跌 20% 時，各半仍剩 8,000；分散不保證不賠\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/04-diversification-and-allocation.md\">Wiki 04\u003c/a>「生活化比喻」限制；「具體數字小試算」第 4 步及比例限制\u003c/td>\u003ctd>S004 pp22–24、p26 支持風險與配置原則；同跌情境由 Wiki 自編\u003c/td>\u003ctd>5,000×0.8＋5,000×0.8＝8,000；50／50 是設定，不是建議，不引用 p25 的停用數據\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>08\u003c/td>\u003ctd>【教學轉譯】把生活、備用金、目標、期限及可承受損失寫成計畫\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/05-first-financial-plan.md\">Wiki 05\u003c/a>「一句話白話定義」依序執行；「具體數字小試算」空白計畫；「生活化比喻」\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=sources/catalog.md#s001\">S001\u003c/a>收入支出與現金健檢；\u003ca href=\"reader.html?doc=sources/catalog.md#s004\">S004\u003c/a> pp21–24、p34\u003c/td>\u003ctd>【概念示意】旅行與回程車錢；只放空白清單，不收集真實財務或帳戶資料，不再放新的理財試算\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>08\u003c/td>\u003ctd>【來源內容】定期定額仍需看契約與費用，不能保證獲利\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/05-first-financial-plan.md\">Wiki 05\u003c/a>「生活化比喻」來源內容段及「新手最常踩的誤區」第 2 點\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=sources/catalog.md#s005\">S005\u003c/a>投資人篇「貳、交易流程」「參、常見問答」Q1–Q3；不保證獲利為 Wiki 對執行方式的限制\u003c/td>\u003ctd>清單用語，不新增手續費率、扣款制度細節或個別投資建議\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>08\u003c/td>\u003ctd>【來源內容／自編情境】高報酬零風險與催匯款是暫停查證警訊；另找官方管道，必要時洽 165\u003c/td>\u003ctd>\u003ca href=\"reader.html?doc=wiki/05-first-financial-plan.md\">Wiki 05\u003c/a>「新手最常踩的誤區」第 3 點；「知識網路連結」自編練習\u003c/td>\u003ctd>S004 pp5、17、31–33；具體群組情境由 Wiki 自編\u003c/td>\u003ctd>【概念示意】只呈現原題警訊及查核方向，不新增案件或犯罪判決；不在本階段撰寫題目逐頁成稿，後續解析沿用 \u003ca href=\"reader.html?doc=exercises/05-first-financial-plan.md\">練習 05\u003c/a>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"禁止帶入的內容\">禁止帶入的內容\u003c/h2>\n\u003cul>\n\u003cli>S004 p25 停用數據，以及未經核實的固定配置比例、年齡配置公式。\u003c/li>\n\u003cli>S006 p12 的誤植算式及未核實名人引言；只採 pp11、13 定義。\u003c/li>\n\u003cli>Wiki 沒有的商品推薦、當期市場數據、稅費率、歷史報酬、投資詐騙個案判決。\u003c/li>\n\u003cli>以「已整理官方來源」為由繞過 Wiki，新增來源中其他尚未匯入的內容。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"本階段檢查與後續閘門\">本階段檢查與後續閘門\u003c/h2>\n\u003cul>\n\u003cli>已對照八頁、五篇 Wiki 與 S001–S007；每個數字例子都有 Wiki 內相同條件及數值。\u003c/li>\n\u003cli>主張涵蓋檢查採逐列閱讀；連結、頁數與試算可做結構／算術檢查，不能據此宣稱所有語意已由程式證明。\u003c/li>\n\u003cli>上述表格是大綱階段的規劃依據，當時只檢查字數預算；本輪已另寫逐頁稿，實際字數與語意檢查見\u003ca href=\"reader.html?doc=reports/2026-11-19-content-check.md\">內容報告\u003c/a>。尚未進行 HTML 版面驗收。\u003c/li>\n\u003cli>\u003cstrong>第 9.4 節狀態：使用者已明確確認通過；本輪停在內容報告待驗收，不進入 HTML 與發布。\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>後續狀態：Step 7 使用者已明確驗收逐頁稿及內容報告，允許製作 HTML；成品見\u003ca href=\"slides/index.html\">八頁簡報\u003c/a>，核對見\u003ca href=\"reader.html?doc=reports/2026-11-19-release-check.md\">發布報告\u003c/a>。原 21 列對照保持不變；公開網址尚待使用者上傳後驗證。\u003c/p>", "source": "# 逐頁來源對照表\n\n對應文件：[八頁大綱](outline.md)。狀態：使用者已明確確認本表及大綱，允許逐頁稿與內容檢查；HTML 尚未授權。核准的 21 列對照內容維持原樣。\n\n## 使用原則\n\n追溯順序是「簡報教學主張 → 已驗收 Wiki 段落 → 原始來源 ID 與定位」。來源不是新增主張的捷徑。下表把來源事實、教學轉譯與假設數字分開；沒有原始統計依據的自編例子，不偽稱官方案例。\n\n本表的 Wiki 段落欄以檔案連結、既有標題與段內關鍵語定位；PDF 頁碼依實際頁序。外部來源網址及機構詳見 [catalog.md](../sources/catalog.md)。\n\n## 八頁完整對照\n\n| 頁碼 | 教學主張／類型 | Wiki 條目及精確段落 | 原始來源 ID 與定位 | 圖表或試算依據與限制 |\n| --- | --- | --- | --- | --- |\n| 01 | 【教學轉譯】先安排生活、目標，再決定投資 | [Wiki 01](../wiki/01-budget-and-emergency-fund.md)「一句話白話定義」；[Wiki 05](../wiki/05-first-financial-plan.md)同名段落之「依序執行」 | [S001](../sources/catalog.md#s001)收入支出健檢說明；[S004](../sources/catalog.md#s004) pp21–24、p34 | 五站路線是教學編排；名稱依 Wiki 01–05，不聲稱機構規定這個順序 |\
