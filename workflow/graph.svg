<svg class="graph" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1060" role="img" aria-labelledby="flow-title flow-desc"><title id="flow-title">來源、內容與呈現三個檢查迴圈</title><desc id="flow-desc">討論規則後查核來源，不足回補來源。Wiki 與大綱經人工審核後寫逐頁稿，字數詞義數字不合格退回改稿。人工確認稿件後才製作 HTML，版面或路徑不合格退回呈現層。公開實測後整理作業。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#94b39e"/></marker></defs><style>svg{background:#0b100d;color:#d9e9df}text{fill:currentColor;font-family:"Microsoft JhengHei",sans-serif}.node{fill:#18261d;stroke:#698d77;stroke-width:1.4}.gate{fill:#243c2d;stroke:#b1e0c3;stroke-width:2}.edge{fill:none;stroke:#94b39e;stroke-width:2}.loop{fill:none;stroke:#e3c187;stroke-width:2;stroke-dasharray:7 5}.label{fill:#e3c187}</style><text x="30" y="35" font-size="24">人工協作工作流・概念示意</text><text x="30" y="70" font-size="18">實線＝前進　虛線＝檢查失敗退回　綠框＝人工審核</text><rect x="280" y="120" width="510" height="76" rx="8" class="node"/><text x="535" y="150" font-size="23" text-anchor="middle">討論受眾與規則</text><text x="535" y="178" font-size="17" text-anchor="middle">AGENTS.md</text><path d="M535 196V227" class="edge" marker-end="url(#arrow)"/><rect x="280" y="230" width="510" height="76" rx="8" class="node"/><text x="535" y="260" font-size="23" text-anchor="middle">來源登錄與可讀性</text><text x="535" y="288" font-size="17" text-anchor="middle">S001–S007</text><path d="M535 306V337" class="edge" marker-end="url(#arrow)"/><rect x="280" y="340" width="510" height="76" rx="8" class="node"/><text x="535" y="370" font-size="23" text-anchor="middle">匯入 Wiki、練習與索引</text><text x="535" y="398" font-size="17" text-anchor="middle">5 篇核心條目</text><path d="M535 416V447" class="edge" marker-end="url(#arrow)"/><rect x="280" y="450" width="510" height="76" rx="8" class="node"/><text x="535" y="480" font-size="23" text-anchor="middle">八頁大綱與來源對照</text><text x="535" y="508" font-size="17" text-anchor="middle">21 列主張追溯</text><path d="M535 526V557" class="edge" marker-end="url(#arrow)"/><rect x="280" y="560" width="510" height="76" rx="8" class="gate"/><text x="535" y="590" font-size="23" text-anchor="middle">人工審核大綱</text><text x="535" y="618" font-size="17" text-anchor="middle">確認後才寫稿</text><path d="M535 636V667" class="edge" marker-end="url(#arrow)"/><rect x="280" y="670" width="510" height="76" rx="8" class="node"/><text x="535" y="700" font-size="23" text-anchor="middle">逐頁稿與內容檢查</text><text x="535" y="728" font-size="17" text-anchor="middle">≤120 字、詞義、數字</text><path d="M535 746V777" class="edge" marker-end="url(#arrow)"/><rect x="280" y="780" width="510" height="76" rx="8" class="gate"/><text x="535" y="810" font-size="23" text-anchor="middle">人工確認稿件</text><text x="535" y="838" font-size="17" text-anchor="middle">保留修正證據</text><path d="M535 856V887" class="edge" marker-end="url(#arrow)"/><rect x="280" y="890" width="510" height="76" rx="8" class="node"/><text x="535" y="920" font-size="23" text-anchor="middle">HTML／SVG 與公開實測</text><text x="535" y="948" font-size="17" text-anchor="middle">先本機，再查公開網址</text><path d="M280 378H115V268H275" class="loop" marker-end="url(#arrow)"/><text x="25" y="307" font-size="19" class="label">來源不足</text><text x="25" y="335" font-size="19" class="label">補查再匯入</text><path d="M790 708H975V650H535V667" class="loop" marker-end="url(#arrow)"/><text x="820" y="615" font-size="18" class="label">逐頁退回修正</text><text x="820" y="640" font-size="18" class="label">最多三輪</text><path d="M790 930H1020V870H535V887" class="loop" marker-end="url(#arrow)"/><text x="810" y="850" font-size="18" class="label">修版面／連結</text><text x="535" y="1015" text-anchor="middle" font-size="21">實測留證 → 整理繳交草稿（不自動送出）</text></svg>